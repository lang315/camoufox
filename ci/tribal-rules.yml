# Decisions this repository has already made, and the evidence for each.
#
# Compiled from code comments, commit messages, and the issue/PR record --
# specifically from what was *rejected*, which is where the reasoning usually
# lives. A rule earns a place here when someone proposed the opposite, it was
# considered on the merits, and the answer was no. Those are the decisions that
# get re-litigated by the next well-meaning contributor, or quietly undone by an
# agent rebasing patches at 3am.
#
# `browser/tests/native/test_tribal_rules.py` asserts every entry that is mechanically
# checkable. An entry with `check: manual` is documentation only.
#
# Adding one: cite the issue, PR, or commit. "I think this is how it works" is
# not evidence, and a rule nobody can trace gets deleted the first time it is
# inconvenient.

schema: 1

rules:
  # -------------------------------------------------------------------------
  # Virtual display
  # -------------------------------------------------------------------------

  - id: virtual-display-default-1x1x24
    title: The Xvfb default screen is 1x1x24 and stays that way
    check: automated
    evidence:
      - "PR #714 (rejected): 'use 1920x1080 screen size for virtual display'"
      - "PR #724 (rejected): the same change, proposed again"
      - "issue #458: blank screenshots, the reported motivation for both"
    rationale: >-
      Proposed twice, rejected twice, on two grounds. First, it does not fix
      anything: rendering was measured identical at both sizes -- innerWidth
      1280, innerHeight 984, fullpage 1280x5367 either way, with only
      fingerprint-rotation noise in the colour count. Second, it costs
      throughput: past 30-40 concurrent browsers the framebuffer becomes the
      bottleneck on a machine that handles 70-80 at 1x1. The root window is not
      a fingerprint -- screen.* comes from the generated fingerprint, applied
      per context in the browser.
    expect:
      module: camoufox.virtdisplay
      attribute: DEFAULT_SCREEN
      equals: "1x1x24"

  - id: virtual-display-size-override-exists
    title: The screen size is overridable, just not by default
    check: automated
    evidence:
      - "PR #714 review: 'hardcoding 1920x1080 would be the wrong default'"
    rationale: >-
      The rejection was of the *default*, not the capability. Anyone who needs a
      real framebuffer sets CAMOUFOX_VIRTUAL_DISPLAY_SIZE. Removing the hatch
      would turn a settled disagreement back into an open one.
    expect:
      module: camoufox.virtdisplay
      attribute: SCREEN_ENV_VAR
      equals: CAMOUFOX_VIRTUAL_DISPLAY_SIZE

  - id: composite-extension-on
    title: The X Composite extension stays enabled by default
    check: automated
    evidence:
      - "lang315/camoufox#136: probe run 35622975837, one binary (build 35586323562)"
      - "python/src/camoufox/virtdisplay.py: the measurement table"
      - "issue #93: no video under headless='virtual'"
      - "#234: the TypeScript twin kept Composite off; typescript/tests/virtdisplay.test.ts now requires it to read the env var as this module does"
    rationale: >-
      (Fork: reverses upstream's composite-extension-off.) The compositor fix for
      #93 covers only Page.startScreencast, which Playwright >=1.58 uses.
      Playwright <=1.57 records through Browser.setVideoRecordingOptions, which
      still reaches libwebrtc's X11 window capturer, and under Xvfb that capturer
      delivers no frames without Composite. pythonlib allows both
      (playwright<1.63). Measured on one binary: Playwright 1.55 with Composite
      off records a 110-byte file with no frames; with Composite on, 54370 bytes.
      Playwright 1.62 records either way. Composite on crashed in neither
      version, so the SIGSEGV that once motivated turning it off does not
      reproduce on beta.31.
    expect:
      module: camoufox.virtdisplay
      attribute: COMPOSITE_ENV_VAR
      equals: CAMOUFOX_VIRTUAL_DISPLAY_COMPOSITE

  - id: displayfd-not-lockfile-scan
    title: Displays are claimed atomically with -displayfd, by Xvfb and by Xorg
    check: automated
    evidence:
      - "issue #597 / commit 8f9ff07"
      - "2026-10-12, Ubuntu's setuid Xorg.wrap: `Xorg -displayfd N -config <name> ...` run unprivileged wrote its display number (:6, past live and stale sockets) down the pipe once the server was up"
    rationale: >-
      The old userspace lock-file scan plus random-jitter retry raced: many
      camoufox processes starting at once all saw the same free display numbers
      before any of them bound. -displayfd lets the server scan up from :0 and
      bind the first free socket itself -- kernel-mediated, no userspace race --
      then writes the number back down an inherited pipe. The GPU display's
      Xorg takes it through the setuid wrapper too, so it does not use the
      random display number and lock-file wait it was ported from.
    expect:
      module: camoufox.virtdisplay
      xvfb_args_contain: "-displayfd"

  - id: displayfd-read-timeout
    title: The displayfd read is bounded
    check: automated
    evidence:
      - "commit 8f9ff07: 'so a hung Xvfb fails fast instead of blocking forever'"
      - "#157: first launch on six fresh ubuntu-24.04 runners took 603-8434 ms, later launches 25-39 ms; one CI run exceeded 10 s"
      - "#232: the TypeScript twin kept 10 s after #157 and failed a CI run the same way; typescript/tests/virtdisplay.test.ts now pins it to this module's bound"
    rationale: >-
      A hung Xvfb with no timeout blocks the launch forever, at 0% CPU, with no
      diagnostic. The bound is 30 seconds. It was 10 until #157 measured a
      cold first launch at up to 8.4 s, and a CI run missed 10 s outright. A
      bound a healthy cold start can exceed fails a user's first launch.
    expect:
      module: camoufox.virtdisplay
      attribute: DISPLAYFD_READ_TIMEOUT_S
      is_positive_number: true

  - id: xvfb-cleanup-runs-even-if-it-already-died
    title: The display's lock and socket are removed whether or not we killed it
    check: automated
    evidence:
      - "found by browser/tests/native/test_crash_recovery.py::test_xvfb_sigkill_under_a_virtual_display"
      - "isolated: Xvfb alive -> socket removed; Xvfb already dead -> socket leaked"
    rationale: >-
      kill() used to gate its entire body on `self.proc.poll() is None`, so a
      display whose Xvfb had already died -- crashed, OOM-killed, reaped with
      the browser's process group -- was never cleaned up. That is backwards: a
      SIGKILLed Xvfb never removes its own socket, so the crash path is the only
      one where /tmp/.X11-unix/X<n> survives, and it was the one path kill()
      skipped. Stranded sockets accumulate, and -displayfd scans upward for a
      free number, so each one pushes the next display higher until a
      long-running host stops being able to allocate one at all.

  - id: xvfb-sigkill-and-socket-cleanup
    title: Xvfb is SIGKILLed, reaped, and its X11 lock and socket removed
    check: automated
    evidence:
      - "PR #652 / commit 71fe028"
      - "PR #618 / commit ce5edf6: wait() the child or it becomes a zombie"
    rationale: >-
      The old terminate-wait-kill ladder left zombie Xvfb processes, and the
      stale /tmp/.X{n}-lock and /tmp/.X11-unix/X{n} files it left behind blocked
      later display allocation. Both halves matter: SIGKILL then wait() so
      nothing is reaped later, then unlink both files.

  - id: xvfb-dies-with-its-launcher
    title: Xvfb gets a parent-death signal, so it never outlives its launcher
    check: automated
    evidence:
      - "issue #868: 113 orphaned Xvfb processes after SIGTERMed launchers"
      - "browser/tests/native/test_crash_recovery.py::test_launcher_sigkill_leaves_nothing_on_its_display"
      - "dbus-launch(1): --autolaunch implies --exit-with-session, whose babysitter kills the bus when it loses its X connection"
    rationale: >-
      kill() runs on the close path, which a launcher killed by a signal never
      reaches, and start_new_session keeps Xvfb out of a process-group kill. So
      Xvfb is exec'd through `setpriv --pdeathsig TERM`: the kernel signals it
      when its launcher dies, even by SIGKILL, and SIGTERM lets Xvfb remove its
      own lock and socket. The session bus Firefox autolaunches on that display
      dies with the X connection, taking its helpers with it. setpriv rather
      than prctl in a preexec_fn: it is the same in both packages, and
      preexec_fn is unsafe in a threaded parent. The signal fires when the
      thread that spawned Xvfb exits, which is the thread that owns the browser.
  - id: gpu-display-shares-the-vt
    title: The GPU display's Xorg always runs with -sharevts and -novtswitch
    check: automated
    evidence:
      - "Holo's headless='virtual-gpu' (the port's source): without -sharevts Xorg took a new VT and moved the monitor to the offscreen server, blanking the live desktop"
      - "2026-10-12: with both flags, Xorg on the RTX 5080 and on the RX 7900 XTX left the active VT on tty2 throughout"
    rationale: >-
      A headless Xorg that allocates its own VT switches the console to it, and
      the user's desktop goes black. -sharevts shares the current VT instead,
      and -novtswitch blocks the switch at start and exit; the config adds
      DontVTSwitch, and UseDisplayDevice "None" on NVIDIA. The launcher also
      watches /sys/class/tty/tty0/active while the server starts and, if it
      moves, switches back, kills the server and raises GpuVtTakeover. That
      guard is insurance, not a reason to drop either flag.
    expect:
      module: camoufox.gpudisplay
      attribute: SERVER_FLAGS
      contains: ["-sharevts", "-novtswitch"]

  - id: gpu-display-terminates-with-its-last-client
    title: The GPU display's Xorg runs with -terminate, never -noreset, and the launcher holds one client
    check: automated
    evidence:
      - "Holo: with -noreset, root-owned servers outlived their launchers and used up VRAM; a server no client ever reached never terminates, and 20 such servers once held ~1 GB of RSS on one machine"
      - "2026-10-12: an Xorg started through Xorg.wrap exited on its own about 2s after a raw X11 client connected and disconnected"
    rationale: >-
      Through the setuid wrapper Xorg runs as root, and a launcher killed with
      SIGKILL runs no teardown at all, so the server must end itself.
      -terminate exits it after its last client disconnects; -noreset keeps it
      forever. A server no client reached has no last client, so the launcher
      connects one raw X11 client as soon as the display is up and holds it
      for the display's lifetime: closed by kill(), or by the kernel when the
      launcher dies.
    expect:
      module: camoufox.gpudisplay
      attribute: SERVER_FLAGS
      contains: ["-terminate"]
      excludes: ["-noreset"]

  - id: gpu-display-sigterm-before-sigkill
    title: The GPU display's Xorg is asked to exit before it is killed
    check: manual   # browser/tests/native/test_gpu_display.py
    evidence:
      - "2026-10-12: a SIGKILLed Xorg left a root-owned /tmp/.X11-unix/X6 that the unprivileged launcher could not remove"
    rationale: >-
      Unlike Xvfb (xvfb-sigkill-and-socket-cleanup), the GPU display's server
      is root's, so its socket is too, and only the server can remove it.
      kill() drops the held client, sweeps the processes on the display, sends
      SIGTERM and waits; SIGKILL is the last resort for a server that did not
      exit.

  - id: gpu-selected-by-pci-address
    title: The GPU is named by the caller and bound by PCI address, never by render node number
    check: automated
    evidence:
      - "2026-10-12, this machine: renderD128 is the RX 7900 XTX, though a config generated earlier on it recorded renderD128 as the RTX 5080"
      - "Holo: NVIDIA and AMD renders of the same scenes differed on 31 of 42 and on MAX_VERTEX_UNIFORM_VECTORS"
    rationale: >-
      Render nodes are numbered in the order the drivers loaded, which changes
      between boots. The PCI address does not, so the GPUs are listed in PCI
      address order, the config binds the card with its BusID and is named
      after its address, and the selector accepts an address. Several GPUs
      with no selector is an error, not a guess: the identity claims the GPU
      that renders, so the card must be the one the caller meant.

  - id: gpu-use-is-read-from-the-kernel
    title: The GPU display proves rendering by the GPU the kernel accounts, not the renderer string or an open render node
    check: automated
    evidence:
      - "2026-10-12, v156.0.1-beta.32: forced onto Mesa's software path on the RTX 5080, Firefox still held /dev/dri/renderD129 (for DMABuf) and not /dev/nvidia0; on hardware it held /dev/nvidia0"
      - "2026-10-12: on the RX 7900 XTX, Firefox's render node showed drm-engine-gfx growing on hardware and was not opened in software"
    rationale: >-
      The renderer string is what the identity claims, so it proves nothing.
      An open render node proves nothing either: Firefox opens the card's DRM
      nodes for DMABuf whatever renders. The check is the NVIDIA driver's
      /dev/nvidia<minor> held open, or time on a GPU engine in the render
      node's fdinfo (the kernel's DRM usage stats), while a probe page draws.
      A browser that fails it is closed and the launch raises
      GpuSoftwareFallback; there is no fallback to Xvfb.

  # -------------------------------------------------------------------------
  # Dependencies
  # -------------------------------------------------------------------------

  - id: no-third-party-camoufox-distribution
    title: Nothing here depends on someone else's camoufox package
    check: automated
    evidence:
      - "PR #521 (2026-03-15) added `cloverlabs-camoufox` to browser/tests/build-tester/requirements.txt"
      - "the commit's author is the PyPI author of that package"
      - "browser/tests/build-tester/scripts/presets.py already prints the correct answer in its ImportError handler"
    rationale: >-
      build-tester generates its fingerprints with camoufox.fingerprints, so
      whichever distribution provides `camoufox` decides what is actually being
      tested. Pointing that at a third-party redistribution means the binary is
      graded against someone else's fingerprint generation, a divergence between
      the two reads as a browser bug, and every CI run pulls an outside package
      into a job holding repository credentials. The only `camoufox` this
      repository may install is python/ from this tree.
    expect:
      no_dependency_matching: "camoufox"
      except_paths: ["python/pyproject.toml"]
      allowed_forms: ["-e ../../../python", "-e ./python", "-e python"]

  # -------------------------------------------------------------------------
  # Measurement
  # -------------------------------------------------------------------------

  - id: animations-run-on-stock-timing
    title: Animations run on stock timing unless the caller opts into instantAnimations
    check: automated
    evidence:
      - "measured on v152.0.4-beta.31: el.animate(frames, 1000).effect.getComputedTiming().duration returned 0, a 500ms transition 0"
      - "the finished promise still resolved after ~1000ms, so the only saving was Playwright's stability wait"
    rationale: >-
      Instant animations were the default so Playwright never waited on one,
      but any page reads the zero duration back in one line. Reporting the
      real duration while not rendering the animation does not hide it
      either: getComputedStyle or getBoundingClientRect sampled mid-animation
      returns the end state. So the saving costs stealth, and it is the
      caller's choice: `instantAnimations: True` turns it on and warns.

  - id: spoofed-voices-speak
    title: speak() on a spoofed voice starts, then ends after the text's duration
    check: automated
    evidence:
      - "measured on v152.0.4-beta.31: speak() on a spoofed voice fired `error` after 3ms"
      - "voices:fakeCompletion, the opt-out, fired start and end in the same tick"
    rationale: >-
      A spoofed voice has no engine behind it, and a real voice never errors
      on a plain utterance or ends the instant it starts. So the browser
      speaks it silently for as long as the text takes at ~150 words per
      minute. The two config keys that chose between the two tells are gone.

  - id: no-glyph-spacing-noise
    title: Text is shaped exactly as stock Firefox shapes it; there is no spacing seed
    check: automated
    evidence:
      - "#779 (6daae88): measured +1 px per ~100 glyphs and fractional deltas on every measureText; defaulted the seed to 0"
      - "issue #741 / ad697a8: the perturbation detached combining marks in Thai, Lao, Arabic, Devanagari and Hebrew"
    rationale: >-
      The feature added a seeded amount to every glyph advance so that text
      widths differed per context. No real machine produces those widths:
      the same font on the same OS measures the same everywhere, so a width
      that matches no real installation is a fingerprint, not a disguise. It
      was defaulted off in #779 and kept as an opt-in, but an opt-in whose
      only effect is to become detectable is not a feature, so the manager,
      the window setter, the shaper hook and the config key are gone.

  - id: ubo-lists-pinned-to-bundled
    title: uBlock Origin's filter lists are pinned to the ones it bundles; no regional list
    check: manual
    evidence:
      - "issue #211; e2e runs 38456928453, 38481074309 and 38483854834 (macOS, locale de-DE)"
      - "uBO platform/common/vapi-background.js: onBeforeRequest holds tabId >= 0 while suspendDepth != 0"
      - "uBO src/js/storage.js: loadFilterLists() calls vAPI.net.suspend() whenever vAPI.Net.canSuspend(), true on Firefox"
      - "uBO src/js/background.js: assetFetchTimeout 30"
    rationale: >-
      On Firefox uBO holds every page request while it loads its filter lists.
      Every Camoufox launch is a first run, and on a first run uBO auto-selects
      a regional list from the UI language, which it does not bundle and must
      download. When that download hangs, every page waits for uBO's 30 s
      timeout once per mirror. With locale de-DE behind a proxy that held
      outside hosts, Page.goto timed out at 30 s. The setting
      suspendUntilListsAreLoaded=false does not help: it lifts only the
      start-up hold, and loadFilterLists() suspends again regardless of it.
      Pinning the selection through managed storage (toOverwrite.filterLists)
      leaves only bundled lists, so the first load needs no network. The cost
      is that a non-English locale loses its regional list. When uBO changes
      its default lists, update the keys in policies.json from its
      assets.json.

  - id: canvas-noise-entropy-is-lower-than-audio
    title: Two contexts shared a canvas fingerprint far more often than they should (beta.30; not reproduced since at small n)
    check: manual   # an open finding, not a settled decision
    evidence:
      - "24 profiles across 3 runs on v152.0.4-beta.30, once the canvas was actually hashed"
      - "audio 24 distinct / 24 samples; canvas 16 / 24, values recurring across independent runs"
      - "macOS 7 distinct of 12, Linux 9 of 12; one value seen three times"
      - "matches the rate at which CI flagged cross-profile canvas collisions"
      - "measured before the fork's canvas seed was restored for FF156 (9b7934c)"
      - "re-measured on CI Tests run 38299426185 (head 0b4c2bf), build-tester gate, raw-binary launches seeded per context (no launcher plan): macPerContext.uniqueCanvas 3/3, linuxPerContext.uniqueCanvas 3/3, uniqueAudio 3/3 in both; uniqueness.low_entropy empty; grade A, 1056/1064"
      - "in that run's macOS group uniqueFonts and uniqueWebGL were 1/3, so the three canvases differed with fonts and claimed GPU shared"
    rationale: >-
      Audio and canvas are both noised per context, by the same machinery, and
      were measured in the same runs with the same hash. Audio came back
      completely unique; canvas did not, and its values repeat across runs that
      share nothing. So two contexts in one browser are linkable by canvas
      roughly a third of the time, which is the property per-context spoofing
      exists to prevent.
      This was invisible until the fingerprint stopped being a 100-character
      prefix of a data URL, which compared equal for almost anything. It is
      recorded as an open question rather than a decision: it may be that canvas
      output is deliberately tied to the device preset rather than to
      canvas:seed, in which case the seed is not doing what its name suggests.
      Not gated, because failing one run in three helps nobody, and not dropped,
      because it is real.
      Re-measured once the seed was restored: six contexts in two groups of
      three, all six canvases distinct. That shows no collision at n=6. It is
      not a rate, and it does not show that "far more often" has gone: a 1-in-3
      collision rate would leave a group of three collision-free some of the
      time. Its macOS group did differ with fonts and claimed GPU shared, which
      fits the seed being what separates contexts. Only the Linux group, on a
      Linux host, is a path the product leaves uncovered; the launcher would
      cover the macOS group there, so it measures the seed mechanism alone. The
      run was headless (#195).
      Kept open until a larger sample settles it.

  # Fork divergence (lang315/camoufox): upstream's rule `canvas-is-not-noised`
  # (canvas rendered, not noised, no canvas seed; PR #528, e4528a2 disabled canvas
  # noise) is deliberately NOT carried here. The fork re-added canvas noise in
  # 617474b (browser/patches/canvas-spoofing.patch, `canvas:*` keys in properties.json),
  # so the rule and its native test were removed rather than left red.
  # The noise runs only where upstream's rendering plan leaves the canvas
  # uncovered. The launcher draws the launch's `canvas:seed`, and NewContext calls
  # setCanvasSeed, only when plan_rendering does not cover canvas
  # (python/src/camoufox/utils.py: launch_options, attach_canvas_cover,
  # context_canvas_seed; typescript/src/utils.ts: launchOptions,
  # attachCanvasCover, contextCanvasSeed). A browser launched outside NewBrowser (firefox.launch(),
  # connect()) carries no record and is seeded by default. With no seed the patch
  # is inert. python/tests/test_canvas_seed_follows_rendering_plan.py asserts that
  # a covered launch sends no seed, in place of upstream's
  # test_no_canvas_seed_is_declared_or_sent.

  - id: audio-is-not-noised
    title: The audio render is stock Firefox's, one value per CPU architecture, and there is no audio seed
    check: automated
    evidence:
      - "issue #926 / PR #927. Study 2026-10-23: 106 runs of stock Firefox, probe = fingerprintjs (OfflineAudioContext 1x5000@44100, triangle 10 kHz into a compressor, sum of |samples| 4500..5000, and SHA-256 of the whole buffer), CreepJS AnalyserNode frequency/time-domain reads, a biquad lowpass and a plain sine. Data: audio-study/summary_all.txt and audio-study/results/ (kept outside the repo); the guard browser/tests/playwright/patches/audio-matches-stock.py carries the probe and the expected values"
      - "ARM64, all 45 runs FPJS 35.74996626004577, buffer sha 8e127fb8b39c...: Raspberry Pi 4 Model B (Cortex-A72, ARMv8.0, Debian 12 arm64), Firefox 158.0.1 and 152.0.3, headless and headed; Mac Studio, Apple M5 Ultra, macOS 27.0.1; Mac mini, Apple M4, macOS 27.0; GitHub macos-14/15/26 (Apple M1), ubuntu-24.04-arm (Neoverse-N2), windows-11-arm (Cobalt 100/200)"
      - "x86-64, all 61 runs FPJS 35.749972093850374, buffer sha dea0ebd60642...: Ryzen 7 9850X3D (Zen 5, AVX-512), Ubuntu 26.04, Firefox 152.0.3, 153.0, 156.0.1 and 158.0.1; i9-11900H, Windows 11 26200, Firefox 158.0.1 and 152.0.3; GitHub ubuntu-latest/22.04 on EPYC 7763 (Zen 3, AVX2) and 9V45/9V74 (AVX-512); GitHub windows-latest/2022 on EPYC; GitHub macos-15-intel on i7-8700B"
      - "every run of an architecture also gave the same AnalyserNode, biquad and sine hashes; Linux, macOS and Windows on one architecture agree, and so do Firefox 152 to 158"
      - "device swap on the Ryzen box: EDIFIER R19BT USB, Samson Q2U, Radeon HDMI, null sinks at 6ch/96k and 1ch/22.05k, private PipeWire servers at 22050, 44100, 48000 and 96000 Hz, and no audio server all gave bit-identical offline output; only sampleRate, maxChannelCount and outputLatency followed the device"
      - "fpgen audio_hash_by_platform (Firefox records, its own metric): the x86 value is about 74% of records, and macOS records carry the ARM value"
      - "Camoufox's per-identity noise gave 35.734-35.743, which no real Firefox produced; v158.0-beta.40 with audio:seed 424242 renders 35.74635897387998 and moves the AnalyserNode, biquad and sine hashes too, and with audio:seed 0 renders stock x86-64 to the bit (audio-matches-stock.py)"
    rationale: >-
      An OfflineAudioContext render depends on the CPU's floating-point path and
      nothing else a page can see: not the OS, the sound card, the sample rate
      or the Firefox version. Real Firefox therefore has one audio fingerprint
      per architecture, and a site that has seen a few million visitors knows
      both. Noise did not hide the device; it put every identity on a value no
      real machine produces, and gave each context of one browser a different
      one, which no real browser does either. The render is left as stock
      renders it, so it is the host's architecture's value, the same in every
      context and every launch, and a returning identity reproduces it
      trivially (#442, #765). The audio-fingerprint-manager patch, its
      per-context setter and the audio:seed key are gone; a caller passing
      audio:seed gets a warning that it was removed, and the key is dropped
      before it reaches the browser. build-tester counts
      the audio hash with the values that must match across contexts, and the
      audio-matches-stock guard checks the build against the recorded values.

  - id: cross-os-canvas-is-the-rfp-placeholder
    title: On the host's OS the identity claims the host's GPU; on another OS or GPU canvas readback is RFP's random placeholder
    check: automated
    evidence:
      - "v156.0.1-beta.32, 2026-10-06: getImageData and readPixels identical with privacy.fingerprintingProtection on and off; CanvasUtils.cpp checks EfficientCanvasRandomization (PNG deBG chunk only) before CanvasRandomization"
      - "LibreWolf librewolf.cfg: privacy.resistFingerprinting true, no canvas prefs of its own; RFP readback without permission is TryToGenerateRandomDataForPlaceholderCanvasData"
      - "v156.0.1-beta.32: the three RFP canvas targets in privacy.baselineFingerprintingProtection.overrides give RFP's readback (random, toDataURL ~770 bytes) with hardwareConcurrency untouched"
      - "v156.0.1-beta.32: a Linux host with an RTX 5080 and a Ryzen iGPU reported 'AMD, Radeon HD 3200 Graphics, or similar' to WebGL, headless and headed"
      - "v156.0.1-beta.32: a Linux identity whose config claimed availHeight 1053 on a 1080 screen read 1080 (nsRFPService::GetSpoofedScreenAvailSize, no Linux offset)"
      - "fork: CI Tests run 38299426185 (head 0b4c2bf), build-tester, raw-binary launches seeded per context (no launcher plan): uniqueCanvas 3/3 macOS and 3/3 Linux on a Linux host; only the Linux group is a path the product leaves uncovered (n=3)"
    rationale: >-
      Canvas and WebGL pixels come from the host's OS, driver and GPU. On the
      host's OS the identity claims the GPU Firefox reports there, read from the
      browser itself because Firefox may render on another device than system
      tools name and sanitizes the name its own way; a software renderer
      matches any GPU, as a machine whose driver failed to load. On another OS,
      or with another GPU (one the caller or a preset names, or a host GPU
      fpgen never recorded, which has no WebGL data to claim), nothing can
      agree, and Firefox 156's private windows do not hide pixels, so the
      launchers turn on privacy.resistFingerprinting's canvas targets through
      the baseline overrides and nothing else. One function in each launcher
      (plan_rendering, planRendering) makes that decision for the launch and
      for the host identity its contexts must keep; a covered browser binds
      no context to the host. The readback is then
      what LibreWolf, Tor Browser and Mullvad Browser return; stock Firefox
      does not, so the launch warns. Firefox's older keyed pixel noise
      (CanvasRandomization) was rejected: no current Firefox produces it by
      default. Spoofed avail-screen and touch values go through baseline
      protection like the real ones, for the claimed OS, so the launchers
      claim them as it reports them (follow_baseline_protection,
      followBaselineProtection): the available screen is the screen less 48px
      on Windows, 76px on macOS and nothing on Linux, and more than one touch
      point is 5. A config claiming fpgen's recorded values read differently
      on the page.

      Fork divergence: this fork does apply keyed noise, its own
      canvas-spoofing.patch, seeded per launch and per context, on every launch
      the plan leaves uncovered, which is the host's OS on its own GPU or a
      software renderer. That is the trade: a pixel perturbation no current
      Firefox makes by default, taken for cross-context unlinkability on one
      host, which upstream does not address. The evidence is CI Tests run
      38299426185 (head 0b4c2bf), build-tester's raw-binary launches seeded per
      context: no collisions, not a rate. Its product-relevant sample is the
      Linux group on the Linux host, n=3, 3/3 distinct; the macOS group, which
      the launcher would cover there, measures only the seed mechanism. Covered
      launches get RFP's placeholder and no seed.

  - id: webgpu-follows-the-claimed-device
    title: navigator.gpu where Firefox on the claimed device has it; the host's adapter only behind the host's own GPU
    check: automated
    evidence:
      - "StaticPrefList.yaml (156.0.1): dom.webgpu.enabled is true on XP_WIN and on aarch64 XP_MACOSX, early-beta only elsewhere"
      - "fpgen gpuInfo, Firefox: navigator.gpu with no adapter on Windows on the Microsoft Basic Render Driver; no navigator.gpu on Intel and AMD Macs; no navigator.gpu for 97% of Linux"
      - "dom/webgpu/Adapter.h: GPUAdapterInfo vendor, architecture, device and description are always empty; limits and features are the real adapter's"
      - "v156.0.1-beta.32, Linux, prefs at startup: gfx.blacklist.webgpu 1 gives a real adapter, 4 (FEATURE_BLOCKED_DEVICE) resolves requestAdapter() to null"
      - "the same prefs through Playwright's firefox_user_prefs alone arrive after gfxPlatform::InitWebGPUConfig and are ignored"
    rationale: >-
      WebGPU hands the page the host's adapter: its limits and features name
      the real GPU even though Firefox blanks the adapter strings. Exposure
      follows Firefox's own build rule for the claimed device, so a Linux or
      Intel Mac identity has no navigator.gpu and a Windows or Apple Silicon one
      does. The adapter is the host's only when the identity claims the host's
      hardware GPU; otherwise the launchers set the downloadable blocklist's
      pref to a blocked device, and requestAdapter() resolves to null as it
      does for real users on a blocked or software GPU. The pref is read once at
      startup, so it goes through CAMOU_PREFS. It is written either way,
      because a persistent profile saves it and the next startup reads it.

  - id: webgl-browser-owned-values-follow-firefox
    title: WebGL values the browser decides follow the running Firefox and the claimed OS's backend, not fpgen's recording
    check: automated
    evidence:
      - "fpgen model-2/2026 records Firefox 146 (90% of Windows, 89% of macOS, 66% of Linux user agents); Camoufox ships 156.0.1"
      - "stock 146.0 and 156.0.1 on the same machines, twice each: Windows 11 on Intel Iris Xe and RTX 3050 Ti (headed), M1 Pro (headed), Linux on a Ryzen iGPU (headless); fpgen's records match 146 on the same hardware"
      - "Windows: 156 exposes EXT_depth_clamp in WebGL1 and WebGL2 on both GPUs, 146 on neither, and no fpgen Windows record has it. third_party/angle/src/libANGLE/renderer/d3d/d3d11/renderer11_utils.cpp:1334 (156, ANGLE chromium/7778) sets depthClampEXT = true on every D3D11 feature level; 146's ANGLE (chromium/5359) never sets it"
      - "Linux: WebGL1 ALIASED_LINE_WIDTH_RANGE is [1, 2048] on 146 and [1, 1] on 156, WebGL2 [1, 1] on both. 146's dom/canvas/WebGLContext.cpp:324 forced REQUIRE_COMPAT_PROFILE on WebGL1 unless webgl.1.allow-core-profiles, which 146's StaticPrefList.yaml set on macOS only; 156 removed both, and WebGLContextValidate.cpp:211 reads the driver's range only off a core profile, leaving WebGLTypes.h:654's {1, 1}"
      - "fpgen Linux WebGL2 records: [1, 1] on 97%, the driver's range on the 3% without EXT_depth_clamp (GLES drivers, where Firefox reads it)"
      - "browser/tests/playwright/patches/stock-gpu-parity.py fails on the 146-style WebGL1 range on Linux, on a hardware GPU and on llvmpipe, and passes with the fix"
    rationale: >-
      fpgen's records are right for the Firefox that made them; what goes
      stale is what that Firefox decided rather than the GPU. Hardware-owned
      values (the renderer, most limits, the extensions a Linux or macOS
      driver offers) keep coming from the recording. Browser-owned ones are
      corrected where the launchers convert a recording (to_config). ANGLE's
      D3D11 backend gives every Windows GPU EXT_depth_clamp, which takes its
      place in Firefox's alphabetical extension order. WebGL1 now shares
      WebGL2's GL profile, so it reports the line width range the same device
      recorded for WebGL2, which is right for core profiles and GLES drivers
      alike. Live state that also changed (the stencil masks) is answered by
      the real context and needs nothing. stock-gpu-parity finds the next
      drift: it fails where stock Firefox of the recorded release and of the
      shipped one differ on the same machine and Camoufox does not follow the
      shipped one.

  - id: canvas-fingerprint-is-hashed-not-truncated
    title: The canvas check hashes pixels, not a prefix of the data URL
    check: automated
    evidence:
      - "browser/tests/build-tester/src/lib/checks/collectors.ts returned canvas.toDataURL().substring(0, 100)"
      - "CI reported two contexts sharing a canvas fingerprint; 8 local runs across two rendering paths never did"
    rationale: >-
      A hundred characters of a data URL is not the image. "data:image/png;base64,"
      takes 22 of them, leaving about 58 bytes of PNG: the signature, the IHDR
      giving width and height, the IDAT header, and roughly fifteen bytes of
      deflate stream. Cross-profile uniqueness was therefore decided by whether
      the noise happened to land in the top-left of the first scanline, and two
      contexts whose canvas differed everywhere else read as identical. Worse,
      the stability check compared the same prefix between two collections, so
      it passed on PNG headers and could not have noticed non-deterministic
      output. getImageData is the surface a fingerprinter reads; hash that.

  - id: build-tester-is-headful-and-webgl-absence-fails
    title: build-tester launches headful, refuses to run without a display, and fails a WebGL check that finds no WebGL
    check: automated
    evidence:
      - "issue #75: one binary, headless 124/125 with 5 WebGL checks passing on 'WebGL not available', headful under xvfb 136/137 with none"
      - "issue #195: browser/tests/build-tester/scripts/runner.py launched with headless=True at both sites, so run_tests.sh's xvfb fallback and BUILDTESTER_HEADLESS changed nothing"
    rationale: >-
      The WebGL checks returned passed:true when there was no GL context, so a
      run without WebGL scored them as green and left the webglExtended block
      out of the denominator. The suite now launches headful, a Linux host with
      no display fails before launching, and every "not available" branch fails
      the check, so missing WebGL reads as a failure rather than as coverage.

  # -------------------------------------------------------------------------
  # Fonts
  # -------------------------------------------------------------------------

  - id: context-font-list-lives-in-the-shared-store
    title: A context's font list lives in the shared store, and every process flushes its font caches when the list arrives
    check: manual
    evidence:
      - "upstream 914b575: the per-context font list moved into RoverfoxStorageManager, read by every process"
      - "browser/patches/cross-process-storage.patch: OnStoragePrefChanged calls FontListManager::OnFontListStored for each roverfox.s.fontlist_<id> pref, after MirrorPref releases the cache mutex; EnsureMirror registers it on the main thread, from ContentChild::InitXPCOM in every content process"
      - "browser/patches/font-list-spoofing.patch: OnFontListStored runs ClearCodepointsWithNoFonts (#81) and ClearFontNameCaches (#83), logging `CAMOU-FL flush ctx=<id> fontlist=<0|1>`"
      - "browser/tests/playwright/patches/context-list-every-process.py: flush_arm"
      - "CI run 38299426185 (head 0b4c2bf): context-list-every-process passed, flush arm included"
    rationale: >-
      A context's documents land in any content process, and only the first
      one calls setFontList. Every other process reads the list from upstream's
      shared store, so each one can answer a lookup for that context before the
      list reaches it. Such an answer is made with no list, which allows every
      family, and the font caches memoize it: the codepoint-miss cache (#81)
      and the name-keyed memos in front of the gate (#83). So each process
      flushes both when the fontlist_<id> pref reaches it, from the storage
      pref callback on the main thread. fontlist=0 means that process has no
      font list yet, so there is nothing to flush. The flush never runs while
      sFontListMutex is held: it takes gfxPlatformFontList's mLock, and every
      gated read takes mLock before sFontListMutex, so flushing under
      sFontListMutex would invert that order. That rules out flushing from
      EnsureFontList, the lazy parse on the lookup path. The guard's
      flush arm fails a process that answered a context without its list and
      never received it, or answered without it after it arrived, and fails
      the run when no content process logged a flush with a live font list.

  - id: macos-package-ships-no-macos-only-fonts
    title: The macOS package bundles the Windows and Linux font groups, never the macOS-only one
    check: automated
    evidence:
      - "issue #259: on a macOS host, fork.5 and fork.6 drew the wrong glyphs for every system-ui string (tab titles, the address bar, page text in system-ui or -apple-system), while 150.0.2-beta.25, packaged with --fonts windows linux, drew them correctly"
      - "upstream #779 (6daae88) changed package-macos from --fonts windows linux to --fonts windows macos linux, which put ten San Francisco faces (42__SFNS.ttf and others) in Contents/Resources/fonts; the bundled SFNS.ttf is 7,909,644 bytes, and the host's /System/Library/Fonts/SFNS.ttf on macOS 15.7.4 is 8,330,740"
      - "issue #259, one change each on the same Mac: the installed fork.6 with gfx.bundled-fonts.activate=0 drew correctly, and a fork.5 copy with only the ten *__SF* files removed and the bundle still on drew correctly"
    rationale: >-
      font-hijacker.patch activates the bundle on macOS for every launch except
      a native identity: a launch with no config, and a Windows or Linux
      identity on a Mac. CoreText then holds two different copies of the system
      font under one name, and the system UI font draws its glyph ids from the
      wrong one. The browser's own chrome uses that font whatever the identity
      claims. A macOS identity on a Mac never activates the bundle, so the
      macOS-only group is never read there. A Windows or Linux identity reads
      only its own OS's groups, and the shared groups still ship.

  - id: bundled-fonts-registered-in-the-macos-gpu-process
    title: On macOS the GPU process registers the bundled fonts through the same gate as the content process
    check: automated
    evidence:
      - "issue #356: on a macOS host a Windows identity drew wrong glyphs for Segoe UI and Arial in the real window ('CH%J' for 'CHƠI') while Page.screenshot of the same page was correct; with layers.gpu-process.enabled=false in the profile's user.js every row was clean and the GPU Helper child of the browser was absent"
      - "issue #356, Swift test of WebRender's lookup (name descriptor plus kCTFontURLAttribute, CTFontCreateWithFontDescriptor) in a process that did not register the bundle: nine of nine names resolved to /System/Library/Fonts/Helvetica.ttc; in a process that registered the files, nine of nine resolved to the requested file"
      - "gfx/2d/ScaledFontMac.cpp UnscaledFontMac::GetFontDescriptor sends the PostScript name and the file path; gfx/wr/wr_glyph_rasterizer/src/platform/macos/font.rs add_native_font looks the name up in the GPU process and ignores a failed URL step; the bundle is registered only with kCTFontManagerScopeProcess from CoreTextFontList::CoreTextFontList"
    rationale: >-
      WebRender rasterizes glyphs in the GPU process, which has no font list and
      so never ran the bundle's registration. CoreText there ignores the path
      attribute for a file it does not know and returns another font, so the
      glyph ids content shaped with are drawn with that font's outlines. The
      gate (the gfx.bundled-fonts.activate pref and a native macOS identity) and
      the loop are one function pair, CoreTextFontList::ShouldActivateBundledFonts
      and ActivateBundledFonts, called by the content-side font list and by
      GPUParent::RecvInit before the render thread starts, so the two file sets
      cannot drift. Windows and Linux hosts hand WebRender a file path, which
      needs no registration.

  - id: fc-activates-only-firefox-own-bundled-fonts
    title: On Linux the browser activates only the files directly in fonts/; the groups come from the launcher's conf
    check: automated
    evidence:
      - "issue #329: on a Linux host a Linux launch drew `fonts/M/27__Helvetica.ttc` for Helvetica, `fonts/M/69__Times.ttc` for Times and `fonts/M/0__arial.ttf` for Arial (CAMOU-FL face, e2e run 40779839195 on the Linux build of PR #328), while `fc-match -s` against the generated FONTCONFIG_FILE listed only L and LW files"
      - "issue #329, removal arm (e2e run 40780901666): with fonts/M, fonts/W and fonts/MW moved out of the browser directory the same names drew `L/openadd-NimbusSans-Regular.otf`, `L/openadd-NimbusRoman-Regular.otf` and `L/openadd-NimbusMonoPS-Regular.otf`"
      - "gfxFcPlatformFontList.cpp:3095-3117 at FIREFOX_158_0_1_RELEASE: ActivateBundledFonts() called FcConfigAppFontAddDir on <GRE>/fonts, which fontconfig scans recursively"
    rationale: >-
      Which font groups an OS reads is decided in one place,
      utils._generate_fontconfig, which hands fontconfig one <dir> per group
      and never the fonts/ parent. Upstream's ActivateBundledFonts added the
      parent as an application font directory, which put every group of every
      OS on the search path regardless of that conf; the allowlist filters by
      family name, not by origin, so any admitted name drew whatever group
      carried it. linux-bundled-fonts-toplevel.patch adds only the files
      directly in fonts/ (Firefox's own bundled faces). A harness that launches
      the Linux binary and reads fonts must set FONTCONFIG_FILE from the
      launcher's generator; a raw launch measures the host's fonts.

  - id: linux-claim-aliases-come-from-fonts-conf
    title: A Linux claim's name aliases on Windows and macOS are generated from the shipped fonts.conf, never written by hand
    check: automated
    evidence:
      - "issue #325: a Linux claim on a Windows or macOS host drew `Helvetica.ttc`, `Times.ttc` and `Arial` for Helvetica, Times and Arial, where a Linux host draws Nimbus Sans, Nimbus Roman and Arimo (CAMOU-FL face, e2e runs 40779839195 and 40791218227)"
      - "gfxFcPlatformFontList.cpp:2564-2608 at FIREFOX_158_0_1_RELEASE: Gecko takes the families before a sentinel in FcConfigSubstitute's answer, which is the chain browser/scripts/gen-font-aliases.py reads with fc-pattern"
    rationale: >-
      Which Linux face a name draws is fontconfig's decision, in the order
      fonts.conf gives, and it depends on what the bundle ships. A table written
      by hand drifts from the conf, and a fingerprint built from two drifting
      copies is detectable. FontAliasesLinux.hpp is generated by
      gen-font-aliases.py on a Linux machine from the staged bundle, and
      test_font_aliases_table.py fails when it differs. No fontconfig is needed
      at build time, and the file is never edited.

  - id: native-system-ui-family-never-masked
    title: A native identity's system UI family is never refused by the launch font mask
    check: automated
    evidence:
      - "issue #263: under os=macos on a Mac, system-ui measured 391.367 with a serif fallback and 500.933 with a monospace one (resolved to nothing) while -apple-system measured 431, on 158.0-beta.33 fork.1, fork.7 and fork.6; stock Firefox 158.0 on the same Mac measured both at 431"
      - "MOZ_LOG=fontlist:5 on that build: `CAMOU-FL pref-fallback ctx=6 key=.sf ns allowed=0`, then `step=system-ui key=none`; the same identity list plus .SF NS resolved system-ui to 431 with `allowed=1`"
      - "commit 41b0944 (#188) sent a native identity's system-ui down the pref path and asserted its family would pass the read filter like every pref font; it was never measured on a Mac"
    rationale: >-
      A native identity resolves system-ui as the host does, so the family
      GetSystemUIFontFamilies names is the OS's own. No font list names it: on
      a Mac it is the hidden .SF NS behind the name -apple-system, which
      CoreTextFontList answers before the mask, so the CSS name drew San
      Francisco while system-ui drew the default serif and a page could tell
      the two apart. The family is exempted by
      CamouIsNativeSystemUIFamily and no other pref family is. The alternative
      of adding the name to the font lists was rejected: the hidden name varies
      with the macOS version, and every launcher would need it.

  # -------------------------------------------------------------------------
  # Browser source
  # -------------------------------------------------------------------------

  - id: launcher-default-browser-is-the-fork-alone
    title: The launchers' default browser is lang315/camoufox alone, with no upstream fallback
    check: automated
    evidence:
      - "issue #266: python/src/camoufox/repos.yml defaulted to daijro/camoufox, so `camoufox fetch` and every launcher installed a browser without this fork's patches"
      - "pkgman.py get_asset (CamoufoxFetcher): it tries the next repository whenever one yields no matching asset, not only on an error; the fork's releases carry Windows and macOS packages only"
      - "python/tests/test_fork_default_browser.py: with a comma list, Linux finds no fork package and installs upstream's"
    rationale: >-
      The default entry in repos.yml names lang315/camoufox and nothing else. A
      second repository there is a silent fallback: on Linux the fork has no
      package, so get_asset would move on and install upstream's unpatched
      browser, and in an anti-detect browser a silent wrong answer is a
      fingerprint. Linux has to raise MissingRelease instead. Upstream's
      browser stays one `camoufox set official/stable` away, and the Official,
      CoryKing and JWriter20 entries are kept for that.

  # -------------------------------------------------------------------------
  # Teardown
  # -------------------------------------------------------------------------

  - id: launch-failure-tears-down-playwright
    title: A failed launch must not leak the Playwright session
    check: automated
    evidence:
      - "issue #82 / PR #655 / commit 0d54401"
    rationale: >-
      The Playwright session is started before the browser. If the launch then
      raises -- bad proxy, missing binary, invalid options -- the driver process
      and its connection stay alive with nothing holding them. Every launch path
      wraps the launch and calls the base __aexit__ on failure.

  - id: close-failure-still-tears-down
    title: browser.close() raising must not skip teardown
    check: automated
    evidence:
      - "issue #82 / PR #655 / commit 0d54401"
      - "commit fd1bb2f: the same rule for the virtual display"
    rationale: >-
      A browser that has already crashed makes close() raise, and the original
      code let that exception skip the driver teardown -- so the failure mode
      that leaks is exactly the one that happens under load. The close goes in a
      try, the teardown in the finally. The virtual display is cleaned up the
      same way.

  # -------------------------------------------------------------------------
  # Contexts and windows
  # -------------------------------------------------------------------------

  - id: no-viewport-when-window-is-spoofed
    title: Spoofed window dimensions imply no_viewport
    check: automated
    evidence:
      - "issue #666 / PR #673: page-recycle hang under spoofed window dims"
    rationale: >-
      Playwright's default viewport deadlocks Juggler when the window has been
      spoofed to a different size. Both launch paths default to no_viewport when
      spoofs_window_dimensions() is true, unless the caller said otherwise.
    expect:
      module: camoufox.utils
      has_callables: [spoofs_window_dimensions, attach_no_viewport_default]

  - id: virtual-display-skips-screen-clamp
    title: A virtual display never clamps the generated screen
    check: automated
    evidence:
      - "python/src/camoufox/utils.py: the `not virtual_display` guards"
    rationale: >-
      This is what makes the 1x1 default safe. If clamping applied, a 1x1 root
      window would clamp every generated screen down to 1x1 and the fingerprint
      would be absurd. The guard and the 1x1 default stand or fall together --
      remove the guard and the display size stops being a free choice.

  - id: evaluate-is-isolated-by-default
    title: page.evaluate runs in an isolated world; "mw:" is the opt-in hatch
    check: automated
    evidence:
      - "PR #745 / issue #738: let init scripts reach the page world with 'mw:'"
      - "commit c3d5721: evaluate in an isolated world, with an opt-in main-world hatch"
    rationale: >-
      Injected automation JavaScript running in the page's world is visible to
      the page, which is the thing this fork exists to prevent. Isolation is the
      default and the "mw:" prefix is the deliberate, per-call way out. Upstream
      Playwright's suite is run with isolation off because it asserts upstream
      semantics -- that flag must never become the default here.

  # -------------------------------------------------------------------------
  # Juggler frame lifecycle
  # -------------------------------------------------------------------------

  - id: per-frame-state-released-on-dispose
    title: Anything reset when the document changes is also released when the frame dies
    check: automated
    evidence:
      - "browser/additions/juggler/content/FrameTree.js: _masterSandbox was cleared in _onGlobalObjectCleared() but not in Frame.dispose()"
      - "upstream Playwright's FrameTree.js has no _masterSandbox, and dispose() was inherited from it verbatim"
    rationale: >-
      Frame.dispose() came from upstream, which has no Camoufox-specific
      per-frame fields. So when one is added, only the navigation path tends to
      learn about it, and a frame that is *destroyed* rather than navigated
      keeps it -- which is the common case on any page that creates and removes
      iframes. _masterSandbox made that concrete: built over the page window
      with a system principal, it holds the window's global and with it the
      whole document, so a retained one keeps a dead document alive. The
      invariant is simply that the two teardown paths agree: a field worth
      resetting when the document changes is worth releasing when the frame goes
      away, and a sandbox needs nuking rather than just dropping.

  - id: fingerprint-setters-sealed-per-window
    title: The window.setXxx() fingerprint setters start sealed, and the seal is per window
    check: manual   # browser/tests/playwright/patches/fingerprint-setter-seal.py
    evidence:
      - "PR #749 (7911f4a): setters a fingerprint never called stayed on window, and a launch with no init script leaked all of them"
      - "browser/patches/window-setter-seal.patch"
      - "browser/tests/native/test_tribal_rules.py: every Func= setter in a Window.webidl hunk is on kCamouFingerprintSetters and in the guard's SETTERS"
    rationale: >-
      The setters are configuration API for the automation side, not page API.
      A window starts sealed; juggler unseals it, runs the init scripts that
      apply a per-context fingerprint, and seals it again before page script
      runs. Sealed is the default so the failure is closed: a window automation
      never drives (the binary launched as a plain browser) never offers them,
      instead of offering them permanently to whatever loads. The flag is per
      window, not per browsing context: every new document needs its own
      configuration window, and a context-wide flag would seal on the first
      about:blank and leave every later navigation unable to apply a
      fingerprint. The Func= guards consult the flag, which is what stops the
      DOM resolve hook handing a name back after it has been deleted.

  # -------------------------------------------------------------------------
  # Input
  # -------------------------------------------------------------------------

  - id: input-through-one-chokepoint
    title: Every synthesized input event goes through MouseDispatch.js
    check: manual   # enforced by browser/scripts/check-input-dispatch.py in CI
    evidence:
      - "docs/input-dispatch.md: four deadlocks between 2026-04 and 2026-09"
      - "issues #225, #677, #751, #752"
    rationale: >-
      Four separate deadlocks, each fixed by adding one more coordinate guard at
      one more call site, which does not converge -- the trigger set is not
      enumerable, because whether a coordinate reaches the renderer depends on a
      rounding accident in the fractional height of spoofed browser chrome. One
      unbounded await for an ack that never arrives wedges input for every tab
      in the process, permanently, at 0% CPU.

  # -------------------------------------------------------------------------
  # Config schema
  # -------------------------------------------------------------------------

  - id: config-keys-are-never-deleted
    title: A key leaves browser/settings/properties.json only by being marked removed
    check: automated
    evidence:
      - "issue #835: camoufox 0.4.11 failed to launch v156.0.1-beta.34 with 'Unknown property navigator.appCodeName in config'"
      - "#787 (180e655) deleted 35 keys the browser no longer read; every release from v156.0.1-beta.32 shipped without them"
    rationale: >-
      properties.json ships inside the browser, and every released library
      validates its config against the copy in whatever browser it finds.
      Libraries up to 0.4.x raise on a key they send that the browser does not
      declare, and they accept every browser release below 1, so they download
      new releases on their own. Deleting a key therefore breaks launches for
      everyone on an older library the moment a release ships. A key the
      browser stops reading is instead kept with a "removed" field: older
      libraries still validate it, the browser ignores it, and current
      libraries skip it with a warning that it has no effect.

  # -------------------------------------------------------------------------
  # Network
  # -------------------------------------------------------------------------

  - id: https-first-stays-on
    title: HTTPS-First keeps Firefox's default, on
    check: manual
    evidence:
      - "#638 (restored in 0e4151f) set dom.security.https_first=false in camoufox.cfg so Playwright's GET-only test proxy passed"
      - "914b575 removed it again; ci/skiplist.yml lists the proxy tests it fails, with the reason"
      - "measured 2026-10-08 on a v156.0.1-beta.32 build: every proxy test in test_proxy.py and test_browsercontext_proxy.py passes with the pref appended to camoufox.cfg, and fails without it"
    rationale: >-
      Stock Firefox tries an http:// navigation as https:// first, and a server
      sees whether a browser does, so turning it off marks the browser as not
      stock Firefox. Playwright's own Firefox turns it off (playwright.cfg), and
      upstream's proxy tests depend on that: their proxy is the test server,
      which answers plain GETs and cannot open the CONNECT tunnel the upgrade
      needs. A real proxy handles CONNECT, as every https:// site needs it to.
      Those tests are skiplisted rather than passed by changing the browser.

  - id: webrtc-fork-model
    title: WebRTC keeps the fork's model, per-context IP with no srflx fabrication and no_host on, and its guards measure that model
    check: manual
    evidence:
      - "#178 D1: keep the per-context WebRTCIPManager (browser/patches/webrtc-ip-spoofing.patch, webrtc-ip-spoofing2.patch); do not take upstream's srflx fabrication"
      - "browser/settings/camoufox.cfg: defaultPref(\"media.peerconnection.ice.no_host\", true)"
      - "CI run 38299426185: upstream's webrtc-context-ip and webrtc-port-range read the srflx candidate upstream fabricates against a silent STUN server, and saw no candidates on the fork"
      - "browser/tests/playwright/patches/webrtc-context-ip.py, browser/tests/playwright/patches/webrtc-port-range.py"
      - "CI run 38310314782 (head 7e03c7e): both adapted guards passed, patch guards spoofing 22/22"
      - "CI run 38992109773 (head a4236f8): upstream's ipv4-only-network guard read no host candidate with network:ipv4Only off or on, because of no_host; it now sets no_host false for its own probe"
    rationale: >-
      The fork's WebRTC model diverges from upstream's. A context's IP masks the
      srflx candidate a real STUN answer produces, no srflx candidate is made up,
      and no_host keeps host candidates off the page. So the two upstream guards
      were adapted, not dropped. webrtc-port-range reads each socket's bound port
      as the source port of its Binding Request at the STUN socket.
      webrtc-context-ip runs an answering STUN server and reads each context's
      srflx candidate, with an unmasked context as the control. Both serve STUN
      on the default-route address, because nICEr skips a loopback STUN server
      under the shipped prefs. The launch-level
      webrtc:ipv4 key is not asserted, because no browser code reads it (#163).
      ipv4-only-network turns no_host off for its probe, since the page cannot
      see which addresses were gathered otherwise.

  - id: legacy-family-names-read-on-masked-lookup
    title: A legacy font family name is resolved by a patch on the lookup, not by gfx.font_loader.delay=0
    check: manual
    evidence:
      - "#247: Windows identity on the fork.4 macOS arm64 build, 8 launches in 8 drew the fallback for DejaVu Sans Condensed, Sans Light and Serif Condensed"
      - "same binary, 8 alternating launches: launch to about:blank 9.13 s without the pref, 10.85 s with gfx.font_loader.delay=0; first lookup 1662 ms against 2 ms"
      - "Firefox 156.0.1 gfx/thebes/gfxPlatformFontList.cpp: gfx.font_loader.delay is read in InitOtherFamilyNames, in the font loader's time-slice check, and in GetPrefsAndStartLoader"
      - "browser/patches/font-other-names-sync.patch; browser/tests/playwright/patches/legacy-family-names-first-measure.py"
    rationale: >-
      The pref resolves the names, but it is one setting for three behaviours: it
      makes the other family names synchronous, starts the font loader after 1 ms
      instead of 8 s, and removes the loader's per-pass time limit. Launch took
      1.7 s longer, and by reading the code the loader would read every cmap at
      startup, which fallback-miss-while-cmaps-load.py needs pending. The patch
      changes one argument on the one lookup that needs it, for a masked page.

  - id: legacy-family-names-windows-claim-stock-path
    title: A Windows claim on a Windows host takes stock Firefox's legacy-name lookup and deferral
    check: manual
    evidence:
      - "#321, run 40694052562: on windows-2025 the monospace row of the five-name arm is identical in stock 158.0.1 and the fix build, and differs from v158.0.1-beta.34-fork.1 on four of five names"
      - "Firefox 158.0.1 gfx/thebes/SharedFontList.cpp:1234-1317: the XP_WIN branch of FontList::FindFamily answers a legacy name with its base family and defers the rest"
      - "browser/tests/playwright/patches/legacy-family-names-first-measure.py, windows_host_parity"
    rationale: >-
      Real Windows Firefox is base-family-first and defers the other names, so
      a Windows identity on a Windows host is closest to a real machine when it
      runs the unmodified path. The patch forces the synchronous read only for a
      Linux or macOS claim there. Forcing it for every masked claim, as #247 did,
      let a page tell the two apart by measuring two legacy names of one base.
      The same difference on a macOS or Linux host is a known gap (#322), see
      docs/fonts-gating.md.

  - id: ipv4-only-network-not-disable-ipv6
    title: geoip without a proxy keeps IPv6 only where it agrees, and never uses network.dns.disableIPv6
    check: manual
    evidence:
      - "issue #849: with geoip=True and an IPv4 address, network.dns.disableIPv6 made IPv6-only sites fail with NS_ERROR_UNKNOWN_HOST"
      - "netwerk/dns/nsDNSService2.cpp GetAFForLookup and nsHostResolver.cpp's IP-literal path: the pref only stops AAAA lookups, so an IPv6 literal still connects and WebRTC still gathers IPv6"
      - "browser/tests/playwright/patches/ipv4-only-network.py: with network:ipv4Only, IPv6 literals and AAAA-only names fail at once, dual-stack names use IPv4, and WebRTC offers no IPv6 candidate; with it off, all of them use IPv6"
    rationale: >-
      A real browser is on a dual-stack network or an IPv4-only one, and the
      pref made a third state no network produces: names never resolve to IPv6
      but IPv6 literals connect, so a page could read the host's IPv6 address
      and tell the browser apart. Without a proxy, sites see this host's own
      addresses, and public_ip() prefers IPv4, so the identity comes from the
      IPv4 address. The launcher keeps IPv6 when the host's IPv6 address
      geolocates to the same timezone and region, and otherwise sets
      network:ipv4Only, which makes the browser behave exactly as on an
      IPv4-only network. A failed IPv6 lookup counts as no IPv6. Behind a proxy
      the browser reaches sites only through the proxy, so nothing is set.

  # -------------------------------------------------------------------------
  # Branding
  # -------------------------------------------------------------------------

  - id: pages-see-firefox-not-camoufox
    title: Camoufox builds as an official Firefox, and pages load Firefox's branding files
    check: automated
    evidence:
      - "issue #847: hCaptcha tokens rejected on a site that validates them server-side, with nothing attached to the browser"
      - "measured 2026-10-10 against stock Firefox 156.0.1: every chrome://branding/content/ logo (contentaccessible=yes) was Camoufox's, and browser-main.js differed because the non-official build ships browser-development-helpers.js and contentaccessible-parity.patch had to remove its loader"
      - "contentaccessible-parity.patch (8c2047a) had declined MOZILLA_OFFICIAL as moving telemetry, update-channel and branding defaults; base.mozconfig now sets it and switches MOZ_TELEMETRY_REPORTING back off"
    rationale: >-
      Stock Firefox releases are official builds with Firefox branding, so
      anything a page can reach must be what that build ships. Camoufox keeps
      its own name only where no page can see it: the binary, window class,
      profile directory and OS icons. MOZILLA_OFFICIAL also switches on
      compile-time telemetry reporting, which base.mozconfig turns back off;
      turns dump() off, which Juggler's readiness line needs, so camoufox.cfg
      turns it back on; and makes Widevine verify host binaries that Camoufox
      does not sign. contentaccessible-parity.py compares every
      content-reachable file's bytes with a stock release.

  # -------------------------------------------------------------------------
  # Juggler
  # -------------------------------------------------------------------------

  - id: juggler-is-not-a-chrome-package
    title: Juggler loads from resource://gre/modules/juggler/, never a chrome package
    check: automated
    evidence:
      - "issue #847: hCaptcha's hsw.js runs new Worker('chrome://juggler/content/content/WorkerMain.js'); the constructor returns while a juggler package is registered and throws a SecurityError when none is, and a returned Worker gets a puzzle"
      - "the reporter's bisect on #847: removing only the manifest line passes, renaming the package passes, an inert Juggler.js under the registered name fails"
      - "measured 2026-10-12: inside a namespace stock Firefox registers (resource://gre, chrome://devtools) the constructor behaves the same for existing and missing files"
    rationale: >-
      Content processes receive every registered chrome package and resource
      host, so a name only Camoufox registers is detectable whatever the files
      under it do. A renamed or per-build-random package only moves the tell,
      since the next probe asks for the new name. Juggler's files are installed
      with FINAL_TARGET_FILES under modules/juggler/, inside resource://gre,
      which every Firefox registers. contentaccessible-parity.py compares the
      registered names with a stock release and runs the Worker probe.

  - id: additions-register-no-new-chrome-package
    title: No addition registers a chrome package or resource host a stock Firefox lacks
    check: automated
    evidence:
      - "issue #847: a registered name is visible to any page through new Worker('chrome://<name>/...'), whatever the files under it do"
      - "issue #258: the tracking panel's \"% content camoufox\" package, registered in every build though the observer is off unless CAMOU_OBSERVE=1, was the only such name left after #847; nothing opened the panel, and the tests read the Collector through Marionette chrome context"
      - "about:observer (armed-only) does not breach it: TrackingObserver.sys.mjs register(), which runs only when CAMOU_OBSERVE is set, registers the about module at runtime, so a disarmed build has no such about: name or contract; the page is a file under resource://gre/modules/, a host every Firefox registers, and no chrome package is declared. test_about_observer.py checks the disarmed refusal and that web content fails to reach the page exactly as it fails for a made-up name"
    rationale: >-
      browser/additions/**/jar.mn may only register names that
      scripts/data/contentaccessible-manifest.json records for a stock release.
      Chrome code that needs files serves them from resource://gre/modules/,
      which every Firefox registers. A page of its own, which needs a chrome
      package to run privileged, is not worth a detectable build.

  # -------------------------------------------------------------------------
  # Releases
  # -------------------------------------------------------------------------

  - id: releases-ride-a-twice-monthly-train
    title: A merge to main is tested, not released; releases ship on the 1st and 15th
    check: manual   # ci/tests/test_release.py
    evidence:
      - "issue #863: seven browser prereleases (v156.0.1-beta.32 to beta.38) shipped between 2026-09-28 and 2026-10-13, one per merge"
      - "PyPI and npm trusted publishing match the top-level workflow file, so publishing stays in release.yml rather than a reusable workflow"
    rationale: >-
      Releasing every merge gave users a new browser every few days, and stable
      releases waited on a maintainer remembering to tag one. The train
      promotes the newest prerelease to stable and cuts the next one from main
      twice a month, so a prerelease has had two weeks of use before it becomes
      stable. Weekly was considered and rejected as too many updates for users
      to manage. A fix that cannot wait is cut by dispatching release.yml on
      main, and an open issue labelled `regression` holds the promotion.

  - id: linux-only-guards-are-not-applicable-elsewhere
    title: A patch guard that needs Linux tooling is "not applicable" on other platforms, never a pass, and a failure on Linux when its prerequisite is missing
    check: manual   # ci/tests/test_ci.py::test_a_linux_only_guard_is_not_applicable_elsewhere_and_not_a_pass
    evidence:
      - "issue #314: ipv4-only-network (unshare, ip) and the WebGL guards (Xvfb) failed on a real Windows host for lack of Linux tools"
      - "issue #311: the runner itself was Linux-only"
    rationale: >-
      Folding them into the passes would claim a measurement nobody took; skipping
      them silently on Linux would let a job that forgot a prerequisite pass having
      tested nothing (AGENTS.md). So the runner's LINUX_ONLY set decides by
      platform before starting the script, prints the guard under its own count,
      and records it as not_applicable. The set sits beside GROUPS rather than in
      each guard because the runner must decide without running the script.
      A guard that does not apply on one platform for that platform's reason
      (system-font-alias-stall on macOS, windows-keyboard on Windows) sits in NOT_ON
      with the reason, counted the same way.
