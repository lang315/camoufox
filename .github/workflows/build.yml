name: Build and Release

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Matrix scope. 'full' = all targets. Otherwise build a single leg."
        required: true
        default: "full"
        type: choice
        options:
          - "full"
          - "linux-x86_64"
          - "linux-arm64"
          - "linux-i686"
          - "windows-x86_64"
          - "windows-i686"
          - "macos-x86_64"
          - "macos-arm64"
  push:
    tags:
      - "v*"

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      json: ${{ steps.gen.outputs.json }}
    steps:
      - id: gen
        env:
          BUILD_TARGET: ${{ inputs.build_target }}
        run: |
          if [ -z "$BUILD_TARGET" ] || [ "$BUILD_TARGET" = "full" ]; then
            cat >>"$GITHUB_OUTPUT" <<'JSON'
          json={"include":[
            {"target":"linux","arch":"x86_64"},
            {"target":"linux","arch":"arm64"},
            {"target":"linux","arch":"i686"},
            {"target":"windows","arch":"x86_64"},
            {"target":"windows","arch":"i686"},
            {"target":"macos","arch":"x86_64"},
            {"target":"macos","arch":"arm64"}
          ]}
          JSON
          else
            os="${BUILD_TARGET%-*}"
            arch="${BUILD_TARGET#*-}"
            echo "json={\"include\":[{\"target\":\"$os\",\"arch\":\"$arch\"}]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix
    # macOS legs run on macos-26 (Xcode 26 / SDK 26.x). FF150 hard-requires the
    # macOS 26 SDK: mac_sdk_min_version() is "26.2", and the source actually uses
    # macOS-26-only APIs (e.g. widget/cocoa/nsCocoaWindow.mm references
    # NSGlassEffectView), so it cannot compile against an older SDK — macos-15
    # (SDK 15.5) failed with "use of undeclared identifier 'NSGlassEffectView'".
    # The SDK is universal, so the x86_64 leg cross-compiles on the arm64 runner.
    runs-on: ${{ matrix.target == 'macos' && 'macos-26' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.json) }}

    env:
      # Persist ccache across runs (see "Cache ccache" step). Without this, every
      # Firefox build is cold (~4-5h, near the 6h GitHub cap); the default ccache
      # dir is overridden to a workspace path so actions/cache can save/restore it.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "2G"

    steps:
      - name: Maximize build space
        if: matrix.target != 'macos'
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          verbose: "false"

      - name: Remove unwanted tools
        if: matrix.target != 'macos'
        # Originally from here: https://github.com/AdityaGarg8/remove-unwanted-software/blob/master/action.yml
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' > /dev/null
          sudo apt-get remove -y '^dotnet-.*' > /dev/null
          sudo apt-get remove -y '^llvm-.*' > /dev/null
          sudo apt-get remove -y 'php.*' > /dev/null
          sudo apt-get remove -y '^mongodb-.*' > /dev/null
          sudo apt-get remove -y '^mysql-.*' > /dev/null
          sudo apt-get remove -y azure-cli google-chrome-stable firefox ${POWERSHELL} mono-devel libgl1-mesa-dri --fix-missing > /dev/null
          if [[ (${CODENAME} = focal) || (${CODENAME} = jammy) ]]; then
            sudo apt-get remove -y google-cloud-sdk --fix-missing > /dev/null
            sudo apt-get remove -y google-cloud-cli --fix-missing > /dev/null
          fi
          sudo apt-get autoremove -y > /dev/null
          sudo apt-get clean > /dev/null

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up LLVM (Linux)
        if: matrix.target != 'macos'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y lld-18 clang-18
          if [ "${{ matrix.arch }}" != "x86_64" ]; then
            sudo apt-get install -y libc6-i386 lib32gcc-s1 lib32stdc++6 gcc-multilib g++-multilib
          fi
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100

      - name: Check disk space
        run: df -h

      - name: Install dependencies (Linux)
        if: matrix.target != 'macos'
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools p7zip-full aria2 ccache

      - name: Install dependencies (macOS)
        if: matrix.target == 'macos'
        run: |
          brew install ccache aria2 p7zip nasm yasm llvm@20 lld node gpatch
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
          # FF150's webrender FFI header is generated by cbindgen and must be
          # the version Mozilla pins (taskcluster/kinds/toolchain/cbindgen.yml
          # -> cbindgen-0.29.1). brew ships latest (0.29.4), whose codegen emits
          # `error: use of undeclared identifier 'COUNT'` in
          # webrender_ffi_generated.h and fails the accessible/base compile
          # ~44 min in. Install the EXACT pin via cargo (=0.29.1, not ^0.29.1
          # which would resolve to 0.29.4) and force configure to use it via the
          # CBINDGEN env var. Linux gets the right version from `mach bootstrap`,
          # which macOS deliberately skips.
          "$HOME/.cargo/bin/cargo" install cbindgen --version '=0.29.1' --locked
          echo "CBINDGEN=$HOME/.cargo/bin/cbindgen" >> $GITHUB_ENV
          # FF150 requires clang >=17 and is built upstream with clang ~19-20.
          # Use brew llvm@20 (pre-installed on macos-26) via env vars that
          # macos.mozconfig reads — closer to Mozilla's FF150 compiler than
          # Apple clang, and avoids a from-source llvm@17 build (no bottle on
          # macOS 26).
          llvm_prefix=$(brew --prefix llvm@20)
          echo "MOZ_LLVM_PREFIX=$llvm_prefix" >> $GITHUB_ENV
          echo "$llvm_prefix/bin" >> $GITHUB_PATH
          # FF150 selects lld as the macOS linker (clang >= 15); Xcode 26's
          # default Apple linker is NOT recognized by FF's probe, so without a
          # working lld configure dies "Failed to find an adequate linker".
          # brew llvm@20's keg did not expose an ld64.lld that `clang
          # -fuse-ld=lld` could find on macos-26, so install the standalone lld
          # formula and put it on PATH ahead of clang's search.
          lld_prefix=$(brew --prefix lld)
          echo "$lld_prefix/bin" >> $GITHUB_PATH
          echo "===== lld diagnostic ====="
          ls "$llvm_prefix/bin" 2>/dev/null | grep -iE 'lld|ld64' || echo "(no lld in llvm@20 keg)"
          ls "$lld_prefix/bin" 2>/dev/null | grep -iE 'lld|ld64' || echo "(no lld in lld keg)"
          PATH="$lld_prefix/bin:$llvm_prefix/bin:$PATH" "$llvm_prefix/bin/clang" -fuse-ld=lld -Wl,--version 2>&1 | head -3 || echo "(lld probe exit $?)"
          echo "===== end lld diagnostic ====="
          # macOS ships BSD patch, which rejects camoufox patches under strict
          # @@ hunk-count checking. Point scripts/patch.py at GNU patch (gpatch)
          # via CAMOU_PATCH so macOS applies the identical patch set. The hunks
          # were regenerated against FF150 source, so they now apply cleanly
          # under gpatch (verified by a local strict-patch audit).
          echo "CAMOU_PATCH=$(command -v gpatch)" >> $GITHUB_ENV

      - name: Cache mozbuild state
        uses: actions/cache@v6
        with:
          path: ~/.mozbuild
          key: mozbuild-${{ matrix.target }}-${{ matrix.arch }}-${{ hashFiles('upstream.sh') }}
          restore-keys: |
            mozbuild-${{ matrix.target }}-${{ matrix.arch }}-
            mozbuild-${{ matrix.target }}-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          # ccache is content-addressed, so a stale restore is safe and still
          # gives a high hit rate — restore-keys fall back to the newest ccache
          # for this leg even when patches (and thus the exact key) change.
          key: ccache-${{ matrix.target }}-${{ matrix.arch }}-${{ hashFiles('upstream.sh') }}
          restore-keys: |
            ccache-${{ matrix.target }}-${{ matrix.arch }}-
            ccache-${{ matrix.target }}-

      - name: Cache Firefox source tarball
        uses: actions/cache@v6
        with:
          path: firefox-*.source.tar.xz
          key: firefox-source-${{ hashFiles('upstream.sh') }}

      - name: List patches (sanity)
        run: |
          echo "Patches that will be applied (alphabetical):"
          find patches -maxdepth 1 -name '*.patch' | sort
          echo "---"
          # Catch alphabetical-ordering footguns where an extension patch
          # would apply before its base patch.
          first_webrtc=$(find patches -maxdepth 1 -name 'webrtc-ip-spoofing*.patch' | sort | head -1)
          if [ -n "$first_webrtc" ] && [ "$(basename "$first_webrtc")" != "webrtc-ip-spoofing.patch" ]; then
            echo "::error::webrtc-ip-spoofing.patch must sort first among its family"
            exit 1
          fi

      - name: Fetch source
        run: make fetch

      - name: Configure git identity
        run: |
          git config --global user.email "ci@camoufox.local"
          git config --global user.name "Camoufox CI"

      - name: Setup and bootstrap
        env:
          BUILD_TARGET: ${{ matrix.target }},${{ matrix.arch }}
        run: |
          make setup
          if [ "${{ matrix.target }}" = "macos" ]; then
            # Skip `make mozbootstrap` on macOS. ./mach bootstrap on a
            # non-Mozilla CI box fails fetching toolchain artifacts and
            # MacOSX SDK tarballs from Mozilla's CDN. macos.mozconfig
            # sets --disable-bootstrap and --with-macos-sdk (xcrun), so
            # ./mach build uses Xcode's preinstalled clang/SDK instead.
            #
            # macos-26 ships Xcode 26 with SDK 26.x (>= the "26.2" pinned by
            # mac_sdk_min_version()), so the SDK gate passes natively and no
            # toolchain.configure patching is needed. (macos-15 / SDK 15.5 both
            # failed the gate and lacked macOS-26 APIs like NSGlassEffectView.)
            make set-target
          else
            make mozbootstrap
          fi
          mkdir -p dist

      - name: Create swap space
        if: matrix.target != 'macos'
        run: |
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build
        env:
          # Cap Rust parallelism to lower peak memory (avoids OOM/SIGTERM).
          # Tune to taste: higher = faster but more RAM.
          CARGO_BUILD_JOBS: "1"
        run: python3 ./multibuild.py --target ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: List build artifacts
        if: always()
        run: ls -lah dist/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CamoufoxBuilds-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifact dirs
        run: |
          mkdir -p release
          find artifacts -type f -exec cp -v {} release/ \;
          ls -lah release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
