name: Build and Release

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Matrix scope. 'full' = all targets. Otherwise build a single leg."
        required: true
        default: "full"
        type: choice
        options:
          - "full"
          - "linux-x86_64"
          - "linux-arm64"
          - "linux-i686"
          - "windows-x86_64"
          - "windows-i686"
          - "macos-x86_64"
          - "macos-arm64"
  push:
    tags:
      - "v*"

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      json: ${{ steps.gen.outputs.json }}
    steps:
      - id: gen
        env:
          BUILD_TARGET: ${{ inputs.build_target }}
        run: |
          if [ -z "$BUILD_TARGET" ] || [ "$BUILD_TARGET" = "full" ]; then
            cat >>"$GITHUB_OUTPUT" <<'JSON'
          json={"include":[
            {"target":"linux","arch":"x86_64"},
            {"target":"linux","arch":"arm64"},
            {"target":"linux","arch":"i686"},
            {"target":"windows","arch":"x86_64"},
            {"target":"windows","arch":"i686"},
            {"target":"macos","arch":"x86_64"},
            {"target":"macos","arch":"arm64"}
          ]}
          JSON
          else
            os="${BUILD_TARGET%-*}"
            arch="${BUILD_TARGET#*-}"
            echo "json={\"include\":[{\"target\":\"$os\",\"arch\":\"$arch\"}]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix
    runs-on: ${{ matrix.target == 'macos' && (matrix.arch == 'arm64' && 'macos-14' || 'macos-13') || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.json) }}

    steps:
      - name: Maximize build space
        if: matrix.target != 'macos'
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          verbose: "false"

      - name: Remove unwanted tools
        if: matrix.target != 'macos'
        # Originally from here: https://github.com/AdityaGarg8/remove-unwanted-software/blob/master/action.yml
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' > /dev/null
          sudo apt-get remove -y '^dotnet-.*' > /dev/null
          sudo apt-get remove -y '^llvm-.*' > /dev/null
          sudo apt-get remove -y 'php.*' > /dev/null
          sudo apt-get remove -y '^mongodb-.*' > /dev/null
          sudo apt-get remove -y '^mysql-.*' > /dev/null
          sudo apt-get remove -y azure-cli google-chrome-stable firefox ${POWERSHELL} mono-devel libgl1-mesa-dri --fix-missing > /dev/null
          if [[ (${CODENAME} = focal) || (${CODENAME} = jammy) ]]; then
            sudo apt-get remove -y google-cloud-sdk --fix-missing > /dev/null
            sudo apt-get remove -y google-cloud-cli --fix-missing > /dev/null
          fi
          sudo apt-get autoremove -y > /dev/null
          sudo apt-get clean > /dev/null

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up LLVM (Linux)
        if: matrix.target != 'macos'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y lld-18 clang-18
          if [ "${{ matrix.arch }}" != "x86_64" ]; then
            sudo apt-get install -y libc6-i386 lib32gcc-s1 lib32stdc++6 gcc-multilib g++-multilib
          fi
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100

      - name: Check disk space
        run: df -h

      - name: Install dependencies (Linux)
        if: matrix.target != 'macos'
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools p7zip-full aria2 ccache

      - name: Install dependencies (macOS)
        if: matrix.target == 'macos'
        run: |
          brew install ccache aria2 p7zip nasm yasm
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi

      - name: Cache mozbuild state
        uses: actions/cache@v4
        with:
          path: ~/.mozbuild
          key: mozbuild-${{ matrix.target }}-${{ matrix.arch }}-${{ hashFiles('upstream.sh') }}
          restore-keys: |
            mozbuild-${{ matrix.target }}-${{ matrix.arch }}-
            mozbuild-${{ matrix.target }}-

      - name: Cache Firefox source tarball
        uses: actions/cache@v4
        with:
          path: firefox-*.source.tar.xz
          key: firefox-source-${{ hashFiles('upstream.sh') }}

      - name: List patches (sanity)
        run: |
          echo "Patches that will be applied (alphabetical):"
          find patches -maxdepth 1 -name '*.patch' | sort
          echo "---"
          # Catch alphabetical-ordering footguns where an extension patch
          # would apply before its base patch.
          first_webrtc=$(find patches -maxdepth 1 -name 'webrtc-ip-spoofing*.patch' | sort | head -1)
          if [ -n "$first_webrtc" ] && [ "$(basename "$first_webrtc")" != "webrtc-ip-spoofing.patch" ]; then
            echo "::error::webrtc-ip-spoofing.patch must sort first among its family"
            exit 1
          fi

      - name: Fetch source
        run: make fetch

      - name: Configure git identity
        run: |
          git config --global user.email "ci@camoufox.local"
          git config --global user.name "Camoufox CI"

      - name: Setup and bootstrap
        env:
          BUILD_TARGET: ${{ matrix.target }},${{ matrix.arch }}
        run: |
          make setup
          if [ "${{ matrix.target }}" = "macos" ]; then
            # Skip `make mozbootstrap` on macOS. ./mach bootstrap on a
            # non-Mozilla CI box fails fetching toolchain artifacts and
            # MacOSX SDK tarballs from Mozilla's CDN. macos.mozconfig
            # sets --disable-bootstrap and --with-macos-sdk (xcrun), so
            # ./mach build uses Xcode's preinstalled clang/SDK instead.
            make set-target
          else
            make mozbootstrap
          fi
          mkdir -p dist

      - name: Create swap space
        if: matrix.target != 'macos'
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build
        run: python3 ./multibuild.py --target ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: List build artifacts
        if: always()
        run: ls -lah dist/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CamoufoxBuilds-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact dirs
        run: |
          mkdir -p release
          find artifacts -type f -exec cp -v {} release/ \;
          ls -lah release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
