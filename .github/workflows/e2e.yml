# End-to-end user journeys on the three desktop OSes, against a build or a
# release. Dispatch only: macOS and Windows runners cost more minutes, and a
# Linux result is no evidence about either (CLAUDE.md lessons 3 and 8). Only the
# legs the build run or release holds a browser for run (the `targets` job).
name: e2e (three OSes)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Fork release tag to test (e.g. v152.0.4-beta.31-fork.1)"
        required: false
      run_id:
        description: "Or: a build.yml run id holding CamoufoxBuilds-<target> artifacts"
        required: false
      live:
        description: "Also run the real-site journey"
        type: boolean
        default: false
      soak_seconds:
        description: "Soak length per driver"
        default: "200"
      generic_prefs:
        description: "Set the launchers' #162 generic font prefs (off = measure the browser fix alone)"
        type: boolean
        default: true
      k:
        description: "Only the tests matching this pytest -k expression"
        required: false
      probe:
        description: "Run this e2e/probes script (with run_id) on each OS instead of the journeys, e.g. other_names_stall.py (#253)"
        required: false
      mozlog:
        description: "Capture MOZ_LOG (nsHttp, nsSocketTransport) for the fingerprint and fifty-contexts journeys (#171)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  # The legs to run: those the build run or the release holds a browser for. A
  # leg with nothing to test would conclude `success` having tested nothing, so
  # it is never started, and an input that holds no browser at all fails here.
  targets:
    name: Which legs
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$RUN_ID" ]; then
            NAMES="$(gh api --paginate "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.expired | not) | .name')"
          elif [ -n "$RELEASE" ]; then
            NAMES="$(gh release view "$RELEASE" --repo "${{ github.repository }}" --json assets -q '.assets[].name')"
          fi
          export NAMES
          python3 - <<'PY'
          import json, os, sys

          TARGETS = [
              {"os": "ubuntu-24.04", "target": "linux-x86_64", "asset": "lin.x86_64"},
              {"os": "macos-26", "target": "macos-arm64", "asset": "mac.arm64"},
              {"os": "windows-2025", "target": "windows-x86_64", "asset": "win.x86_64"},
          ]
          names = os.environ.get("NAMES", "").split()
          if os.environ["RUN_ID"]:
              source = f"run {os.environ['RUN_ID']}"
              legs = [t for t in TARGETS if f"CamoufoxBuilds-{t['target']}" in names]
          elif os.environ["RELEASE"]:
              source = f"release {os.environ['RELEASE']}"
              legs = [t for t in TARGETS if any(n.endswith(f"-{t['asset']}.zip") for n in names)]
          else:
              print("::error::pass release or run_id")
              sys.exit(1)
          if not legs:
              print(f"::error::{source} holds no browser for {', '.join(t['target'] for t in TARGETS)}")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": legs}) + "\n")
          PY

  e2e:
    name: e2e (${{ matrix.target }})
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          # 1.23 like every other workflow here: go1.22.x links binaries without
          # LC_UUID, which dyld on macOS 26 refuses to load (e2e run 36078088130).
          go-version: "1.23"
          cache-dependency-path: goapi/go.sum
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          python3 ci/apt_install.py xvfb libgtk-3-0 libasound2t64 libdbus-glib-1-2 \
            libx11-xcb1 libxcb-shm0 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 libxi6 libxrandr2 libxtst6 libpci3
      - run: pip install -r ci/requirements.txt -e "python[geoip]"
      - run: python -m playwright install firefox
      - name: Which browser
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            gh run download "${{ inputs.run_id }}" --repo "${{ github.repository }}" \
              -n "CamoufoxBuilds-${{ matrix.target }}" -D .ci-work/artifact
            # Absolute: the Run step works from e2e/, where a relative path does not resolve.
            zip="$PWD/$(ls .ci-work/artifact/*.zip | head -1)"
            echo "E2E_BROWSER=--zip=$zip" >> "$GITHUB_ENV"
          else
            echo "E2E_BROWSER=--release=${{ inputs.release }}" >> "$GITHUB_ENV"
          fi
          if [ "${{ inputs.live }}" = "true" ]; then echo "E2E_LIVE=1" >> "$GITHUB_ENV"; fi
          if [ "${{ inputs.mozlog }}" = "true" ]; then echo "E2E_MOZ_LOG=${{ github.workspace }}/.ci-work/mozlog" >> "$GITHUB_ENV"; fi
      - name: Unpack the browser (family check)
        if: ${{ inputs.k == 'zz_family' && runner.os == 'Windows' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          binary="$(python e2e/util.py $E2E_BROWSER)"
          echo "CAMOUFOX_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Family grouping check (Windows)
        if: ${{ inputs.k == 'zz_family' && runner.os == 'Windows' }}
        shell: pwsh
        env:
          FAM_DUMP: noto serif armenian,noto serif hebrew,noto serif lao,ubuntu,ubuntu sans mono
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Write-Output "VS: $vs"
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /EHsc /O2 /std:c++17 /Fe:.ci-work\fam.exe .ci-work\fam.cpp dwrite.lib"
          $fonts = Join-Path (Split-Path $env:CAMOUFOX_BINARY) "fonts"
          Write-Output "fonts dir: $fonts ($((Get-ChildItem $fonts).Count) entries)"
          .\.ci-work\fam.exe $fonts "${env:FAM_DUMP}"
      - name: Run
        if: ${{ inputs.probe == '' && inputs.k != 'zz_family' }}
        shell: bash
        working-directory: e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CAMOUFOX_NO_GENERIC_PREFS: ${{ inputs.generic_prefs && '0' || '1' }}
          E2E_K: ${{ inputs.k }}
        run: |
          # Per-test timeout, as ci/run_e2e.py sets on the gate: one hung test must not hold the job.
          args=($E2E_BROWSER --soak-seconds "${{ inputs.soak_seconds }}" -v -rA --timeout 900)
          if [ -n "${E2E_LIVE:-}" ]; then args+=(-m "live or not live"); fi
          if [ -n "$E2E_K" ]; then args+=(-k "$E2E_K"); fi
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python -m pytest "${args[@]}"; else python -m pytest "${args[@]}"; fi
      - name: Probe
        if: inputs.probe != ''
        shell: bash
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          # A probe takes --zip, which a release input does not give it: that fails at argparse, loudly.
          python "e2e/probes/$PROBE" $E2E_BROWSER --runs 8
      - if: always() && inputs.mozlog
        uses: actions/upload-artifact@v4
        with:
          name: mozlog-${{ matrix.target }}
          path: .ci-work/mozlog
          retention-days: 7
