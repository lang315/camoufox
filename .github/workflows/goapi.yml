name: goapi

on:
  push:
    branches: [main]
    paths:
      - 'goapi/**'
      - 'browser/additions/**'
      - 'browser/settings/properties.json'
      - 'browser/bundle/fontconfig/**'
      - 'python/src/camoufox/fonts.json'
      - '.github/workflows/goapi.yml'
  pull_request:
    paths:
      - 'goapi/**'
      # TestAdditionsImportTimerBeforeUsingIt guards browser/additions/, so a PR that
      # touches only browser/additions/ must still trigger this job.
      - 'browser/additions/**'
      - 'browser/settings/properties.json'
      - 'browser/bundle/fontconfig/**'
      - 'python/src/camoufox/fonts.json'
      - '.github/workflows/goapi.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: goapi
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -timeout 5m ./...
