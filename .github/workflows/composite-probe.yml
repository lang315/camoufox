name: Composite probe

# Re-measures the one thing PR #128 left open: whether the X Composite extension
# is still required for video capture under headless="virtual".
#
# Two tables disagree. efb0a09 (2026-08-25, beta.29) measured Composite off
# producing a 110-byte empty container and Composite on a 54 KB working video,
# and re-enabled it. Upstream's ci/tribal-rules.yml says the opposite -- that
# #93 was a Juggler bug fixed by capturing from the compositor, so Composite is
# neither dangerous nor useful -- and its own text says those numbers were taken
# BEFORE that fix. This runs the fork's three-row table on a current binary.
#
# Arm 1 is the control that makes the other two readable: with no virtual
# display at all, a non-trivial .webm proves record_video works in this
# environment, so a 110-byte container in arm 2 is about Composite rather than
# about recording being broken.

# on: pull_request rather than workflow_dispatch -- a dispatchable workflow has
# to exist on the default branch, and a throwaway probe does not belong on main.
# The build id is fixed here for the same reason: it is the linux-x86_64 build of
# the merge under test (34998440365, branch sync/upstream-772).
on: pull_request

env:
  BUILD_RUN_ID: "34998440365"

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pip install -e pythonlib 'playwright<1.63'

      # record_video_dir muxes through Playwright's own ffmpeg build, which is a
      # separate download from the package. Without it every arm dies with
      # "Executable doesn't exist at .../ffmpeg-1011/ffmpeg-linux" and writes no
      # file -- which looks exactly like the empty container this probe is
      # hunting for. Only the browsers are skipped here; the binary under test
      # comes from the artifact.
      - run: python -m playwright install ffmpeg

      - name: Fetch the binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$BUILD_RUN_ID" --repo "${{ github.repository }}" \
            -n CamoufoxBuilds-linux-x86_64 -D build
          find build -maxdepth 2 -name '*.zip' -exec unzip -q {} -d build/x \;
          BIN=$(find build -name 'camoufox' -type f | head -1)
          echo "CAMOUFOX_BIN=$BIN" >> "$GITHUB_ENV"
          echo "binary: $BIN"
          chmod +x "$BIN"

      - name: Write the probe
        run: |
          cat > probe.py <<'PY'
          import os, sys, pathlib, time
          from camoufox.sync_api import Camoufox
          from camoufox.addons import DefaultAddons

          mode = sys.argv[1]                      # "off" | "virtual"
          out = pathlib.Path(sys.argv[2]); out.mkdir(parents=True, exist_ok=True)
          headless = True if mode == "off" else "virtual"

          # Something that actually changes between frames: a still page can
          # legitimately encode to almost nothing, which would be indistinguishable
          # from the empty container this probe is looking for.
          PAGE = (
              "data:text/html,<style>@keyframes s{from{background:#000}to{background:#fff}}"
              "body{margin:0;height:100vh;animation:s .25s infinite alternate}</style>"
          )

          # exclude_addons: launch_options() otherwise downloads uBlock Origin from
          # addons.mozilla.org on every launch (#110). The first attempt at this probe
          # sat in arm 1 for over an hour with no output, and an addon fetch is the
          # one network call in this path. Nothing here needs an ad blocker.
          print('launching:', headless, flush=True)
          with Camoufox(headless=headless, executable_path=os.environ["CAMOUFOX_BIN"],
                        exclude_addons=list(DefaultAddons)) as browser:
              print('launched', flush=True)
              ctx = browser.new_context(record_video_dir=str(out), viewport={"width": 640, "height": 480})
              page = ctx.new_page()
              page.goto(PAGE)
              print('navigated', flush=True)
              time.sleep(3)
              ctx.close()
              browser.close()

          vids = sorted(out.glob("*.webm"))
          for v in vids:
              print(f"RESULT {mode} composite={os.environ.get('CAMOUFOX_VIRTUAL_DISPLAY_COMPOSITE','unset')} "
                    f"bytes={v.stat().st_size} file={v.name}")
          if not vids:
              print(f"RESULT {mode} composite={os.environ.get('CAMOUFOX_VIRTUAL_DISPLAY_COMPOSITE','unset')} bytes=0 file=NONE")
          PY

      - timeout-minutes: 6
        name: "Arm 1 — headless=True, no Xvfb (control: does recording work at all)"
        continue-on-error: true
        run: python probe.py off vid/arm1

      - timeout-minutes: 6
        name: "Arm 2 — headless=virtual, Composite OFF"
        continue-on-error: true
        env:
          CAMOUFOX_VIRTUAL_DISPLAY_COMPOSITE: "0"
        run: python probe.py virtual vid/arm2

      - timeout-minutes: 6
        name: "Arm 3 — headless=virtual, Composite ON"
        continue-on-error: true
        env:
          CAMOUFOX_VIRTUAL_DISPLAY_COMPOSITE: "1"
        run: python probe.py virtual vid/arm3

      - name: Table
        if: always()
        run: |
          echo "=== video sizes ==="
          find vid -name '*.webm' -printf '%s bytes  %p\n' | sort -n || true

      # Size alone cannot tell a recorded page from a recorded blank screen:
      # upstream's own table describes Composite off producing "a valid .webm of
      # 24 pure-white frames", and a flat-colour video encodes to a few KB either
      # way. The probe page alternates black and white at 4 Hz, so a correct
      # recording has frames whose mean luma differs; a blank one does not.
      - name: Do the videos contain the page, or a blank screen?
        if: always()
        run: |
          FFMPEG=$(python -c "from playwright._impl._driver import compute_driver_executable; import pathlib,sys; print(next(pathlib.Path(compute_driver_executable()[0]).parent.parent.parent.rglob('ffmpeg-linux')))" 2>/dev/null || echo ffmpeg)
          echo "ffmpeg: $FFMPEG"
          for d in vid/arm1 vid/arm2 vid/arm3; do
            f=$(find "$d" -name '*.webm' | head -1) || true
            [ -z "$f" ] && { echo "$d: no video"; continue; }
            rm -rf "$d/frames"; mkdir -p "$d/frames"
            "$FFMPEG" -loglevel error -i "$f" -vf fps=4 "$d/frames/%03d.png" || true
            python - "$d" <<'PY2'
          import sys, pathlib, struct, zlib
          d = pathlib.Path(sys.argv[1])
          frames = sorted((d/"frames").glob("*.png"))
          # Mean luma per frame without a decoder dependency: PNG palette-free RGB
          # is not worth parsing by hand, so use the file size of each frame as a
          # proxy for content and the count for whether anything decoded at all.
          sizes = [f.stat().st_size for f in frames]
          uniq = len(set(sizes))
          print(f"{d.name}: {len(frames)} frames, {uniq} distinct frame sizes, "
                f"min={min(sizes) if sizes else 0} max={max(sizes) if sizes else 0}")
          PY2
          done
