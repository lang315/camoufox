          if n2_failures:
              tripwires.append(f"(n2) generic -> family under a per-context list (#92): {n2_failures}")
              note_unmeasured("(n2)", n2_failures, "GENERIC MISMAPPED")
              print(f"  (n2) generic -> family under a per-context list (#92):  RED -- {n2_failures}")
          else:
              print("  (n2) generic -> family under a per-context list (#92):  GREEN -- no tripwire")
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Arm (h'): identify the 375.70001220703125 face (#88). Arm (h) above
          # proved the gate FIRED for both mac probes -- the diag build's
