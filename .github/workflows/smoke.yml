name: Smoke Fingerprint

# Runtime verification of the device-faking spoofs against a real Camoufox
# binary: pulls a linux build artifact, runs the deterministic per-field
# assertions (TestRuntimeSpoofs) and the live detector-site smoke
# (CreepJS / sannysoft / browserleaks), and uploads the results.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run id holding CamoufoxBuilds-linux-x86_64"
        required: true
        default: "28422261406"

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Headless Firefox runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            unzip xvfb libgtk-3-0 libdbus-glib-1-2 libx11-xcb1 \
            libxt6 libxcomposite1 libxdamage1 libxrandr2 libpci3 \
            libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2

      - name: Download linux artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" \
            -n CamoufoxBuilds-linux-x86_64 -D dist
          echo "--- dist ---"; ls -la dist/

      - name: Unpack + locate firefox binary
        id: bin
        run: |
          cd dist
          zip=$(ls camoufox-*-lin.x86_64.zip 2>/dev/null | head -1)
          if [ -z "$zip" ]; then zip=$(ls *.zip | head -1); fi
          echo "package: $zip"
          mkdir -p cf && unzip -q "$zip" -d cf
          bin=$(find cf -maxdepth 3 -type f -name firefox | head -1)
          if [ -z "$bin" ]; then bin=$(find cf -maxdepth 3 -type f -name camoufox | head -1); fi
          if [ -z "$bin" ]; then echo "::error::no firefox/camoufox binary in package"; find cf -maxdepth 3 -type f | head -40; exit 1; fi
          chmod +x "$bin" || true
          abs="$GITHUB_WORKSPACE/dist/$bin"
          echo "bin=$abs" >> "$GITHUB_OUTPUT"
          echo "--- binary ---"; ls -la "$abs"; file "$abs" || true

      - name: "#60 diag: does persisted roverfox.s.* storage outrank CAMOU_CONFIG?"
        timeout-minutes: 12
        run: |
          # The previous run of this step proved MaskConfig reads "timezone"
          # correctly (maskTz=Europe/London on every launch that set it), which
          # refutes the original #60 hypothesis. It also showed storageHit=1 on
          # a fresh process AND on a launch with no CAMOU_CONFIG at all -- so
          # roverfox.s.* survives between launches. That is expected: they are
          # user prefs (Preferences::SetCString) and land in prefs.js.
          #
          # GetTimezone returns on a storage hit WITHOUT consulting MaskConfig,
          # so a stale stored value would silently outrank the launch config.
          # This matrix reads the JS-visible timezone (the printf only shows
          # what was read, not what was returned) and separates the variables:
          #   A: fresh profile, same config, x3   -> is it intermittent at all?
          #   B: SHARED profile, London then Paris -> does launch 1 poison 2?
          #   C: fresh profile, CHUNKED config     -> the path pythonlib uses
          pip install --quiet 'playwright==1.55.0'
          python - <<'PY'
          import json, os, subprocess, sys
          from playwright.sync_api import sync_playwright

          BIN = os.environ["CAMOUFOX_BIN"]
          READ = "() => Intl.DateTimeFormat().resolvedOptions().timeZone"

          def cfg(tz):
              return {"timezone": tz, "navigator.platform": "FakePlatform99"}

          def env_single(tz):
              return {**os.environ, "CAMOU_CONFIG": json.dumps(cfg(tz))}

          def env_chunked(tz):
              blob = json.dumps(cfg(tz))
              half = len(blob) // 2
              e = {k: v for k, v in os.environ.items() if k != "CAMOU_CONFIG"}
              e["CAMOU_CONFIG_1"], e["CAMOU_CONFIG_2"] = blob[:half], blob[half:]
              return e

          def read_tz(launch):
              page = launch.new_page()
              page.goto("data:text/html,<h1>tz</h1>")
              tz = page.evaluate(READ)
              page.close()
              return tz

          def dump_prefs(profile):
              p = os.path.join(profile, "prefs.js")
              if not os.path.exists(p):
                  print(f"    prefs.js: (absent at {p})")
                  return
              hits = [l.strip() for l in open(p) if "roverfox.s." in l]
              print(f"    prefs.js roverfox.s.* ({len(hits)}):")
              for h in hits[:12]:
                  print(f"      {h}")

          host = subprocess.run(["date", "+%Z"], capture_output=True, text=True).stdout.strip()
          print(f"host TZ env={os.environ.get('TZ', '(unset)')} date=%Z -> {host}\n")

          with sync_playwright() as pw:
              print("=== ARM A: fresh profile each launch, config=Europe/London x3 ===")
              for i in range(3):
                  b = pw.firefox.launch(executable_path=BIN, headless=True, env=env_single("Europe/London"))
                  print(f"  A{i+1}: JS timezone = {read_tz(b)}   (expected Europe/London)")
                  b.close()

              print("\n=== ARM B: ONE SHARED profile, launch 1 London then launch 2 Paris ===")
              shared = "/tmp/shared-profile"
              os.makedirs(shared, exist_ok=True)
              for label, tz in (("B1", "Europe/London"), ("B2", "Europe/Paris")):
                  ctx = pw.firefox.launch_persistent_context(
                      shared, executable_path=BIN, headless=True, env=env_single(tz))
                  page = ctx.new_page()
                  page.goto("data:text/html,<h1>tz</h1>")
                  got = page.evaluate(READ)
                  ctx.close()
                  print(f"  {label}: config={tz:14s} -> JS timezone = {got}")
                  dump_prefs(shared)
              print("  If B2 reports Europe/London, stale storage outranks the launch config.")

              print("\n=== ARM C: fresh profile, CHUNKED CAMOU_CONFIG_1/_2 (pythonlib's path) ===")
              for i in range(2):
                  b = pw.firefox.launch(executable_path=BIN, headless=True, env=env_chunked("Europe/London"))
                  print(f"  C{i+1}: JS timezone = {read_tz(b)}   (expected Europe/London)")
                  b.close()
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}

      - name: "record_video under headless=virtual (#93/#458 regression guard)"
        timeout-minutes: 15
        run: |
          # ffmpeg is a separate playwright download; without it video recording
          # hangs rather than erroring. playwright==1.55.0 is the version this
          # suite's browser interop is known good on.
          pip install --quiet -e pythonlib 'playwright==1.55.0'
          python -m playwright install ffmpeg
          cd pythonlib
          python - <<'PY'
          import os, glob
          from camoufox.sync_api import Camoufox
          out = "/tmp/vid"; os.makedirs(out, exist_ok=True)
          with Camoufox(headless="virtual", executable_path=os.environ["CAMOUFOX_BIN"],
                        ff_version=152, i_know_what_im_doing=True) as b:
              p = b.new_page(record_video_dir=out, viewport={"width": 800, "height": 600})
              p.goto("data:text/html,<h1 style='font-size:200px'>hello world</h1>")
              p.wait_for_timeout(2000)
              p.close()
          vids = glob.glob(out + "/*.webm")
          assert vids, "no .webm produced under headless='virtual'"
          size = os.path.getsize(vids[0])
          print(f"video: {vids[0]} {size} bytes")
          # Composite off produced a 110-byte empty container; on, ~54KB. 10K
          # separates them by a wide margin without pinning an exact size.
          assert size > 10_000, (
              f"video is {size} bytes -- an empty container. Composite is most likely "
              "off; see the measurement table in pythonlib/camoufox/virtdisplay.py"
          )
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}
          # pkgman.get_path() resolves fonts/ and properties.json through
          # camoufox_path(), which fetches from the GitHub releases API when no
          # local install exists; unauthenticated that is rate-limited to 403.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Integration suite (all goapi tests vs real binary)
        # Runs the FULL suite against the real binary, not just TestRuntimeSpoofs:
        # the other ~24 browser tests (navigation, DOM, forms, keyboard, storage,
        # accessibility, ...) otherwise never execute against a real build —
        # goapi.yml runs without CAMOUFOX_BIN so they all t.Skip.
        run: |
          set -o pipefail  # tee must not mask a go-test failure exit code
          cd goapi
          CAMOUFOX_BIN="${{ steps.bin.outputs.bin }}" \
            xvfb-run -a go test -timeout 15m -v ./... 2>&1 | tee "$GITHUB_WORKSPACE/spoof-test.log"

      - name: Detector-site smoke (CreepJS / sannysoft / browserleaks)
        run: |
          cd goapi
          CAMOUFOX_BIN="${{ steps.bin.outputs.bin }}" \
            xvfb-run -a go run ./example/integration 2>&1 | tee "$GITHUB_WORKSPACE/smoke.log" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: |
            spoof-test.log
            smoke.log
            goapi/integration-results/
          if-no-files-found: warn
          retention-days: 14
