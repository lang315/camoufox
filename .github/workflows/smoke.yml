          # path INSIDE SystemFindFontForChar, before
          # CommonFontFallback/GlobalFontFallback (and Task 4's gates
          # inside them) ever run. Unlike #81, this is not a Task-4
          # regression: before Task 4, BOTH the population and the read
          # were ungated, so this cache was indistinguishable from the
          # rest of the leaky fallback path. Task 4's gate closed the
          # population side (population now goes through gated
          # Common/GlobalFontFallback) but left the read side open --
          # a pre-existing hole the gate narrowed but did not close.
          #
          # Unlike #81's miss (tofu where a glyph belonged), this reads
          # a REAL, working font handle cached by an earlier context,
          # with no gating check on the read at all -- a genuine
          # cross-context leak, not just a coherence defect.
          #
          # Same two-contexts-one-launch shape as arm (i). Context A
          # needs a list with a family that DEMONSTRABLY resolves
          # U+FFFD in THIS build under a per-context list -- team-lead
          # correction: a fontTools cmap entry says the codepoint is
          # MAPPED, it does not guarantee this build's gated fallback
          # actually resolves that family for it (confirmed the hard
          # way: "Tahoma" alone reported "arm (j)/#82 setup invalid...
          # settled U+FFFD to 49.217, its OWN tofu floor" in run
          # 33596116918 -- A never populated the cache, so B had
          # nothing to inherit, and the arm correctly refused its own
          # result rather than report a false pass). Bisected against
          # several strong candidates by naming each one directly
          # (`JS_FFFD_BISECT`, same discipline as arm (f)'s
          # `JS_F_BISECT`) to find one that empirically differs from a
          # known-tofu reference, rather than trusting cmap coverage
          # alone.
          FFFD_CANDIDATES = ["Tahoma", "Verdana", "Segoe UI", "MS Gothic",
                              "Arial Unicode MS", "Noto Sans", "DejaVu Sans",
                              "SimSun", "Malgun Gothic", "Yu Gothic"]
          JS_FFFD_BISECT = """() => {
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "NoSuchFamilyAtAll5"';
            const tofu = c.measureText('�').width;
            const widths = {};
            for (const fam of """ + json.dumps(FFFD_CANDIDATES) + """) {
              c.font = '48px "' + fam + '"';
              widths[fam] = c.measureText('�').width;
            }
            return {tofu: tofu, widths: widths};
          }"""
          fffd_bisect = one_page("win", JS_FFFD_BISECT)
          print(f"  [arm j / #82 setup] U+FFFD tofu floor (no-op family, own context): "
                f"{fffd_bisect['tofu']}")
          print(f"  [arm j / #82 setup] named-candidate U+FFFD widths: {fffd_bisect['widths']}")
          fffd_working = [fam for fam, w in fffd_bisect["widths"].items() if w != fffd_bisect["tofu"]]
          print(f"  [arm j / #82 setup] candidates that demonstrably resolve U+FFFD "
                f"(differ from tofu): {fffd_working or 'NONE -- see setup note above'}")

          # REPAIR (#82, 2026-09-09). The donor's list is exactly ["Tahoma"].
          # From the bisect in run 34240575679, Tahoma renders U+FFFD at 46.617
          # while Verdana and Segoe UI BOTH render it at 44.533 -- with more than
          # one family on the donor's list the leaked width cannot be attributed
          # to a specific face, so a leak and a coincidence look the same.
          # Malgun Gothic (48) is also unambiguous but is a CJK face whose
          # advance is more likely to collide with a fallback.
          FFFD_DONOR = ["Tahoma"]
          FFFD_NO_PROBE = ["Arial", "Calibri", "Times New Roman"]
          # Cross-check, printed not scored: the width Tahoma rendered U+FFFD at
          # in run 34240575679. A different number here is not a failure -- it
          # means the bundle or the build changed -- but it must be read before
          # anyone quotes 46.617 again (CLAUDE.md lesson 6).
          FFFD_TAHOMA_HISTORIC = 46.617

          JS_4C = """async () => {
            // Same fixed-window sampling discipline as arm (i)'s
            // JS_4B -- needed even though the U+FFFD fast path itself
            // is synchronous, because context A's FIRST-EVER
            // resolution (before mReplacementCharFallbackFamily is
            // populated at all) still falls through to the normal,
            // async-raced Common/GlobalFontFallback path.
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "NoSuchFamilyAtAll4"';
            const samples = [];
            for (let i = 0; i < 20; i++) {
              samples.push(c.measureText('�').width);
              await new Promise(r => setTimeout(r, 500));
            }
            const refs = {};
            for (const fam of ['monospace', 'sans-serif', 'serif']) {
              c.font = '48px ' + fam;
              refs[fam] = c.measureText('�').width;
            }
            // A GUARANTEED-DIFFERENT tofu reference. The generic families
            // above are NOT one: a generic resolves within the asking
            // context's own allowed list, and Segoe UI / Tahoma / Malgun
            // Gothic all carry U+FFFD (fontTools over bundle/fonts: 46 of
            // 574 faces cover it; 9 Windows families among them). So in a
            // context allowed those, `sans-serif` renders the REAL glyph,
            // fallback renders the same real glyph, the two compare equal,
            // and a correct resolution reads as "settled to its own tofu
            // floor". Three #82 setups were declared invalid on exactly
            // that false negative.
            // These three are absent from the U+FFFD-covering set, so
            // naming one yields the true tofu width whether the context is
            // allowed it (no glyph in the face) or not (gated out).
            const named = {};
            for (const fam of ['Arial', 'Calibri', 'Times New Roman',
                               'Tahoma', 'Segoe UI', 'Malgun Gothic']) {
              c.font = '48px "' + fam + '"';
              named[fam] = c.measureText('�').width;
            }
            // `tofu` is retained only as a printed diagnostic. It is NO LONGER
            // the scoring reference: both it and `final` route through U+FFFD
            // system fallback, so during a real leak the cache answers both
            // identically and the arm goes green for the bug it guards
            // (code-recon B.3, defect 1). Scoring is now positive
            // identification against the donor's own directly-named Tahoma
            // width, measured in the same run and the same process.
            return {final: samples[samples.length - 1], samples: samples,
                    refs: refs, named: named, tofu: named['Arial']};
          }"""

          # WHAT WOULD MAKE THIS ARM GREEN WRONGLY (CLAUDE.md lesson 4):
          #  1. The old floor comparison. `tofu = named['Arial']` and `final`
          #     both route through U+FFFD system fallback, so a cache hit
          #     answered both and `final != tofu` was false during a real leak.
          #     Replaced below by positive identification: B leaks iff B's
          #     automatic fallback measures the SAME width as the donor's own
          #     directly-named Tahoma. The FIRST repair then reinstated
          #     named['Arial'] two lines later as a "control invalid" floor,
          #     which is the same defect again: Arial carries no U+FFFD glyph,
          #     so it routes through the very cache under test and reads the
          #     donor's width during a real leak -- firing "control invalid" and
          #     making the leak branch unreachable exactly when the leak is real.
          #     The floor is now fffd_bisect["tofu"], measured in its own launch
          #     BEFORE any candidate family is named, so the cache is empty when
          #     it is taken and it cannot equal the donor's Tahoma width. B's
          #     named Arial is printed as a diagnostic and scores nothing.
          #  2. Donor and recipient in different content processes.
          #     mReplacementCharFallbackFamily is a member of gfxPlatformFontList,
          #     a per-process singleton, so a split pair tests nothing and would
          #     print GREEN. #83's process table (run 34008395471) showed
          #     dom.ipc.processCount=1 alone does not collapse them, so the pids
          #     are asserted, not assumed, and a split reports "unmeasured".
          #  3. The donor never populating the cache. Under a narrow list
          #     GlobalFontFallback can take the StartCmapLoadingFromFamily skip
          #     (gfxPlatformFontList.cpp:1581-1587) and `continue` past every
          #     family, leaving nothing to inherit. Turned off with
          #     gfx.font_rendering.fallback.async=false, and asserted: A's own
          #     automatic `final` must equal A's directly-named Tahoma width.
          #
          # WHY THIS ARM IS UNMEASURABLE ON THIS BUNDLE -- measured, not
          # inferred, in run 34428270062, and the reason arm (j) is in
          # KNOWN_UNMEASURABLE at the end of this step rather than in
          # EXPECTED_GREEN. The whole run produced ZERO `CAMOU-FL fffd-cache`
          # lines and ZERO `global-fallback` / `sys-fallback` lines for
          # U+FFFD; all 111 of each were for U+6F22, arm (f)'s codepoint. The
          # only route to mReplacementCharFallbackFamily from a text run is
          # gfxFontGroup::WhichSystemFontSupportsChar -> SystemFindFontForChar
          # (gfxTextRun.cpp:3623, logged immediately after at :3629), so zero
          # sys-fallback lines for U+FFFD means FindFontForChar returned
          # BEFORE that call on every U+FFFD run in all 76 log files: the
          # cache was neither read nor written, by anyone.
          #
          # For THIS arm the trailing default font is the cause, and the
          # argument is the donor list, not a width match. FFFD_DONOR is
          # ["Tahoma"] -- a SINGLE family -- and Tahoma's directly-named
          # U+FFFD width is 46.61666488647461, while the donor settled at
          # 49.21666717529297. The glyph therefore cannot have come from the
          # one family this donor was allowed, and the trailing default is
          # what remains. Every one of the run's 355 `CAMOU-FL default` lines
          # names DejaVu Sans, whose own directly-named U+FFFD width is that
          # same 49.21666717529297.
          #
          # The width match ALONE would not identify the face: the run's
          # bare-context table shows MS Gothic, Noto Sans, SimSun and DejaVu
          # Sans all measuring 49.21666717529297. What the width does
          # establish is that the "tofu floor" is not tofu -- it is a real
          # face rendering a real glyph -- which is CLAUDE.md lesson 4 again,
          # a reference not guaranteed to differ from a successful
          # resolution because it IS one. No choice of donor list changes
          # that; the default font is appended to every font group.
          #
          # FOLLOW-UP, NOT THIS PR. Measuring #82 needs a different
          # observation point: a donor whose mFonts INCLUDING its trailing
          # default has no U+FFFD coverage, or a direct probe of
          # mReplacementCharFallbackFamily rather than an inference from a
          # rendered width. gfx.font_rendering.fallback.async is not the lever
          # the setup-invalid text above suggests, and re-running changes
          # nothing.
          j_mark = log_mark()
          j_a, j_b, j_pids = two_contexts_one_launch(
              FFFD_DONOR, FFFD_NO_PROBE, JS_4C,
              extra_prefs={"gfx.font_rendering.fallback.async": False,
                           "fission.autostart": False})
          # Task 4's fallback-observation question, now answerable: which face
          # the donor's U+FFFD fallback actually settled on, from the browser's
          # own log rather than inferred from a width. Three of this arm's five
          # failure branches are `setup invalid` / `unmeasured` verdicts about
          # the donor, and this line is what names WHY one of them fired --
          # `resolved=<none>` means GlobalFontFallback refused everything, so
          # there was never anything for context B to inherit.
          print(f"  [arm j / U+FFFD fallback observed] "
                f"{fffd_resolved(j_mark) or 'no global-fallback line for U+FFFD in this launch'}")
          print(f"  [arm j / U+FFFD fallback observed] textrun system fallback: "
                f"{camou_fl(j_mark, 'textrun-systemfallback', limit=4) or 'none'}")
          j_sig = j_a["named"]["Tahoma"]      # the leak signature
          # DIAGNOSTIC ONLY (wrong-GREEN item 1 above): Arial has no U+FFFD
          # glyph, so this routes through the same system fallback as `final`
          # and can equal j_sig during a real leak. Printed, never compared.
          j_b_arial = j_b["named"]["Arial"]
          # The scoring floor: measured in the bisect's own launch before any
          # candidate family was named, so the cache was empty when it was taken.
          j_floor = fffd_bisect["tofu"]
          print(f"  [arm j / #82] context A ({FFFD_DONOR}, donor, first in launch, stays open) "
                f"settled={j_a['final']} named-Tahoma={j_sig} named={j_a['named']} "
                f"refs={j_a['refs']} samples={j_a['samples']}")
          print(f"  [arm j / #82] context B ({FFFD_NO_PROBE}, no U+FFFD coverage, same launch, "
                f"AFTER A) settled={j_b['final']} named-Arial(diagnostic)={j_b_arial} "
                f"named={j_b['named']} refs={j_b['refs']} samples={j_b['samples']}")
          print(f"  [arm j / #82] tab pids after A / after B: {j_pids}")
          print(f"  [arm j / #82] cross-check (printed, not scored): donor Tahoma U+FFFD "
                f"width {j_sig} vs run 34240575679's {FFFD_TAHOMA_HISTORIC} -- "
                f"{'matches' if abs(j_sig - FFFD_TAHOMA_HISTORIC) < 0.01 else 'DIFFERS, do not quote the old number'}")

          j_failures = []
          if isinstance(j_pids["after_a"], str) or isinstance(j_pids["after_b"], str):
              j_failures.append(
                  f"arm (j)/#82 unmeasured: could not read the content-process table "
                  f"({j_pids}) -- #82's cache is a per-process singleton, so without the pids "
                  f"this arm cannot tell a working gate from two isolated processes.")
          elif (j_pids["after_b"] - j_pids["after_a"]) or not j_pids["after_a"]:
              # "No NEW tab pid appeared for B", not set equality: a lingering
              # about:blank process that exits between the two samples would make
              # equality false forever and the arm would read "unmeasured" on
              # every run, including ones that did share a process.
              j_failures.append(
                  f"arm (j)/#82 unmeasured: a new content process appeared for B. Tab pids were "
                  f"{sorted(j_pids['after_a'])} after A and {sorted(j_pids['after_b'])} after "
                  f"B, so donor and recipient did not share the gfxPlatformFontList singleton "
                  f"that holds mReplacementCharFallbackFamily. Not a verdict either way.")
          elif "Tahoma" not in fffd_working:
              j_failures.append(
                  f"arm (j)/#82 setup invalid: Tahoma is not among the families that "
                  f"demonstrably resolve U+FFFD in this build ({fffd_working or 'NONE'}, "
                  f"widths {fffd_bisect['widths']}, tofu {fffd_bisect['tofu']}). The donor "
                  f"cannot populate the cache, so there is nothing for B to inherit.")
          elif abs(j_a["final"] - j_sig) >= 0.01:
              j_failures.append(
                  f"arm (j)/#82 setup invalid: the donor's AUTOMATIC U+FFFD fallback settled "
                  f"at {j_a['final']}, not at its own directly-named Tahoma width ({j_sig}), "
                  f"so mReplacementCharFallbackFamily was never populated with Tahoma and "
                  f"there is nothing for context B to inherit. Check whether "
                  f"gfx.font_rendering.fallback.async=false actually applied.")
          elif abs(j_sig - j_floor) < 0.01:
              j_failures.append(
                  f"arm (j)/#82 control invalid: the leak signature ({j_sig}, the donor's "
                  f"directly-named Tahoma, measured in this arm's own launch) equals the run's "
                  f"U+FFFD tofu floor ({j_floor}, taken in the bisect launch before any "
                  f"candidate family was named), so a leak and a correct block would read "
                  f"identically. This arm cannot discriminate on this build.")
          elif abs(j_b["final"] - j_sig) < 0.01:
              j_failures.append(
                  f"arm (j)/#82: REPLACEMENT-CHAR CACHE LEAK (#82) -- context B "
                  f"({FFFD_NO_PROBE}, none of which cover U+FFFD) settled U+FFFD at "
                  f"{j_b['final']}, which is the donor's own Tahoma width ({j_sig}) and not "
                  f"the run's tofu floor ({j_floor}); B's named Arial, a diagnostic that routes "
                  f"through the same fallback and scores nothing, read {j_b_arial}. "
                  f"Both contexts shared tab process(es) "
                  f"{sorted(j_pids['after_a'])}. B rendered a REAL glyph from a family it was "
                  f"never allowed, inherited through gfxPlatformFontList's process-wide "
                  f"mReplacementCharFallbackFamily, which is read at "
                  f"gfxPlatformFontList.cpp:1328-1348 with no CamouIsFontAllowed check.")
          j_ok_msg = (f"context B settled U+FFFD at {j_b['final']}, which is NOT the donor's "
                      f"Tahoma ({j_sig}); the donor did populate the cache "
                      f"(A settled {j_a['final']}), the two shared "
                      f"process(es) {sorted(j_pids['after_a']) if not isinstance(j_pids['after_a'], str) else j_pids['after_a']}, "
                      f"the run's tofu floor is {j_floor}, and B's named Arial "
                      f"(a diagnostic only) is {j_b_arial}")
          print(f"  (j) replacement-char cache leak (#82):  {'RED' if j_failures else 'GREEN'} "
                f"-- {j_failures or j_ok_msg}")
          if j_failures:
              tripwires.append(f"(j) replacement-char cache leak (#82): {j_failures}")
              note_unmeasured("(j)", j_failures, "REPLACEMENT-CHAR CACHE LEAK")
          # -----------------------------------------------------------

          # Diagnostic (not scored, no assert -- same discipline as
          # JS_F_RACE above): arm (j)'s OWN `named` data (printed
          # above) shows context B (allow-list FFFD_NO_PROBE = Arial/
          # Calibri/Times New Roman ONLY) resolving Tahoma/Segoe UI/
          # Malgun Gothic -- none on its own list -- to their REAL,
          # named widths, not tofu, in the SAME shared-process launch,
          # AFTER context A had already named all three as its own
          # (allowed) probe candidates. That is a leak, through
          # whichever cache backs canvas direct-name font resolution --
          # not necessarily mReplacementCharFallbackFamily specifically.
          # Two hypotheses this data alone cannot separate: (a)
          # order-dependent -- a process-wide cache A's earlier,
          # legitimate lookup populated, read back by B without
          # re-checking CamouIsFontAllowed; (b) canvas direct-naming
          # isn't gated per-context on this build at all, regardless of
          # order. Discriminator: name the same three families in a
          # FRESH, ISOLATED, single-context launch (FFFD_NO_PROBE as
          # the ONLY allow-list, nothing preceding it at all) -- if
          # still correctly blocked there, the leak is order-dependent
          # (a); if not, gating is absent outright (b).
          JS_DIAG_NAMED = """() => {
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "NoSuchFamilyAtAll7"';
            const tofu = c.measureText('�').width;
            const widths = {};
            for (const fam of ['Tahoma', 'Segoe UI', 'Malgun Gothic']) {
              c.font = '48px "' + fam + '"';
              widths[fam] = c.measureText('�').width;
            }
            return {tofu: tofu, widths: widths};
          }"""

          def one_page_list(font_list, js):
              # Same shape as one_page() above, but takes a literal
              # font list instead of a FONTS[] dict key -- FFFD_NO_PROBE
              # is a literal list, not in that dict.
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx = b.new_context()
                  ctx.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(font_list)))
                  page = ctx.new_page()
                  page.goto("data:text/html,<h1>4b-diag</h1>")
                  result = page.evaluate(js)
                  b.close()
                  return result

          diag_isolated = one_page_list(FFFD_NO_PROBE, JS_DIAG_NAMED)
          print(f"  [diagnostic, not scored] ISOLATED single-context launch, "
                f"FFFD_NO_PROBE-only allow-list, nothing preceding it -- "
                f"tofu={diag_isolated['tofu']} named={diag_isolated['widths']}")
          diag_leaked = [f for f, w in diag_isolated["widths"].items() if w != diag_isolated["tofu"]]
          if diag_leaked:
              print(f"  [diagnostic] {diag_leaked} resolved to REAL widths even ALONE, "
                    f"isolated, nothing preceding -- gating for direct-named canvas font "
                    f"lookups may not hold at all on this build, independent of ordering "
                    f"(hypothesis b).")
          else:
              print(f"  [diagnostic] all three correctly blocked when isolated -- gating "
                    f"holds ALONE; the leak seen in arm (j)'s context B is order-dependent, "
                    f"consistent with a process-wide cache populated by context A's earlier, "
                    f"legitimate resolution and read back by B without re-checking "
                    f"CamouIsFontAllowed (hypothesis a).")
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Discriminator (#83's true scope): does the leak require a
          # SINGLE, unresolvable font-family request with nothing else
          # in the CSS stack to fall back to, or does it also leak when
          # an explicit generic ("monospace") follows the blocked name
          # in the SAME request? Team-lead's hypothesis, from arm (b)
          # staying green at processCount=1 while arm (j) still leaks:
          # CSS font-stack resolution tries each declared family in
          # order and stops at the first that resolves -- "monospace"
          # always resolves to something, so a STACKED request never
          # needs Gecko's automatic Unicode-fallback machinery, which
          # is where the process-wide, unguarded cache read lives. A
          # SINGLE name with nothing after it has nowhere else to go
          # and DOES enter that path.
          #
          # Same shared-process, mac-then-win shape as arm (b) itself:
          # dom.ipc.processCount=1, mac context first (legitimately
          # resolving its own MAC_ONLY families, exactly like arm (b)'s
          # own probe), win context second, measuring those SAME
          # families it was never allowed -- in BOTH forms, same
          # families, same launch, same order, only the stack differs.
          # A NoSuchFontAtAll control in both forms gives each form its
          # own unresolvable baseline, so "differs from its own
          # baseline" -- not a hardcoded width -- is what "leaked"
          # means, same discipline as every other arm here.
          JS_DISC_MAC = """() => {
            // Resolve mac's own families for real, exactly like arm
            // (b)'s probe() does, to populate whatever process-wide
            // state the leak reads from.
            const c = document.createElement('canvas').getContext('2d');
            const s = 'mmmmmmmmmmlliWWWWWWW@#$%^&*()_+';
            const widths = {};
            for (const fam of """ + json.dumps(MAC_ONLY) + """) {
              c.font = '48px "' + fam + '"';
              widths[fam] = c.measureText(s).width;
            }
            return widths;
          }"""

          JS_DISC_WIN = """() => {
            const c = document.createElement('canvas').getContext('2d');
            const s = 'mmmmmmmmmmlliWWWWWWW@#$%^&*()_+';
            const families = """ + json.dumps(MAC_ONLY + ["NoSuchFontAtAll"]) + """;
            const single = {}, stacked = {};
            for (const fam of families) {
              c.font = '48px "' + fam + '"';
              single[fam] = c.measureText(s).width;
              c.font = '48px "' + fam + '", monospace';
              stacked[fam] = c.measureText(s).width;
            }
            return {single: single, stacked: stacked};
          }"""

          def discriminator_run():
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      firefox_user_prefs={"dom.ipc.processCount": 1},
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx_mac = b.new_context()
                  ctx_mac.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["mac"])))
                  page_mac = ctx_mac.new_page()
                  page_mac.goto("data:text/html,<h1>disc-mac</h1>")
                  mac_result = page_mac.evaluate(JS_DISC_MAC)

                  ctx_win = b.new_context()
                  ctx_win.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["win"])))
                  page_win = ctx_win.new_page()
                  page_win.goto("data:text/html,<h1>disc-win</h1>")
                  win_result = page_win.evaluate(JS_DISC_WIN)

                  b.close()
                  return mac_result, win_result

          disc_mac, disc_win = discriminator_run()
          print(f"  [discriminator / #83 scope] mac context (first, resolving its own "
                f"families for real): {disc_mac}")
          print(f"  [discriminator / #83 scope] win context (second, same process), "
                f"single-name form: {disc_win['single']}")
          print(f"  [discriminator / #83 scope] win context (second, same process), "
                f"stacked ', monospace' form: {disc_win['stacked']}")

          disc_single_baseline = disc_win["single"]["NoSuchFontAtAll"]
          disc_stacked_baseline = disc_win["stacked"]["NoSuchFontAtAll"]
          disc_single_leaked = [f for f in MAC_ONLY if disc_win["single"][f] != disc_single_baseline]
          disc_stacked_leaked = [f for f in MAC_ONLY if disc_win["stacked"][f] != disc_stacked_baseline]
          print(f"  [discriminator / #83 scope] single-name baseline (NoSuchFontAtAll): "
                f"{disc_single_baseline}; leaked: {disc_single_leaked or 'NONE'}")
          print(f"  [discriminator / #83 scope] stacked-form baseline (NoSuchFontAtAll, "
                f"monospace): {disc_stacked_baseline}; leaked: {disc_stacked_leaked or 'NONE'}")

          if disc_single_leaked and not disc_stacked_leaked:
              print("  [discriminator / #83 scope] VERDICT: hypothesis HOLDS -- single-name "
                    "form leaks, stacked form does not. #83 is precisely a bare/"
                    "unresolvable-request leak: a fingerprinter probing a single font name "
                    "with no fallback (an ordinary font-detection technique) can read back "
                    "an earlier context's resolution. Narrower mechanism, same severity -- "
                    "this is exactly the detection #44's per-context list exists to prevent.")
          elif disc_single_leaked and disc_stacked_leaked:
              print("  [discriminator / #83 scope] VERDICT: BOTH forms leak -- arm (b)'s "
                    "green result does not come from stack-resolution avoiding the leaky "
                    "path; the gate is weaker than arm (b) alone shows. This blocks Task 8's "
                    "flip pending further investigation.")
          elif not disc_single_leaked and not disc_stacked_leaked:
              print("  [discriminator / #83 scope] VERDICT: NEITHER form leaks -- this "
                    "specific mac/win family pairing does not reproduce #83 at all. The "
                    "leak may be specific to arm (j)'s U+FFFD probe families or setup, not "
                    "this one. #83 needs re-scoping again before it means anything.")
          else:
              print("  [discriminator / #83 scope] VERDICT: UNEXPECTED -- stacked form "
                    "leaks but single-name form does not. Re-examine the hypothesis before "
                    "trusting either reading.")
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Is arm (b)'s green real or structural? #83's discriminator
          # leaked mac's exact real font widths into win, same shared
          # process, same run in which arm (b) itself reported green
          # for the identical families. Two untested differences
          # between arm (b)'s probe() and the leaking discriminator,
          # per team-lead direction -- vary ONE at a time so the result
          # attributes cleanly:
          #
          #   1. Reference ordering: probe()'s absentW is measured
          #      BEFORE the family loop; the discriminator measured its
          #      baseline AFTER (last). If the leak needs an earlier
          #      same-context request to seed whatever it reads, taking
          #      the reference first means arm (b) never reaches that
          #      state before it has already recorded its answer.
          #   2. Donor context lifetime: arm (b) calls ctx.close() on
          #      mac before creating win. The discriminator's leak was
          #      demonstrated with the donor context still alive.
          #
          # Both variants below keep processCount=1 and every other
          # condition (same FONTS[name] lists, same probe string, same
          # 72px+monospace stacked form) identical to arm (b)'s own
          # probe() -- ONLY the one named variable changes in each.
          # `mac`/`win` (arm (b)'s own already-computed result, same
          # run) are still in scope below for a same-run comparison.

          # Variant 1: reference-ordering only. Same JS shape as arm
          # (b)'s probe(), same ctx.close()-before-next lifetime -- only
          # WHEN absentW is measured moves, from first to last.
          JS_ORDER_LAST = """(families) => {
            const c = document.createElement('canvas').getContext('2d');
            const s = 'mmmmmmmmmmlliWWWWWWW@#$%^&*()_+';
            const w = (f) => { c.font = '72px "' + f + '", monospace'; return c.measureText(s).width; };
            const rawWidths = {};
            for (const f of families) rawWidths[f] = w(f);
            rawWidths['__impossible__'] = w('__NoSuchFamily__12345');
            const absentW = w('__CamouAbsentRef__0001');
            const measure = {};
            for (const f of families) measure[f] = (rawWidths[f] !== absentW);
            measure['__impossible__'] = (rawWidths['__impossible__'] !== absentW);
            return {measure: measure, absentWidth: absentW};
          }"""

          def run_ordering_variant():
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      firefox_user_prefs={"dom.ipc.processCount": 1},
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctxs = {}
                  for name in ("mac", "win"):
                      ctx = b.new_context()
                      ctx.add_init_script(
                          'if (typeof window.setFontList === "function") '
                          'window.setFontList(%s);' % json.dumps(",".join(FONTS[name])))
                      page = ctx.new_page()
                      page.goto("data:text/html,<h1>f</h1>")
                      ctxs[name] = page.evaluate(JS_ORDER_LAST, PROBES)
                      ctx.close()  # matches arm (b)'s own close-before-next
                  b.close()
                  return ctxs["mac"], ctxs["win"]

          order_mac, order_win = run_ordering_variant()
          print(f"  [variant 1 / ordering-only] mac measure {order_mac['measure']}")
          print(f"  [variant 1 / ordering-only] win measure {order_win['measure']}")
          order_leaked = [f for f in MAC_ONLY if order_win["measure"][f]]
          print(f"  [variant 1 / ordering-only] win resolved MAC_ONLY families it was never "
                f"allowed: {order_leaked or 'NONE -- unchanged from arm (b)'}")

          # Variant 2: donor-lifetime only. Same JS as arm (b)'s probe()
          # verbatim (reference still measured FIRST), same reused
          # probe() helper -- only mac's context is kept alive (not
          # closed) while win is created and probed.
          def run_lifetime_variant():
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      firefox_user_prefs={"dom.ipc.processCount": 1},
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx_mac = b.new_context()
                  ctx_mac.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["mac"])))
                  mac_result = probe(ctx_mac.new_page())
                  # Deliberately NOT closed here -- the one variable
                  # under test. arm (b) itself calls ctx.close() at this
                  # exact point, before the next context exists.
                  ctx_win = b.new_context()
                  ctx_win.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["win"])))
                  win_result = probe(ctx_win.new_page())
                  ctx_mac.close()
                  ctx_win.close()
                  b.close()
                  return mac_result, win_result

          life_mac, life_win = run_lifetime_variant()
          print(f"  [variant 2 / lifetime-only] mac measure {life_mac['measure']}")
          print(f"  [variant 2 / lifetime-only] win measure {life_win['measure']}")
          life_leaked = [f for f in MAC_ONLY if life_win["measure"][f]]
          print(f"  [variant 2 / lifetime-only] win resolved MAC_ONLY families it was never "
                f"allowed, donor still alive: {life_leaked or 'NONE -- unchanged from arm (b)'}")

          print(f"  [variants summary] arm (b) original (this same run): win resolved "
                f"{[f for f in MAC_ONLY if win['measure'][f]] or 'NONE'}")
          if order_leaked and not life_leaked:
              print("  [variants summary] VERDICT: ordering alone flips it -- arm (b)'s "
                    "green is structural (reference taken before the leak-triggering state "
                    "exists), not evidence the gate holds.")
          elif life_leaked and not order_leaked:
              print("  [variants summary] VERDICT: donor lifetime alone flips it -- arm (b)'s "
                    "green is structural (closing the donor tears down whatever holds the "
                    "cached resolution before the recipient ever asks), not evidence the gate "
                    "holds.")
          elif order_leaked and life_leaked:
              print("  [variants summary] VERDICT: BOTH flip it independently -- either is "
                    "sufficient on its own; arm (b)'s green depends on both conditions arm (b) "
                    "happens to have (reference-first AND donor-closed), not on the gate.")
          else:
              print("  [variants summary] VERDICT: NEITHER flips it -- arm (b)'s green survives "
                    "both candidate explanations. There is a third, unidentified difference "
                    "between arm (b)'s setup and the discriminator's; report as such rather "
                    "than forcing a conclusion.")
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Does closing a context kill its content process (team-lead's
          # sharper version of the lifetime finding): if so, arm (b)'s
          # win never shared ANY process with mac, at any
          # dom.ipc.processCount setting, and its green says nothing
          # about cross-context sharing either way.
          #
          # No content-visible API answers this: web content has no
          # standard way to read its own OS process id (checked --
          # Camoufox's own Services.appinfo.processID reference, at
          # additions/juggler/content/main.js:83, is Juggler's own
          # PRIVILEGED chrome-context automation code, not something a
          # page can call; exposing process identity to content would
          # itself be a fingerprinting surface no browser ships). So
          # this checks from OUTSIDE, at the OS level, which the CI
          # runner can do directly and more authoritatively than any
          # content-side proxy: list this binary's own content-process
          # PIDs (Gecko's e10s convention: a content process carries
          # '-contentproc' on its command line, unrelated to Camoufox)
          # at three checkpoints, for BOTH sequences already measured
          # above -- donor-closed (arm (b)'s own shape) and donor-alive
          # (the lifetime variant that leaked).
          def track_pids_donor_closed():
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      firefox_user_prefs={"dom.ipc.processCount": 1},
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx_mac = b.new_context()
                  ctx_mac.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["mac"])))
                  page_mac = ctx_mac.new_page()
                  page_mac.goto("data:text/html,<h1>pid-mac</h1>")
                  after_mac = content_pids()
                  ctx_mac.close()
                  after_close = content_pids()
                  ctx_win = b.new_context()
                  ctx_win.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["win"])))
                  page_win = ctx_win.new_page()
                  page_win.goto("data:text/html,<h1>pid-win</h1>")
                  after_win = content_pids()
                  ctx_win.close()
                  b.close()
                  return after_mac, after_close, after_win

          def track_pids_donor_alive():
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      firefox_user_prefs={"dom.ipc.processCount": 1},
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx_mac = b.new_context()
                  ctx_mac.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["mac"])))
                  page_mac = ctx_mac.new_page()
                  page_mac.goto("data:text/html,<h1>pid-mac2</h1>")
                  after_mac = content_pids()
                  # donor stays alive -- no ctx_mac.close() here
                  ctx_win = b.new_context()
                  ctx_win.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["win"])))
                  page_win = ctx_win.new_page()
                  page_win.goto("data:text/html,<h1>pid-win2</h1>")
                  after_win = content_pids()
                  ctx_mac.close()
                  ctx_win.close()
                  b.close()
                  return after_mac, after_win

          pid_after_mac, pid_after_close, pid_after_win = track_pids_donor_closed()
          print(f"  [pid / donor-closed] content processes after mac page ready:\n{pid_after_mac}")
          print(f"  [pid / donor-closed] content processes after ctx_mac.close():\n{pid_after_close}")
          print(f"  [pid / donor-closed] content processes after win page ready:\n{pid_after_win}")

          pid2_after_mac, pid2_after_win = track_pids_donor_alive()
          print(f"  [pid / donor-alive] content processes after mac page ready:\n{pid2_after_mac}")
          print(f"  [pid / donor-alive] content processes after win page ready (donor still open):\n{pid2_after_win}")
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Arm (j2): UNMEASURABLE ON THIS BUNDLE -- see the long note
          # above arm (j)'s launch. The bare donor here settled U+FFFD at
          # 49.21666717529297 in run 34428270062, which is both this
          # arm's "tofu floor" AND the directly-named U+FFFD width of
          # DejaVu Sans, the family every one of the run's 355 `default`
          # lines names. WHICH face rendered it is NOT established here:
          # this donor is bare under a bare launch, so it is allowed
          # every family, and MS Gothic, Noto Sans and SimSun measure
          # that same width -- the four-way tie arm (j)'s single-family
          # ["Tahoma"] donor breaks by construction is not broken on this
          # arm. What IS measured, and is what puts the arm in
          # KNOWN_UNMEASURABLE, needs no such identification: zero
          # fffd-cache lines and zero U+FFFD sys-fallback lines across
          # all 76 files, so the cache this arm exists to observe was
          # never read and never written, whatever supplied the glyph.
          # The donor did not fail to resolve -- it resolved something
          # real, which is what the floor was measuring all along. Kept,
          # and listed in KNOWN_UNMEASURABLE at the end of this step, so
          # the arm still prints its numbers for the follow-up rather
          # than being deleted -- but its GREEN would be vacuous and its
          # RED observes nothing.
          #
          # Arm (j) above asked a NARROW per-context list to populate
          # mReplacementCharFallbackFamily; none of ten strong
          # candidates did, so that context's OWN gated fallback never
          # reaches the population site and there is nothing for a
          # later context to inherit -- correctly reported as "setup
          # invalid" above, not a false pass.
          #
          # Read straight from CamouIsFontAllowed
          # (patches/font-list-spoofing.patch, gfxPlatformFontList.cpp):
          #   uint32_t ctx = FontListManager::GetCurrentContext();
          #   if (ctx != 0 && FontListManager::HasFontList(ctx)) { ...gated...}
          #   ...else falls through to the (launch-level) "fonts" key...
          # The gated branch is skipped -- and the launch-level
          # fallback taken instead -- whenever HasFontList(ctx) is
          # false, i.e. whenever setFontList() was NEVER called for
          # that context. That is true for literal userContextId 0
          # (nothing ever calls setFontList() on it) but also, per this
          # same read, for ANY context that simply never calls it --
          # exactly this fork's own established "bare context" pattern
          # (see one_page_webfont_bare() above, same file). Under
          # CAMOU_CONFIG={} (empty launch, no "fonts" key),
          # sLaunchFonts is empty, so CamouIsFontAllowed returns true
          # for every font name -- a bare launch/context is allowed
          # everything, which is also the realistic production shape
          # of a context nobody ever called setFontList() on.
          def one_page_bare(js):
              # Same shape as one_page() above, but the context never
              # calls window.setFontList() at all -- HasFontList(ctx)
              # stays false for its whole life, so CamouIsFontAllowed
              # falls through to the (empty) launch-level fonts key.
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx = b.new_context()
                  page = ctx.new_page()
                  page.goto("data:text/html,<h1>4b-bare</h1>")
                  result = page.evaluate(js)
                  b.close()
                  return result

          bare_bisect = one_page_bare(JS_FFFD_BISECT)
          print(f"  [arm j2 / #82 bare setup] U+FFFD tofu floor (no-op family, bare context): "
                f"{bare_bisect['tofu']}")
          print(f"  [arm j2 / #82 bare setup] named-candidate U+FFFD widths under a BARE "
                f"context (no per-context list, no launch fonts key): {bare_bisect['widths']}")
          bare_working = [fam for fam, w in bare_bisect["widths"].items() if w != bare_bisect["tofu"]]
          print(f"  [arm j2 / #82 bare setup] candidates that resolve U+FFFD under a bare "
                f"context: {bare_working or 'NONE'}")

          j2_failures = []
          if not bare_working:
              # Stop condition (team-lead directive): this is the last
              # attempt on #82 in this task. A bare context is the
              # least restricted setup this fork can produce -- if
              # U+FFFD does not resolve here either, it does not
              # resolve through this build's gated fallback under any
              # setup tried, which is itself a finding, not a null
              # result to iterate past.
              j2_failures.append(
                  f"arm (j2)/#82 bare-context setup ALSO invalid: none of the bisected "
                  f"candidates ({FFFD_CANDIDATES}) resolve U+FFFD under a bare context "
                  f"either (widths {bare_bisect['widths']} all equal tofu "
                  f"{bare_bisect['tofu']}) -- U+FFFD does not resolve through this build's "
                  f"gated fallback under the least-restricted setup available. Per the "
                  f"task's stop condition, no further arm redesign was attempted; this is "
                  f"reported on #82 as its own finding and may warrant a separate issue.")
              print(f"  (j2) bare-context U+FFFD population check:  INCONCLUSIVE -- "
                    f"{j2_failures}")
          else:
              def two_contexts_bare_then_narrow(list_b, js, extra_prefs=None):
                  prefs = {"dom.ipc.processCount": 1}
                  if extra_prefs:
                      prefs.update(extra_prefs)
                  # Same one-launch-two-contexts shape as
                  # two_contexts_one_launch() above, but context A
                  # never calls setFontList() at all -- it must be
                  # BARE, not narrow, to test whether the
                  # default-shaped context (nothing ever calls
                  # setFontList() on it) is what actually populates
                  # mReplacementCharFallbackFamily in production.
                  # Deliberately NOT a parameter on
                  # two_contexts_one_launch(): that helper always
                  # installs list_a via setFontList, and arm (i)'s
                  # already-confirmed call site should not change.
                  with sync_playwright() as pw:
                      b = pw.firefox.launch(
                          executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                          # Same requirement as two_contexts_one_launch():
                          # without this, A and B land in separate
                          # content processes and this arm tests nothing.
                          firefox_user_prefs=prefs,
                          env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                      ctx_a = b.new_context()
                      page_a = ctx_a.new_page()
                      page_a.goto("data:text/html,<h1>4b-bare-a</h1>")
                      pids_a = tab_pids()
                      result_a = page_a.evaluate(js)

                      ctx_b = b.new_context()
                      ctx_b.add_init_script(
                          'if (typeof window.setFontList === "function") '
                          'window.setFontList(%s);' % json.dumps(",".join(list_b)))
                      page_b = ctx_b.new_page()
                      page_b.goto("data:text/html,<h1>4b-bare-b</h1>")
                      pids_b = tab_pids()
                      result_b = page_b.evaluate(js)

                      b.close()
                      return result_a, result_b, {"after_a": pids_a, "after_b": pids_b}

              # WHAT WOULD MAKE THIS ARM GREEN WRONGLY (CLAUDE.md lesson 4):
              # identical to arm (j)'s list, with one difference. A bare donor
              # has no list, so the leak signature cannot be named in advance --
              # it is DERIVED here from the donor's own `named` dict: the family
              # whose directly-named U+FFFD width equals the donor's settled
              # width is the face the cache now holds. If no named family
              # matches, the arm cannot identify what the donor resolved and
              # says so rather than falling back to a floor comparison, which is
              # the exact defect this repair removes.
              #
              # WHAT WOULD MAKE THIS ARM PRINT A LEAK WRONGLY -- the mode run
              # 34322535132 actually hit. The bare donor settled at the run's own
              # tofu floor, i.e. it resolved no real face at all; B then settled
              # at that same universal tofu, which is the CORRECT outcome, and
              # the arm printed "LEAK CONFIRMED". Its guard missed it because the
              # guard compared against j2_b["named"]["Arial"], a named-family
              # width that itself lacks U+FFFD coverage, rather than against a
              # "nothing rendered" floor. The floor is now bare_bisect["tofu"],
              # measured in its own bare launch before any candidate is named,
              # and a donor sitting on it is scored `setup invalid` -- the same
              # shape arm (j) uses.
              j2_mark = log_mark()
              j2_a, j2_b, j2_pids = two_contexts_bare_then_narrow(
                  FFFD_NO_PROBE, JS_4C,
                  extra_prefs={"gfx.font_rendering.fallback.async": False,
                               "fission.autostart": False})
              # Arm (j)'s fallback observation, for the bare donor. Both of this
              # arm's `setup invalid` branches are statements about what the
              # bare donor resolved; this names the face the browser itself
              # reports, so a Phase D `setup invalid` says why rather than only
              # that widths matched.
              print(f"  [arm j2 / U+FFFD fallback observed] "
                    f"{fffd_resolved(j2_mark) or 'no global-fallback line for U+FFFD in this launch'}")
              print(f"  [arm j2 / U+FFFD fallback observed] textrun system fallback: "
                    f"{camou_fl(j2_mark, 'textrun-systemfallback', limit=4) or 'none'}")
              j2_sig_families = [fam for fam, w in j2_a["named"].items()
                                 if abs(w - j2_a["final"]) < 0.01]
              # DIAGNOSTIC ONLY, for arm (j)'s reason: Arial has no U+FFFD glyph
              # and routes through the cache under test. Printed, never compared.
              j2_b_arial = j2_b["named"]["Arial"]
              j2_floor = bare_bisect["tofu"]
              print(f"  [arm j2 / #82] context A (bare, no setFontList call at all, first in "
                    f"launch, stays open) settled={j2_a['final']} named={j2_a['named']} "
                    f"refs={j2_a['refs']} samples={j2_a['samples']}")
              print(f"  [arm j2 / #82] the donor's settled width matches these named families: "
                    f"{j2_sig_families or 'NONE'}")
              print(f"  [arm j2 / #82] context B ({FFFD_NO_PROBE}, no U+FFFD coverage, same "
                    f"launch, AFTER A) settled={j2_b['final']} "
                    f"named-Arial(diagnostic)={j2_b_arial} "
                    f"named={j2_b['named']} refs={j2_b['refs']} samples={j2_b['samples']}")
              print(f"  [arm j2 / #82] tab pids after A / after B: {j2_pids}")

              if isinstance(j2_pids["after_a"], str) or isinstance(j2_pids["after_b"], str):
                  j2_failures.append(
                      f"arm (j2)/#82 unmeasured: could not read the content-process table "
                      f"({j2_pids}); #82's cache is a per-process singleton.")
              elif (j2_pids["after_b"] - j2_pids["after_a"]) or not j2_pids["after_a"]:
                  # Same "no NEW tab pid" test as arm (j), for the same reason.
                  j2_failures.append(
                      f"arm (j2)/#82 unmeasured: a new content process appeared for B. Tab pids were "
                      f"{sorted(j2_pids['after_a'])} after A and {sorted(j2_pids['after_b'])} "
                      f"after B, so donor and recipient did not share the gfxPlatformFontList "
                      f"singleton. Not a verdict either way.")
              elif abs(j2_a["final"] - j2_floor) < 0.01:
                  # Ordered BEFORE the sig-families check on purpose. When the
                  # donor resolves nothing, families that also lack U+FFFD
                  # coverage still "match" its settled width, so j2_sig_families
                  # is non-empty and names nothing: run 34322535132 derived
                  # ['Calibri'] that way and the arm went on to print a leak. A
                  # donor sitting on the tofu floor is a setup failure, and it is
                  # now the first thing tested.
                  j2_failures.append(
                      f"arm (j2)/#82 setup invalid: the bare donor settled U+FFFD at "
                      f"{j2_a['final']}, which is the run's own bare-context tofu floor "
                      f"({j2_floor}, taken in the bisect launch before any candidate was "
                      f"named). The donor resolved no real face, so nothing was written to "
                      f"mReplacementCharFallbackFamily and B settling at the same width is the "
                      f"correct outcome rather than a leak. The derived signature "
                      f"{j2_sig_families} names only families that also fail to cover U+FFFD.")
              elif not j2_sig_families:
                  j2_failures.append(
                      f"arm (j2)/#82 setup invalid: the bare donor settled U+FFFD at "
                      f"{j2_a['final']}, which matches none of the families it named "
                      f"({j2_a['named']}). The face now in mReplacementCharFallbackFamily "
                      f"cannot be identified, so no positive-identification verdict is "
                      f"available and this arm will not fall back to a floor comparison.")
              elif abs(j2_b["final"] - j2_a["final"]) < 0.01:
                  j2_failures.append(
                      f"arm (j2)/#82: REPLACEMENT-CHAR CACHE LEAK (#82) CONFIRMED via the "
                      f"bare-context population path -- context B ({FFFD_NO_PROBE}, none of "
                      f"which cover U+FFFD) settled U+FFFD at {j2_b['final']}, the same width "
                      f"the bare donor settled at ({j2_a['final']}, identified as "
                      f"{j2_sig_families}) and not the run's bare tofu floor ({j2_floor}); "
                      f"B's named Arial, a diagnostic that routes through the same fallback "
                      f"and scores nothing, read {j2_b_arial}. Both shared "
                      f"tab process(es) {sorted(j2_pids['after_a'])}. A bare context -- the "
                      f"production shape of one nobody ever called setFontList on, which "
                      f"CamouIsFontAllowed treats exactly like userContextId 0 -- populated "
                      f"the process-wide cache and B inherited a real glyph from a family it "
                      f"was never allowed.")
              j2_ok_msg = (f"context B settled U+FFFD at {j2_b['final']}, which is NOT the "
                           f"bare donor's {j2_a['final']} ({j2_sig_families}); the run's bare "
                           f"tofu floor is {j2_floor}, and B's named Arial (a diagnostic only) "
                           f"is {j2_b_arial}")
              print(f"  (j2) bare-context replacement-char cache leak (#82):  "
                    f"{'RED' if j2_failures else 'GREEN'} -- {j2_failures or j2_ok_msg}")
          if j2_failures:
              tripwires.append(f"(j2) bare-context replacement-char cache leak (#82): {j2_failures}")
              note_unmeasured("(j2)", j2_failures, "REPLACEMENT-CHAR CACHE LEAK")
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Arm (n4): #82. mReplacementCharFallbackFamily is a per-process,
          # per-FontVisibility-level cache of the family that answered U+FFFD.
          # PR #93 gates the read (gfxPlatformFontList.cpp:1409-1427); this arm
          # is the measurement that gate never had.
          #
          # Fixture, traced exit by exit in the spec review: donor ["Times",
          # "Menlo"], victim ["Times", "Geneva"], both stacks "Times" only.
          # Times is 4/4 faces WITHOUT U+FFFD; A2's serif row starts with Times,
          # which both lists contain, so the appended default generic (serif,
          # from all.js:2038 via GetDefaultGeneric(x-western)) also resolves to
          # Times and both groups read families=times,times. The only U+FFFD
          # carrier the donor can reach is N4_CARRIER, through system fallback.
          # U+FFFD is the FIRST character of its own text run so aPrevMatchedFont
          # (exit 8) is empty. Re-scanned against the shipped bundle before this
          # arm landed: 345 faces, U+FFFD carriers are Apple Symbols, Arimo,
          # Lucida Grande, Malgun Gothic, Menlo, Microsoft Sans Serif, STIX Two
          # Math, Segoe UI (+Black/Light/Semibold/Semilight), System Font,
          # Tahoma, Tinos, Verdana -- Times and Geneva are in neither, which is
          # what the fixture needs, and Menlo and Lucida Grande are both there,
          # which is what makes N4_DONOR_ALT a real recovery fixture.
          #
          # WHAT WOULD MAKE THIS PRINT A WRONG ANSWER (CLAUDE.md lesson 4):
          #  * Two contexts in different content processes share no cache at
          #    all, so the arm would read GREEN for a leak it never exposed.
          #    two_contexts_one_launch forces dom.ipc.processCount=1 and the
          #    pids are ASSERTED equal, not assumed.
          #  * mReplacementCharFallbackFamily is indexed by FontVisibility
          #    LEVEL. Both pages are same-scheme (data:) content documents, so
          #    both groups sit at the same level; a mismatch reads an empty slot
          #    and looks exactly like the pre-#93 report B6 keys on.
          #  * The victim's own tofu floor and Menlo's U+FFFD width could be
          #    equal, in which case "leaked" and "rendered nothing" are the same
          #    number. Asserted.
          #  * On a binary with no CAMOU-FL kinds at all (build 34236331658 @
          #    8990915 emits zero) none of the four log preconditions can be
          #    read. That is the width-only diagnostic branch, and its reading
          #    is what triggers B6.
          #  * Geneva appears here as a LIST MEMBER ONLY -- nothing renders it,
          #    its role is "allowed but not a U+FFFD carrier" -- so issue #95
          #    (Geneva never renders) cannot affect this arm's reading. Every
          #    measured stack is Times.
          # THE CARRIER IS LUCIDA GRANDE, NOT MENLO, and run 34501017054 is
          # why. With Menlo the arm reported `control invalid`: Menlo's U+FFFD
          # measured 43 and the victim's own tofu floor measured 43, so a leak
          # and an empty render were one number. That collision is STRUCTURAL,
          # not luck -- Menlo is monospaced, so its U+FFFD advance is its
          # advance for every glyph including .notdef, and a 43-wide face is
          # what serves U+E000 in every context this step measured. ANY
          # monospace carrier collides with a tofu floor on this bundle.
          # Lucida Grande advances U+FFFD at 1.0000 em, i.e. 72 at 72px
          # (fontTools, off bundle/fonts/macos/LucidaGrande.ttc), against a
          # floor of 43 -- so the control differs by construction rather than
          # by hope. Menlo becomes the recovery fixture the two swap roles.
          N4_CARRIER = "Lucida Grande"
          # CAMOU-FL lowercases the family in its `key=` field ("key=segoe ui",
          # "key=.sf compact"), so the log predicates match on this, not on the
          # display name. `resolved=` carries the name as-is and uses N4_CARRIER.
          _CAR_KEY = N4_CARRIER.casefold()
          N4_DONOR = ["Times", N4_CARRIER]
          N4_DONOR_ALT = ["Times", "Menlo"]   # recovery fixture
          N4_VICTIM = ["Times", "Geneva"]
          JS_N4 = """() => {
            const c = document.createElement('canvas').getContext('2d');
            const out = {};
            c.font = '72px "Times"';
            // U+FFFD first in its own measureText call, so aPrevMatchedFont is
            // empty when FindFontForChar runs for it.
            out.fffd = c.measureText('\\uFFFD').width;
            out.floor = c.measureText('\\uE000').width;
            return out;
          }"""
          JS_N4_REF = """(fam) => {
            const c = document.createElement('canvas').getContext('2d');
            c.font = '72px "' + fam + '"';
            return {carrier: c.measureText('\\uFFFD').width};
          }"""

          n4_mark = log_mark()
          n4_a, n4_b, n4_pids = two_contexts_one_launch(
              N4_DONOR, N4_VICTIM, JS_N4,
              extra_prefs={"gfx.font_rendering.fallback.async": False,
                           "fission.autostart": False})
          # Every log read BEFORE the reference launch, for the reason stated in
          # arm (n1)'s log-window note above.
          n4_fl = camou_fl(n4_mark, "CAMOU-FL fontlist", limit=None)
          n4_sys = camou_fl(n4_mark, "CAMOU-FL sys-fallback", "ch=U+FFFD", limit=None)
          n4_cache = camou_fl(n4_mark, "CAMOU-FL fffd-cache", limit=None)
          n4_pf = camou_fl(n4_mark, "CAMOU-FL pref-fallback", limit=None)
          n4_ref = one_page_list_arg(None, JS_N4_REF, N4_CARRIER)["carrier"]
          # Spec B4 wants FOUR preconditions, two of them per context: the
          # donor's `fontlist` line AND the victim's, each times=times with no
          # carrier. `any(...)` over the whole window satisfies both with one
          # line and would pass a run in which the victim resolved something
          # else entirely. Resolve each context id from the line that is unique
          # to it -- the donor is the context that populated the cache
          # (sys-fallback), the victim is the one that read it (fffd-cache) --
          # and then assert each context's own fontlist line.
          # The donor is the context whose sys-fallback line names a REAL
          # family. `sys-fallback` is emitted UNCONDITIONALLY after the call,
          # not inside `if (font)` (gfxTextRun.cpp:3623-3630), with
          # `resolved=none` when nothing was found -- so the VICTIM emits one
          # too: it reaches WhichSystemFontSupportsChar (that is where the
          # fffd-cache read this arm needs lives) and comes back null once the
          # gate refuses Menlo. Its line is written after the donor's, in the
          # same content-process file under dom.ipc.processCount=1, so
          # `n4_sys[-1]` is the victim's and both ids would come out equal --
          # tripping this arm's own "one context cannot leak to itself" branch
          # on the very build where #82's only GREEN has to come from.
          # Filter on the same predicate the arm already asserts further down.
          #
          # AND TAKE THE FIRST, NOT THE LAST. The `resolved=none` filter above
          # repairs this only while the gate HOLDS. Measured, not reasoned:
          # run 34543794646, the B6 diagnostic build with the fffd-cache
          # refusal dropped, emitted
          #   :779  sys-fallback ctx=6 ch=U+FFFD resolved=Lucida Grande   (donor)
          #   :810  fffd-cache   ctx=7 key=lucida grande allowed=0
          #   :811  sys-fallback ctx=7 ch=U+FFFD resolved=Lucida Grande   (VICTIM)
          # -- because with the refusal gone the victim KEEPS the cached
          # fontEntry, HasCharacter(0xFFFD) is true, and WhichSystemFontSupportsChar
          # hands it back, so the victim's line names the carrier too. `[-1]` then
          # picked the VICTIM as the donor, both ctx came out 7, and the arm
          # reported "one context cannot leak to itself" on the one build where
          # #82's RED has to come from -- while `victim fffd=72` in the same
          # print showed the leak plainly.
          #
          # The donor renders FIRST, and camou_fl returns lines in (file, line)
          # order; both contexts share one content process under
          # dom.ipc.processCount=1, so within that one file line order IS time
          # order and `[0]` is the donor's. The "same ctx" refusal below is KEPT,
          # not replaced: if every naming line really did belong to one context,
          # this arm still must not score a leak.
          _n4_sys_ok = [ln for ln in n4_sys
                        if "resolved=" in ln
                        and not ln.rstrip().endswith("resolved=none")]
          n4_donor_ctx = _ctx_tok(_n4_sys_ok[0]) if _n4_sys_ok else None
          n4_victim_ctx = _ctx_tok(n4_cache[-1]) if n4_cache else None
          print(f"  [arm n4 / #82] sys-fallback lines NAMING a family, in (file, line) "
                f"order: {[_ctx_tok(_l) for _l in _n4_sys_ok]} -- donor taken as the "
                f"first ({n4_donor_ctx}), victim from the fffd-cache line "
                f"({n4_victim_ctx})")

          def _n4_families(ctx):
              return [ln.split("families=", 1)[1].strip()
                      for ln in n4_fl
                      if "families=" in ln and _ctx_tok(ln) == ctx]
          # _ctx_tok is defined in arm (n1) above. Both arms live in the same
          # `python - <<'PY'` heredoc, so it is in scope here.
          print(f"  [arm n4 / #82] donor fffd={n4_a['fffd']} floor={n4_a['floor']}; "
                f"victim fffd={n4_b['fffd']} floor={n4_b['floor']}; "
                f"carrier({N4_CARRIER})_ref={n4_ref}; pids={n4_pids}; "
                f"donor_ctx={n4_donor_ctx} victim_ctx={n4_victim_ctx}; "
                f"fontlist={len(n4_fl)} sys-fallback(U+FFFD)={len(n4_sys)} "
                f"fffd-cache={len(n4_cache)} pref-fallback={len(n4_pf)}")
          for _ln in (n4_fl + n4_sys + n4_cache + n4_pf)[-10:]:
              print(f"      {_ln}")

          n4_failures = []
          # Keyed on `fontlist` ALONE, not on fffd-cache. 34432908522 @ 163ee25
          # emits fffd-cache but not fontlist, so an `or` here would be flipped
          # true by one fffd-cache line from arm (j) earlier in the run, take
          # the log branch, find no fontlist lines and report SETUP-INVALID on a
          # binary that was never going to have them. Every precondition in the
          # log branch below reads `fontlist`; that is the kind to test.
          n4_have_log = kind_total("fontlist") > 0
          if isinstance(n4_pids["after_a"], str) or isinstance(n4_pids["after_b"], str):
              n4_failures.append(
                  f"setup invalid: pgrep failed, so 'same process' could not be "
                  f"asserted: {n4_pids}")
          elif not (n4_pids["after_a"] & n4_pids["after_b"]):
              n4_failures.append(
                  f"setup invalid: donor and victim rendered in different content "
                  f"processes, and mReplacementCharFallbackFamily is a per-process "
                  f"singleton, so nothing could have been shared: {n4_pids}")
          elif abs(n4_ref - n4_b["floor"]) < 0.01:
              n4_failures.append(
                  f"control invalid: {N4_CARRIER}'s U+FFFD width ({n4_ref}) equals "
                  f"the victim's own tofu floor ({n4_b['floor']}), so a leak and an "
                  f"empty render are the same number. Re-run with the recovery "
                  f"carrier from {N4_DONOR_ALT}")
          elif not n4_have_log:
              # Build 34236331658 @ 8990915: zero CAMOU-FL lines of any kind.
              _leak = abs(n4_b["fffd"] - n4_ref) < 0.01
              _tofu = abs(n4_b["fffd"] - n4_b["floor"]) < 0.01
              _donor_carrier = abs(n4_a["fffd"] - n4_ref) < 0.01
              print(f"  [arm n4 / #82] DIAGNOSTIC (binary emits no CAMOU-FL kind): "
                    f"donor {'reached ' + N4_CARRIER if _donor_carrier else 'did NOT reach ' + N4_CARRIER}; "
                    f"victim read {N4_CARRIER.upper() + ' (leak)' if _leak else 'its tofu floor' if _tofu else 'neither'}. "
                    f"B6 TRIGGER = donor did not reach {N4_CARRIER}, i.e. something answered "
                    f"U+FFFD before SystemFindFontForChar; record which of the bundle's "
                    f"U+FFFD carriers the widths match.")
          else:
              _don = _n4_families(n4_donor_ctx)
              _vic = _n4_families(n4_victim_ctx)
              _pf_carrier = [ln for ln in n4_pf
                             if "key=" + _CAR_KEY in ln and "allowed=1" in ln]

              # M5: derived from the fixture constants, not hardcoded, so a
              # third carrier cannot silently stop being excluded.
              _n4_excl = {fam.split()[0].casefold()
                          for fam in (N4_DONOR + N4_DONOR_ALT)
                          if fam.casefold() != "times"}

              def _times_only(fams):
                  return bool(fams) and all(
                      "times" in f.lower()
                      and not any(t in f.lower() for t in _n4_excl)
                      for f in fams)

              if n4_donor_ctx is None or n4_victim_ctx is None:
                  n4_failures.append(
                      f"setup invalid: could not resolve the donor's ctx from a "
                      f"`sys-fallback ch=U+FFFD resolved=<family>` line "
                      f"({n4_donor_ctx}; {len(n4_sys)} sys-fallback lines, "
                      f"{len(_n4_sys_ok)} of them naming a family) or the victim's "
                      f"from a `fffd-cache` line ({n4_victim_ctx}), so neither "
                      f"context's fontlist line can be identified")
              elif n4_donor_ctx == n4_victim_ctx:
                  n4_failures.append(
                      f"setup invalid: the donor and the victim resolved to the SAME "
                      f"ctx ({n4_donor_ctx}); one context cannot leak to itself")
              elif not _don or not _vic:
                  n4_failures.append(
                      f"setup invalid: {kind_total('fontlist')} `fontlist` lines in the "
                      f"run, but {len(_don)} for the donor (ctx={n4_donor_ctx}) and "
                      f"{len(_vic)} for the victim (ctx={n4_victim_ctx}); spec B4 wants "
                      f"both, separately")
              elif any(f == "" for f in _don + _vic):
                  n4_failures.append(
                      "setup invalid: a `fontlist` line has an EMPTY families= field, "
                      "which is a child-process AsString failure, not an empty list")
              elif not _times_only(_don):
                  n4_failures.append(
                      f"setup invalid: the DONOR (ctx={n4_donor_ctx}) did not resolve "
                      f"to Times-only, so a carrier is in mFonts and exit 4 answers "
                      f"before the cache: {_don}")
              elif not _times_only(_vic):
                  n4_failures.append(
                      f"setup invalid: the VICTIM (ctx={n4_victim_ctx}) did not resolve "
                      f"to Times-only, so its own stack could cover U+FFFD and a GREEN "
                      f"would not be the gate's doing: {_vic}")
              elif _pf_carrier:
                  n4_failures.append(
                      f"setup invalid: the donor's PREF path answered with "
                      f"{N4_CARRIER} "
                      f"({_pf_carrier[-1]}), so the cache was never populated by system "
                      f"fallback. Re-run this arm with the recovery fixture "
                      f"{N4_DONOR_ALT}, a carrier fontconfig's serif/sans candidates "
                      f"do not reach")
              elif not any("resolved=" + N4_CARRIER in ln for ln in n4_sys):
                  n4_failures.append(
                      f"setup invalid: no `sys-fallback ctx=... ch=U+FFFD "
                      f"resolved={N4_CARRIER}` "
                      f"line, so the donor never populated the cache: "
                      f"{n4_sys[-2:] or 'no sys-fallback lines at all'}")
              elif not any("key=" + _CAR_KEY in ln and "allowed=0" in ln
                           for ln in n4_cache):
                  n4_failures.append(
                      f"setup invalid: no `fffd-cache ctx=... key={_CAR_KEY} allowed=0` line, "
                      f"so the victim never reached the cached-family read: "
                      f"{n4_cache[-2:] or 'no fffd-cache lines at all'}")
              elif abs(n4_b["fffd"] - n4_ref) < 0.01:
                  n4_failures.append(
                      f"U+FFFD CACHE LEAK: the victim rendered U+FFFD at {n4_b['fffd']}, "
                      f"which is {N4_CARRIER}'s width ({n4_ref}) -- a family its own "
                      f"list excludes -- despite `fffd-cache ... key={_CAR_KEY} allowed=0`")
              elif abs(n4_b["fffd"] - n4_b["floor"]) >= 0.01:
                  n4_failures.append(
                      f"the victim rendered U+FFFD at {n4_b['fffd']}, which is neither "
                      f"{N4_CARRIER} ({n4_ref}) nor its own tofu floor ({n4_b['floor']}); some "
                      f"third face answered and this arm cannot say which")
          if n4_failures:
              tripwires.append(f"(n4) replacement-char cache, donor/victim (#82): {n4_failures}")
              note_unmeasured("(n4)", n4_failures, "U+FFFD CACHE LEAK")
              print(f"  (n4) replacement-char cache, donor/victim (#82):  RED -- {n4_failures}")
          else:
              print("  (n4) replacement-char cache, donor/victim (#82):  GREEN -- no tripwire")
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Arm (n5): #90. SpeechVoicesManager keeps its per-context voice list
          # in a process-local nsTHashMap (sVoicesMap,
          # patches/speech-voices-spoofing.patch) while its one-shot disable
          # flag goes through the cross-process RoverfoxStorageManager -- the
          # same asymmetry #83 turned out to be. This arm MEASURES it; the fix
          # (A4) lands only if this is RED.
          #
          # WHAT WOULD MAKE THIS PRINT A WRONG ANSWER (CLAUDE.md lesson 4):
          #  * getVoices() is legitimately empty until `voiceschanged` fires, so
          #    an empty read is not evidence of anything on its own. Read after
          #    goto() AND after the event, and report both.
          #  * The init script runs in juggler's ISOLATED world, so a window
          #    global it sets is invisible to page.evaluate(). Every page-world
          #    value comes back through a DOM attribute (the #83 shape).
          #  * Playwright runs init scripts on EVERY navigation and new_page()
          #    lands on about:blank first, so a one-shot setter registered
          #    before new_page() is already spent. add_init_script comes AFTER
          #    new_page(), exactly as probe_windows_fonts.py:640-646 does it.
          #  * A context reading an empty list while the pid set did not change
          #    is not a cross-process finding. pids are sampled between
          #    new_page() and goto() and reported with the verdict.
          #  * The binding itself is present on this binary -- the "which setter
          #    bindings reached the build" step of run 34496121342 lists
          #    setSpeechVoices in every probed context -- so a `saw:false`
          #    data-sv here is a real finding about ordering, not a missing
          #    build.
          # THE SETTER IS A FILTER OVER REAL VOICES, NOT AN INJECTOR, and
          # that is why this fixture is not the plan's. Read off
          # patches/speech-voices-spoofing.patch: SetSpeechVoices takes a
          # DOMString and stores it, and SpeechSynthesis::GetVoices then walks
          # nsSynthVoiceRegistry's REAL voices and `continue`s past any whose
          # name IsVoiceAllowed() refuses. Installing ["Alpha One","Alpha Two"]
          # therefore does not create two voices -- it filters the registry down
          # to voices with those names, of which there are none, and getVoices()
          # correctly returns []. The plan scored an empty read as `VOICES
          # LEAK`, so on a runner with no speech backend at all this arm was
          # going to report a leak on EVERY run whatever the code did, and Task
          # 6 would have been sent to fix a defect nobody had measured. That is
          # the CLAUDE.md lesson-4 shape exactly: a reference that cannot differ.
          #
          # So the fixture is derived from the registry at run time. A baseline
          # context with NO filter installed reads whatever voices this runner
          # actually has; that list is split in half and each half installed in
          # one context. If the registry holds fewer than two voices the arm
          # CANNOT distinguish a leak from an empty registry and says so --
          # setup invalid, which the gate reads as NEITHER.
          #
          # WHAT WOULD MAKE THIS PRINT A WRONG ANSWER (CLAUDE.md lesson 4):
          #  * getVoices() is legitimately empty until `voiceschanged` fires, so
          #    an empty read is not evidence of anything on its own. Read after
          #    goto() AND after the event, and report both.
          #  * An empty registry makes every context read [] whatever the
          #    filter says. Measured first, and the arm refuses to score.
          #  * The init script runs in juggler's ISOLATED world, so a window
          #    global it sets is invisible to page.evaluate(). Every page-world
          #    value comes back through a DOM attribute (the #83 shape).
          #  * Playwright runs init scripts on EVERY navigation and new_page()
          #    lands on about:blank first, so a one-shot setter registered
          #    before new_page() is already spent. add_init_script comes AFTER
          #    new_page(), exactly as probe_windows_fonts.py:640-646 does it.
          #  * A context reading the wrong list while the pid set did not change
          #    is not a cross-process finding. pids are sampled between
          #    new_page() and goto() and reported with the verdict.
          #  * The binding is present on this binary -- run 34496121342's "which
          #    setter bindings reached the build" step lists setSpeechVoices in
          #    every probed context -- so a `saw:false` here is an ordering bug
          #    in this arm, not a missing build.
          N5_INIT = (
              '(() => {'
              ' const saw = (typeof window.setSpeechVoices === "function");'
              ' let applied = false, err = null;'
              ' if (saw) { try { window.setSpeechVoices(%s); applied = true; }'
              '            catch (e) { err = String(e); } }'
              ' const mark = () => { try { document.documentElement.setAttribute('
              '   "data-sv", JSON.stringify({saw, applied, err})); } catch (e) {} };'
              ' mark(); document.addEventListener("DOMContentLoaded", mark);'
              '})()'
          )
          JS_N5 = """async () => {
            const read = () => speechSynthesis.getVoices().map(v => v.name);
            const first = read();
            await new Promise(r => {
              if (read().length) { r(); return; }
              speechSynthesis.addEventListener('voiceschanged', r, {once: true});
              setTimeout(r, 4000);
            });
            const after = read();
            return {first, after,
                    dataSv: document.documentElement.getAttribute('data-sv')};
          }"""

          def n5_probe():
              """Baseline (unfiltered) read first, then one context per half."""
              out = {}
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      firefox_user_prefs={"dom.ipc.processCount": 1},
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  # No init script at all: HasVoices(ctx) is false, so GetVoices
                  # filters nothing and this is the registry as the runner has
                  # it. It has to be read from a context of the same shape as
                  # the two under test, not from a launch-level default.
                  ctx0 = b.new_context()
                  page0 = ctx0.new_page()
                  page0.goto("data:text/html,<h1>n5-base</h1>")
                  out["base"] = page0.evaluate(JS_N5)
                  # N2: DEDUPE BEFORE SPLITTING. The halves are `r[:n]` and
                  # `r[n:]`, so a name appearing twice with its copies
                  # straddling the midpoint would sit in BOTH `want` sets and
                  # `_got & _theirs` would fire a FALSE `VOICES LEAK` -- which,
                  # now that (n5) is in EXPECTED_GREEN, fails the step. Not live
                  # on run 34513429414 (13362 entries, 13362 distinct), and
                  # deduping makes disjointness a property of the construction
                  # rather than of the runner's voice table.
                  out["raw"] = list(out["base"]["after"])
                  registry = list(dict.fromkeys(out["base"]["after"]))
                  halves = {"a": registry[:len(registry) // 2],
                            "b": registry[len(registry) // 2:]}
                  if len(registry) >= 2:
                      for label in ("a", "b"):
                          ctx = b.new_context()
                          page = ctx.new_page()
                          pids_before = tab_pids()
                          ctx.add_init_script(
                              N5_INIT % json.dumps(",".join(halves[label])))
                          page.goto("data:text/html,<h1>n5-%s</h1>" % label)
                          out[label] = {"res": page.evaluate(JS_N5),
                                        "pids_before": pids_before,
                                        "pids_after": tab_pids(),
                                        "want": halves[label]}
                  b.close()
              out["registry"] = registry
              out["halves"] = halves
              return out

          n5 = n5_probe()
          # N4: this printed ~1.2 MB across three lines -- 13362 voice names,
          # twice more as the two halves. `gh run view --log` truncates this
          # workflow's output without a marker, and an arm that prints a
          # megabyte is a self-inflicted readback hazard. Counts, the numbers
          # the verdict actually rests on, and a three-name sample; the full
          # lists appear only in a failure string, and those are capped too.
          _n5_raw, _n5_reg = n5.get("raw", []), n5["registry"]
          print(f"  [arm n5 / #90] registry (a context with NO filter installed): "
                f"{len(_n5_raw)} entries, {len(_n5_reg)} distinct "
                f"({len(_n5_raw) - len(_n5_reg)} duplicates dropped before "
                f"splitting); sample {_n5_reg[:3]}; "
                f"baseline first-read={len(n5['base']['first'])} "
                f"data-sv={n5['base']['dataSv']!r}")
          for _lbl in ("a", "b"):
              _oth = "b" if _lbl == "a" else "a"
              if _lbl in n5:
                  _w = set(n5[_lbl]["want"])
                  _a = n5[_lbl]["res"]["after"]
                  _t = set(n5[_oth]["want"]) if _oth in n5 else set()
                  # N3: the shortfall is REPORTED, not left for a reader to
                  # notice. `issubset` passes on a subset, so a context reading
                  # fewer names than were installed cannot produce a false
                  # verdict -- but it is an unexplained gap in the measurement
                  # that closes #90, and an unexplained gap should be visible.
                  print(f"  [arm n5 / #90] ctx {_lbl}: installed {len(_w)}, read "
                        f"{len(_a)} of them ({len(_w) - len(set(_a))} of its own "
                        f"list not returned); cross-reads from ctx {_oth}: "
                        f"{len(set(_a) & _t)}; names outside its own list: "
                        f"{len(set(_a) - _w)}; first-read={len(n5[_lbl]['res']['first'])}; "
                        f"sample {_a[:3]}; data-sv={n5[_lbl]['res']['dataSv']} "
                        f"pids {n5[_lbl]['pids_before']} -> {n5[_lbl]['pids_after']}")

          n5_failures = []
          if len(n5["registry"]) < 2:
              n5_failures.append(
                  f"setup invalid: this runner's speech registry holds "
                  f"{len(n5['registry'])} voice(s) ({n5['registry']}), and "
                  f"setSpeechVoices FILTERS the registry rather than adding to it "
                  f"(SpeechSynthesis::GetVoices skips names IsVoiceAllowed refuses). "
                  f"With fewer than two real voices every context reads the same "
                  f"list whatever its filter says, so a leak and a correct refusal "
                  f"are one reading and this arm measures nothing. Needs a host with "
                  f"speech-dispatcher voices installed")
          else:
              for _lbl in ("a", "b"):
                  _sv = n5[_lbl]["res"]["dataSv"]
                  if not _sv or '"applied":true' not in _sv.replace(" ", ""):
                      n5_failures.append(
                          f"setup invalid: ctx {_lbl}'s init script did not apply "
                          f"setSpeechVoices on the document that was measured "
                          f"(data-sv={_sv!r}); with no list installed a context is "
                          f"allowed everything and a wrong reading is "
                          f"indistinguishable from a leak")
              if not n5_failures:
                  for _lbl, _other in (("a", "b"), ("b", "a")):
                      _got = set(n5[_lbl]["res"]["after"])
                      _want = set(n5[_lbl]["want"])
                      _theirs = set(n5[_other]["want"])
                      if _got & _theirs:
                          n5_failures.append(
                              f"VOICES LEAK: ctx {_lbl} read "
                              f"{len(_got & _theirs)} name(s) belonging to ctx "
                              f"{_other}, e.g. {sorted(_got & _theirs)[:10]}; pids "
                              f"{n5[_lbl]['pids_before']} -> {n5[_lbl]['pids_after']}")
                      elif not _got:
                          n5_failures.append(
                              f"VOICES LEAK: ctx {_lbl} read an EMPTY voice list after "
                              f"`voiceschanged` while its own list ({sorted(_want)}) was "
                              f"installed and every name in it is a REAL registry voice; "
                              f"pids {n5[_lbl]['pids_before']} -> "
                              f"{n5[_lbl]['pids_after']}")
                      elif not _got.issubset(_want):
                          n5_failures.append(
                              f"VOICES LEAK: ctx {_lbl} read "
                              f"{len(_got - _want)} name(s) in neither context's "
                              f"configured list, e.g. {sorted(_got - _want)[:10]}")
          if n5_failures:
              tripwires.append(f"(n5) per-context speech voices (#90): {n5_failures}")
              note_unmeasured("(n5)", n5_failures, "VOICES LEAK")
              print(f"  (n5) per-context speech voices (#90):  RED -- {n5_failures}")
          else:
              print("  (n5) per-context speech voices (#90):  GREEN -- no tripwire")
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Arm (n7): #91. FontFaceImpl::SetStatus discards aStatus entirely and
          # writes Loaded/Error from a family-name gate, so a url() face whose
          # download 404s still reports `loaded`. FontFace::Status() never reads
          # mStatus at all (FontFace.cpp:285-289), and FontFace::Load() resolves
          # its promise from the same gate rather than from the load.
          #
          # WHY AN HTTP SERVER. Every other navigation in this file is
          # `data:text/html,...`, which is an OPAQUE origin. An absolute
          # http:// font url() from an opaque origin is a cross-origin font
          # fetch with no CORS and is blocked before the network result matters,
          # so the 404 face AND the control face would both read `error` -- a
          # RED that looks exactly like a real one (spec-review I6).
          #
          # WHAT WOULD MAKE THIS PRINT A WRONG ANSWER (CLAUDE.md lesson 4):
          #  * document.fonts.ready does not guarantee a face LEFT `loading`.
          #    Each face is scored from its own .loaded promise, with a poll as
          #    the backstop.
          #  * The control face is the run-time fontTools probe from arm (k)
          #    (build_probe_k): unitsPerEm 1000, glyph 'a' advancing 2000, so 20
          #    glyphs at 48px measure exactly 1920 IF AND ONLY IF that face
          #    rendered. It differs from any fallback by construction rather
          #    than by assumption, which is the whole point.
          import base64 as _b64_n7
          import http.server as _http_n7
          import socketserver as _sock_n7
          import threading as _thr_n7

          n7_font_bytes = None
          try:
              _uri = build_probe_k()
              n7_font_bytes = _b64_n7.b64decode(_uri.split(",", 1)[1])
          except Exception as _exc:
              print(f"  [arm n7 / #91] SKIP: could not build the control font: "
                    f"{type(_exc).__name__}: {_exc}")

          if n7_font_bytes:
              N7_PAGE = (
                  b"<!doctype html><meta charset=utf-8><title>n7</title>"
                  b"<style>"
                  b"@font-face { font-family: N7Ctl; src: url('/ctl.ttf'); }"
                  b"@font-face { font-family: N7Bad; src: url('/nope.ttf'); }"
                  b"</style><body><h1>n7</h1>"
              )

              # What the browser ACTUALLY asked for. Run 34503994177 had the
              # control face reporting `loaded` while measuring the fallback
              # baseline, and "the bytes never arrived" and "the bytes arrived
              # and the face still did not render" are different findings that
              # a width alone cannot tell apart. TCPServer.serve_forever
              # handles one request at a time, so a plain list is enough.
              n7_served = []

              class _N7Handler(_http_n7.SimpleHTTPRequestHandler):
                  def log_message(self, *a):
                      pass

                  def do_GET(self):
                      n7_served.append(self.path)
                      if self.path.startswith("/ctl.ttf"):
                          body, code, ctype = n7_font_bytes, 200, "font/ttf"
                      elif self.path.startswith("/nope.ttf"):
                          body, code, ctype = b"not found", 404, "text/plain"
                      else:
                          body, code, ctype = N7_PAGE, 200, "text/html; charset=utf-8"
                      self.send_response(code)
                      self.send_header("Content-Type", ctype)
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

              # allow_reuse_address is a CLASS attribute read inside
              # server_bind, so setting it on the instance after construction
              # does nothing. Set it on the subclass instead -- though with port
              # 0 the kernel picks a free port and it never mattered.
              _sock_n7.TCPServer.allow_reuse_address = True
              _srv = _sock_n7.TCPServer(("127.0.0.1", 0), _N7Handler)
              n7_port = _srv.server_address[1]
              _thr_n7.Thread(target=_srv.serve_forever, daemon=True).start()

              JS_N7 = """async () => {
                const faces = {};
                for (const f of document.fonts) {
                  const name = f.family.replace(/^["']|["']$/g, '');
                  faces[name] = f;
                }
                const score = async (name) => {
                  const f = faces[name];
                  if (!f) return 'NO_FACE_FOUND';
                  // INITIATE THE LOAD, INSIDE THE RACE. Two requirements meet
                  // here and only one arrangement satisfies both.
                  //
                  // The load must be initiated: an @font-face rule whose family
                  // is never used is never fetched -- ordinary CSS lazy loading,
                  // not a defect -- and awaiting f.loaded does not start a fetch
                  // either. Without an explicit load the 404 face is never
                  // requested, a CORRECT binary reports `unloaded`, and the
                  // verdict branch below would score that as INVENTED LOAD
                  // STATUS: a false RED on the very build Task 5 is meant to
                  // prove.
                  //
                  // And nothing may be awaited bare: page.evaluate() has no
                  // timeout on the Python side, so a promise that never settles
                  // hangs the whole guard step until GitHub kills it -- and on a
                  // fork that writes FontFaceLoadStatus from a family-name gate
                  // rather than from the load, a url() face's promise plausibly
                  // never settles at all.
                  //
                  // A previous version satisfied the first with a bare
                  // `await f.load()` ABOVE this race, which quietly defeated the
                  // second: per the CSS Font Loading spec load() and loaded
                  // return the SAME [[FontStatusPromise]], so if f.loaded can
                  // hang then await f.load() hangs on the identical promise --
                  // with no timer beside it -- and STUCK_LOADING became
                  // unreachable in exactly the case it was written for. Racing
                  // load() itself gives the same initiation, the same 5s bound,
                  // and keeps that branch alive. dryrun.py asserts the shape,
                  // because it drives the Python branches from a supplied status
                  // and never executes this JS.
                  let settled = false;
                  await Promise.race([
                    f.load().then(() => { settled = true; },
                                  () => { settled = true; }),
                    new Promise(r => setTimeout(r, 5000)),
                  ]);
                  for (let i = 0; i < 40 && f.status === 'loading'; i++) {
                    await new Promise(r => setTimeout(r, 100));
                  }
                  return f.status === 'loading' && !settled
                      ? 'STUCK_LOADING' : f.status;
                };
                const c = document.createElement('canvas').getContext('2d');
                const s = 'aaaaaaaaaaaaaaaaaaaa';   // 20 glyphs -> 1920 at 48px
                c.font = '48px monospace';
                const baseline = c.measureText(s).width;
                const ctlStatus = await score('N7Ctl');
                const badStatus = await score('N7Bad');
                // Arm (k) awaits document.fonts.ready and measures the SAME
                // font at 1920; this arm did not, and in run 34503994177 it
                // measured the fallback baseline. Awaiting it here removes
                // "the face had not finished loading yet" as an explanation
                // before anything is claimed. The text is also laid out once
                // so the font is actually USED, not merely measured.
                const probe = document.createElement('span');
                probe.style.font = '48px "N7Ctl", monospace';
                probe.textContent = s;
                document.body.appendChild(probe);
                await document.fonts.ready;
                for (let i = 0; i < 30; i++) {
                  c.font = '48px "N7Ctl", monospace';
                  if (Math.abs(c.measureText(s).width - baseline) > 1) break;
                  await new Promise(r => setTimeout(r, 100));
                }
                c.font = '48px "N7Ctl", monospace';
                const ctlWidth = c.measureText(s).width;
                return {ctlStatus, badStatus, ctlWidth, baseline};
              }"""

              def n7_run(font_list):
                  with sync_playwright() as pw:
                      b = pw.firefox.launch(
                          executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                          env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                      ctx = b.new_context()
                      page = ctx.new_page()
                      if font_list is not None:
                          ctx.add_init_script(
                              'if (typeof window.setFontList === "function") '
                              'window.setFontList(%s);' % json.dumps(",".join(font_list)))
                      page.goto("http://127.0.0.1:%d/" % n7_port)
                      out = page.evaluate(JS_N7)
                      b.close()
                      return out

              # M3: shutdown() stops the loop but leaves the listening socket
              # open until process exit, and if n7_run raises it was skipped
              # entirely. try/finally costs two lines.
              try:
                  n7 = n7_run(FONTS["mac"])
              finally:
                  _srv.shutdown()
                  _srv.server_close()
              print(f"  [arm n7 / #91] control face status={n7['ctlStatus']} "
                    f"width={n7['ctlWidth']} baseline={n7['baseline']}; "
                    f"404 face status={n7['badStatus']}; "
                    f"paths the browser actually fetched: {n7_served}")
              _n7_got_ctl = any(x.startswith("/ctl.ttf") for x in n7_served)
              _n7_rendered = abs(n7["ctlWidth"] - 1920.0) <= 1.0

              n7_failures = []
              if n7["ctlStatus"] == "NO_FACE_FOUND" or n7["badStatus"] == "NO_FACE_FOUND":
                  n7_failures.append(
                      f"setup invalid: document.fonts did not carry both @font-face "
                      f"rules (ctl={n7['ctlStatus']} bad={n7['badStatus']})")
              elif n7["ctlStatus"] != "loaded":
                  n7_failures.append(
                      f"control invalid: the REAL control font reported "
                      f"{n7['ctlStatus']!r}, so 'error' here says nothing about the 404 "
                      f"face -- the server, the origin or the face itself is at fault")
              elif not _n7_rendered and _n7_got_ctl:
                  # NOT control-invalid. The server was asked for the font and
                  # served it, the face says `loaded`, and it still did not
                  # render -- and the SAME bytes render at exactly 1920 in arm
                  # (k) of this same run, from a data: URI, which is what rules
                  # out a broken font file rather than an assumption about one.
                  # document.fonts.ready has been awaited and the width polled
                  # for 3s, which rules out "not finished yet". A status of
                  # `loaded` for a face that never rendered is #91 read from the
                  # control side, and calling it a broken control would file the
                  # defect as a fixture problem.
                  n7_failures.append(
                      f"INVENTED LOAD STATUS (control variant): the control face "
                      f"reports {n7['ctlStatus']!r} and the server DID serve its bytes "
                      f"({n7_served}), yet after document.fonts.ready plus a 3s poll it "
                      f"measured {n7['ctlWidth']}, the plain-monospace baseline "
                      f"({n7['baseline']}), not 1920. Arm (k) renders these same bytes "
                      f"at 1920.0 from a data: URI in this run, so the file is good and "
                      f"the status is being reported without the load")
              elif not _n7_rendered:
                  n7_failures.append(
                      f"INVENTED LOAD STATUS (never-fetched variant): the control face "
                      f"reports {n7['ctlStatus']!r} but the browser never requested its "
                      f"src url() at all -- the server was asked only for {n7_served} -- "
                      f"and it measured {n7['ctlWidth']} against a baseline of "
                      f"{n7['baseline']}. A load status reported for a resource that was "
                      f"never fetched is the defect stated as plainly as it can be")
              elif n7["badStatus"] == "STUCK_LOADING":
                  n7_failures.append(
                      f"INVENTED LOAD STATUS (stuck variant): the 404 face never left "
                      f"`loading` -- its .loaded promise did not settle within 5s and "
                      f"its status was still 'loading' 4s later -- while the control "
                      f"face on the same page reached 'loaded' and rendered at 1920. A "
                      f"face whose download failed must reject and report 'error'; one "
                      f"that never resolves either way is the same defect seen from "
                      f"the promise side")
              elif n7["badStatus"] == "unloaded":
                  # NOT the #91 verdict. `unloaded` means no load was ever
                  # initiated for this face, so the arm never asked the question
                  # it scores. Since f.load() is called above, reaching this
                  # means the call itself did nothing -- a fixture failure, not
                  # a fork defect, and it must not be published as one.
                  n7_failures.append(
                      f"setup invalid: the 404 face is still 'unloaded' after "
                      f"f.load(), so its load was never initiated and this arm cannot "
                      f"say what status a real load would report. Paths the server was "
                      f"asked for: {n7_served}")
              elif n7["badStatus"] != "error":
                  # THE EXPECTED PHASE 1 TRANSITION, stated so Task 5 can check
                  # it rather than infer it: after the fix the 404 face must
                  # read 'error' and the control face must still read 'loaded'.
                  # A run where BOTH go 'error' is the control-invalid branch
                  # above, not a pass; a run where the 404 face reads 'unloaded'
                  # is the setup-invalid branch above, not a pass.
                  n7_failures.append(
                      f"INVENTED LOAD STATUS: a face whose src url() 404s reports "
                      f"{n7['badStatus']!r}, not 'error', while the control face on the "
                      f"same page loaded and rendered at 1920. After Task 5 this face "
                      f"must read 'error' and the control must still read 'loaded'")
              if n7_failures:
                  tripwires.append(f"(n7) FontFace load status for non-local faces (#91): {n7_failures}")
                  note_unmeasured("(n7)", n7_failures, "INVENTED LOAD STATUS")
                  print(f"  (n7) FontFace load status for non-local faces (#91):  RED -- {n7_failures}")
              else:
                  print("  (n7) FontFace load status for non-local faces (#91):  GREEN -- no tripwire")
          # -----------------------------------------------------------

          # Phase D triage. This branch closes #80, #81 and #83, and #82 is
          # unmeasurable on this bundle (see KNOWN_UNMEASURABLE below).
          #
          # #83 was diagnosed and then fixed within this PR: the leak ran
          # through gfxFcPlatformFontList::mFcSubstituteCache, a process-global
          # name->family memo keyed WITHOUT the user context and consulted
          # before the base FindAndAddFamiliesLocked where the gate lives, so
          # the gate was never asked (recon-83-gate-bypass.md). With the memo
          # keys carrying the context and the memos flushed in SetFontList,
          # arms (b2) and (b2r) are expected GREEN and a leak red in either is
          # a regression in that fix.
          #
          # Nothing is triaged red any more, so EXPECTED_RED is empty. The
          # dict stays rather than being deleted: it is the machinery for
          # triaging a future measured-but-unfixed defect, and the loop below
          # prints nothing when it is empty.
          #
          # Round 3's C++ has landed, so every arm it fixes is expected GREEN
          # and moves to EXPECTED_GREEN below. What stays red here is only what
          # this branch does NOT close.
          #
          # WHAT EMPTYING IT BUYS, stated because the cost of filling it was
          # stated when Phase 0 filled it. EXPECTED_RED is consulted FIRST in
          # the bucketing below, so while an arm sat here it could not fail the
          # step whichever way it went red -- including for the very defect it
          # exists to catch, and including a setup-invalid. With the table
          # empty, (n1) #94, (n2) #92, (h3) #88, (n4) #82, (n7) #91 and
          # (i)/(i2) #81 each fail the step if they go RED and fail it again,
          # under their own names, if they come back UNMEASURED. That is what
          # makes this branch's evidence mandatory rather than optional.
          #
          # (tag, (tripwire_prefix, why)) whenever this is next non-empty. The
          # prefix is what the triage matches on, the way KNOWN_UNMEASURABLE
          # carries a signature: an arm that emits two KINDS of red -- (i) and
          # (i2) emit "#94/#88 refused-list render:" and "#81 negative cache:"
          # -- must be absorbed by one of them and never by a bare tag. The two
          # asserts below enforce that on whatever is put here next.
          EXPECTED_RED = {}
          for _k, _v in EXPECTED_RED.items():
              assert isinstance(_v, tuple) and len(_v) == 2 and _v[0].startswith(_k), (
                  f"EXPECTED_RED[{_k}] must be (tripwire_prefix, why) whose prefix starts with "
                  f"the tag: {_v!r}. A prefix that does not match what the arm emits would "
                  f"absorb every red the arm can produce, including the one this table is "
                  f"deliberately not excusing.")
              # A BARE TAG IS REFUSED. "(i)" alone starts with "(i)" and passes
              # the assert above, but it matches every tripwire the arm can
              # emit -- including "(i) #81 negative cache: ...", the one red
              # this table exists to NOT excuse. So the prefix must carry the
              # arm's own discriminating text and must name the issue it
              # excuses, which is what makes "which red is absorbed" readable
              # from the table rather than from the arm's source.
              assert len(_v[0]) > len(_k) and "#" in _v[0], (
                  f"EXPECTED_RED[{_k}]'s prefix {_v[0]!r} is a bare tag or names no issue. "
                  f"Give the arm's full tripwire prefix, including its #issue, so this "
                  f"entry absorbs one KIND of red rather than every red the arm emits.")
          # The arms that guard defects this branch DOES close, so each must be
          # GREEN here. Listed so the run prints a per-arm verdict line for
          # each even when every one passes -- Phase D's readback needs a line
          # per arm to quote, not the absence of one.
          EXPECTED_GREEN = {
              "(b2)": "#83, cross-context leak with the donor alive -- closed by the flush "
                      "in SetFontList and the per-context mFcSubstituteCache key together; "
                      "the flush alone explains (b2)/(b2r), the key is what (b2)'s post-B "
                      "re-probe tests",
              "(b2r)": "#83, same, with the init script on the document under test; "
                       "measures the flush, not the key -- see (b2)'s re-probe",
              # Back here, as Phase 0 said they would be. These two emit TWO
              # kinds of red and this table takes no prefix, so BOTH now fail
              # the step: the "#94/#88 refused-list render:" red that Phase 0
              # absorbed (context A was served a CJK family its list refuses,
              # by an ungated read path -- the path A1/A2 gate) and the "#81
              # negative cache:" red this table never excused. Bucketing does
              # not consult EXPECTED_GREEN at all, so either lands in
              # `unexpected`; a setup-invalid lands in `unmeasured`. All three
              # fail, which is the point of moving them.
              "(i)": "#81, negative fallback cache -- and, since Task 3/4, #94/#88: "
                     "context A's list refuses every CJK family, so with the pref-font "
                     "memo gated at read and the generic resolved through the ordered "
                     "table intersected with the list, A must settle at its OWN floor. "
                     "A refused-list render here is a regression in A1/A2",
              "(i2)": "#81 ordering case -- both lists installed before either context "
                      "renders; same two reds as (i)",
              "(k)": "#80, url() web fonts under a configured fonts list",
              # #90 is a MEASUREMENT that came back negative, not a defect this
              # branch closes -- but the routing it needs is EXPECTED_GREEN's,
              # not EXPECTED_RED's. This table drives the printed row only; the
              # bucketing below consults EXPECTED_RED, KNOWN_UNMEASURABLE and
              # unmeasured_arms, so an arm listed ONLY here falls through to
              # `unexpected` (a verdict) or `unmeasured` (a broken precondition)
              # and fails the step either way. That is exactly what a leak or a
              # lost registry should do.
              "(n5)": "#90, per-context speech voices -- a MEASUREMENT that came back "
                      "negative on run 34513429414: a 13362-voice espeak-ng registry, "
                      "split into two disjoint halves of 6681, and each context read "
                      "~6480 names all from its OWN half and none from the other's. A "
                      "RED here is either a real cross-context leak or a runner whose "
                      "speech registry went away; both must fail the step",
              # Round 3's own arms. Each was EXPECTED_RED through Phase 0 and
              # each guards a defect this branch's C++ closes, so each must be
              # GREEN on a binary built from this head -- and an arm that comes
              # back UNMEASURED fails under its own name, because there the
              # missing measurement is missing evidence for a fix this PR
              # claims.
              "(n1)": "#94, the pref-font memo is populated unfiltered at context 0 and "
                      "both gates are asked at read",
              "(n2)": "#92, a generic under a per-context list resolves through the "
                      "ordered table intersected with that list",
              "(h3)": "#88, GetDefaultFont opens its own scope and both last-resort "
                      "walks are gate-approved with an unfiltered tail. Retired from "
                      "KNOWN_UNMEASURABLE in the same edit: its excuse was `generic-map` "
                      "not existing, and A2 emits that kind, so this arm must now reach "
                      "shape B -- no `default` line for the context AND a generic-map "
                      "line naming an in-list family for it",
              "(n4)": "#82, the U+FFFD cache read is gated (PR #93) and this arm is the "
                      "measurement that gate never had. Its RED control is a separate "
                      "build: commit c7b1ff1 drops only the refusal on the fffd-cache "
                      "hit branch and keeps the log line, and is reverted on this branch "
                      "(see .superpowers/sdd-fonts3/gate-b4.md)",
              "(n7)": "#91, a non-local face reports the status its load produced",
          }
          assert not (set(EXPECTED_RED) & set(EXPECTED_GREEN)), (
              "an arm is in both EXPECTED_RED and EXPECTED_GREEN: "
              f"{sorted(set(EXPECTED_RED) & set(EXPECTED_GREEN))}. The triage table walks both, "
              "so it would print two contradictory rows for it.")
          # Arms this binary cannot measure AT ALL, for a reason in the build
          # rather than in the arm. Distinct from unmeasured_arms, which is a
          # per-run accident: this is a standing property of the bundle, read
          # off run 34428270062's own log. Such an arm must never print GREEN
          # (its green is vacuous) and must never be reported as "unfixed"
          # (it observed nothing), and its setup-invalid red must not fail the
          # step -- there is nothing a re-run could do about it.
          # (run_id, signature, why). `run_id` is the run that ESTABLISHED the
          # structural reason -- an entry without one is a guess, and the assert
          # below refuses it. `signature` is a substring that must appear in the
          # arm's OWN recorded unmeasured text when it failed for THAT reason,
          # so that an arm going unmeasured for any other reason (a process
          # split, an unreadable pid table, an invalid control) falls through to
          # SETUP-INVALID and fails the step instead of absorbing silently.
          #
          # signature was None until Phase 0 run 1 had been READ. It could not be
          # written before then: note_unmeasured stores failures[0][:220], and
          # which of arm (j)'s five branches fires under FONTCONFIG_FILE was not
          # knowable from run 34428270062, which predates that launch. Task 2
          # Step 1 filled them in from run 34496121342's own text and turned the
          # match on; each string below is the first 40 characters of that run's
          # `observed this run:` line, copied verbatim, not paraphrased.
          #
          # ARM (j) IS GONE FROM THIS TABLE, and its absence is the point. Under
          # FONTCONFIG_FILE it became measurable and reached a real verdict
          # (GREEN) in run 34496121342: `fffd-cache ctx=7 key=.sf compact
          # allowed=0` is that run's first such line on this bundle, and (j)
          # fired no tripwire at all, so it recorded no unmeasured text and
          # there is no signature to take. Leaving a None-signatured entry here
          # would absorb a FUTURE (j) red of any kind, which is exactly what
          # this reshape exists to prevent -- a measurable arm reporting a real
          # defect must reach `unexpected` and fail the step.
          KNOWN_UNMEASURABLE = {
              "(j2)": ("34428270062", "arm (j2)/#82 setup invalid: the bare don",
                       "#82: bare-donor variant. The bare donor settles U+FFFD at the "
                       "run's own bare-context tofu floor, so it resolved no real face "
                       "and never populated the cache this arm reads. Signature from "
                       "run 34496121342."),
              # ARM (h3) IS GONE FROM THIS TABLE, and, like arm (j) above, its
              # absence is the point. Its excuse was the `generic-map` kind not
              # existing: without it the arm could only take the
              # `h3_family is None` + no-generic-map branch, a setup-invalid
              # that observed nothing. A2 (commit 9d0f3b8) adds that kind, so
              # the branch this signature named is unreachable and the arm must
              # now reach shape B -- no `default` line for the refusing context
              # AND a generic-map line naming an in-list family for it -- or
              # emit `DEFAULT FONT OUTSIDE THE LIST`, which note_unmeasured
              # treats as a VERDICT rather than an unmeasured. Either way it no
              # longer lands here. It is in EXPECTED_GREEN above, so a red of
              # any kind now falls through to `unexpected` and fails the step.
              "(f)": ("34491802439", "arm (f) width reference collides: naming",
                      "#44 codepoint fallback is unmeasurable BY ADVANCE WIDTH under "
                      "FONTCONFIG_FILE. LIVE CAUSE, the one the arm records on every run: "
                      "the tofu floor COLLIDES. Run 34491802439 prints `tofu floor -- named "
                      "'PingFang HK' width 24 vs impossible-family fallback 24: COLLIDES, "
                      "no floor` for mac and the same for win with MS Gothic, so the "
                      "impossible-family fallback lands on a real CJK face at the named "
                      "family's own advance and there is no floor left to score against -- "
                      "the same ungated path arms (i)/(i2) name. A SECOND cause sits behind "
                      "it: PingFang HK and MS Gothic are both 0.5 em at U+FF71, so even "
                      "with a floor `mac == win` could not be a verdict. BACKGROUND, "
                      "already fixed: U+6F22 drew a full em in every bundled CJK face and "
                      "in most of their .notdef glyphs, which is why the codepoint moved to "
                      "U+FF71. Needs a discriminator that is not an advance -- the pixel "
                      "checksum this step already uses in three places -- or U+FFE8, the "
                      "only codepoint both faces cover at different advances that no "
                      "bundled Latin face covers. Falls through to a step failure the "
                      "moment this arm reaches a real verdict again."),
          }
          for _k, _v in KNOWN_UNMEASURABLE.items():
              assert isinstance(_v, tuple) and len(_v) == 3 and _v[0].isdigit(), (
                  f"KNOWN_UNMEASURABLE[{_k}] must be (run_id, signature, why) with a "
                  f"real run id: an arm may only be excused by a run someone can read.")
          # Four buckets. An arm in unmeasured_arms is red because its OWN
          # preconditions failed on this run: it reached no verdict, so calling
          # it a regression is as wrong as calling it a confirmed defect.
          #
          # ORDER MATTERS HERE. EXPECTED_RED is consulted first, so a triaged
          # arm never fails the step whichever way it went red -- the table
          # below still annotates it "RED but UNMEASURED" and withholds the
          # "unfixed" claim, which is what C5 asked for. KNOWN_UNMEASURABLE is
          # consulted second, and ONLY absorbs an arm that also reached no
          # verdict. An arm listed there that DOES reach its verdict has become
          # measurable -- the structural blocker no longer applies and it is
          # reporting a real defect -- so it falls through to `unexpected` and
          # fails the step rather than being swallowed by its own excuse. An
          # arm that is expected GREEN and comes back unmeasured also fails,
          # under its own name: there the missing measurement is missing
          # evidence for a fix this PR claims.
          expected, unmeasurable, unmeasured, unexpected = [], [], [], []
          for t in tripwires:
              tag = next((k for k, (_p, _w) in EXPECTED_RED.items() if t.startswith(_p)), None)
              if tag:
                  expected.append(f"{t[:120]}...")
                  continue
              tag = next((k for k in KNOWN_UNMEASURABLE if t.startswith(k)), None)
              _sig = KNOWN_UNMEASURABLE[tag][1] if tag else None
              if (tag and tag in unmeasured_arms
                      and (_sig is None or _sig in unmeasured_arms[tag])):
                  unmeasurable.append(t)
                  continue
              tag = next((k for k in unmeasured_arms if t.startswith(k)), None)
              (unmeasured if tag else unexpected).append(t)
          print("=== tripwire triage ===")
          for k, (_pfx, why) in EXPECTED_RED.items():
              hit = any(t.startswith(_pfx) for t in tripwires)
              if hit and k in unmeasured_arms:
                  # C5: this arm is red because its OWN preconditions failed. It
                  # reached no verdict, so the table must not assert that the
                  # defect it guards is still unfixed.
                  state = "RED but UNMEASURED -- no verdict; does NOT assert:"
              elif hit:
                  state = "RED (expected)"
              else:
                  state = ("GREEN -- was expected red, so the defect it guards may be "
                           "fixed; update EXPECTED_RED")
              print(f"  {k:5} {state}  {why}")
          for k, why in EXPECTED_GREEN.items():
              hit = any(t.startswith(k) for t in tripwires)
              if hit and k in unmeasured_arms:
                  state = "RED but UNMEASURED -- no verdict; does NOT assert:"
              elif hit:
                  state = "RED (UNEXPECTED) -- expected GREEN on this binary:"
              else:
                  state = "GREEN"
              print(f"  {k:5} {state}  {why}")
          for k, (_run, _sig, why) in KNOWN_UNMEASURABLE.items():
              hit = any(t.startswith(k) for t in tripwires)
              if hit and k in unmeasured_arms and (_sig is None or _sig in unmeasured_arms[k]):
                  state = "UNMEASURABLE (known) -- observed nothing; asserts NOTHING:"
              elif hit:
                  state = ("RED WITH A VERDICT -- this arm has become measurable, the "
                           "blocker below no longer applies, and it is reporting a real "
                           "defect. READ IT:")
              else:
                  state = ("GREEN, but VACUOUS on this bundle -- NOT evidence the defect "
                           "is fixed:")
              print(f"  {k:5} {state}  {why}")
              if hit and k in unmeasured_arms:
                  # F1 (from this task's re-review): `why` above is a FIXED
                  # string describing the branch that fired in run
                  # 34428270062. These arms have five and four absorbed
                  # branches respectively -- a process split, an unreadable
                  # process table, a control-invalid signature -- and the
                  # standing reason does not describe those. Printing the
                  # arm's own recorded text under the row is what stops a row
                  # someone quotes from asserting a cause nobody read back
                  # (CLAUDE.md lesson 6).
                  print(f"        observed this run: {unmeasured_arms[k]}")
          if unmeasurable:
              print("=== KNOWN UNMEASURABLE (a property of this bundle, not of this run) ===")
              for t in unmeasurable:
                  print(f"  KNOWN UNMEASURABLE: {t}")
          if unmeasured_arms:
              print("=== UNMEASURED (red, but the arm measured nothing -- not a verdict) ===")
              for tag, first in unmeasured_arms.items():
                  print(f"  {tag:5} {first}")
          for t in unmeasured:
              print(f"  SETUP-INVALID: {t}")
          for t in unexpected:
              print(f"  UNEXPECTED RED: {t}")
          assert not (unexpected or unmeasured), (
              f"{len(unexpected)} arm(s) red for a reason this guard does not already "
              f"know about:\n" + "\n".join(unexpected) +
              f"\n{len(unmeasured)} arm(s) red because their OWN preconditions failed -- "
              f"no verdict either way, and no evidence Phase D can quote:\n" +
              "\n".join(unmeasured))
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}
          LIBGL_ALWAYS_SOFTWARE: "1"
          CAMOU_FONTS_DIR: ${{ steps.bin.outputs.fonts_dir }}
          CAMOU_FONTS_CONF: ${{ steps.bin.outputs.fonts_conf }}
          # Python block-buffers stdout when it is a pipe, so a step that dies
          # mid-way loses whatever is still in the buffer and the surviving
          # timestamps are the FLUSH times, not the print times. Run
          # 34501017054 timed out with three arms sharing one timestamp and its
          # last arm's second line missing although that arm had finished --
          # which made "where did the time go" unanswerable from the log. The
          # only cost is more syscalls.
          PYTHONUNBUFFERED: "1"

      - name: "mixed-OS contexts from one launch honour the launch font mask, warn, and keep WebGL per-context (#44 contract guard)"
        timeout-minutes: 15
        # This step used to be the "#44 headline" measurement, marked
        # continue-on-error because it asserted the UNSUPPORTED behaviour --
        # that every context resolves its own OS's fonts from one launch --
        # and was known red (runs 34618162525, 34620762155, 34656256911,
        # 34658431749, 34678025310: five runs, three launch draws, same result).
        #
        # That behaviour is documented as unsupported. Since 8f36f9b (#45/#73)
        # pythonlib warns at NewContext time that the launch font list is a
        # process-wide mask a per-context list can only narrow, and tells the
        # caller to launch one browser per OS. So the contract is:
        #   (1) the context whose os= matches the LAUNCH's spoofed OS resolves
        #       its required marker fonts;
        #   (2) the other two contexts resolve NO markers -- not their own (the
        #       mask holds) and not anyone else's (no cross-OS leak);
        #   (3) warn_fonts_excluded_by_launch fires for each of those two (the
        #       matching context may or may not fire it -- both sides are random
        #       30-78% samples of the same list, so its set difference can be
        #       non-empty too -- and is not asserted);
        #   (4) WebGL stays per-context: all three contexts reporting the
        #       launch's renderer is the original #44 defect.
        # This step guards that contract and is BLOCKING.
        #
        # Marker validity is established here, deterministically: one explicit
        # launch per OS before the headline launch. The old arm depended on a
        # random draw to ever exercise the lin set; this does not.
        run: |
          # Entry point #44's body names: AsyncCamoufox() with NO os= at launch,
          # then three contexts from that ONE browser with three different os=.
          # `opts` is precomputed via launch_options() and reused through
          # `from_options=` so the printed FONTCONFIG_FILE / spoofed OS are read
          # back from the launch that actually ran (CLAUDE.md lesson 6).
          #
          # No ff_version is passed; on a runner with no managed install that
          # used to raise (#97), so reaching the browser is #97's end-to-end proof.
          #
          # xvfb is mandatory: headless returns '(no webgl)' for every renderer.
          pip install --quiet -e pythonlib 'playwright==1.55.0'
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python - <<'PY'
          import asyncio, os, warnings
          from camoufox.async_api import AsyncCamoufox, AsyncNewContext
          from camoufox.utils import (_reassemble_camou_config, get_target_os,
                                       launch_options)

          READ = '''() => {
            const c = document.createElement('canvas');
            const gl = c.getContext('webgl');
            const dbg = gl && gl.getExtension('WEBGL_debug_renderer_info');
            const renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)
                                 : '(no webgl)';
            const probe = (f) => {
              const s = document.createElement('span');
              s.style.cssText = 'position:absolute;font-size:72px';
              s.textContent = 'mmmmmmmmwwwwwww';
              document.body.appendChild(s);
              s.style.fontFamily = 'monospace';
              const base = s.getBoundingClientRect().width;
              s.style.fontFamily = `"${f}", monospace`;
              const w = s.getBoundingClientRect().width;
              s.remove();
              return w !== base;
            };
            // Markers must be (1) bundled by Camoufox for exactly this OS --
            // NOT a host font the CI runner happens to have -- and (2) not
            // that OS's own `monospace` generic alias, or the probe compares
            // a face against itself and reads ABSENT although present.
            // DejaVu Sans / Liberation Sans / Ubuntu are the runner's host
            // fonts, invisible under FONTCONFIG_FILE; Menlo/Consolas are the
            // mac/win monospace aliases; Monaco is monospaced at 600/1000em
            // next to Menlo's 602 and collapses to the same width at 72px.
            // PingFang HK (855/755) replaced it. Cambria is NOT in
            // _ESSENTIAL_FONTS_WINDOWS, so it is in the random sample and is
            // never required -- see REQUIRED below.
            //
            // probe() returns `w !== base`, so a dead layout reads
            // base === w === 0 for every family, absent reference included --
            // byte-identical to a live context refusing every marker. The
            // baseline is returned so the two can be told apart (lesson 4).
            const baseWidth = (() => {
              const s = document.createElement('span');
              s.style.cssText = 'position:absolute;font-size:72px';
              s.textContent = 'mmmmmmmmwwwwwww';
              document.body.appendChild(s);
              s.style.fontFamily = 'monospace';
              const b = s.getBoundingClientRect().width;
              s.remove();
              return b;
            })();
            return {
              platform: navigator.platform,
              renderer,
              base: baseWidth,
              mac: ['Helvetica Neue', 'Lucida Grande', 'PingFang HK'].filter(probe),
              win: ['Segoe UI', 'Calibri', 'Cambria'].filter(probe),
              lin: ['Arimo', 'Tinos', 'Noto Sans JP'].filter(probe),
              absent: probe('__CamouAbsentRef__0001'),
            };
          }'''

          EXPECT = {'macos': 'mac', 'windows': 'win', 'linux': 'lin'}
          # Markers a context of that OS must resolve when nothing masks it.
          # Cambria is a random-sample font (not essential) and is excluded.
          REQUIRED = {
              'mac': ['Helvetica Neue', 'Lucida Grande', 'PingFang HK'],
              'win': ['Segoe UI', 'Calibri'],
              'lin': ['Arimo', 'Tinos', 'Noto Sans JP'],
          }
          NARROW = "can only narrow it, never restore a family (#44)"
          BIN = os.environ['CAMOUFOX_BIN']

          async def read_context(browser, os_name):
              # warn_fonts_excluded_by_launch is called inside AsyncNewContext,
              # in this coroutine, after the executor-side fingerprint draw
              # returns (async_api.py:230) -- so a catch_warnings around the
              # await captures it.
              with warnings.catch_warnings(record=True) as rec:
                  warnings.simplefilter("always")
                  ctx = await AsyncNewContext(browser, os=os_name)
              fired = sum(1 for w in rec if NARROW in str(w.message))
              page = await ctx.new_page()
              await page.goto('data:text/html,<h1>c</h1>')
              r = await page.evaluate(READ)
              await ctx.close()
              r['warned'] = fired
              return r

          # -- precheck: every marker set resolves under its own OS ------------
          # One explicit launch per OS, context of the same OS. If a required
          # marker does not resolve HERE, the headline cannot read it either,
          # and any empty list below would be the probe, not the contract.
          async def precheck():
              out = {}
              for os_name in ('macos', 'windows', 'linux'):
                  async with AsyncCamoufox(os=os_name, headless=False,
                                           executable_path=BIN) as b:
                      out[os_name] = await read_context(b, os_name)
              return out

          pre = asyncio.run(precheck())
          invalid = []
          for os_name, r in pre.items():
              own = EXPECT[os_name]
              print(f"  [precheck {os_name}] {own}={r[own]} base={r['base']} absent={r['absent']}")
              missing = [f for f in REQUIRED[own] if f not in r[own]]
              if missing:
                  invalid.append(f"precheck {os_name}: required {own} markers did not resolve "
                                 f"under their own launch: {missing}")
              if r['absent']:
                  invalid.append(f"precheck {os_name}: the absent reference resolved")
              if r['base'] <= 0:
                  invalid.append(f"precheck {os_name}: probe laid out nothing (base={r['base']})")

          # -- headline: one launch, no os=, three contexts --------------------
          opts = launch_options(headless=False, executable_path=BIN)
          fontconfig_file = opts['env'].get('FONTCONFIG_FILE', '(unset)')
          launch_config = _reassemble_camou_config(opts)
          if launch_config is None:
              invalid.append("launch config did not reassemble from CAMOU_CONFIG_* -- cannot "
                             "read the launch's OS or renderer")
              spoofed_os, launch_renderer = '(unavailable)', None
          else:
              spoofed_os = get_target_os(launch_config)
              launch_renderer = launch_config.get('webGl:renderer')
          print(f"  [launch] fontconfig={fontconfig_file} spoofed_os={spoofed_os} "
                f"renderer={launch_renderer}")

          async def headline():
              seen = {}
              async with AsyncCamoufox(from_options=opts) as browser:
                  for os_name in ('macos', 'windows', 'linux'):
                      seen[os_name] = await read_context(browser, os_name)
              return seen

          seen = asyncio.run(headline())
          for os_name, r in seen.items():
              print(f"  [{os_name}] platform={r['platform']} renderer={r['renderer']}")
              print(f"  [{os_name}] mac={r['mac']} win={r['win']} lin={r['lin']} "
                    f"absent={r['absent']} base={r['base']} warned={r['warned']}")

          # -- setup validity (lesson 4) ----------------------------------------
          if any(r['renderer'] == '(no webgl)' for r in seen.values()):
              invalid.append("no GL context -- every renderer read is '(no webgl)'")
          if any(r['absent'] for r in seen.values()):
              invalid.append("the deliberately-absent family measured as present")
          if len({r['platform'] for r in seen.values()}) != 3:
              invalid.append(f"contexts did not differ on navigator.platform: "
                             f"{[r['platform'] for r in seen.values()]}")
          if any(r['base'] <= 0 for r in seen.values()):
              invalid.append(f"a context laid out nothing (base widths "
                             f"{[r['base'] for r in seen.values()]})")
          # get_target_os() returns the SHORT key ('mac'/'win'/'lin') -- the
          # same vocabulary as EXPECT's values and fonts.json's keys -- not the
          # long os= names. Run 34682740205 went SETUP-INVALID on exactly this.
          launch_key = spoofed_os if spoofed_os in ('mac', 'win', 'lin') else None
          if launch_key is None:
              invalid.append(f"launch spoofed_os={spoofed_os!r} is not one of mac/win/lin")
          renderers = [r['renderer'] for r in seen.values()]
          all_launch = launch_renderer is not None and all(x == launch_renderer for x in renderers)
          # Two contexts drawing the same WebGL renderer is a coincidence, not
          # the #44 defect (that is all three == launch). Context renderers are
          # sampled from webgl/webgl_data.db (AsyncNewContext passes no preset);
          # its mac and lin pools share 3 strings, so on a weighted draw
          # it happens on roughly 1 run in 37. It must NOT go through
          # `invalid`: that exits before the font verdict, and the font half is
          # what this guard exists for. Only the WebGL sub-verdict is skipped;
          # the font contract is still measured.
          webgl_measurable = all_launch or len(set(renderers)) == 3
          if not webgl_measurable:
              print(f"::notice::WebGL preset collision between contexts: {sorted(renderers)} "
                    f"(launch={launch_renderer}) -- WebGL half not evaluated this run")
          if invalid:
              print("::error::SETUP-INVALID -- this guard measured nothing:")
              for line in invalid:
                  print(f"  - {line}")
              raise SystemExit("setup-invalid")

          # -- contract verdict --------------------------------------------------
          bad = []
          for os_name, r in seen.items():
              own = EXPECT[os_name]
              if own == launch_key:
                  missing = [f for f in REQUIRED[own] if f not in r[own]]
                  if missing:
                      bad.append(f"{os_name} (matches launch {spoofed_os}): required markers "
                                 f"missing {missing} -- the launch mask refused its own OS")
              else:
                  for k in ('mac', 'win', 'lin'):
                      if r[k]:
                          bad.append(f"{os_name} (masked by launch {spoofed_os}): resolved {k} "
                                     f"markers {r[k]} -- expected none")
                  if r['warned'] == 0:
                      bad.append(f"{os_name} (masked by launch {spoofed_os}): "
                                 f"warn_fonts_excluded_by_launch did not fire")
          if all_launch:
              bad.append(f"every context reports the LAUNCH renderer {launch_renderer!r} "
                         f"-- the original #44 WebGL defect")
          elif len(set(renderers)) == 1:
              # All three on ONE renderer that is not the launch's. The win pool
              # shares no string with mac or lin in webgl_data.db, so three
              # contexts of three OSes cannot land on one renderer by chance:
              # this is a cross-context leak (the #83 class), not a collision.
              # Also the only bucket that catches launch_renderer=None.
              bad.append(f"all three contexts report one renderer {renderers[0]!r} that is "
                         f"not the launch's -- a cross-context leak, not a preset draw")

          assert not bad, "#44 contract violated:\n  " + "\n  ".join(bad)
          print(f"  #44 contract holds: launch={spoofed_os}, matching context resolved "
                f"{REQUIRED[launch_key]}, both masked contexts empty and warned, "
                + ("three distinct renderers" if webgl_measurable else
                   "WebGL half not evaluated (preset collision, see ::notice::)"))
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}
          LIBGL_ALWAYS_SOFTWARE: "1"
          # Block-buffered stdout would lose the precheck and [launch] lines if
          # the process died before flushing; those lines are the evidence.
          PYTHONUNBUFFERED: "1"

      # Bulk dump of what the per-context font-list guard captured -- that is
      # the CAMOU-FL producer, now two steps above rather than one, since the
      # #44 headline arm was inserted between them. Separate from that step, and
      # `if: always()`, for two reasons: it must not spend the guard's
      # 10-minute budget, and the run in which the guard FAILS is exactly the
      # run whose log someone needs. It launches nothing -- MOZ_LOG was set
      # inside the guard's own Python, so every one of its ~20 launches was
      # already instrumented.
      - name: "CAMOU-FL font log dump (#83/#88 diagnostic)"
        if: always()
        timeout-minutes: 5
        run: |
          python3 - <<'PY'
          import glob, os, re, sys

          LOG_DIR = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "camou-fontlog")
          # The nine CAMOU-FL kinds Task 5 added (task-5-report.md section 2a),
          # in the order they appear there.
          KINDS = ["gate", "set", "group", "scope-switch", "fffd-cache",
                   "global-fallback", "sys-fallback", "default", "facename",
                   # #83's mechanism site, added with the mFcSubstituteCache
                   # fix: a hit here answers a direct-named family before the
                   # gate is ever asked.
                   "fc-subst",
                   # Round 3. This list is DUPLICATED state: the guard step is a
                   # different python3 process and cannot import from here, so a
                   # kind added to one and not the other silently drops out of
                   # the counter table. See the plan's "Log line contract".
                   "pref-fallback",     # #94, the pref-memo read filter
                   "fontlist",          # #94, what EnsureFontList resolved
                   "generic-map",       # #92, which step answered a generic
                   "default-unfiltered"]  # #88, the last-resort tail fired
          OTHER = "textrun-systemfallback"   # pre-existing eGfxLog_textrun line
          CAP = 3000                        # printed lines, head + tail

          files = sorted(glob.glob(os.path.join(LOG_DIR, "*")))
          total_bytes = sum(os.path.getsize(p) for p in files)
          print(f"log dir: {LOG_DIR}")
          print(f"files: {len(files)}   bytes: {total_bytes}")
          if not files:
              # Not an error: this step also runs when the guard step failed
              # before its first launch. Say which it is rather than printing
              # an empty section that reads like "the log lines are gone".
              print("NO LOG FILES -- either the guard step never launched a browser, or "
                    "MOZ_LOG_FILE did not take effect. A build without patches/"
                    "font-list-spoofing.patch has no CAMOU-FL sites at all.")
              sys.exit(0)

          # `timestamp` puts UTC wall clock at the head of every line
          # (xpcom/base/Logging.cpp:797-801), so sorting on it merges the
          # per-process files into one time order; file and line number break
          # ties and keep a file's own lines in the order it wrote them.
          TS = re.compile(r"^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+) UTC")
          rows, counts = [], {k: 0 for k in KINDS + [OTHER]}
          for p in files:
              base = os.path.basename(p)
              with open(p, encoding="utf-8", errors="replace") as fh:
                  for i, raw in enumerate(fh):
                      line = raw.rstrip()
                      if "CAMOU-FL " in line:
                          kind = line.split("CAMOU-FL ", 1)[1].split(" ", 1)[0]
                          counts[kind] = counts.get(kind, 0) + 1
                      elif OTHER in line:
                          counts[OTHER] += 1
                      else:
                          continue
                      m = TS.match(line)
                      rows.append((m.group(1) if m else "", base, i, line))
          rows.sort(key=lambda r: (r[0], r[1], r[2]))

          print(f"total matching lines: {len(rows)}")
          for k in KINDS + [OTHER]:
              print(f"  {k:18} {counts.get(k, 0)}")
          for k in sorted(set(counts) - set(KINDS) - {OTHER}):
              print(f"  {k:18} {counts[k]}   <-- kind not in Task 5's nine")
          if not rows:
              print("ZERO matching lines despite non-empty log files: the fontlist module "
                    "logged, but no CAMOU-FL site ran. Check that this artifact carries "
                    "patches/font-list-spoofing.patch.")

          # The full set goes to a file the Upload results step collects, so a
          # reader can re-slice what the cap below drops.
          with open("camou-fl.txt", "w", encoding="utf-8") as out:
              for ts, base, i, line in rows:
                  out.write(f"{base}:{i}\t{line}\n")
          print("full set written to camou-fl.txt (uploaded with smoke-results)")

          # I1 (from this task's review): the (b2)/(b2r) slice attributed per
          # context, printed HERE and not only inside the guard step. Arm (a)
          # hard-asserts and arm (b)'s check_signal hard-asserts, both before
          # arm (b2) runs, and a 10-minute timeout kills the step wherever it
          # is -- any of which leaves the guard step's own slice unprinted. On
          # a build whose purpose is to diagnose #83 that is the one output
          # that has to survive, and this step is `if: always()`.
          #
          # This attributes by uri= alone, so it needs no byte mark and does
          # not care which launch or process emitted the line. The
          # `<h1>...</h1>` wrapper is part of the needle: it makes the marker
          # unambiguous against a bare substring.
          print("=== (b2)/(b2r) group lines by context (uri= attribution) ===")
          for m in ("b2-mac", "b2-win", "b2-reprobe", "b2r-mac", "b2r-win"):
              sel = [ln for _ts, _b, _i, ln in rows
                     if "CAMOU-FL group " in ln and f"<h1>{m}</h1>" in ln]
              print(f"  [{m}] {len(sel)} group line(s)")
              for ln in sel[-6:]:
                  print(f"    {ln}")
          print("  (a context with 0 group lines never built a font group under that "
                "marker -- its arm did not run, or the render never resolved a family)")

          # #83's memo lines, printed here for the same reason as the slice
          # above: the guard step may never reach arm (b2). fc-subst lines
          # carry ctx= but no uri=, so they cannot be attributed to a marker --
          # the ctx value on each line is what identifies the context.
          #
          # This section is INFORMATIONAL and is not a pass/fail criterion.
          # Once a context looks a family up twice it hits its own
          # `:<ctx>`-suffixed entry, so hits are what a correctly scoped memo
          # produces, and "none" is not what a working fix looks like. What
          # run 34428270062 showed BEFORE the fix was
          # `fc-subst ctx=7 key=0:geneva:<vis> hit=1` -- no ctx suffix on the
          # key, and no `CAMOU-FL gate` line beside it. The positive signal a
          # working fix leaves is gate lines REAPPEARING for the recipient,
          # which the merged dump below carries. The one reading here that
          # carries information is a key ending `:0` for a context that did
          # install a list: that is the context-0 fail-open this fix does not
          # close (CLAUDE.md lesson 5). Keys look like `0:segoe ui:3:7` -- a
          # family name with spaces -- so the key runs from `key=` to ` hit=`.
          # All SIX probe families, not a subset: MAC_ONLY + WIN_ONLY in the
          # guard step above, lowercased. The guard step derives its own copy
          # from PROBES; this step is a separate process and cannot, so if that
          # list ever changes, change this one with it.
          # MAC_ONLY's third slot is chosen at runtime by the guard step's
          # precheck (Optima, else Palatino, else Helvetica), so this separate
          # process cannot know which one won. Carry the SUPERSET -- every
          # family MAC_ONLY can hold -- rather than a stale literal. This is an
          # informational filter, so matching one name too many costs nothing.
          FC_PROBE_KEYS = ("helvetica neue", "pingfang hk",
                           "optima", "palatino", "helvetica",
                           "segoe ui", "calibri", "ms gothic")
          fc_hits = []
          for _ts, _b, _i, ln in rows:
              if "CAMOU-FL fc-subst " not in ln or " hit=1 " not in ln or "key=" not in ln:
                  continue
              if any(k in ln.split("key=", 1)[1].split(" hit=", 1)[0].lower()
                     for k in FC_PROBE_KEYS):
                  fc_hits.append(ln)
          print(f"=== fc-subst hit=1 on probe families, informational "
                f"({len(fc_hits)} line(s)) ===")
          for ln in fc_hits[-40:]:
              print(f"    {ln}")
          if not fc_hits:
              print("    none -- either every such lookup reached the gate, or this build "
                    "predates the fc-subst log line, in which case the fc-subst count "
                    "above is 0 as well: check it before reading anything into this")

          print("=== CAMOU-FL lines, merged time order ===")
          if len(rows) <= CAP:
              shown = rows
              elided = 0
          else:
              half = CAP // 2
              shown = rows[:half] + rows[-half:]
              elided = len(rows) - CAP
          for n, (ts, base, i, line) in enumerate(shown):
              if elided and n == CAP // 2:
                  print(f"  ... {elided} line(s) elided; camou-fl.txt has all of them ...")
              print(f"  {base}:{i} {line}")
          PY

      - name: "record_video under headless=virtual (#93/#458 regression guard)"
        timeout-minutes: 15
        run: |
          # ffmpeg is a separate playwright download; without it video recording
          # hangs rather than erroring. playwright==1.55.0 is the version this
          # suite's browser interop is known good on.
          pip install --quiet -e pythonlib 'playwright==1.55.0'
          python -m playwright install ffmpeg
          cd pythonlib
          python - <<'PY'
          import os, glob
          from camoufox.sync_api import Camoufox
          out = "/tmp/vid"; os.makedirs(out, exist_ok=True)
          with Camoufox(headless="virtual", executable_path=os.environ["CAMOUFOX_BIN"],
                        ff_version=152, i_know_what_im_doing=True) as b:
              p = b.new_page(record_video_dir=out, viewport={"width": 800, "height": 600})
              p.goto("data:text/html,<h1 style='font-size:200px'>hello world</h1>")
              p.wait_for_timeout(2000)
              p.close()
          vids = glob.glob(out + "/*.webm")
          assert vids, "no .webm produced under headless='virtual'"
          size = os.path.getsize(vids[0])
          print(f"video: {vids[0]} {size} bytes")
          # Composite off produced a 110-byte empty container; on, ~54KB. 10K
          # separates them by a wide margin without pinning an exact size.
          assert size > 10_000, (
              f"video is {size} bytes -- an empty container. Composite is most likely "
              "off; see the measurement table in pythonlib/camoufox/virtdisplay.py"
          )
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}
          # pkgman.get_path() resolves fonts/ and properties.json through
          # camoufox_path(), which fetches from the GitHub releases API when no
          # local install exists; unauthenticated that is rate-limited to 403.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Integration suite (all goapi tests vs real binary)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        # Runs the FULL suite against the real binary, not just TestRuntimeSpoofs:
        # the other ~24 browser tests (navigation, DOM, forms, keyboard, storage,
        # accessibility, ...) otherwise never execute against a real build —
        # goapi.yml runs without CAMOUFOX_BIN so they all t.Skip.
        run: |
          set -o pipefail  # tee must not mask a go-test failure exit code
          cd goapi
          CAMOUFOX_BIN="${{ steps.bin.outputs.bin }}" \
            xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            go test -timeout 15m -v ./... 2>&1 | tee "$GITHUB_WORKSPACE/spoof-test.log"

          # TestRuntimeSpoofs used to launch headless, so its two WebGL subtests
          # hit their "__NOGL__" guard and skipped while the suite still
          # reported PASS. They now run headful under the xvfb above; fail the
          # step if they go back to skipping, otherwise the regression is
          # invisible again.
          # A subtest that downgrades itself to a skip still lets the suite
          # report PASS, so the missing coverage is invisible. Both of these
          # skipped for months while their PASS line was quoted as evidence.
          for marker in "no WebGL in this headless env" "no voices returned" \
                        "decodingInfo did not resolve in time"; do
            if grep -q "$marker" "$GITHUB_WORKSPACE/spoof-test.log"; then
              echo "::error::subtest skipped ($marker) -- that spoof was not verified"
              exit 1
            fi
          done

      - name: Detector-site smoke (CreepJS / sannysoft / browserleaks)
        run: |
          set -o pipefail  # tee must not mask the run's exit code
          cd goapi
          # This step used to end in `|| true` with no pipefail, so it was green
          # even if the binary crashed or ./example/integration failed to
          # compile -- the workflow's only live check against real anti-bot
          # vendors could not fail for any reason.
          CAMOUFOX_BIN="${{ steps.bin.outputs.bin }}" \
            xvfb-run -a go run ./example/integration 2>&1 | tee "$GITHUB_WORKSPACE/smoke.log"

          # example/integration asserts nothing about the verdicts by design --
          # it logs each oracle and writes its JSON "for human review", skipping
          # any oracle whose goto/eval failed. So the file count is the one
          # machine-checkable signal here: zero files means the browser reached
          # no oracle at all, which is a broken run, not a bad score.
          written=$(ls integration-results/*.json 2>/dev/null | wc -l)
          echo "oracles captured: $written / 4"
          if [ "$written" -eq 0 ]; then
            echo "::error::detector smoke reached no oracle -- run is broken, not merely flagged"
            exit 1
          fi
          if [ "$written" -lt 4 ]; then
            echo "::warning::only $written/4 oracles captured; the rest failed goto/eval (see smoke.log)"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: |
            spoof-test.log
            smoke.log
            camou-fl.txt
            goapi/integration-results/
          if-no-files-found: warn
          retention-days: 14
