name: Smoke Fingerprint

# Runtime verification of the device-faking spoofs against a real Camoufox
# binary: pulls a linux build artifact, runs the deterministic per-field
# assertions (TestRuntimeSpoofs) and the live detector-site smoke
# (CreepJS / sannysoft / browserleaks), and uploads the results.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run id holding CamoufoxBuilds-linux-x86_64"
        required: true
        default: "28422261406"

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Headless Firefox runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            unzip xvfb libgtk-3-0 libdbus-glib-1-2 libx11-xcb1 \
            libxt6 libxcomposite1 libxdamage1 libxrandr2 libpci3 \
            libasound2t64 speech-dispatcher \
            || sudo apt-get install -y --no-install-recommends libasound2 speech-dispatcher

      - name: Download linux artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" \
            -n CamoufoxBuilds-linux-x86_64 -D dist
          echo "--- dist ---"; ls -la dist/

      - name: Unpack + locate firefox binary
        id: bin
        run: |
          cd dist
          zip=$(ls camoufox-*-lin.x86_64.zip 2>/dev/null | head -1)
          if [ -z "$zip" ]; then zip=$(ls *.zip | head -1); fi
          echo "package: $zip"
          mkdir -p cf && unzip -q "$zip" -d cf
          bin=$(find cf -maxdepth 3 -type f -name firefox | head -1)
          if [ -z "$bin" ]; then bin=$(find cf -maxdepth 3 -type f -name camoufox | head -1); fi
          if [ -z "$bin" ]; then echo "::error::no firefox/camoufox binary in package"; find cf -maxdepth 3 -type f | head -40; exit 1; fi
          chmod +x "$bin" || true
          abs="$GITHUB_WORKSPACE/dist/$bin"
          echo "bin=$abs" >> "$GITHUB_OUTPUT"
          echo "--- binary ---"; ls -la "$abs"; file "$abs" || true

      - name: "page.evaluate() is isolated from the page (#51/#62)"
        timeout-minutes: 10
        run: |
          # Upstream's own check for what its docstring calls Camoufox's core
          # automation-stealth property: page.evaluate() must run in a
          # Cu.Sandbox with its own compartment, so page globals are invisible
          # to automation and vice versa. It regressed once before (03c1230)
          # and no test noticed, because evaluate() keeps working either way --
          # it just stops being hidden.
          #
          # beta.28 shipped it broken, which is the whole of #51 and #62:
          # TestTouchscreenTouchEvents passed there only by reading a page
          # global that a correctly isolated evaluate() cannot see.
          pip install --quiet -e pythonlib 'playwright==1.55.0'
          python tests/patches/isolated-evaluate.py
        env:
          CAMOUFOX_EXECUTABLE_PATH: ${{ steps.bin.outputs.bin }}
          # pkgman resolves fonts/ and properties.json through the releases API,
          # which is rate-limited to 403 unauthenticated.
          GITHUB_TOKEN: ${{ github.token }}

      - name: "launch-config timezone applies (#60 regression guard)"
        timeout-minutes: 8
        run: |
          # #60: SetNewDocument applied a CAMOU_CONFIG timezone with
          # JS::SetRealmTimeZoneOverride, which the Playwright patch makes inert
          # (per-realm overrides are disabled in favour of the process-global
          # one). The value was read and persisted to prefs.js but never
          # applied, so Intl kept reporting the host zone.
          #
          # The second assertion is not decoration: the fix moves this path onto
          # a PROCESS-GLOBAL override, so a per-context timezone_id must still
          # win over it. Losing that would be #44 all over again in this layer.
          pip install --quiet 'playwright==1.55.0'
          python - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          READ = "() => Intl.DateTimeFormat().resolvedOptions().timeZone"
          ENV = {**os.environ, "CAMOU_CONFIG": json.dumps({"timezone": "Europe/London"})}

          def tz_of(page):
              page.goto("data:text/html,<h1>tz</h1>")
              return page.evaluate(READ)

          with sync_playwright() as pw:
              b = pw.firefox.launch(executable_path=os.environ["CAMOUFOX_BIN"],
                                    headless=True, env=ENV)
              got = tz_of(b.new_page())
              print(f"launch config Europe/London -> {got}")

              ctx = b.new_context(timezone_id="Europe/Paris")
              per_ctx = tz_of(ctx.new_page())
              print(f"context timezone_id Europe/Paris -> {per_ctx}")
              ctx.close(); b.close()

          assert got == "Europe/London", f"launch-config timezone not applied: {got}"
          assert per_ctx == "Europe/Paris", f"per-context timezone_id lost to the global override: {per_ctx}"
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}

      - name: "reused profile can be re-fingerprinted (#63 regression guard)"
        timeout-minutes: 8
        run: |
          # roverfox.s.* used to be written as USER prefs, so they were
          # serialised to prefs.js. A reused profile then inherited the
          # previous session's values and, worse, its *_disabled_* self-destruct
          # flags -- which hide the setters via the WebIDL Func guard, so the
          # init script's `typeof window.setX === "function"` check silently
          # skipped them forever. Measured before the fix: launch 2 asked for
          # Asia/Tokyo and got UTC.
          pip install --quiet 'playwright==1.55.0'
          python - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          PROFILE = "/tmp/reuse-guard"
          os.makedirs(PROFILE, exist_ok=True)

          def launch(pw, tz):
              env = {**os.environ, "CAMOU_CONFIG": json.dumps({"timezone": tz})}
              ctx = pw.firefox.launch_persistent_context(
                  PROFILE, executable_path=os.environ["CAMOUFOX_BIN"],
                  headless=True, env=env)
              ctx.add_init_script(
                  'if (typeof window.setTimezone === "function") window.setTimezone(%s);'
                  % json.dumps(tz))
              page = ctx.new_page()
              page.goto("data:text/html,<h1>p</h1>")
              got = page.evaluate("() => Intl.DateTimeFormat().resolvedOptions().timeZone")
              ctx.close()
              return got

          with sync_playwright() as pw:
              first = launch(pw, "Europe/London")
              second = launch(pw, "Asia/Tokyo")
          print(f"launch 1 Europe/London -> {first}")
          print(f"launch 2 Asia/Tokyo    -> {second}")

          leaked = [l.strip() for l in open(os.path.join(PROFILE, "prefs.js"))
                    if "roverfox.s." in l] if os.path.exists(os.path.join(PROFILE, "prefs.js")) else []
          print(f"roverfox.s.* persisted to prefs.js: {leaked or 'none'}")

          assert first == "Europe/London", f"launch 1 timezone not applied: {first}"
          assert second == "Asia/Tokyo", (
              f"launch 2 got {second} -- the profile kept launch 1's state and could "
              "not be re-fingerprinted")
          assert not leaked, f"roverfox.s.* still written to prefs.js: {leaked}"
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}

      - name: "spoofing setters are gone from window (#57 regression guard)"
        timeout-minutes: 8
        run: |
          # The setters self-destruct only when CALLED, so every field a config
          # leaves unset kept its setter on window -- all 14 in a context that
          # runs no init script, which is the first thing anyone writes:
          #   Camoufox(...) then browser.new_page().
          # A page needed one line to identify the browser. Juggler now tears
          # them down right after the init-script loop.
          #
          # Both arms matter: the default context is the serious half, and the
          # explicit-context arm proves teardown does not run so early that a
          # per-context value stops applying.
          pip install --quiet 'playwright==1.55.0'
          python - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          NAMES = ["setFontSpacingSeed","setAudioFingerprintSeed","setCanvasSeed","setTimezone",
                   "setScreenDimensions","setScreenColorDepth","setNavigatorPlatform",
                   "setNavigatorOscpu","setNavigatorHardwareConcurrency","setWebGLVendor",
                   "setWebGLRenderer","setFontList","setSpeechVoices","setWebRTCIPv4"]
          LEFT = "() => (%s).filter(n => typeof window[n] !== 'undefined')" % json.dumps(NAMES)
          PLATFORM = "() => navigator.platform"

          with sync_playwright() as pw:
              b = pw.firefox.launch(executable_path=os.environ["CAMOUFOX_BIN"],
                                    headless=True, env={**os.environ})

              page = b.new_page()
              page.goto("data:text/html,<h1>d</h1>")
              default_left = page.evaluate(LEFT)
              print(f"default context : {len(default_left)}/14 left -> {default_left}")
              page.close()

              ctx = b.new_context()
              ctx.add_init_script(
                  'if (typeof window.setNavigatorPlatform === "function") '
                  'window.setNavigatorPlatform("FakePlatform99");')
              p2 = ctx.new_page()
              p2.goto("data:text/html,<h1>c</h1>")
              ctx_left = p2.evaluate(LEFT)
              platform = p2.evaluate(PLATFORM)
              print(f"explicit context: {len(ctx_left)}/14 left -> {ctx_left}")
              print(f"                  navigator.platform = {platform}")
              ctx.close(); b.close()

          assert not default_left, (
              f"{len(default_left)} setters still on window in the default context: {default_left}")
          assert not ctx_left, (
              f"{len(ctx_left)} setters still on window after init scripts: {ctx_left}")
          assert platform == "FakePlatform99", (
              f"teardown ran too early -- the per-context value did not apply: {platform}")
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}

      - name: "per-context WebGL renderer beats the launch config (#44 regression guard)"
        timeout-minutes: 10
        run: |
          # A launch-level fingerprint carries webGl:parameters["37446"], the raw
          # pname for UNMASKED_RENDERER_WEBGL. GetParameter used to answer from
          # that generic table and return before reaching the branch that reads
          # this context's own value, so setWebGLRenderer() silently did nothing
          # and every context reported the launch OS's renderer.
          #
          # Three assertions, because the fix can regress in three directions:
          #   A  the per-context value wins over the launch config -- the bug;
          #   B  vendor behaves like renderer -- the two paths are line-for-line
          #      identical, so a typo dropping one disjunct would regress vendor
          #      while a renderer-only guard stayed green;
          #   C  with NO per-context value the launch config still applies. The
          #      table is skipped at the top of GetParameter, so it has to be
          #      honoured in the dedicated branch instead, or a config setting
          #      only webGl:parameters loses its spoof silently.
          #
          # For C the table and the shorthand carry DIFFERENT values, otherwise
          # the assertion cannot tell which source answered.
          #
          # Needs a real GL context: headless CI returns '(no webgl)' for every
          # read, which looks like a clean negative while never testing anything.
          pip install --quiet 'playwright==1.55.0'
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          READ = '''() => {
            const c = document.createElement('canvas');
            const gl = c.getContext('webgl');
            const dbg = gl && gl.getExtension('WEBGL_debug_renderer_info');
            if (!dbg) return {renderer: '(no webgl)', vendor: '(no webgl)'};
            return {renderer: gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL),
                    vendor:   gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)};
          }'''
          CFG = json.dumps({"webGl:renderer": "SHORTHAND-RENDERER",
                            "webGl:vendor": "SHORTHAND-VENDOR",
                            "webGl:parameters": {"37446": "TABLE-RENDERER",
                                                 "37445": "TABLE-VENDOR"}})

          def init_for(renderer, vendor):
              return (
                  'if (typeof window.setWebGLRenderer === "function") '
                  'window.setWebGLRenderer(%s);'
                  'if (typeof window.setWebGLVendor === "function") '
                  'window.setWebGLVendor(%s);'
                  % (json.dumps(renderer), json.dumps(vendor))
              )

          def read(browser, init=None):
              ctx = browser.new_context()
              if init:
                  ctx.add_init_script(init)
              page = ctx.new_page()
              page.goto("data:text/html,<h1>w</h1>")
              out = page.evaluate(READ)
              ctx.close()
              return out

          with sync_playwright() as pw:
              b = pw.firefox.launch(executable_path=os.environ["CAMOUFOX_BIN"],
                                    headless=False,
                                    firefox_user_prefs={"webgl.force-enabled": True},
                                    env={**os.environ, "CAMOU_CONFIG": CFG})

              per_ctx = []
              for r, v in (("CTX-RENDERER-1", "CTX-VENDOR-1"),
                           ("CTX-RENDERER-2", "CTX-VENDOR-2")):
                  got = read(b, init_for(r, v))
                  print(f"  per-context asked {r}/{v} -> {got['renderer']}/{got['vendor']}")
                  per_ctx.append((got["renderer"], got["vendor"]))

              plain = read(b)   # no init script: the launch config must still apply
              print(f"  no per-context value -> {plain['renderer']}/{plain['vendor']}")
              b.close()

          flat = [x for pair in per_ctx for x in pair] + [plain["renderer"], plain["vendor"]]
          assert "(no webgl)" not in flat, "no GL context -- the guard tested nothing"

          # A + B
          assert per_ctx == [("CTX-RENDERER-1", "CTX-VENDOR-1"),
                             ("CTX-RENDERER-2", "CTX-VENDOR-2")], (
              f"per-context renderer/vendor lost to the launch config: {per_ctx}")
          # C -- the table is the more specific source, so it wins the fallback
          assert (plain["renderer"], plain["vendor"]) == ("TABLE-RENDERER", "TABLE-VENDOR"), (
              "launch-level webGl:parameters no longer reaches the renderer/vendor "
              f"branch: got {plain['renderer']}/{plain['vendor']}")
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: "webGl:contextAttributes reach the page (premultipliedAlpha guard)"
        timeout-minutes: 10
        run: |
          # MBoolVal() passes a BARE field name to MaskConfig::GetAttribute,
          # which prepends the domain itself. premultipliedAlpha passed the
          # domain-qualified string instead, so the lookup became
          # data["webGl:contextAttributes"]["webGl:contextAttributes.premultipliedAlpha"]
          # -- a key that cannot exist. GetNested returns nullopt on a miss
          # with no warning, so MBoolVal fell back to the page's own real
          # value and the override was silently inert. Nothing tested this.
          #
          # antialias is asserted alongside it on purpose: it pins that the
          # mechanism works, so a failure here separates "this one key is
          # wrong" from "contextAttributes stopped applying entirely".
          pip install --quiet 'playwright==1.55.0'
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python - <<'PY2'
          import json, os
          from playwright.sync_api import sync_playwright

          # Both default to true, so false is a value the page cannot produce
          # on its own for this request.
          # antialias is spoofed the OTHER way on purpose. A driver may DECLINE
          # MSAA (reporting false when the page asked true), but it cannot
          # spuriously ENABLE it, so "page asked false, got true" can only come
          # from the spoof -- on any runner, whatever the GL stack does. Asking
          # true and spoofing false would have gone vacuous the day a runner
          # downgraded naturally. Measured on this CI (run 33289500088): with no
          # config at all, antialias comes back true, so the old direction was
          # load-bearing today but only by luck of the driver.
          CFG = json.dumps({"webGl:contextAttributes": {
              "premultipliedAlpha": False, "antialias": True}})
          READ = """() => {
            const c = document.createElement('canvas');
            const gl = c.getContext('webgl', {premultipliedAlpha: true, antialias: false});
            if (!gl) return '(no webgl)';
            const a = gl.getContextAttributes();
            return JSON.stringify({pma: a.premultipliedAlpha, aa: a.antialias});
          }"""

          with sync_playwright() as pw:
              b = pw.firefox.launch(executable_path=os.environ["CAMOUFOX_BIN"],
                                    headless=False,
                                    firefox_user_prefs={"webgl.force-enabled": True},
                                    env={**os.environ, "CAMOU_CONFIG": CFG})
              page = b.new_page()
              page.goto("data:text/html,<h1>ca</h1>")
              got = page.evaluate(READ)
              b.close()

          print(f"getContextAttributes -> {got}")
          assert got != "(no webgl)", "no GL context -- the guard tested nothing"
          a = json.loads(got)
          assert a["aa"] is True, (
              f"antialias override lost: {a} -- the page asked for antialias:false and a\n"
              "driver cannot turn MSAA on by itself, so true here can only come from the spoof")
          assert a["pma"] is False, (
              f"premultipliedAlpha override never reached the page: {a} "
              "(antialias did, so the key string is wrong, not the mechanism)")
          PY2
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: "per-context font list beats the launch whitelist (#44 regression guard)"
        timeout-minutes: 10
        run: |
          # #44 / H2: the per-context filter is the ONLY thing that narrows a
          # context's font set -- nothing is trimmed at launch time (that flip
          # is Task 8, not yet landed). Two launches probe both halves of that
          # claim:
          #
          #   config launch (`fonts` = this profile's own Windows subset, same
          #   as today) -- no context installs a list of its own, so every
          #   read path must fall back to `fonts`, never answer "allow
          #   everything":
          #     (a) the default page (never gets setFontList) resolves only
          #         the launch `fonts` subset, not macOS families too;
          #     (c) document.fonts agrees with canvas text measurement --
          #         different code paths (FontFaceImpl.h's IsFontAllowed via
          #         FontFaceSet::Check, versus
          #         gfxPlatformFontList::FindAndAddFamiliesLocked) -- so only
          #         both being right means the context is coherent;
          #     (d) a BARE FontFace agrees too: `new FontFace(f,
          #         'local(f)').status` read straight off the object, never
          #         added to document.fonts. (c) only covers read paths that
          #         go THROUGH a FontFaceSet entry point, which is where the
          #         AutoFontListContext lives; a bare FontFace has none above
          #         it, so FontFace::Status() ran with no context in scope.
          #
          #   bare launch (no `fonts` key at all) -- mFontFamilies then holds
          #   every bundled family (the Linux package bundles win+mac+linux
          #   together), nothing is deleted from font.system.whitelist, and
          #   setFontList() per context is the only thing narrowing the set.
          #   This is the exact steady state Task 8 makes the product path
          #   reach, which is what lets every gate in later tasks be measured
          #   before the flip:
          #     (b) a mac context resolves mac families and not windows ones,
          #         and a win context the other way round -- including an OS
          #         the launch config never had.
          #
          # Marker families are DERIVED as set(os) - set(other) - set(other).
          # 83 of the 815 bundled entries appear in two or more per-OS lists
          # (Tahoma is in BOTH win and mac), and an eyeballed marker silently
          # inverts the probe.
          #
          # (c) has to add the family to document.fonts first: on a *system*
          # family document.fonts.check() is vacuously true in FF152, because
          # FontFaceSetImpl::FindMatchingFontFaces only searches the user font
          # set and an unmatched family contributes no face to test -- measured,
          # check('12px "__NoSuchFamily__12345"') === true. Adding the family
          # routes the question through FontFaceSet::Check -> FontFace::Status()
          # -> IsFontAllowed, inside the AutoFontListContext scope.
          #
          # (d): FontFace::Status() and FontFace::Load() consult IsFontAllowed()
          # with no AutoFontListContext in scope unless the caller sets one, so
          # a bare FontFace the page never hands to a FontFaceSet has none above
          # it. Measured on run 33260827044, before the fix: a mac context
          # reported 'loaded' for Segoe UI and 'error' for Helvetica Neue while
          # canvas measurement in that same context said the opposite. Wrong-
          # but-consistent is one tell; two surfaces contradicting each other
          # hands a detector a boolean in two lines of JS.
          #
          # Fails loudly on no signal: a second impossible family must not
          # resolve, the canvas must measure a non-zero width, every context
          # must resolve something, and the mac/win contexts (bare launch)
          # must not agree.
          pip install --quiet 'playwright==1.55.0'
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          FONTS = json.load(open("pythonlib/camoufox/fonts.json"))
          MAC_STRICT = set(FONTS["mac"]) - set(FONTS["win"]) - set(FONTS["lin"])
          WIN_STRICT = set(FONTS["win"]) - set(FONTS["mac"]) - set(FONTS["lin"])
          MAC_ONLY = ["Helvetica Neue", "PingFang HK", "Geneva"]
          WIN_ONLY = ["Segoe UI", "Calibri", "MS Gothic"]
          PROBES = MAC_ONLY + WIN_ONLY
          assert MAC_STRICT.issuperset(MAC_ONLY), (
              "these are no longer mac-only in fonts.json, the probe would invert: "
              f"{sorted(set(MAC_ONLY) - MAC_STRICT)}")
          assert WIN_STRICT.issuperset(WIN_ONLY), (
              "these are no longer win-only in fonts.json, the probe would invert: "
              f"{sorted(set(WIN_ONLY) - WIN_STRICT)}")

          # Two DIFFERENT impossible families: both must fall back to the same
          # default face, so equal widths. If they ever differ, width comparison
          # has stopped meaning "did this family resolve".
          JS = """(families) => {
            const c = document.createElement('canvas').getContext('2d');
            const s = 'mmmmmmmmmmlliWWWWWWW@#$%^&*()_+';
            const w = (f) => { c.font = '72px "' + f + '", monospace'; return c.measureText(s).width; };
            const absentW = w('__CamouAbsentRef__0001');
            const measure = {}, fontfaces = {}, status = {};
            for (const f of families) measure[f] = (w(f) !== absentW);
            measure['__impossible__'] = (w('__NoSuchFamily__12345') !== absentW);
            // Bare FontFace objects, read BEFORE anything is handed to
            // document.fonts: no FontFaceSet entry point sits above this read,
            // so nothing but FontFace::Status() itself can scope the context.
            const bare = (f) => new FontFace(f, 'local("' + f + '")').status;
            for (const f of families) status[f] = bare(f);
            status['__impossible__'] = bare('__NoSuchFamily__12345');
            for (const f of families) {
              document.fonts.add(new FontFace(f, 'local("' + f + '")'));
              fontfaces[f] = document.fonts.check('12px "' + f + '"');
            }
            return {measure: measure, fontfaces: fontfaces, status: status,
                    absentWidth: absentW};
          }"""

          def probe(page):
              page.goto("data:text/html,<h1>f</h1>")
              return page.evaluate(JS, PROBES)

          def check_signal(label, r):
              assert r["absentWidth"] > 0, f"{label}: canvas measured 0 -- nothing ran"
              assert not r["measure"]["__impossible__"], (
                  f"{label}: an impossible family 'resolved' -- width comparison can no "
                  "longer tell a hit from a miss")
              assert any(r["measure"][f] for f in PROBES), (
                  f"{label}: not one bundled family resolved -- the guard measured nothing")

          # config launch -- `fonts` is this profile's own Windows subset, and
          # no context installs a per-context list. Covers arms (a), (c), (d).
          with sync_playwright() as pw:
              b = pw.firefox.launch(
                  executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                  env={**os.environ, "CAMOU_CONFIG": json.dumps({"fonts": FONTS["win"]})})
              default = probe(b.new_page())
              b.close()

          print(f"  [config launch / default] measure        {default['measure']}")
          print(f"  [config launch / default] document.fonts  {default['fontfaces']}")
          print(f"  [config launch / default] FontFace.status {default['status']}")
          check_signal("config launch / default", default)

          # (a) the default context answers from the launch `fonts` subset,
          # not from every bundled family (the Linux package bundles
          # win+mac+linux together).
          assert all(default["measure"][f] for f in WIN_ONLY), (
              "the default context lost the launch config's own Windows families: "
              f"{default['measure']}")
          assert not any(default["measure"][f] for f in MAC_ONLY), (
              "the default context resolved macOS families under a Windows launch -- a "
              f"read path answered 'allow everything' instead of `fonts`: {default['measure']}")

          # (c) document.fonts and text measurement are the same context
          for f in PROBES:
              assert bool(default["fontfaces"][f]) == default["measure"][f], (
                  f"document.fonts says {default['fontfaces'][f]} for {f!r} but text "
                  f"measurement says {default['measure'][f]} -- the two font read paths "
                  "disagree, so the context is not coherent")

          # (d) a bare FontFace answers for the same context as measurement.
          assert default["status"]["__impossible__"] == "error", (
              "config launch / default: a bare FontFace for an impossible family reports "
              f"{default['status']['__impossible__']!r} -- .status can no longer tell a hit "
              "from a miss, so this arm is measuring nothing")
          assert any(default["status"][f] == "loaded" for f in PROBES), (
              "config launch / default: not one bundled family is 'loaded' on a bare "
              "FontFace -- the .status arm measured nothing")
          for f in PROBES:
              assert (default["status"][f] == "loaded") == default["measure"][f], (
                  f"new FontFace({f!r}, 'local(...)').status is {default['status'][f]!r} but "
                  f"text measurement says {default['measure'][f]} -- FontFace::Status() is "
                  "answering for a different context than measurement")

          # bare launch -- no `fonts` key at all, so mFontFamilies holds every
          # bundled family and nothing is deleted from font.system.whitelist.
          # setFontList() per context is the only narrowing in play. Covers
          # arm (b).
          with sync_playwright() as pw:
              b = pw.firefox.launch(
                  executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                  env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
              ctxs = {}
              for name in ("mac", "win"):
                  ctx = b.new_context()
                  ctx.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS[name])))
                  ctxs[name] = probe(ctx.new_page())
                  ctx.close()
              b.close()
          mac, win = ctxs["mac"], ctxs["win"]

          for label, r in (("bare launch / mac context", mac), ("bare launch / win context", win)):
              print(f"  [{label}] measure        {r['measure']}")
              print(f"  [{label}] document.fonts  {r['fontfaces']}")
              print(f"  [{label}] FontFace.status {r['status']}")
              check_signal(label, r)

          assert mac["measure"] != win["measure"], (
              "the mac and win contexts measured identically -- no per-context signal")

          # (b) each context narrows to its own OS, including one the launch
          # never had
          assert all(mac["measure"][f] for f in MAC_ONLY), (
              "a mac context cannot resolve macOS families under a bare launch -- the "
              f"per-context filter regressed: {mac['measure']}")
          assert not any(mac["measure"][f] for f in WIN_ONLY), (
              f"the mac context still resolves Windows-only families: {mac['measure']}")
          assert all(win["measure"][f] for f in WIN_ONLY), f"win context: {win['measure']}"
          assert not any(win["measure"][f] for f in MAC_ONLY), (
              f"the win context resolves macOS-only families: {win['measure']}")
          # -----------------------------------------------------------
          # Step 0: the two gates Task 1 added inside gfxPlatformFontList
          # (GetFontList, GetFontFamilyList) have no arm reaching either.
          # Reachability, checked against the FIREFOX_152_0_4_RELEASE tag
          # (raw.githubusercontent.com/mozilla-firefox/firefox and
          # searchfox.org/mozilla-central, symbol layout unchanged for
          # this window):
          #
          #   GetFontList -- gfxPlatform::GetFontList() has exactly one
          #   caller, nsThebesFontEnumerator (gfx/src/
          #   nsThebesFontEnumerator.cpp:53,119), which implements
          #   nsIFontEnumerator. Every consumer of that interface --
          #   browser/components/preferences/config/accessibility.mjs,
          #   toolkit/content/preferences/Preference.mjs,
          #   toolkit/mozapps/preferences/fontbuilder.js -- is the
          #   chrome-privileged about:preferences font-picker UI.
          #   Instantiating nsIFontEnumerator needs Components.classes,
          #   which unprivileged page content never has. Chrome-only: no
          #   page-side probe can reach it. Unmeasured defence-in-depth;
          #   the gate stays, it is not verified by this guard.
          #
          #   GetFontFamilyList -- exactly one caller,
          #   gfx/thebes/gfxTextRun.cpp:2229, inside
          #   gfxFontGroup::GetDefaultFont()'s font-of-last-resort loop.
          #   GetDefaultFont() IS reached from ordinary content text
          #   shaping -- gfxFontGroup::GetFirstValidFont()'s own last
          #   resort (gfxTextRun.cpp:2326) and
          #   gfxFontGroup::FindFontForChar()'s fallback chain
          #   (gfxTextRun.cpp:3430) both call it -- so this one is not
          #   chrome-only the way GetFontList is. But its interesting
          #   branch -- "if CamouIsFontAllowed() filtered the list down
          #   to nothing, hand back the unfiltered one" -- only opens
          #   when a context's ENTIRE per-context family set is empty,
          #   one step before gfxTextRun.cpp's own next fallback
          #   (pfl->GetDefaultFontEntry(), a separate, non-per-context
          #   call) and two steps before a MOZ_CRASH
          #   ("unable to find a usable font"). Every context this guard
          #   builds installs a real, non-empty OS font list, so normal
          #   probes never approach that edge, and deliberately emptying
          #   a context's list to force it risks landing on the
          #   MOZ_CRASH side of that line inside a CI browser process
          #   rather than the unfiltered-fallback side. No arm is added
          #   for it here: both gates are unmeasured defence-in-depth,
          #   like GetFontList. Stated plainly: the last-resort branch
          #   deliberately returns every bundled OS's families, unfiltered,
          #   whenever filtering has emptied a context's set -- a hole by
          #   construction, not a bug Task 2 introduces or closes.
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Arms (e)-(h): the four read paths #44's H2 review found
          # ungated. Two design lessons from two earlier attempts, both
          # against this same run_id, before this shape:
          #
          #   1. One page per context, not one context serving four
          #      pages. Sharing ctx_mac across arms (e)-(h) let (e)'s
          #      @font-face rules for "Segoe UI"/"Helvetica Neue"
          #      shadow (g)'s later plain c.font lookups for those same
          #      names on the SAME document -- (g) measured the
          #      shadowed face, not the system family.
          #   2. Even with each arm on its OWN page, the per-context
          #      list still degraded by the 3rd page opened in a
          #      context that had ALREADY served earlier arms' pages:
          #      arm (g)'s own MAIN-THREAD measurement, on ITS page
          #      alone, came back identical for mac and win (every
          #      family "present" in both) -- the same allow-everything
          #      shape arm (b) shows only when a context's per-context
          #      list is entirely absent. Whatever `setFontList()`
          #      installs is not proven to survive a context serving
          #      more than one page. So every arm below gets a FRESH
          #      context of its own (one `setFontList()` call, one
          #      page, nothing else ever asked of that context) rather
          #      than sharing ctx_mac/ctx_win across arms. Arm (f) goes
          #      one step further and gives every measurement (mac,
          #      win, and the mac2 repeatability control) its own
          #      FRESH BROWSER LAUNCH, since a shared-context fix does
          #      not rule out a process-wide confound (e.g. progressive
          #      cmap-loading state shared by every context in one
          #      content process) -- and the first attempt at this
          #      repeatability control (contexts sharing one launch)
          #      still measured mac2 != mac on an identical list.
          # -----------------------------------------------------------
          JS_E = """async () => {
            // (e) CSS @font-face via a stylesheet rule, not a JS
            // FontFace object -- FontFaceSet::Check/::Add scope an
            // AutoFontListContext; InsertRuleFontFace (what a
            // stylesheet rule goes through during style flush) does
            // not. Both discriminating families are real markers -- an
            // invented name reports 'error' in every context and would
            // never disagree with anything. A third rule, "Tahoma", is
            // a positive control: it is in BOTH FONTS["mac"] and
            // FONTS["win"], so a genuinely working readback must never
            // report 'error' for it in either context -- unlike the
            // other two, its redness would mean the readback itself is
            // broken, not that the gate is missing, which is the wrong
            // kind of red for a tripwire whose job is to tell Task 3
            // what to fix.
            //
            // Discriminator for WHICH kind of broken, per code review:
            // Tahoma's rule is declared as a bare, unquoted CSS
            // identifier (valid -- it has no space) instead of a
            // quoted string, unlike Segoe UI/Helvetica Neue which MUST
            // be quoted (they contain a space). If FontFace.family
            // serializes it without quotes and its status comes back
            // correctly gated where the space-containing families do
            // not, that points hard at InsertRuleFontFace handing a
            // QUOTED family key to IsFontAllowed(). Separately, Calibri
            // (win-only, no spaces) is added via
            // document.fonts.add(new FontFace(...)) rather than a
            // stylesheet rule -- FontFaceSet::Add DOES get an
            // AutoFontListContext scope (Task 1's own patch), unlike
            // InsertRuleFontFace. If THAT path resolves Calibri
            // correctly per context, the per-context mechanism itself
            // works and whatever is wrong is specific to the CSS-rule
            // path's family key, not a missing scope in general.
            const sheet = document.createElement('style');
            sheet.textContent =
              '@font-face { font-family: "Segoe UI"; src: local("Segoe UI"); }' +
              '@font-face { font-family: "Helvetica Neue"; src: local("Helvetica Neue"); }' +
              '@font-face { font-family: Tahoma; src: local(Tahoma); }';
            document.head.appendChild(sheet);
            document.body.offsetHeight;
            await document.fonts.ready;
            const out = {};
            const rawFamilies = [];
            for (const f of document.fonts) {
              rawFamilies.push(f.family);
              // FontFace.family serializes as a CSS string, quotes
              // included -- strip them or every lookup below misses.
              const fam = f.family.replace(/^["\']|["\']$/g, '');
              out[fam] = f.status;
            }

            const jsFace = new FontFace('Calibri', 'local(Calibri)');
            document.fonts.add(jsFace);
            document.body.offsetHeight;
            await document.fonts.ready;

            return {status: out, rawFamilies: rawFamilies, jsFaceStatus: jsFace.status};
          }"""

          JS_F = """() => {
            // (f) codepoint fallback: neither context's non-CJK
            // families cover U+6F22, so this forces
            // SystemFindFontForChar / GlobalFontFallback, which
            // nothing gates. Own browser launch, own context, one
            // page -- see the design note above.
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "NoSuchFamilyAtAll"';
            return c.measureText('\u6f22').width;
          }"""

          # Positive control for arm (f), added after a review finding: JS_F's
          # width alone never proved U+6F22 can render as a real glyph at all
          # -- if it's tofu everywhere, no gate could ever make mac/win
          # diverge. Explicitly names each context's own CJK family (real,
          # allowed, per WIN_ONLY/MAC_ONLY -- WIN_ONLY needed "MS Gothic"
          # added for this control to even be attemptable, since it had no
          # CJK-covering entry before). If this width equals JS_F's
          # impossible-family fallback width, the probe measures tofu in
          # both cases and arm (f) cannot discriminate regardless of the
          # gate's correctness.
          JS_F_CONTROL_MAC = """() => {
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "PingFang HK"';
            return c.measureText('\u6f22').width;
          }"""

          JS_F_CONTROL_WIN = """() => {
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "MS Gothic"';
            return c.measureText('\u6f22').width;
          }"""

          # Diagnostic (not scored, no assert): does JS_F's own measurement
          # change if repeated after a delay on the SAME page? Source trace
          # (gfx/thebes/SharedFontList.h: IsFullyInitialized() requires a
          # computed character map; gfx/thebes/gfxPlatformFontList.cpp's
          # GlobalFontFallback shared-list loop skips any family that isn't
          # fully initialized and only fires an ASYNC StartCmapLoadingFromFamily
          # for it -- gfx.font_rendering.fallback.async defaults to true) says
          # a brand-new page's first-ever fallback call may race ahead of
          # cmap loading for every family except whatever few were already
          # touched during startup, and never reach a genuinely-present,
          # genuinely-allowed CJK family at all. If `delayed` differs from
          # `immediate` here, that race is the reason arm (f) cannot
          # discriminate on this harness, independent of gate correctness.
          JS_F_RACE = """async () => {
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "NoSuchFamilyAtAll"';
            const immediate = c.measureText('\u6f22').width;
            await new Promise(r => setTimeout(r, 3000));
            const delayed = c.measureText('\u6f22').width;
            return {immediate: immediate, delayed: delayed};
          }"""

          # Follow-up diagnostic: JS_F_RACE (this same run's earlier result,
          # mac only) confirmed the value changes over time on one page --
          # 30.533 immediate, 41.517 after 3s. But a fixed sleep is a
          # diagnostic, not something a guard can rely on for determinism,
          # and one context alone can't say whether the ASYMPTOTIC value
          # discriminates mac from win. This polls until the measurement
          # stops changing (3 consecutive identical reads, 250ms apart,
          # bounded at 10s -- loud failure via a null `stable` if it never
          # settles) and records that STABLE value for mac, win, and mac2,
          # plus reference widths for the same glyph in the three CSS
          # generics at the same size, to identify what's actually
          # rendering once fallback stops moving.
          JS_F_STABLE = """async () => {
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "NoSuchFamilyAtAll"';
            const samples = [];
            let prevWidth = null;
            let stableRun = 0;
            let polls = 0;
            const maxPolls = 40;
            while (polls < maxPolls) {
              const w = c.measureText('\u6f22').width;
              samples.push(w);
              if (prevWidth !== null && w === prevWidth) {
                stableRun++;
                if (stableRun >= 3) break;
              } else {
                stableRun = 0;
              }
              prevWidth = w;
              await new Promise(r => setTimeout(r, 250));
              polls++;
            }
            const stable = (stableRun >= 3) ? samples[samples.length - 1] : null;
            const refs = {};
            for (const fam of ['monospace', 'sans-serif', 'serif']) {
              c.font = '48px ' + fam;
              refs[fam] = c.measureText('\u6f22').width;
            }
            return {stable: stable, polls: polls, samples: samples, refs: refs};
          }"""

          # Final diagnostic on this arm (team-lead directive): JS_F_STABLE's
          # "3 consecutive identical reads" heuristic stopped at a TEMPORARY
          # plateau (polls=3, samples all 30.533, exited in under a second)
          # while JS_F_RACE's fixed 3s delay in the SAME run still showed
          # 41.517 -- the underlying process changes state on a multi-second
          # timescale, so short-run stability is not convergence. This
          # samples on a FIXED window (no early-stop logic at all) long
          # enough to clear that plateau -- 20 samples, 500ms apart, 10s
          # total -- and reports the raw series plus the final value, for
          # mac, win, and mac2, to answer directly: does the eventual value
          # discriminate context, or does everything converge to the same
          # number regardless of which context is asking?
          JS_F_FINAL = """async () => {
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "NoSuchFamilyAtAll"';
            const samples = [];
            for (let i = 0; i < 20; i++) {
              samples.push(c.measureText('漢').width);
              await new Promise(r => setTimeout(r, 500));
            }
            const refs = {};
            for (const fam of ['monospace', 'sans-serif', 'serif']) {
              c.font = '48px ' + fam;
              refs[fam] = c.measureText('漢').width;
            }
            return {final: samples[samples.length - 1], samples: samples, refs: refs};
          }"""

          JS_G = """async () => {
            // (g) worker / OffscreenCanvas: GetDocument() is null off
            // the main thread, so the context id falls to 0 there and
            // the per-context list is never consulted. Verdict
            // compares the worker against arm (b)'s trusted per-
            // context ground truth, not against this page's own main-
            // thread reading -- printed here for the record, but see
            // the design note above on why it cannot be trusted as a
            // baseline on its own.
            //
            // The worker is spawned and awaited FIRST, before this
            // page's main thread has touched any of these families at
            // all -- if Gecko memoizes a (family, context) resolution
            // anywhere below the per-call IsFontAllowed check, a
            // worker whose own context propagation were genuinely
            // broken could otherwise read a cache entry the main
            // thread's correctly-gated lookup had just warmed, and
            // produce this exact symmetric per-context-correct data
            // for the wrong reason. Doing gMain second removes that
            // path entirely: nothing on this page has resolved any of
            // these families before the worker answers.
            //
            // The worker reports its own identity alongside the widths
            // -- self.constructor.name and typeof document -- so a
            // silent fallback to a main-thread measurement (this
            // OffscreenCanvas is created INSIDE the worker, never
            // transferred in from the page) fails loudly instead of
            // scoring a vacuous green.
            const workerSrc = `onmessage = () => {
              const c = new OffscreenCanvas(8, 8).getContext('2d');
              const widths = {};
              for (const f of ['Segoe UI', 'Helvetica Neue', 'Tahoma']) {
                c.font = '48px "' + f + '", monospace';
                widths[f] = c.measureText('mmmmmmmmmmlli').width;
              }
              postMessage({widths: widths, ctor: self.constructor.name,
                          docType: typeof document});
            }`;
            const gWorker = await new Promise((resolve, reject) => {
              const w = new Worker(URL.createObjectURL(
                new Blob([workerSrc], {type: 'text/javascript'})));
              const timer = setTimeout(
                () => reject(new Error('worker never responded (10s)')), 10000);
              w.onmessage = (ev) => { clearTimeout(timer); resolve(ev.data); };
              w.onerror = (ev) => { clearTimeout(timer); reject(new Error('worker error: ' + ev.message)); };
              w.postMessage(null);
            });

            // Only now -- after the worker has already answered -- does
            // this page's main thread touch any of these families.
            const c = document.createElement('canvas').getContext('2d');
            const s48 = 'mmmmmmmmmmlli';
            const baseline48 = (() => {
              c.font = '48px monospace';
              return c.measureText(s48).width;
            })();
            const gMain = {};
            for (const f of ['Segoe UI', 'Helvetica Neue', 'Tahoma']) {
              c.font = '48px "' + f + '", monospace';
              gMain[f] = c.measureText(s48).width;
            }
            return {gMain: gMain, gWorker: gWorker.widths, gWorkerCtor: gWorker.ctor,
                    gWorkerDocType: gWorker.docType, baseline48: baseline48};
          }"""

          JS_H = """async () => {
            // (h) face-name lookup: only reached when a local()
            // @font-face src is actually USED to render text
            // (gfxUserFontSet::FindPlatformFont at font-matching time)
            // -- never via FontFace.load(), which font-hijacker.patch
            // answers purely from IsFontAllowed() without ever calling
            // mImpl->Load(). Full-name and PostScript-name forms,
            // printed regardless of verdict -- Task 6 designs the gate
            // from what these print.
            const sheet = document.createElement('style');
            sheet.textContent =
              '@font-face { font-family: "ProbeH_full"; src: local("Segoe UI"); }' +
              '@font-face { font-family: "ProbeH_ps"; src: local("SegoeUI"); }';
            document.head.appendChild(sheet);
            document.body.offsetHeight;
            await document.fonts.ready;
            const c = document.createElement('canvas').getContext('2d');
            const s48 = 'mmmmmmmmmmlli';
            c.font = '48px monospace';
            const baseline = c.measureText(s48).width;
            c.font = '48px "ProbeH_full", monospace';
            const hFull = c.measureText(s48).width;
            c.font = '48px "ProbeH_ps", monospace';
            const hPs = c.measureText(s48).width;
            return {hFull: hFull, hPs: hPs, baseline: baseline};
          }"""

          JS_WEBFONT = """async (fontDataUri) => {
            // Out-of-scope observation for #44 (measured, not fixed here --
            // see the Task 3 brief). font-hijacker.patch's SetStatus()
            // answers status purely from IsFontAllowed() for EVERY
            // @font-face, not just the OS-name surface Tasks 1-3 spoof. An
            // ordinary web font loaded by URL, whose family is in no OS
            // list at all, asks IsFontAllowed() a question it can only
            // answer 'no' to. A bare, unquoted, single-word invented
            // family name isolates this from the quoting bug Task 3 fixes:
            // IsFontAllowed() never has a chance to match it against any
            // list entry regardless of quoting.
            //
            // status alone cannot tell "reported failed" apart from
            // "genuinely failed" -- both look like 'error'. The
            // discriminating control is render evidence: does the glyph
            // width actually change from a plain-monospace fallback, which
            // only happens if the browser truly loaded and is using this
            // font's outlines.
            const FAMILY = 'CamouProbeWebFont';
            const sheet = document.createElement('style');
            sheet.textContent =
                '@font-face { font-family: ' + FAMILY + '; src: url("' + fontDataUri + '"); }';
            document.head.appendChild(sheet);
            document.body.offsetHeight;
            await document.fonts.ready;
            const face = [...document.fonts].find(
                f => f.family.replace(/^["\']|["\']$/g, '') === FAMILY);
            const c = document.createElement('canvas').getContext('2d');
            const s = 'mmmmmmmmmmlli';
            c.font = '72px monospace';
            const baseline = c.measureText(s).width;
            c.font = '72px "' + FAMILY + '", monospace';
            const probeWidth = c.measureText(s).width;
            return {
              status: face ? face.status : 'NO_FACE_FOUND',
              rendered: Math.abs(probeWidth - baseline) > 1,
              probeWidth: probeWidth,
              baseline: baseline,
            };
          }"""

          def one_page(fonts_key, js):
              # A brand-new launch, a brand-new context, exactly one
              # page: the strongest isolation available, since sharing
              # even just a context (never mind a whole launch) across
              # more than one page was already shown to degrade the
              # per-context list.
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx = b.new_context()
                  ctx.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS[fonts_key])))
                  page = ctx.new_page()
                  page.goto("data:text/html,<h1>f</h1>")
                  result = page.evaluate(js)
                  b.close()
                  return result

          e = {"mac": one_page("mac", JS_E), "win": one_page("win", JS_E)}
          f = {"mac": one_page("mac", JS_F), "win": one_page("win", JS_F),
               "mac2": one_page("mac", JS_F)}
          f_control = {"mac": one_page("mac", JS_F_CONTROL_MAC),
                       "win": one_page("win", JS_F_CONTROL_WIN)}
          f_race = one_page("mac", JS_F_RACE)
          f_stable = {"mac": one_page("mac", JS_F_STABLE),
                      "win": one_page("win", JS_F_STABLE),
                      "mac2": one_page("mac", JS_F_STABLE)}
          f_final = {"mac": one_page("mac", JS_F_FINAL),
                     "win": one_page("win", JS_F_FINAL),
                     "mac2": one_page("mac", JS_F_FINAL)}
          g = {"mac": one_page("mac", JS_G), "win": one_page("win", JS_G)}
          h = {"mac": one_page("mac", JS_H), "win": one_page("win", JS_H)}

          print(f"  [mac / arm e] document.fonts status {e['mac']['status']} raw families {e['mac']['rawFamilies']}")
          print(f"  [win / arm e] document.fonts status {e['win']['status']} raw families {e['win']['rawFamilies']}")
          print(f"  [mac / arm e] document.fonts.add(new FontFace('Calibri', ...)).status = {e['mac']['jsFaceStatus']!r}")
          print(f"  [win / arm e] document.fonts.add(new FontFace('Calibri', ...)).status = {e['win']['jsFaceStatus']!r}")
          print(f"  [mac / arm f] CJK fallback width      {f['mac']}")
          print(f"  [mac2 / arm f] CJK fallback width (dup mac list, own launch) {f['mac2']}")
          print(f"  [win / arm f] CJK fallback width      {f['win']}")
          print(f"  [mac / arm f] positive control -- named 'PingFang HK' width {f_control['mac']}")
          print(f"  [win / arm f] positive control -- named 'MS Gothic' width   {f_control['win']}")
          print(f"  [mac / arm f] async cmap-loading race diagnostic -- immediate={f_race['immediate']} delayed(3s)={f_race['delayed']}")
          for label in ("mac", "win", "mac2"):
              fs = f_stable[label]
              print(f"  [{label} / arm f] poll-to-stable -- stable={fs['stable']} polls={fs['polls']} "
                    f"samples={fs['samples']} refs={fs['refs']}")
          for label in ("mac", "win", "mac2"):
              ff = f_final[label]
              print(f"  [{label} / arm f] fixed-window (20x500ms=10s) -- final={ff['final']} "
                    f"samples={ff['samples']} refs={ff['refs']}")
          print(f"  [mac / arm g] main thread widths (this page only, not a trusted baseline) {g['mac']['gMain']}")
          print(f"  [mac / arm g] worker widths      {g['mac']['gWorker']} (baseline {g['mac']['baseline48']})")
          print(f"  [mac / arm g] worker identity    ctor={g['mac']['gWorkerCtor']!r} typeof document={g['mac']['gWorkerDocType']!r}")
          print(f"  [win / arm g] main thread widths (this page only, not a trusted baseline) {g['win']['gMain']}")
          print(f"  [win / arm g] worker widths      {g['win']['gWorker']} (baseline {g['win']['baseline48']})")
          print(f"  [win / arm g] worker identity    ctor={g['win']['gWorkerCtor']!r} typeof document={g['win']['gWorkerDocType']!r}")
          print(f"  [mac / arm h] local('Segoe UI')={h['mac']['hFull']} local('SegoeUI')={h['mac']['hPs']} baseline={h['mac']['baseline']}")
          print(f"  [win / arm h] local('Segoe UI')={h['win']['hFull']} local('SegoeUI')={h['win']['hPs']} baseline={h['win']['baseline']}")

          assert g["mac"]["baseline48"] > 0 and g["win"]["baseline48"] > 0, (
              "arm (g): monospace baseline measured 0 -- nothing ran")
          assert set(g["mac"]["gWorker"].keys()) == {"Segoe UI", "Helvetica Neue", "Tahoma"}, (
              f"arm (g): mac worker returned {g['mac']['gWorker']} -- did the Worker even run?")
          assert set(g["win"]["gWorker"].keys()) == {"Segoe UI", "Helvetica Neue", "Tahoma"}, (
              f"arm (g): win worker returned {g['win']['gWorker']} -- did the Worker even run?")
          # Prove the measurement genuinely ran off the main thread before
          # trusting anything about the widths: a fallback that silently
          # measured on the main thread and reported it as "the worker's"
          # answer would look exactly like a real, gated result.
          for label in ("mac", "win"):
              assert g[label]["gWorkerCtor"] == "DedicatedWorkerGlobalScope", (
                  f"arm (g): {label} worker reported self.constructor.name = "
                  f"{g[label]['gWorkerCtor']!r}, not 'DedicatedWorkerGlobalScope' -- "
                  "this did not run in a worker, the whole arm is unverified")
              assert g[label]["gWorkerDocType"] == "undefined", (
                  f"arm (g): {label} worker reported typeof document = "
                  f"{g[label]['gWorkerDocType']!r}, not 'undefined' -- "
                  "this ran somewhere with a document, the whole arm is unverified")
          assert f["mac"] > 0 and f["win"] > 0 and f["mac2"] > 0, (
              f"arm (f): CJK fallback measured 0 somewhere -- nothing rendered, no signal. "
              f"mac={f['mac']} mac2={f['mac2']} win={f['win']}")
          # Positive control: prove U+6F22 can render as a real, non-tofu
          # glyph at all before trusting anything about arm (f)'s fallback
          # measurement. If naming the context's own CJK family produces the
          # SAME width as JS_F's impossible-family fallback, the probe has
          # been measuring tofu in both cases and no gate could ever make
          # this arm discriminate -- that would be a probe-design defect,
          # not evidence about the gate.
          assert f_control["mac"] != f["mac"], (
              f"arm (f) positive control: naming 'PingFang HK' explicitly measured the "
              f"SAME width ({f_control['mac']}) as the impossible-family fallback "
              f"({f['mac']}) on mac -- U+6F22 never rendered as a real glyph here, so "
              f"this arm cannot prove anything about the gate")
          assert f_control["win"] != f["win"], (
              f"arm (f) positive control: naming 'MS Gothic' explicitly measured the "
              f"SAME width ({f_control['win']}) as the impossible-family fallback "
              f"({f['win']}) on win -- U+6F22 never rendered as a real glyph here, so "
              f"this arm cannot prove anything about the gate")

          # Well-formedness floor for arm (e): document.fonts has
          # exactly the 3 rules this page declared, non-empty, real
          # family strings. This is a pure "did anything even run" gate
          # -- kept as an early hard assert, unlike Tahoma's positive
          # control below, which is itself part of the evidence the
          # discriminator needs and must not be allowed to mask it.
          for label in ("mac", "win"):
              raw = sorted(f.strip('"').strip("'") for f in e[label]["rawFamilies"])
              assert raw == ["Helvetica Neue", "Segoe UI", "Tahoma"], (
                  f"arm (e): {label} document.fonts has {raw!r}, not exactly the 3 rules "
                  "this page declared -- the readback is malformed, not a gating question")

          # (e) CSS @font-face: expect NO disagreement between
          # document.fonts and the arm (b) measurement (mac/win dicts,
          # already validated above) for the same family in the same
          # context. Pre-gate, InsertRuleFontFace runs with no context
          # in scope, so IsFontAllowed() falls through to allow-all and
          # a family arm (b) says this context doesn't have still
          # reports 'loaded'. That disagreement is the red. Tahoma is
          # included here too, not as a separate early hard-assert like
          # (a)-(d)'s __impossible__ check -- it is in BOTH
          # FONTS["mac"] and FONTS["win"] (not from arm (b)'s
          # PROBES-based measurement, which never covers it), so its
          # ground truth is hardcoded True/"loaded" for both contexts.
          # Folding it into e_failures rather than a standalone assert
          # means a broken Tahoma reading still surfaces as evidence
          # instead of crashing before the discriminator below runs.
          e_ground = {
              "mac": {"Segoe UI": mac["measure"]["Segoe UI"],
                      "Helvetica Neue": mac["measure"]["Helvetica Neue"], "Tahoma": True},
              "win": {"Segoe UI": win["measure"]["Segoe UI"],
                      "Helvetica Neue": win["measure"]["Helvetica Neue"], "Tahoma": True},
          }
          e_failures = []
          for label, ground in e_ground.items():
              for fam, present in ground.items():
                  expect = "loaded" if present else "error"
                  got = e[label]["status"].get(fam)
                  if got != expect:
                      e_failures.append(
                          f"{label}/{fam}: document.fonts status is {got!r} but expected "
                          f"{expect!r} ({'arm (b) measurement' if fam != 'Tahoma' else 'Tahoma is in both FONTS[mac] and FONTS[win]'})")

          # Discriminator: does document.fonts.add(new FontFace(...)) --
          # the ALREADY-SCOPED path -- resolve "Calibri" (win-only)
          # correctly per context, and does the bare-identifier Tahoma
          # rule (no quotes needed in its source) resolve correctly,
          # where the space-containing (always-quoted) Segoe UI /
          # Helvetica Neue rules do not? The combination tells Task 3
          # which defect this tripwire is actually reporting.
          js_face_expect = {"mac": "error", "win": "loaded"}  # Calibri is win-only
          js_face_correct = all(
              e[label]["jsFaceStatus"] == js_face_expect[label] for label in ("mac", "win"))
          tahoma_bare_correct = all(
              e[label]["status"].get("Tahoma") == "loaded" for label in ("mac", "win"))
          print(f"  [arm e] document.fonts.add() path correct per context? {js_face_correct}")
          print(f"  [arm e] bare-identifier Tahoma rule correct per context? {tahoma_bare_correct}")
          if js_face_correct and tahoma_bare_correct:
              hypothesis = (
                  "SUPPORTS the quoting hypothesis: document.fonts.add() resolves Calibri "
                  "correctly per context AND the bare-identifier Tahoma rule also resolves "
                  "correctly, while the space-containing (always-quoted) Segoe UI/Helvetica "
                  "Neue rules do not -- InsertRuleFontFace is handing IsFontAllowed() a "
                  "QUOTED family key for names that need quoting in CSS, and that mismatch "
                  "-- not a missing context scope -- is the defect Task 3 should fix.")
          elif js_face_correct and not tahoma_bare_correct:
              hypothesis = (
                  "PARTIALLY supports the CSS-rule-key hypothesis: document.fonts.add() "
                  "resolves Calibri correctly (the per-context mechanism itself works), but "
                  "Tahoma still fails even as a bare, unquoted identifier -- so quoting "
                  "alone does not explain it; something else about InsertRuleFontFace's "
                  "family key is broken, still specific to the CSS-rule path, not a missing "
                  "context scope in general (which would predict allow-all/'loaded', not "
                  "uniform 'error').")
          else:
              hypothesis = (
                  "REFUTES the CSS-rule-specific hypothesis: document.fonts.add(), the "
                  "ALREADY-SCOPED path per Task 1's own patch, ALSO fails to resolve Calibri "
                  "correctly per context -- whatever is broken is not specific to "
                  "InsertRuleFontFace or CSS-rule parsing; the per-context mechanism itself "
                  "is unreliable somewhere broader, and Task 3 needs to look there first.")
          print(f"  [arm e] hypothesis: {hypothesis}")

          # (f) codepoint fallback: expect the mac and win contexts to
          # measure DIFFERENT widths in a correctly-gated world --
          # PingFang HK and MS Gothic cover U+6F22 with different
          # metrics. Ungated, fallback ignores context entirely and
          # both resolve the same font -- that sameness is the red.
          # Only trust mac-vs-win at all if mac-vs-mac2 (same list, own
          # launch) agrees -- otherwise the width isn't a deterministic
          # function of the list and this arm proves nothing either way.
          f_repeatable = (f["mac"] == f["mac2"])
          f_tripwire = f_repeatable and f["mac"] == f["win"]
          print(f"  [arm f] repeatable (mac == mac2, separate launches)? {f_repeatable}")

          # (g) worker/OffscreenCanvas: expect the worker's answer to
          # match arm (b)'s trusted per-context ground truth for every
          # family in a correctly-gated world -- NOT this page's own
          # main-thread reading, which cannot be trusted as a baseline
          # (see the design note above). GetDocument() is null off the
          # main thread, so the context id falls to 0 there and
          # sLaunchFonts is empty under this bare launch, so
          # CamouIsFontAllowed falls through to allow-all -- the worker
          # should see every family regardless of context. That
          # disagreement with arm (b) is the red. Tahoma is printed for
          # the record (both contexts should resolve it either way) but
          # skipped here -- arm (b)'s ground truth only covers
          # MAC_ONLY/WIN_ONLY, and Tahoma is neither, so it has no
          # ground-truth entry to compare against.
          g_failures = []
          for label, ground in (("mac", mac["measure"]), ("win", win["measure"])):
              for fam in ("Segoe UI", "Helvetica Neue"):
                  worker_present = g[label]["gWorker"][fam] != g[label]["baseline48"]
                  if worker_present != ground[fam]:
                      g_failures.append(
                          f"{label}/{fam}: worker {'resolved' if worker_present else 'did not resolve'} "
                          f"it, arm (b) says this context {'has' if ground[fam] else 'does not have'} it")

          tripwires = []
          if e_failures:
              tripwires.append(
                  f"(e) CSS @font-face -- doc.fonts vs arm (b) measurement disagree: "
                  f"{e_failures}. Discriminator result -- {hypothesis}")
          if f_tripwire:
              tripwires.append(
                  f"(f) codepoint fallback ignores context (repeatable): mac={f['mac']} "
                  f"mac2={f['mac2']} win={f['win']}")
          if g_failures:
              tripwires.append(f"(g) worker vs arm (b) per-context ground truth disagree: {g_failures}")

          print("=== arms (e)-(h) summary ===")
          print(f"  (e) CSS @font-face:         {'RED (expected)' if e_failures else 'GREEN'} -- {e_failures}")
          if not f_repeatable:
              print(f"  (f) codepoint fallback:     INCONCLUSIVE -- mac != mac2 on the same font "
                    f"list, separate launches ({f['mac']} vs {f['mac2']}); width is not a "
                    f"deterministic function of the list, mac-vs-win proves nothing. Needs a "
                    f"different measurement, not scored here.")
          else:
              print(f"  (f) codepoint fallback:     {'RED (expected)' if f_tripwire else 'GREEN (repeatable)'} -- mac={f['mac']} mac2={f['mac2']} win={f['win']}")
          print(f"  (g) worker/OffscreenCanvas: {'RED (expected)' if g_failures else 'GREEN'} -- {g_failures}")
          print("  (h) face-name lookup: measurement only, no verdict enforced here "
                "(Task 6 reads the gate from this data):")
          print(f"      mac: local('Segoe UI')={h['mac']['hFull']} local('SegoeUI')={h['mac']['hPs']} baseline={h['mac']['baseline']}")
          print(f"      win: local('Segoe UI')={h['win']['hFull']} local('SegoeUI')={h['win']['hPs']} baseline={h['win']['baseline']}")

          # Web-font measurement (out of scope for this task -- see the
          # comment on JS_WEBFONT above). A local .ttf on the runner
          # supplies real font bytes for a data: URI src -- the browser
          # only ever sees these as ordinary web-font bytes, not a host
          # font, so the host-font-deletion machinery is irrelevant here.
          import base64, glob

          def find_test_font():
              for c in (
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                  "/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf",
              ):
                  if os.path.exists(c):
                      return c
              hits = glob.glob("/usr/share/fonts/**/*.ttf", recursive=True)
              return hits[0] if hits else None

          webfont_path = find_test_font()
          if webfont_path is None:
              print("  [web-font] SKIP: no local .ttf found on the runner to embed")
          else:
              with open(webfont_path, "rb") as fh:
                  webfont_b64 = base64.b64encode(fh.read()).decode("ascii")
              webfont_uri = "data:font/ttf;base64," + webfont_b64

              def one_page_webfont(fonts_key, js, arg):
                  # Same shape as one_page() above, but page.evaluate() here
                  # needs an argument (the data: URI) -- kept as its own
                  # function rather than changing one_page()'s signature.
                  with sync_playwright() as pw:
                      b = pw.firefox.launch(
                          executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                          env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                      ctx = b.new_context()
                      ctx.add_init_script(
                          'if (typeof window.setFontList === "function") '
                          'window.setFontList(%s);' % json.dumps(",".join(FONTS[fonts_key])))
                      page = ctx.new_page()
                      page.goto("data:text/html,<h1>f</h1>")
                      result = page.evaluate(js, arg)
                      b.close()
                      return result

              webfont = one_page_webfont("mac", JS_WEBFONT, webfont_uri)
              print(f"  [web-font] font file used: {webfont_path} ({len(webfont_b64)} b64 chars)")
              print(f"  [web-font] document.fonts status = {webfont['status']!r}")
              print(f"  [web-font] rendered (probe width {webfont['probeWidth']} vs "
                    f"monospace baseline {webfont['baseline']})? {webfont['rendered']}")
              if webfont['status'] == 'error' and webfont['rendered']:
                  print("  [web-font] FINDING (out of scope, not fixed here): "
                        "document.fonts reports 'error' for an ordinary web font "
                        "that the canvas evidence shows the browser actually "
                        "rendered -- SetStatus() answers every @font-face from "
                        "IsFontAllowed(), not just the OS-name spoofing surface "
                        "#44 targets. A page can watch its own web font render "
                        "while document.fonts calls it failed. Recorded for "
                        "issue #44; intentionally not fixed by this task.")
              elif webfont['status'] == 'loaded' and not webfont['rendered']:
                  print("  [web-font] unexpected: status says 'loaded' but no "
                        "render evidence -- treat this measurement as unreliable, "
                        "not a clean answer either way.")
              else:
                  print("  [web-font] status and render evidence agree -- no "
                        "production-wide surface shown by this measurement.")

              if webfont['status'] == 'error' and not webfont['rendered']:
                  # Review pushback: status and render evidence agreeing
                  # does NOT mean "no problem" here -- it means the web font
                  # is consistently blocked rather than inconsistently
                  # reported, and "camoufox blocks web fonts" would itself
                  # be a far bigger tell than #44. But one sample through a
                  # data: URI on a data: page can fail for reasons that have
                  # nothing to do with font gating (CSP, origin rules, a
                  # malformed payload). Discriminator: does this same page
                  # render under a BARE launch/context instead -- no
                  # CAMOU_CONFIG "fonts" key, no setFontList() call at all,
                  # so IsFontAllowed()'s own second branch
                  # (FontFaceImpl.h) falls through to allow-everything?
                  def one_page_webfont_bare(js, arg):
                      # Deliberately NOT one_page_webfont() above: this one
                      # must skip the setFontList() call entirely, not just
                      # pass a different fonts_key -- there must be no
                      # per-context list AND no launch-level list installed.
                      with sync_playwright() as pw:
                          b = pw.firefox.launch(
                              executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                              env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                          ctx = b.new_context()
                          page = ctx.new_page()
                          page.goto("data:text/html,<h1>f</h1>")
                          result = page.evaluate(js, arg)
                          b.close()
                          return result

                  webfont_bare = one_page_webfont_bare(JS_WEBFONT, webfont_uri)
                  print(f"  [web-font/bare] document.fonts status = {webfont_bare['status']!r}")
                  print(f"  [web-font/bare] rendered (probe width {webfont_bare['probeWidth']} vs "
                        f"monospace baseline {webfont_bare['baseline']})? {webfont_bare['rendered']}")
                  if webfont_bare['rendered']:
                      print("  [web-font] DISCRIMINATOR: renders under the bare launch/context "
                            "(IsFontAllowed falls through to allow-everything) but NOT under the "
                            "per-context-list measurement above -- pins the non-render to font "
                            "gating specifically. This is a real defect, out of scope for #44 "
                            "and NOT fixed by this task -- it needs its own issue and its own plan.")
                  else:
                      print("  [web-font] DISCRIMINATOR: fails to render under the bare "
                            "launch/context too, where IsFontAllowed() allows everything -- the "
                            "non-render cannot be font gating. The probe's own setup is at fault "
                            "(most likely the data: URI font payload -- decode failure, MIME "
                            "type, or the raw .ttf needing a woff2 wrapper instead), not a gating "
                            "defect. The question stays open, not closed: next step would be "
                            "checking for a console font-decode error, or trying a woff2 payload.")

          assert not tripwires, (
              "arms (e)-(g) are still ungated on this binary (expected -- Tasks 3-5 "
              "each close one of these):\n" + "\n".join(tripwires))
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: "record_video under headless=virtual (#93/#458 regression guard)"
        timeout-minutes: 15
        run: |
          # ffmpeg is a separate playwright download; without it video recording
          # hangs rather than erroring. playwright==1.55.0 is the version this
          # suite's browser interop is known good on.
          pip install --quiet -e pythonlib 'playwright==1.55.0'
          python -m playwright install ffmpeg
          cd pythonlib
          python - <<'PY'
          import os, glob
          from camoufox.sync_api import Camoufox
          out = "/tmp/vid"; os.makedirs(out, exist_ok=True)
          with Camoufox(headless="virtual", executable_path=os.environ["CAMOUFOX_BIN"],
                        ff_version=152, i_know_what_im_doing=True) as b:
              p = b.new_page(record_video_dir=out, viewport={"width": 800, "height": 600})
              p.goto("data:text/html,<h1 style='font-size:200px'>hello world</h1>")
              p.wait_for_timeout(2000)
              p.close()
          vids = glob.glob(out + "/*.webm")
          assert vids, "no .webm produced under headless='virtual'"
          size = os.path.getsize(vids[0])
          print(f"video: {vids[0]} {size} bytes")
          # Composite off produced a 110-byte empty container; on, ~54KB. 10K
          # separates them by a wide margin without pinning an exact size.
          assert size > 10_000, (
              f"video is {size} bytes -- an empty container. Composite is most likely "
              "off; see the measurement table in pythonlib/camoufox/virtdisplay.py"
          )
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}
          # pkgman.get_path() resolves fonts/ and properties.json through
          # camoufox_path(), which fetches from the GitHub releases API when no
          # local install exists; unauthenticated that is rate-limited to 403.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Integration suite (all goapi tests vs real binary)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        # Runs the FULL suite against the real binary, not just TestRuntimeSpoofs:
        # the other ~24 browser tests (navigation, DOM, forms, keyboard, storage,
        # accessibility, ...) otherwise never execute against a real build —
        # goapi.yml runs without CAMOUFOX_BIN so they all t.Skip.
        run: |
          set -o pipefail  # tee must not mask a go-test failure exit code
          cd goapi
          CAMOUFOX_BIN="${{ steps.bin.outputs.bin }}" \
            xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            go test -timeout 15m -v ./... 2>&1 | tee "$GITHUB_WORKSPACE/spoof-test.log"

          # TestRuntimeSpoofs used to launch headless, so its two WebGL subtests
          # hit their "__NOGL__" guard and skipped while the suite still
          # reported PASS. They now run headful under the xvfb above; fail the
          # step if they go back to skipping, otherwise the regression is
          # invisible again.
          # A subtest that downgrades itself to a skip still lets the suite
          # report PASS, so the missing coverage is invisible. Both of these
          # skipped for months while their PASS line was quoted as evidence.
          for marker in "no WebGL in this headless env" "no voices returned" \
                        "decodingInfo did not resolve in time"; do
            if grep -q "$marker" "$GITHUB_WORKSPACE/spoof-test.log"; then
              echo "::error::subtest skipped ($marker) -- that spoof was not verified"
              exit 1
            fi
          done

      - name: Detector-site smoke (CreepJS / sannysoft / browserleaks)
        run: |
          set -o pipefail  # tee must not mask the run's exit code
          cd goapi
          # This step used to end in `|| true` with no pipefail, so it was green
          # even if the binary crashed or ./example/integration failed to
          # compile -- the workflow's only live check against real anti-bot
          # vendors could not fail for any reason.
          CAMOUFOX_BIN="${{ steps.bin.outputs.bin }}" \
            xvfb-run -a go run ./example/integration 2>&1 | tee "$GITHUB_WORKSPACE/smoke.log"

          # example/integration asserts nothing about the verdicts by design --
          # it logs each oracle and writes its JSON "for human review", skipping
          # any oracle whose goto/eval failed. So the file count is the one
          # machine-checkable signal here: zero files means the browser reached
          # no oracle at all, which is a broken run, not a bad score.
          written=$(ls integration-results/*.json 2>/dev/null | wc -l)
          echo "oracles captured: $written / 4"
          if [ "$written" -eq 0 ]; then
            echo "::error::detector smoke reached no oracle -- run is broken, not merely flagged"
            exit 1
          fi
          if [ "$written" -lt 4 ]; then
            echo "::warning::only $written/4 oracles captured; the rest failed goto/eval (see smoke.log)"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: |
            spoof-test.log
            smoke.log
            goapi/integration-results/
          if-no-files-found: warn
          retention-days: 14
