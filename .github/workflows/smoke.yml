name: Smoke Fingerprint

# Runtime verification of the device-faking spoofs against a real Camoufox
# binary: pulls a linux build artifact, runs the deterministic per-field
# assertions (TestRuntimeSpoofs) and the live detector-site smoke
# (CreepJS / sannysoft / browserleaks), and uploads the results.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run id holding CamoufoxBuilds-linux-x86_64"
        required: true
        default: "28422261406"

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Headless Firefox runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            unzip xvfb libgtk-3-0 libdbus-glib-1-2 libx11-xcb1 \
            libxt6 libxcomposite1 libxdamage1 libxrandr2 libpci3 \
            libasound2t64 speech-dispatcher \
            || sudo apt-get install -y --no-install-recommends libasound2 speech-dispatcher
          # #90 / arm (n5): speech-dispatcher ALONE registers exactly one voice,
          # named "Default" -- runs 34501017054, 34503994177, 34504036128,
          # 34506253452, 34508157395 and 34510848820 all read
          # `registry: ['Default']`. It is a server with no synthesiser module
          # attached. setSpeechVoices FILTERS the registry rather than adding to
          # it, so with one voice no per-context fixture can separate a leak
          # from a correct refusal and arm (n5) reports setup-invalid. A module
          # is what makes #90 measurable at all.
          #
          # PACKAGE NAMES ARE PRINTED, NOT ASSUMED. `apt-cache policy` runs for
          # each candidate before the install, so the log says what this runner
          # actually offers rather than what someone remembered; the install is
          # then tolerant, and `spd-say -L` plus `dpkg -l` record what landed.
          # If none of it works the arm still reports setup-invalid and says so.
          for _p in espeak-ng speech-dispatcher-espeak-ng speech-dispatcher-espeak; do
            echo "--- apt-cache policy $_p ---"
            apt-cache policy "$_p" 2>&1 | head -4 || true
          done
          sudo apt-get install -y espeak-ng speech-dispatcher-espeak-ng \
            || sudo apt-get install -y espeak-ng speech-dispatcher-espeak \
            || sudo apt-get install -y espeak-ng \
            || echo "!! no espeak module installed -- (n5) will stay unmeasurable"
          echo "--- dpkg: what actually landed ---"
          dpkg -l 2>/dev/null | grep -E 'speech-dispatcher|espeak' || true
          echo "--- spd-say -L (voices the daemon can offer) ---"
          timeout 30 spd-say -L 2>&1 | head -25 || true
          echo "--- speech-dispatcher modules configured ---"
          grep -hE '^\s*AddModule' /etc/speech-dispatcher/speechd.conf 2>/dev/null || true

      - name: Download linux artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" \
            -n CamoufoxBuilds-linux-x86_64 -D dist
          echo "--- dist ---"; ls -la dist/

      - name: Unpack + locate firefox binary
        id: bin
        run: |
          cd dist
          zip=$(ls camoufox-*-lin.x86_64.zip 2>/dev/null | head -1)
          if [ -z "$zip" ]; then zip=$(ls *.zip | head -1); fi
          echo "package: $zip"
          mkdir -p cf && unzip -q "$zip" -d cf
          bin=$(find cf -maxdepth 3 -type f -name firefox | head -1)
          if [ -z "$bin" ]; then bin=$(find cf -maxdepth 3 -type f -name camoufox | head -1); fi
          if [ -z "$bin" ]; then echo "::error::no firefox/camoufox binary in package"; find cf -maxdepth 3 -type f | head -40; exit 1; fi
          chmod +x "$bin" || true
          abs="$GITHUB_WORKSPACE/dist/$bin"
          echo "bin=$abs" >> "$GITHUB_OUTPUT"
          # Camoufox (#44 round 3): the fonts step now launches with
          # FONTCONFIG_FILE pointing at the bundle's own fonts.conf, the way
          # pythonlib/camoufox/utils.py:238 ships it, so the measurement is of
          # the font universe a shipped Camoufox has rather than of the
          # runner's host fontconfig. Export both paths from here rather than
          # deriving them in Python: the package layout is a property of
          # scripts/package.py, not of the guard.
          # The path is PINNED to the linux directory, never `-name fonts.conf
          # | head -1`. scripts/package.py copytrees the whole
          # bundle/fontconfig directory, so the artifact carries THREE
          # fonts.conf files and `head -1` would pick one by directory order:
          #   linux/   sans-serif=Arimo  serif=Tinos            monospace=Cousine
          #   macos/   sans-serif=Helvetica serif=Times         monospace=Menlo
          #   windows/ sans-serif=Arial  serif=Times New Roman  monospace=Consolas
          # All three contain the `<dir prefix="cwd">fonts</dir>` needle, so the
          # substitution guard below cannot catch a wrong pick. Picking the
          # macOS file would silently make three arms mean something else: (n1)
          # would resolve serif to Times, which does not cover U+1C80, so the
          # ungated pref path produces no leak and the arm reads GREEN for the
          # wrong reason; (n2)'s monospace would resolve to Menlo, which is IN
          # its fixture list, so #92 would look fixed with no A2 at all; and
          # (n4)'s donor would get Menlo into the ctx-0 memo, which is its own
          # SETUP-INVALID branch.
          fdir=$(find cf -maxdepth 4 -type d -name fonts | head -1)
          fconf=$(find cf -maxdepth 6 -type f -path '*/fontconfig/linux/fonts.conf' | head -1)
          if [ -z "$fconf" ]; then
            echo "::error::no fontconfig/linux/fonts.conf in the package"
            find cf -maxdepth 6 -type f -name fonts.conf; exit 1
          fi
          echo "fonts_dir=$GITHUB_WORKSPACE/dist/$fdir" >> "$GITHUB_OUTPUT"
          echo "fonts_conf=$GITHUB_WORKSPACE/dist/$fconf" >> "$GITHUB_OUTPUT"
          echo "--- fonts ---"; echo "dir=$fdir conf=$fconf"
          ls "$fdir" | head -5
          echo "--- binary ---"; ls -la "$abs"; file "$abs" || true

      - name: "page.evaluate() is isolated from the page (#51/#62)"
        timeout-minutes: 10
        run: |
          # Upstream's own check for what its docstring calls Camoufox's core
          # automation-stealth property: page.evaluate() must run in a
          # Cu.Sandbox with its own compartment, so page globals are invisible
          # to automation and vice versa. It regressed once before (03c1230)
          # and no test noticed, because evaluate() keeps working either way --
          # it just stops being hidden.
          #
          # beta.28 shipped it broken, which is the whole of #51 and #62:
          # TestTouchscreenTouchEvents passed there only by reading a page
          # global that a correctly isolated evaluate() cannot see.
          pip install --quiet -e pythonlib 'playwright==1.55.0'
          python tests/patches/isolated-evaluate.py
        env:
          CAMOUFOX_EXECUTABLE_PATH: ${{ steps.bin.outputs.bin }}
          # pkgman resolves fonts/ and properties.json through the releases API,
          # which is rate-limited to 403 unauthenticated.
          GITHUB_TOKEN: ${{ github.token }}

      - name: "launch-config timezone applies (#60 regression guard)"
        timeout-minutes: 8
        run: |
          # #60: SetNewDocument applied a CAMOU_CONFIG timezone with
          # JS::SetRealmTimeZoneOverride, which the Playwright patch makes inert
          # (per-realm overrides are disabled in favour of the process-global
          # one). The value was read and persisted to prefs.js but never
          # applied, so Intl kept reporting the host zone.
          #
          # The second assertion is not decoration: the fix moves this path onto
          # a PROCESS-GLOBAL override, so a per-context timezone_id must still
          # win over it. Losing that would be #44 all over again in this layer.
          pip install --quiet 'playwright==1.55.0'
          python - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          READ = "() => Intl.DateTimeFormat().resolvedOptions().timeZone"
          ENV = {**os.environ, "CAMOU_CONFIG": json.dumps({"timezone": "Europe/London"})}

          def tz_of(page):
              page.goto("data:text/html,<h1>tz</h1>")
              return page.evaluate(READ)

          with sync_playwright() as pw:
              b = pw.firefox.launch(executable_path=os.environ["CAMOUFOX_BIN"],
                                    headless=True, env=ENV)
              got = tz_of(b.new_page())
              print(f"launch config Europe/London -> {got}")

              ctx = b.new_context(timezone_id="Europe/Paris")
              per_ctx = tz_of(ctx.new_page())
              print(f"context timezone_id Europe/Paris -> {per_ctx}")
              ctx.close(); b.close()

          assert got == "Europe/London", f"launch-config timezone not applied: {got}"
          assert per_ctx == "Europe/Paris", f"per-context timezone_id lost to the global override: {per_ctx}"
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}

      - name: "reused profile can be re-fingerprinted (#63 regression guard)"
        timeout-minutes: 8
        run: |
          # roverfox.s.* used to be written as USER prefs, so they were
          # serialised to prefs.js. A reused profile then inherited the
          # previous session's values and, worse, its *_disabled_* self-destruct
          # flags -- which hide the setters via the WebIDL Func guard, so the
          # init script's `typeof window.setX === "function"` check silently
          # skipped them forever. Measured before the fix: launch 2 asked for
          # Asia/Tokyo and got UTC.
          pip install --quiet 'playwright==1.55.0'
          python - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          PROFILE = "/tmp/reuse-guard"
          os.makedirs(PROFILE, exist_ok=True)

          def launch(pw, tz):
              env = {**os.environ, "CAMOU_CONFIG": json.dumps({"timezone": tz})}
              ctx = pw.firefox.launch_persistent_context(
                  PROFILE, executable_path=os.environ["CAMOUFOX_BIN"],
                  headless=True, env=env)
              ctx.add_init_script(
                  'if (typeof window.setTimezone === "function") window.setTimezone(%s);'
                  % json.dumps(tz))
              page = ctx.new_page()
              page.goto("data:text/html,<h1>p</h1>")
              got = page.evaluate("() => Intl.DateTimeFormat().resolvedOptions().timeZone")
              ctx.close()
              return got

          with sync_playwright() as pw:
              first = launch(pw, "Europe/London")
              second = launch(pw, "Asia/Tokyo")
          print(f"launch 1 Europe/London -> {first}")
          print(f"launch 2 Asia/Tokyo    -> {second}")

          leaked = [l.strip() for l in open(os.path.join(PROFILE, "prefs.js"))
                    if "roverfox.s." in l] if os.path.exists(os.path.join(PROFILE, "prefs.js")) else []
          print(f"roverfox.s.* persisted to prefs.js: {leaked or 'none'}")

          assert first == "Europe/London", f"launch 1 timezone not applied: {first}"
          assert second == "Asia/Tokyo", (
              f"launch 2 got {second} -- the profile kept launch 1's state and could "
              "not be re-fingerprinted")
          assert not leaked, f"roverfox.s.* still written to prefs.js: {leaked}"
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}

      - name: "spoofing setters are gone from window (#57 regression guard)"
        timeout-minutes: 8
        run: |
          # The setters self-destruct only when CALLED, so every field a config
          # leaves unset kept its setter on window -- every one of them in a
          # context that runs no init script, which is the first thing anyone
          # writes:
          #   Camoufox(...) then browser.new_page().
          # A page needed one line to identify the browser. Juggler now tears
          # them down right after the init-script loop.
          #
          # Both arms matter: the default context is the serious half, and the
          # explicit-context arm proves teardown does not run so early that a
          # per-context value stops applying.
          #
          # NAMES is the closed list; the sweep is the open one, so a setter
          # added later is caught without anyone remembering to edit NAMES.
          pip install --quiet 'playwright==1.55.0'
          python - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          # Every Camoufox window.setXxx(); keep in step with dom/webidl/Window.webidl.
          NAMES = ["setFontSpacingSeed","setAudioFingerprintSeed","setCanvasSeed","setTimezone",
                   "setScreenDimensions","setScreenColorDepth","setNavigatorPlatform",
                   "setNavigatorOscpu","setNavigatorUserAgent",
                   "setNavigatorHardwareConcurrency","setWebGLVendor","setWebGLRenderer",
                   "setFontList","setSpeechVoices","setWebRTCIPv4","setWebRTCIPv6"]
          # Firefox's own set[A-Z] names on window. setScrollMarks and setCursor are
          # chrome-only, setResizable is a content-visible 4.x no-op; none is ours.
          NATIVE = ["setTimeout","setInterval","setResizable","setScrollMarks","setCursor"]

          # One evaluate per arm: the closed list, the open sweep, and a control.
          # The sweep walks window and its prototype chain -- a [Global] interface
          # hands its members out as own properties of the global, but sweeping the
          # chain too costs nothing and does not depend on that staying true.
          # natives is the control: page.evaluate runs in an isolated world in this
          # fork, and a sweep that could see nothing would report an empty stray
          # list forever. If setTimeout is not in it, the sweep proves nothing.
          PROBE = """() => {
            const named = %s.filter(n => typeof window[n] !== 'undefined');
            const native = new Set(%s);
            const seen = new Set();
            for (let o = window; o; o = Object.getPrototypeOf(o))
              for (const n of Object.getOwnPropertyNames(o)) seen.add(n);
            const all = [...seen].filter(n => /^set[A-Z]/.test(n));
            return {named: named, stray: all.filter(n => !native.has(n)),
                    natives: all.filter(n => native.has(n))};
          }""" % (json.dumps(NAMES), json.dumps(NATIVE))
          PLATFORM = "() => navigator.platform"

          def report(label, r):
              pad = " " * len(label)
              print(f"{label}: {len(r['named'])}/{len(NAMES)} left -> {r['named']}")
              print(f"{pad}  stray set[A-Z] -> {r['stray']}")
              print(f"{pad}  sweep can see  -> {r['natives']}")

          with sync_playwright() as pw:
              b = pw.firefox.launch(executable_path=os.environ["CAMOUFOX_BIN"],
                                    headless=True, env={**os.environ})

              page = b.new_page()
              page.goto("data:text/html,<h1>d</h1>")
              default_res = page.evaluate(PROBE)
              report("default context ", default_res)
              page.close()

              ctx = b.new_context()
              ctx.add_init_script(
                  'if (typeof window.setNavigatorPlatform === "function") '
                  'window.setNavigatorPlatform("FakePlatform99");')
              p2 = ctx.new_page()
              p2.goto("data:text/html,<h1>c</h1>")
              ctx_res = p2.evaluate(PROBE)
              platform = p2.evaluate(PLATFORM)
              report("explicit context", ctx_res)
              print(f"                  navigator.platform = {platform}")
              ctx.close(); b.close()

          for label, r in (("default", default_res), ("explicit", ctx_res)):
              assert "setTimeout" in r["natives"], (
                  f"the {label} context sweep is blind -- it cannot see setTimeout, "
                  "so an empty stray list proves nothing")
              assert not r["named"], (
                  f"{len(r['named'])} setters still on window in the {label} context: "
                  f"{r['named']}")
              assert not r["stray"], (
                  f"unlisted set[A-Z] names on window in the {label} context: {r['stray']}")
          assert platform == "FakePlatform99", (
              f"teardown ran too early -- the per-context value did not apply: {platform}")
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}

      - name: "per-context WebGL renderer beats the launch config (#44 regression guard)"
        timeout-minutes: 10
        run: |
          # A launch-level fingerprint carries webGl:parameters["37446"], the raw
          # pname for UNMASKED_RENDERER_WEBGL. GetParameter used to answer from
          # that generic table and return before reaching the branch that reads
          # this context's own value, so setWebGLRenderer() silently did nothing
          # and every context reported the launch OS's renderer.
          #
          # Three assertions, because the fix can regress in three directions:
          #   A  the per-context value wins over the launch config -- the bug;
          #   B  vendor behaves like renderer -- the two paths are line-for-line
          #      identical, so a typo dropping one disjunct would regress vendor
          #      while a renderer-only guard stayed green;
          #   C  with NO per-context value the launch config still applies. The
          #      table is skipped at the top of GetParameter, so it has to be
          #      honoured in the dedicated branch instead, or a config setting
          #      only webGl:parameters loses its spoof silently.
          #
          # For C the table and the shorthand carry DIFFERENT values, otherwise
          # the assertion cannot tell which source answered.
          #
          # Needs a real GL context: headless CI returns '(no webgl)' for every
          # read, which looks like a clean negative while never testing anything.
          pip install --quiet 'playwright==1.55.0'
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          READ = '''() => {
            const c = document.createElement('canvas');
            const gl = c.getContext('webgl');
            const dbg = gl && gl.getExtension('WEBGL_debug_renderer_info');
            if (!dbg) return {renderer: '(no webgl)', vendor: '(no webgl)'};
            return {renderer: gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL),
                    vendor:   gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)};
          }'''
          CFG = json.dumps({"webGl:renderer": "SHORTHAND-RENDERER",
                            "webGl:vendor": "SHORTHAND-VENDOR",
                            "webGl:parameters": {"37446": "TABLE-RENDERER",
                                                 "37445": "TABLE-VENDOR"}})

          def init_for(renderer, vendor):
              return (
                  'if (typeof window.setWebGLRenderer === "function") '
                  'window.setWebGLRenderer(%s);'
                  'if (typeof window.setWebGLVendor === "function") '
                  'window.setWebGLVendor(%s);'
                  % (json.dumps(renderer), json.dumps(vendor))
              )

          def read(browser, init=None):
              ctx = browser.new_context()
              if init:
                  ctx.add_init_script(init)
              page = ctx.new_page()
              page.goto("data:text/html,<h1>w</h1>")
              out = page.evaluate(READ)
              ctx.close()
              return out

          with sync_playwright() as pw:
              b = pw.firefox.launch(executable_path=os.environ["CAMOUFOX_BIN"],
                                    headless=False,
                                    firefox_user_prefs={"webgl.force-enabled": True},
                                    env={**os.environ, "CAMOU_CONFIG": CFG})

              per_ctx = []
              for r, v in (("CTX-RENDERER-1", "CTX-VENDOR-1"),
                           ("CTX-RENDERER-2", "CTX-VENDOR-2")):
                  got = read(b, init_for(r, v))
                  print(f"  per-context asked {r}/{v} -> {got['renderer']}/{got['vendor']}")
                  per_ctx.append((got["renderer"], got["vendor"]))

              plain = read(b)   # no init script: the launch config must still apply
              print(f"  no per-context value -> {plain['renderer']}/{plain['vendor']}")
              b.close()

          flat = [x for pair in per_ctx for x in pair] + [plain["renderer"], plain["vendor"]]
          assert "(no webgl)" not in flat, "no GL context -- the guard tested nothing"

          # A + B
          assert per_ctx == [("CTX-RENDERER-1", "CTX-VENDOR-1"),
                             ("CTX-RENDERER-2", "CTX-VENDOR-2")], (
              f"per-context renderer/vendor lost to the launch config: {per_ctx}")
          # C -- the table is the more specific source, so it wins the fallback
          assert (plain["renderer"], plain["vendor"]) == ("TABLE-RENDERER", "TABLE-VENDOR"), (
              "launch-level webGl:parameters no longer reaches the renderer/vendor "
              f"branch: got {plain['renderer']}/{plain['vendor']}")
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: "webGl:contextAttributes reach the page (premultipliedAlpha guard)"
        timeout-minutes: 10
        run: |
          # MBoolVal() passes a BARE field name to MaskConfig::GetAttribute,
          # which prepends the domain itself. premultipliedAlpha passed the
          # domain-qualified string instead, so the lookup became
          # data["webGl:contextAttributes"]["webGl:contextAttributes.premultipliedAlpha"]
          # -- a key that cannot exist. GetNested returns nullopt on a miss
          # with no warning, so MBoolVal fell back to the page's own real
          # value and the override was silently inert. Nothing tested this.
          #
          # antialias is asserted alongside it on purpose: it pins that the
          # mechanism works, so a failure here separates "this one key is
          # wrong" from "contextAttributes stopped applying entirely".
          pip install --quiet 'playwright==1.55.0'
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python - <<'PY2'
          import json, os
          from playwright.sync_api import sync_playwright

          # Both default to true, so false is a value the page cannot produce
          # on its own for this request.
          # antialias is spoofed the OTHER way on purpose. A driver may DECLINE
          # MSAA (reporting false when the page asked true), but it cannot
          # spuriously ENABLE it, so "page asked false, got true" can only come
          # from the spoof -- on any runner, whatever the GL stack does. Asking
          # true and spoofing false would have gone vacuous the day a runner
          # downgraded naturally. Measured on this CI (run 33289500088): with no
          # config at all, antialias comes back true, so the old direction was
          # load-bearing today but only by luck of the driver.
          CFG = json.dumps({"webGl:contextAttributes": {
              "premultipliedAlpha": False, "antialias": True}})
          READ = """() => {
            const c = document.createElement('canvas');
            const gl = c.getContext('webgl', {premultipliedAlpha: true, antialias: false});
            if (!gl) return '(no webgl)';
            const a = gl.getContextAttributes();
            return JSON.stringify({pma: a.premultipliedAlpha, aa: a.antialias});
          }"""

          with sync_playwright() as pw:
              b = pw.firefox.launch(executable_path=os.environ["CAMOUFOX_BIN"],
                                    headless=False,
                                    firefox_user_prefs={"webgl.force-enabled": True},
                                    env={**os.environ, "CAMOU_CONFIG": CFG})
              page = b.new_page()
              page.goto("data:text/html,<h1>ca</h1>")
              got = page.evaluate(READ)
              b.close()

          print(f"getContextAttributes -> {got}")
          assert got != "(no webgl)", "no GL context -- the guard tested nothing"
          a = json.loads(got)
          assert a["aa"] is True, (
              f"antialias override lost: {a} -- the page asked for antialias:false and a\n"
              "driver cannot turn MSAA on by itself, so true here can only come from the spoof")
          assert a["pma"] is False, (
              f"premultipliedAlpha override never reached the page: {a} "
              "(antialias did, so the key string is wrong, not the mechanism)")
          PY2
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: "which setter bindings reached the build (#83 diagnostic)"
        run: |
          # setFontList is the only one of Camoufox's 14 setters missing from
          # window when an init script runs; setWebGLRenderer uses a Func gate
          # identical line for line, including the RoverfoxStorageManager call,
          # and is present. So the gate logic is not the difference -- check
          # whether the WebIDL binding reached the build at all.
          # Its own step because the #44 guard step is already at GitHub's
          # 21000-character limit for a run block.
          BIN_DIR="$(dirname "${{ steps.bin.outputs.bin }}")"
          for n in setFontList setWebGLRenderer setNavigatorPlatform setSpeechVoices; do
            printf '  %-24s %s\n' "$n" "$(grep -ac "$n" "$BIN_DIR"/libxul.so 2>/dev/null || echo 0)"
          done

      - name: "is setFontList absent in the default context too (#83 diagnostic)"
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}
        run: |
          # setFontList's WebIDL binding IS in libxul (2 hits, same as three
          # setters that work), and its Func gate is identical line for line to
          # setWebGLRenderer's. Every test so far used b.new_context(), where
          # mUserContextId != 0. Split that variable: does the property appear
          # in the DEFAULT context, where the id is 0?
          pip install --quiet 'playwright==1.55.0'
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python - <<'PY2'
          import json, os
          from playwright.sync_api import sync_playwright
          NAMES = ["setFontList", "setWebGLRenderer", "setNavigatorPlatform", "setSpeechVoices"]
          INIT = ('(() => { const o = %s.filter(n => typeof window[n] === "function"); '
                  'const m = () => { try { document.documentElement.setAttribute("data-s", '
                  'JSON.stringify(o)); } catch (e) {} }; m(); '
                  'document.addEventListener("DOMContentLoaded", m); })()' % json.dumps(NAMES))
          READ = '() => document.documentElement.getAttribute("data-s")'
          # setFontList IS present in both contexts here, but absent in the
          # #44 guard step. The remaining difference between the two setups is
          # firefox_user_prefs={"dom.ipc.processCount": 1}, which this plan
          # added to those arms during the #83 work. Single-variable test.
          def probe_setters(prefs, label):
              with sync_playwright() as pw:
                  kw = {"executable_path": os.environ["CAMOUFOX_BIN"],
                        "headless": False,
                        "env": {**os.environ, "CAMOU_CONFIG": json.dumps({})}}
                  if prefs:
                      kw["firefox_user_prefs"] = prefs
                  b = pw.firefox.launch(**kw)
                  pg = b.new_page()
                  pg.add_init_script(INIT)
                  pg.goto("data:text/html,<h1>d</h1>")
                  d = pg.evaluate(READ)
                  ctx = b.new_context()
                  ctx.add_init_script(INIT)
                  p2 = ctx.new_page()
                  p2.goto("data:text/html,<h1>c</h1>")
                  e = p2.evaluate(READ)
                  b.close()
              print(f"  [{label}] default id 0 : {d}")
              print(f"  [{label}] explicit ctx : {e}")

          probe_setters(None, "no processCount pref")
          probe_setters({"dom.ipc.processCount": 1}, "processCount=1")

          # Neither pref nor context id explains it. Two differences remain
          # between this step and the #44 guard step, where setFontList is
          # absent: the guard runs a config launch first in the same Python
          # process, and its init script carries a 574-family list. Test both.
          import pathlib as _pl
          FONTS = json.load(open("pythonlib/camoufox/fonts.json"))
          BIG = ('(() => { const o = %s.filter(n => typeof window[n] === "function"); '
                 'try { window.setFontList(%s); } catch (e) {} '
                 'const m = () => { try { document.documentElement.setAttribute("data-s", '
                 'JSON.stringify(o)); } catch (e) {} }; m(); '
                 'document.addEventListener("DOMContentLoaded", m); })()')
          with sync_playwright() as pw:
              kw = {"executable_path": os.environ["CAMOUFOX_BIN"], "headless": False,
                    "env": {**os.environ, "CAMOU_CONFIG": json.dumps({"fonts": FONTS["win"]})}}
              b1 = pw.firefox.launch(**kw)
              b1.new_page().goto("data:text/html,<h1>1</h1>")
              b1.close()
              kw["env"] = {**os.environ, "CAMOU_CONFIG": json.dumps({})}
              b2 = pw.firefox.launch(**kw)
              c2 = b2.new_context()
              c2.add_init_script(BIG % (json.dumps(NAMES), json.dumps(",".join(FONTS["mac"]))))
              q = c2.new_page()
              q.goto("data:text/html,<h1>2</h1>")
              print(f"  [2nd launch, 574-family init] present: {q.evaluate(READ)}")
              # The script above CALLS setFontList, and the setter is one-shot
              # per user context by design. Playwright runs an init script on
              # EVERY navigation, and new_page() lands on about:blank first --
              # so invocation 1 consumes the setter and invocation 2, after
              # goto(), finds it gone. Read the FIRST invocation, from
              # about:blank, before navigating anywhere.
              c3 = b2.new_context()
              c3.add_init_script(BIG % (json.dumps(NAMES), json.dumps(",".join(FONTS["mac"]))))
              r = c3.new_page()
              print(f"  [1st invocation, about:blank] present: {r.evaluate(READ)}")
              b2.close()
          PY2

      - name: "Geneva bundled in the artifact? (#44 Task 6 diagnostic)"
        run: |
          # arm (b) below: mac context stopped resolving Geneva (MAC_ONLY)
          # between builds 34021403701 and 34034555160 -- document.fonts and
          # FontFace.status say it's allowed, canvas measurement says no
          # glyph rendered. This distinguishes "not in this artifact" from
          # "present but the resolution path stops it reaching canvas" --
          # its own step because the #44 guard step is already at GitHub's
          # 21000-character limit for a run block, and this needs
          # steps.bin.outputs.bin.
          BIN_DIR="$(dirname "${{ steps.bin.outputs.bin }}")"
          echo "--- searching for Geneva* under $BIN_DIR ---"
          find "$BIN_DIR" -iname 'Geneva*' -exec ls -la {} \; || true
          echo "--- fonts/macos dir, if present ---"
          find "$BIN_DIR" -type d -iname macos -exec find {} -maxdepth 1 -type f \; 2>/dev/null | head -20 || true
          echo "--- fontconfig cache mentions of Geneva (may be empty pre-first-run) ---"
          find / -xdev -iname '*fontconfig*' -type d 2>/dev/null | head -5 || true

      - name: "per-context font list beats the launch whitelist (#44 regression guard)"
        # 10 -> 20. Run 34501017054 died here: the six Task 2 arms add seven
        # browser launches to the ~20 this step already makes, and run
        # 34496121342 needed 4m53s for the old set. It reached arm (n5) and was
        # killed with only (n7) left. The bound still exists -- it is there to
        # kill a hung browser, not to cap the work -- it is just no longer set
        # below what the step does.
        timeout-minutes: 20
        run: |

          # #44 / H2: the per-context filter is the ONLY thing that narrows a
          # context's font set -- nothing is trimmed at launch time (that flip
          # is Task 8, not yet landed). Two launches probe both halves of that
          # claim:
          #
          #   config launch (`fonts` = this profile's own Windows subset, same
          #   as today) -- no context installs a list of its own, so every
          #   read path must fall back to `fonts`, never answer "allow
          #   everything":
          #     (a) the default page (never gets setFontList) resolves only
          #         the launch `fonts` subset, not macOS families too;
          #     (c) document.fonts agrees with canvas text measurement --
          #         different code paths (FontFaceImpl.h's IsFontAllowed via
          #         FontFaceSet::Check, versus
          #         gfxPlatformFontList::FindAndAddFamiliesLocked) -- so only
          #         both being right means the context is coherent;
          #     (d) a BARE FontFace agrees too: `new FontFace(f,
          #         'local(f)').status` read straight off the object, never
          #         added to document.fonts. (c) only covers read paths that
          #         go THROUGH a FontFaceSet entry point, which is where the
          #         AutoFontListContext lives; a bare FontFace has none above
          #         it, so FontFace::Status() ran with no context in scope.
          #
          #   bare launch (no `fonts` key at all) -- mFontFamilies then holds
          #   every bundled family (the Linux package bundles win+mac+linux
          #   together), nothing is deleted from font.system.whitelist, and
          #   setFontList() per context is the only thing narrowing the set.
          #   This is the exact steady state Task 8 makes the product path
          #   reach, which is what lets every gate in later tasks be measured
          #   before the flip:
          #     (b) a mac context resolves mac families and not windows ones,
          #         and a win context the other way round -- including an OS
          #         the launch config never had.
          #
          # Marker families are DERIVED as set(os) - set(other) - set(other).
          # 83 of the 815 bundled entries appear in two or more per-OS lists
          # (Tahoma is in BOTH win and mac), and an eyeballed marker silently
          # inverts the probe.
          #
          # (c) has to add the family to document.fonts first: on a *system*
          # family document.fonts.check() is vacuously true in FF152, because
          # FontFaceSetImpl::FindMatchingFontFaces only searches the user font
          # set and an unmatched family contributes no face to test -- measured,
          # check('12px "__NoSuchFamily__12345"') === true. Adding the family
          # routes the question through FontFaceSet::Check -> FontFace::Status()
          # -> IsFontAllowed, inside the AutoFontListContext scope.
          #
          # (d): FontFace::Status() and FontFace::Load() consult IsFontAllowed()
          # with no AutoFontListContext in scope unless the caller sets one, so
          # a bare FontFace the page never hands to a FontFaceSet has none above
          # it. Measured on run 33260827044, before the fix: a mac context
          # reported 'loaded' for Segoe UI and 'error' for Helvetica Neue while
          # canvas measurement in that same context said the opposite. Wrong-
          # but-consistent is one tell; two surfaces contradicting each other
          # hands a detector a boolean in two lines of JS.
          #
          # Fails loudly on no signal: a second impossible family must not
          # resolve, the canvas must measure a non-zero width, every context
          # must resolve something, and the mac/win contexts (bare launch)
          # must not agree.
          pip install --quiet 'playwright==1.55.0' fonttools
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python - <<'PY'
          import glob, json, os
          from playwright.sync_api import sync_playwright

          # ---- #83/#88 diagnostic capture (Phase D) -------------------------
          # Task 5 put nine CAMOU-FL lines behind MOZ_LOG's "fontlist" module;
          # this turns them on. EVERY launch in this step already passes
          # `env={**os.environ, ...}`, so setting the variables here
          # instruments all of them and adds no launch of its own.
          #
          # Option choices, each read out of xpcom/base/Logging.cpp on the
          # beta.31 tree rather than recalled:
          #  * `%PID` (MOZ_LOG_PID_TOKEN, Logging.h:28) is expanded per process
          #    by ExpandLogFileName (Logging.cpp:121-146): the parent writes
          #    `cfx-main.<pid>.moz_log`, each content process
          #    `cfx-child.<pid>.moz_log`. Without it every process in a launch
          #    shares one file and no line can be attributed to a process.
          #  * `append` -- the default open mode is "w" (Logging.cpp:572), so a
          #    later launch that is handed a recycled pid would TRUNCATE an
          #    earlier launch's file. That would silently delete arm (b2)'s
          #    evidence and leave arm (j2)'s, which is the failure mode this
          #    whole capture exists to avoid.
          #  * `sync` (Logging.cpp:418) fflushes every line. The per-arm marks
          #    below take byte offsets DURING a launch; without sync a line
          #    written before a mark can land in the file after it, and the
          #    slice would attribute the donor's lines to the recipient.
          #  * `timestamp` (Logging.cpp:416) prefixes each line with a UTC
          #    wall-clock time, which is what lets the dump step merge the
          #    per-process files into one time order.
          # Levels are 4 (Debug), not 5 (Verbose). Every CAMOU-FL site logs at
          # LogLevel::Debug -- `CAMOU_LOG_FL` in dom/base/FontListManager.cpp
          # and `CAMOU_LOG_FONTLIST` in gfx/thebes/gfxTextRun.cpp, both on the
          # same `fontlist` module upstream's LOG_FONTLIST writes to -- so 5
          # would add only upstream's Verbose font-list chatter, and volume is
          # the one cost of this capture that is not yet measured.
          # `textrun` is for the pre-existing eGfxLog_textrun
          # `(textrun-systemfallback-*)` line at gfxPlatformFontList.cpp:1475,
          # which names the face system fallback actually returned; it is
          # guarded by MOZ_LOG_TEST at LogLevel::Warning (2), so 4 already
          # carries it with room to spare.
          LOG_DIR = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "camou-fontlog")
          os.makedirs(LOG_DIR, exist_ok=True)
          os.environ["MOZ_LOG"] = "fontlist:4,textrun:4,timestamp,sync,append"
          os.environ["MOZ_LOG_FILE"] = os.path.join(LOG_DIR, "cfx%PID")

          # ---- #44 round 3 (B0): confine fontconfig to the bundle ----------
          # Until now every launch here ran the raw binary with the runner's
          # host fontconfig, so ubuntu-24.04's fonts -- DejaVu among them --
          # were in every font list and every arm measured a font universe no
          # shipped Camoufox has (recon open question 4). pythonlib/camoufox/
          # utils.py:238 sets FONTCONFIG_FILE for exactly this reason; this is
          # the same substitution _generate_fontconfig (utils.py:58-92) makes.
          #
          # CONSEQUENCE, stated up front because it decides three arms:
          # bundle/fontconfig/linux/fonts.conf aliases serif/sans-serif/
          # monospace to Tinos/Arimo/Cousine -- all `lin`-only in fonts.json,
          # so all refused under any mac or win per-context list. Every generic
          # under such a list is therefore decided by A2's table, not by
          # fontconfig. The file also carries ZERO <include> elements, so the
          # host's /etc/fonts/conf.d/30-metric-aliases.conf is absent and
          # `Times` is not silently aliased to `Tinos`.
          #
          # WHAT THIS GUARD CANNOT SEE (CLAUDE.md lesson 3). It measures the
          # LINUX conf. A shipped Camoufox picks the conf by the SPOOFED os:
          # pythonlib/camoufox/utils.py:213-231 maps user_agent_os through
          # {'lin':'linux','mac':'macos','win':'windows'} and reads
          # fontconfig/<os_dir>/fonts.conf. So a real mac-fingerprinted session
          # runs with sans-serif/serif/monospace aliased to
          # Helvetica/Times/Menlo -- all mac families, all ALLOWED under a mac
          # list -- and fontconfig answers its generics correctly there without
          # A2 ever being consulted. #92 is still real (the refusal case is
          # reachable whenever the per-context list and the spoofed OS disagree,
          # which is the whole point of a per-context list), but arm (n2)'s RED
          # is partly an artifact of the conf this guard chose. Stated here and
          # in the PR's NOT-verified section rather than discovered later.
          FONTS_DIR = os.environ.get("CAMOU_FONTS_DIR", "")
          FONTS_CONF_SRC = os.environ.get("CAMOU_FONTS_CONF", "")
          assert FONTS_DIR and os.path.isdir(FONTS_DIR), (
              f"CAMOU_FONTS_DIR is {FONTS_DIR!r}: the unpack step did not find the "
              f"artifact's fonts directory, so this run would measure the runner's "
              f"host fontconfig and every arm below would be about the wrong font "
              f"universe.")
          assert FONTS_CONF_SRC and os.path.isfile(FONTS_CONF_SRC), (
              f"CAMOU_FONTS_CONF is {FONTS_CONF_SRC!r}: no fonts.conf in the "
              f"artifact. Same consequence as above.")
          FC_DIR = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "camou-fc")
          os.makedirs(os.path.join(FC_DIR, "cache"), exist_ok=True)
          _conf = open(FONTS_CONF_SRC, encoding="utf-8").read()
          _needle = '<dir prefix="cwd">fonts</dir>'
          assert _needle in _conf, (
              f"{FONTS_CONF_SRC} does not contain {_needle!r}; the bundle's fonts.conf "
              f"has changed shape and this substitution would silently do nothing.")
          # Identity check, not a path check: all three bundled fonts.conf files
          # carry the needle above, so only their alias targets tell them apart.
          # Arimo/Tinos/Cousine appear ONLY in the linux file (verified: grep -c
          # over the macos and windows files returns 0 for all three).
          _missing = [f for f in ("Arimo", "Tinos", "Cousine") if f not in _conf]
          assert not _missing, (
              f"{FONTS_CONF_SRC} does not alias to {_missing}: this is not the LINUX "
              f"fonts.conf, and arms (n1), (n2) and (n4) all rest on the Linux aliases. "
              f"See the unpack step's -path '*/fontconfig/linux/fonts.conf' pin.")
          _conf = _conf.replace(_needle, "<dir>%s</dir>" % FONTS_DIR)
          FONTCONFIG_FILE = os.path.join(FC_DIR, "fonts.conf")
          with open(FONTCONFIG_FILE, "w", encoding="utf-8") as _fh:
              _fh.write(_conf)
          os.environ["FONTCONFIG_FILE"] = FONTCONFIG_FILE
          os.environ["XDG_CACHE_HOME"] = os.path.join(FC_DIR, "cache")
          print(f"  [setup] FONTCONFIG_FILE={FONTCONFIG_FILE} "
                f"src={FONTS_CONF_SRC} fonts_dir={FONTS_DIR} "
                f"xdg_cache={os.environ['XDG_CACHE_HOME']}")
          # -------------------------------------------------------------------

          def log_mark():
              # Byte offset of every log file that exists right now. Handing
              # this to camou_fl() reads only what was appended afterwards,
              # which is what attributes a line to ONE arm instead of to the
              # ~20 launches this step makes.
              return {p: os.path.getsize(p) for p in glob.glob(os.path.join(LOG_DIR, "*"))}

          def camou_fl(mark, *needles, limit=12):
              """Log lines appended since `mark` that contain every needle.

              `limit=None` means unlimited; otherwise the LAST `limit` lines,
              because the interesting render is the one at the end of an arm.
              """
              out = []
              for p in sorted(glob.glob(os.path.join(LOG_DIR, "*"))):
                  try:
                      size = os.path.getsize(p)
                      start = mark.get(p, 0)
                      if start > size:
                          # `append` means a log file cannot shrink, so this is
                          # defensive. If one did, the offset is meaningless and
                          # seeking to it returns nothing -- which is
                          # indistinguishable from "the site never ran", the
                          # worst way for this to fail. Read the whole file and
                          # say so, so the over-report is visible.
                          out.append(f"({os.path.basename(p)} shrank below the mark, "
                                     f"{size} < {start}: showing the WHOLE file, so lines "
                                     f"from earlier arms may appear below)")
                          start = 0
                      with open(p, encoding="utf-8", errors="replace") as fh:
                          fh.seek(start)
                          for line in fh:
                              if all(n in line for n in needles):
                                  out.append(f"{os.path.basename(p)} {line.rstrip()}")
                  except OSError as exc:
                      out.append(f"(could not read {os.path.basename(p)}: {exc})")
              return out if limit is None else out[-limit:]

          def ctx_histogram(mark, kind):
              """How many CAMOU-FL <kind> lines carried each ctx= value."""
              hist = {}
              for ln in camou_fl(mark, f"CAMOU-FL {kind} ", limit=None):
                  tok = next((t for t in ln.split() if t.startswith("ctx=")), None)
                  if tok:
                      hist[tok] = hist.get(tok, 0) + 1
              return dict(sorted(hist.items())) or "no lines (module off, or the site never ran)"

          # The mark for the WHOLE step, taken before any launch. kind_total()
          # below counts against it rather than against an arm's own mark,
          # because the question it answers is about the BINARY, not the arm:
          # "does this build emit `fontlist` lines at all?" An arm that cannot
          # tell "the binary predates this kind" from "the kind exists but not
          # for my context" reports SETUP-INVALID on a binary that was never
          # going to produce the line -- which under the routing fixed in Step 5
          # fails the step for a reason no re-run can change.
          LOG_START = log_mark()

          def kind_total(kind):
              """How many `CAMOU-FL <kind>` lines this RUN has emitted so far."""
              return len(camou_fl(LOG_START, f"CAMOU-FL {kind} ", limit=None))

          def fffd_resolved(mark, limit=8):
              """`ctx=`/`resolved=` of each U+FFFD global-fallback in a window.

              `resolved=%s` is the LAST field of the format string
              (gfxPlatformFontList.cpp:1644) and a family name contains spaces
              ("Segoe UI"), so the value is everything to end of line -- taking
              the next whitespace token would silently truncate it.
              """
              out = []
              for ln in camou_fl(mark, "CAMOU-FL global-fallback", "ch=U+FFFD", limit=limit):
                  ctx = next((t for t in ln.split() if t.startswith("ctx=")), "ctx=?")
                  res = ln.split("resolved=", 1)[1] if "resolved=" in ln else "?"
                  out.append(f"{ctx} resolved={res}")
              return out

          # #83's mechanism: gfxFcPlatformFontList::mFcSubstituteCache, a
          # process-global name->family memo consulted BEFORE the base
          # FindAndAddFamiliesLocked where the gate lives, so a hit answers a
          # direct-named family with no `CAMOU-FL gate` line at all. Keys look
          # like `0:segoe ui:3` -- a family name with spaces, so the key runs
          # from `key=` to ` hit=`, not to the next whitespace.
          # FC_PROBE_KEYS is assigned just after PROBES below, DERIVED from it
          # rather than written out: the hand-written tuple that used to live
          # here held four of the six probe families, so `pingfang hk` and
          # `ms gothic` silently never matched and run 34435628304's section
          # printed 6 of the log's 7 lines. Same failure as an eyeballed marker
          # family (CLAUDE.md, "Marker families are DERIVED").
          def fc_subst_hits(mark, limit=12):
              """`fc-subst ... hit=1` lines whose key names a probe family."""
              out = []
              for ln in camou_fl(mark, "CAMOU-FL fc-subst", "hit=1", limit=None):
                  if "key=" not in ln:
                      continue
                  key = ln.split("key=", 1)[1].split(" hit=", 1)[0].lower()
                  if any(k in key for k in FC_PROBE_KEYS):
                      out.append(ln)
              return out[-limit:]
          # -------------------------------------------------------------------

          FONTS = json.load(open("pythonlib/camoufox/fonts.json"))
          MAC_STRICT = set(FONTS["mac"]) - set(FONTS["win"]) - set(FONTS["lin"])
          WIN_STRICT = set(FONTS["win"]) - set(FONTS["mac"]) - set(FONTS["lin"])
          # ---- #44 round 3: pick MAC_ONLY's third family from THIS RUN ------
          # Geneva was the third MAC_ONLY probe and it has never rendered. The
          # pixel discriminator further down read `geneva == absent` in run
          # 34445606698, where arm (b)'s WIDTH said True, and again in run
          # 34477369394, where the width said False -- two runs, one answer,
          # with the discriminator's own positive control valid in both. So the
          # width flip was the fallback face changing when the host fonts left
          # the universe, not the gate changing its mind.
          # bundle/fonts/macos/Geneva.ttf carries a single cmap subtable,
          # (0,3) format 12, upem 2048, Latin covered, so whatever fails is
          # downstream of the cmap. That is a bundle defect (issue drafted at
          # .superpowers/sdd-fonts3/issue-geneva.md), not a verdict arm (b)
          # should keep asserting about the fork.
          #
          # A probe family this guard cannot render is a reference that is
          # never right (CLAUDE.md lesson 4), so the third slot is chosen BY
          # THIS RUN from three mac-only candidates -- each checked against
          # pythonlib/camoufox/fonts.json (in `mac`, absent from `win` and
          # `lin`) and present in bundle/fonts/macos/. The choice happens in
          # its OWN launch, before PROBES exists: picking it inside the bare
          # launch would leave arm (a) measuring a different probe set from
          # arm (b).
          MAC_CANDIDATES = ["Optima", "Palatino", "Helvetica"]

          # One checksum implementation, shared by this precheck and the
          # Geneva discriminator below. Two different faces essentially never
          # rasterize identically at 72px even when metrically similar, which
          # is the reference the width probe does not have.
          PIXEL_JS = """(families) => {
            const S = 'mmmmmmmmmmlliWWWWWWW@#$%^&*()_+';
            const draw = (f) => {
              const c = document.createElement('canvas');
              c.width = 300; c.height = 100;
              const x = c.getContext('2d');
              x.fillStyle = 'white'; x.fillRect(0, 0, 300, 100);
              x.fillStyle = 'black';
              x.font = '72px "' + f + '", monospace';
              x.fillText(S, 0, 80);
              const d = x.getImageData(0, 0, 300, 100).data;
              let sum = 0;
              for (let i = 0; i < d.length; i++) { sum = (Math.imul(sum, 31) + d[i]) >>> 0; }
              return sum;
            };
            const width = (f) => {
              const x = document.createElement('canvas').getContext('2d');
              x.font = '72px "' + f + '", monospace';
              return x.measureText(S).width;
            };
            const out = {};
            for (const f of families) out[f] = {pixels: draw(f), width: width(f)};
            return out;
          }"""

          def mac_list_probe(js, arg, marker):
              """One launch, one context carrying FONTS["mac"], one page."""
              with sync_playwright() as pw:
                  _b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  _c = _b.new_context()
                  # A bare new_context() has NO mac list, so every mac-only
                  # candidate would read refused and the precheck would reject
                  # all three for the wrong reason. Same init script the Geneva
                  # discriminator uses.
                  _c.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["mac"])))
                  _p = _c.new_page()
                  _p.goto(f"data:text/html,<h1>{marker}</h1>")
                  try:
                      return _p.evaluate(js, arg)
                  finally:
                      _b.close()

          _pre = mac_list_probe(
              PIXEL_JS,
              MAC_CANDIDATES + ["Helvetica Neue", "Geneva", "__CamouAbsentRef__0001"],
              "mac-candidate-precheck")
          _absent = _pre["__CamouAbsentRef__0001"]
          _ctrl_ok = _pre["Helvetica Neue"]["pixels"] != _absent["pixels"]
          print(f"  [MAC_ONLY precheck] absent reference: {_absent}")
          print(f"  [MAC_ONLY precheck] positive control Helvetica Neue: "
                f"{_pre['Helvetica Neue']} -> pixel test "
                f"{'valid' if _ctrl_ok else 'INVALID'}")
          print(f"  [MAC_ONLY precheck] Geneva (no longer a probe; kept as evidence for the "
                f"bundle issue): {_pre['Geneva']} renders="
                f"{_pre['Geneva']['pixels'] != _absent['pixels']}")
          assert _ctrl_ok, (
              "MAC_ONLY precheck SETUP-INVALID: Helvetica Neue, which arm (b) has resolved in "
              f"every run, checksums identical to the absent reference ({_absent['pixels']}). "
              "The pixel test cannot tell a hit from a miss here, so no candidate below can be "
              "trusted and MAC_ONLY cannot be chosen at all.")
          MAC_THIRD = None
          for _c in MAC_CANDIDATES:
              _w_ok = _pre[_c]["width"] != _absent["width"]
              _p_ok = _pre[_c]["pixels"] != _absent["pixels"]
              print(f"  [MAC_ONLY precheck] {_c}: width {_pre[_c]['width']} vs absent "
                    f"{_absent['width']} ({'differs' if _w_ok else 'SAME'}); pixels "
                    f"{'differ' if _p_ok else 'SAME'} -> "
                    f"{'ACCEPT' if (_w_ok and _p_ok) else 'reject'}")
              if _w_ok and _p_ok and MAC_THIRD is None:
                  MAC_THIRD = _c   # first accepted wins; the rest still measure
                                   # and print, so the log shows all three
          _pre_summary = {_c: _pre[_c] for _c in MAC_CANDIDATES}
          assert MAC_THIRD, (
              f"MAC_ONLY precheck SETUP-INVALID: not one of {MAC_CANDIDATES} renders in a mac "
              f"context -- width AND pixels match the absent reference for all three: "
              f"{_pre_summary}. MAC_ONLY has no third family this run can prove, and a probe "
              "family that never renders is exactly what Geneva was.")
          print(f"  [MAC_ONLY precheck] chosen third MAC_ONLY family: {MAC_THIRD}")

          MAC_ONLY = ["Helvetica Neue", "PingFang HK", MAC_THIRD]
          WIN_ONLY = ["Segoe UI", "Calibri", "MS Gothic"]
          PROBES = MAC_ONLY + WIN_ONLY
          # Derived, never written out -- see fc_subst_hits above. The fc memo
          # lowercases its key, and so does the reader, so these are lowercase.
          FC_PROBE_KEYS = tuple(f.lower() for f in PROBES)
          print(f"  [setup] fc-subst probe keys, derived from PROBES: "
                f"{list(FC_PROBE_KEYS)}")
          assert MAC_STRICT.issuperset(MAC_ONLY), (
              "these are no longer mac-only in fonts.json, the probe would invert: "
              f"{sorted(set(MAC_ONLY) - MAC_STRICT)}")
          assert WIN_STRICT.issuperset(WIN_ONLY), (
              "these are no longer win-only in fonts.json, the probe would invert: "
              f"{sorted(set(WIN_ONLY) - WIN_STRICT)}")

          # Two DIFFERENT impossible families: both must fall back to the same
          # default face, so equal widths. If they ever differ, width comparison
          # has stopped meaning "did this family resolve".
          JS = """(families) => {
            const c = document.createElement('canvas').getContext('2d');
            const s = 'mmmmmmmmmmlliWWWWWWW@#$%^&*()_+';
            const w = (f) => { c.font = '72px "' + f + '", monospace'; return c.measureText(s).width; };
            const absentW = w('__CamouAbsentRef__0001');
            const measure = {}, fontfaces = {}, status = {};
            for (const f of families) measure[f] = (w(f) !== absentW);
            measure['__impossible__'] = (w('__NoSuchFamily__12345') !== absentW);
            // Bare FontFace objects, read BEFORE anything is handed to
            // document.fonts: no FontFaceSet entry point sits above this read,
            // so nothing but FontFace::Status() itself can scope the context.
            const bare = (f) => new FontFace(f, 'local("' + f + '")').status;
            for (const f of families) status[f] = bare(f);
            status['__impossible__'] = bare('__NoSuchFamily__12345');
            for (const f of families) {
              document.fonts.add(new FontFace(f, 'local("' + f + '")'));
              fontfaces[f] = document.fonts.check('12px "' + f + '"');
            }
            return {measure: measure, fontfaces: fontfaces, status: status,
                    absentWidth: absentW};
          }"""

          def probe(page, marker="f"):
              # `marker` goes into the document URI, which is the only field
              # the CAMOU-FL `group ... uri=` line carries that can name a
              # context (the `gate` line has no uri at all). Without it every
              # context in this step navigates to the same
              # `data:text/html,<h1>f</h1>` and no font group in the log can be
              # attributed to the context that produced it (#83). Arm (b2r)
              # has always used a distinct URI per context and reproduces the
              # same verdict as arm (b2), so the URI is not a variable either
              # arm is sensitive to.
              page.goto(f"data:text/html,<h1>{marker}</h1>")
              return page.evaluate(JS, PROBES)

          def check_signal(label, r):
              assert r["absentWidth"] > 0, f"{label}: canvas measured 0 -- nothing ran"
              assert not r["measure"]["__impossible__"], (
                  f"{label}: an impossible family 'resolved' -- width comparison can no "
                  "longer tell a hit from a miss")
              assert any(r["measure"][f] for f in PROBES), (
                  f"{label}: not one bundled family resolved -- the guard measured nothing")

          # ---- #44 round 3: is the width reference guaranteed to differ? ----
          # CLAUDE.md lesson 4. `measure[f]` is `w(f) != absentWidth`, and
          # absentWidth is the advance of whatever face serves
          # `72px "<absent family>", monospace`. That is a verdict only while the
          # reference is GUARANTEED to differ from the family under test, and
          # since B0 put every launch under FONTCONFIG_FILE it is not: the font
          # universe is the bundle alone, the linux conf aliases monospace to
          # Cousine, Cousine is lin-only and refused under a win or mac `fonts`
          # list, and the generic lands on some other bundled face. Run
          # 34471565975 read `MS Gothic: False` out of that comparison while the
          # SAME launch reported document.fonts.check True, FontFace.status
          # 'loaded', and (CAMOU-FL, ctx=6) `gate ... key=ms gothic allowed=1`.
          #
          # This probe decides presence WITHOUT the absent reference, so it can
          # tell "refused" from "is itself the fallback face". For family f it
          # compares two stacks measured on the same canvas:
          #     wf(f) = 72px "f", monospace        wb(f) = 72px "f"
          # If f resolved, both stacks render with f, so the widths are EQUAL.
          # If f was refused, the first falls to the monospace generic and the
          # second to the canvas default font, so the widths DIFFER -- provided
          # those two fallback faces differ, which is exactly
          # `absentBare != absentMono` and is read back at runtime below. The
          # test is therefore guaranteed under a condition this run measures,
          # not under an assumption about which face the fallback picked.
          #
          # WHAT IT CANNOT SEE (lesson 3, stated next to what it proves):
          #  * A family that does not cover every codepoint in the probe string
          #    renders it by per-character fallback in BOTH stacks and reads
          #    "present" either way. No family in PROBES is like that; the
          #    `named` sweep below may list one, so `named` is a candidate set.
          #  * Equal advance is not identity. `named` is the set of families
          #    indistinguishable from the fallback face at this size and string.
          #    It does not prove the fallback IS any one of them.
          # The sweep covers all three fonts.json lists, not just this launch's:
          # if an ungated read path (#88's last-resort walk) served the generic,
          # the face can be a mac or lin family and a win-only sweep would name
          # nothing.
          FALLBACK_CANDS = sorted(set(FONTS["win"]) | set(FONTS["mac"]) | set(FONTS["lin"]))
          NAMING_JS = """([cands, probes]) => {
            const c = document.createElement('canvas').getContext('2d');
            const s = 'mmmmmmmmmmlliWWWWWWW@#$%^&*()_+';
            const wf = (f) => { c.font = '72px "' + f + '", monospace'; return c.measureText(s).width; };
            const wb = (f) => { c.font = '72px "' + f + '"'; return c.measureText(s).width; };
            // Second presence source, for when the first one's discriminator
            // collapses. A bare FontFace resolves synchronously in this fork
            // and never touches the canvas, so it cannot be fooled by two
            // faces sharing an advance -- it is arm (d)'s read, reused here.
            const st = (f) => { try { return new FontFace(f, 'local("' + f + '")').status; }
                                catch (e) { return 'exception'; } };
            const absentMono = wf('__CamouAbsentRef__0002');
            const absentBare = wb('__CamouAbsentRef__0002');
            const refValid = (absentBare !== absentMono);
            const src = refValid ? 'width' : 'FontFace.status';
            const isPresent = (f) => refValid ? (wf(f) === wb(f)) : (st(f) === 'loaded');
            const present = {};
            for (const f of probes) present[f] = isPresent(f);
            const named = [];
            for (const f of cands) {
              if (wf(f) !== absentMono) continue;   // not at the fallback advance
              if (!isPresent(f)) continue;          // refused, so not the fallback face
              named.push(f);
            }
            return {absentMono: absentMono, absentBare: absentBare, refValid: refValid,
                    presentSource: src, absentStatus: st('__CamouAbsentRef__0002'),
                    present: present, named: named};
          }"""

          def collided_families(r, nm, label):
              """Families the width comparison cannot decide in this context.

              `measure[f]` is `w(f) != absentWidth`, so a family that renders
              the probe string at the fallback face's own advance reads False
              whether it resolved or not. `nm["present"]` answers the same
              question without the absent reference -- from the two-stack width
              test when its discriminator is valid, else from a bare
              FontFace's status, which never touches the canvas. A family
              present by that route and absent by width is undecided by width.
              """
              assert nm["absentStatus"] == "error", (
                  f"{label}: a bare FontFace for an impossible family reports "
                  f"{nm['absentStatus']!r} in the naming probe -- its presence source "
                  "cannot tell a hit from a miss")
              out = [f for f in PROBES if nm["present"][f] and not r["measure"][f]]
              print(f"  [{label}] absentWidth={nm['absentMono']} absentBare={nm['absentBare']} "
                    f"width-discriminator={'valid' if nm['refValid'] else 'INVALID'} "
                    f"presence-source={nm['presentSource']} present={nm['present']}")
              for f in out:
                  print(f"  [{label}] width reference collides for {f}: it renders the probe "
                        f"string at absentWidth ({nm['absentMono']}), so the width comparison "
                        f"cannot decide it; fallback face = one of {nm['named']}")
              return out

          # config launch -- `fonts` is this profile's own Windows subset, and
          # no context installs a per-context list. Covers arms (a), (c), (d).
          with sync_playwright() as pw:
              b = pw.firefox.launch(
                  executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                  env={**os.environ, "CAMOU_CONFIG": json.dumps({"fonts": FONTS["win"]})})
              # Explicit context, the way every other launch in this step does
              # it: Playwright refuses new_page() on the implicit context that
              # b.new_page() creates ("Please use browser.new_context()", run
              # 34474487872). No `fonts` option, so still a context with no
              # per-context list, which is what arms (a)/(c)/(d) are about.
              _ctx_default = b.new_context()
              _pg_default = _ctx_default.new_page()
              default = probe(_pg_default, "a-default")
              # Same BrowserContext as `default`, so the same context id and
              # the same font list. A second b.new_context() would be a FRESH
              # context and so a reference nothing establishes as comparable.
              # A fresh DOCUMENT though: probe() leaves six `local()` FontFace
              # objects in document.fonts, and a document web font resolves
              # through LookupLocalFont, a different (and per CLAUDE.md partly
              # ungated) read path from the family lookup this arm is about.
              # Measuring in that document would let the wrong path answer.
              # The `absentMono == absentWidth` assert below is what
              # establishes the two documents are comparable.
              _pg_name = _ctx_default.new_page()
              _pg_name.goto("data:text/html,<h1>a-fallback</h1>")
              naming = _pg_name.evaluate(NAMING_JS, [FALLBACK_CANDS, PROBES])
              b.close()

          print(f"  [config launch / default] measure        {default['measure']}")
          print(f"  [config launch / default] document.fonts  {default['fontfaces']}")
          print(f"  [config launch / default] FontFace.status {default['status']}")
          check_signal("config launch / default", default)

          # Two absent sentinels, two scripts, two documents of one context: if
          # they disagree the width apparatus is not reproducible across those
          # documents and nothing below means anything.
          assert naming["absentMono"] == default["absentWidth"], (
              f"config launch / default: the naming probe's absent reference "
              f"{naming['absentMono']} differs from probe()'s {default['absentWidth']} in "
              "the same page -- the width apparatus is not reproducible")
          REF_VALID = naming["refValid"]
          if not REF_VALID:
              # Not a setup failure any more, a finding: `"f"` alone and
              # `"f", monospace` land on the SAME face, so the generic and the
              # canvas default font are one and the same here -- the ungated
              # last-resort default is serving both (#88's face). Presence
              # falls to FontFace.status, which never touches the canvas.
              print("  [config launch / default] the monospace generic and the canvas "
                    "default font render the probe string at the same advance, so the "
                    "width test cannot decide presence; presence read from "
                    "FontFace.status instead (canvas-independent by construction)")
          print(f"  [config launch / default] families rendering the probe string at "
                f"absentWidth and present in this context: {naming['named']}")
          collided = collided_families(default, naming, "config launch / default")
          if collided and not naming["named"]:
              print("  [config launch / default] the fallback face matches no family in any "
                    "fonts.json list -- an ungated read path chose it and it cannot be "
                    "named from here")

          # (a) the default context answers from the launch `fonts` subset,
          # not from every bundled family (the Linux package bundles
          # win+mac+linux together). A family whose width reference collides is
          # decided by the two reads that remain, which must BOTH say present.
          for f in WIN_ONLY:
              if f in collided:
                  assert bool(default["fontfaces"][f]) and default["status"][f] == "loaded", (
                      f"the default context lost {f!r}: its width equals the fallback "
                      f"face's, so width cannot decide it, and the two reads that remain "
                      f"do not both say present -- document.fonts.check="
                      f"{default['fontfaces'][f]} FontFace.status={default['status'][f]!r}")
                  continue
              assert default["measure"][f], (
                  "the default context lost the launch config's own Windows families: "
                  f"{default['measure']} (absentWidth {default['absentWidth']}, "
                  f"present {naming['present']})")
          for f in MAC_ONLY:
              assert not default["measure"][f], (
                  "the default context resolved macOS families under a Windows launch -- a "
                  f"read path answered 'allow everything' instead of `fonts`: {default['measure']}")
              # Strengthening, not a weakening: a mac family that leaked AND
              # happened to render at the fallback advance would be invisible to
              # `measure` alone, exactly the way MS Gothic was.
              assert not naming["present"][f], (
                  f"the default context resolved {f!r} under a Windows launch -- the "
                  "width comparison missed it because it renders at the fallback face's "
                  f"advance, but the presence test (source {naming['presentSource']}) "
                  f"says it is there: {naming['present']}")

          # (c) document.fonts and text measurement are the same context.
          # Skipped for a colliding family: there `measure` is False by
          # construction, so this assertion could only restate the collision.
          # The part that still carries information -- that the two non-canvas
          # reads agree with each other -- is asserted in arm (a) above.
          for f in PROBES:
              if f in collided:
                  continue
              assert bool(default["fontfaces"][f]) == default["measure"][f], (
                  f"document.fonts says {default['fontfaces'][f]} for {f!r} but text "
                  f"measurement says {default['measure'][f]} -- the two font read paths "
                  "disagree, so the context is not coherent")

          # (d) a bare FontFace answers for the same context as measurement.
          # Same collision skip, same reason.
          assert default["status"]["__impossible__"] == "error", (
              "config launch / default: a bare FontFace for an impossible family reports "
              f"{default['status']['__impossible__']!r} -- .status can no longer tell a hit "
              "from a miss, so this arm is measuring nothing")
          assert any(default["status"][f] == "loaded" for f in PROBES), (
              "config launch / default: not one bundled family is 'loaded' on a bare "
              "FontFace -- the .status arm measured nothing")
          for f in PROBES:
              if f in collided:
                  continue
              assert (default["status"][f] == "loaded") == default["measure"][f], (
                  f"new FontFace({f!r}, 'local(...)').status is {default['status'][f]!r} but "
                  f"text measurement says {default['measure'][f]} -- FontFace::Status() is "
                  "answering for a different context than measurement")

          # Moved up from just before arm (e)/(f)/(g) below: arm (b2)
          # (right after arm (b), further down) is collect-then-assert
          # too, per team-lead direction, and needs this list to exist
          # before it runs. Still the SAME list, still first appended to
          # by (e); moving its creation earlier changes nothing about
          # (e)/(f)/(g)/(i)/(j)/(j2)'s own behavior.
          tripwires = []

          # C5 (from this task's review): an arm that reports "unmeasured",
          # "setup invalid" or "control invalid" has measured NOTHING -- it is
          # red because its own preconditions failed, not because the defect it
          # guards is still open. The EXPECTED_RED triage table at the end of
          # this step prints "RED (expected) ... unfixed" for every arm that
          # reaches `tripwires`, which asserts a verdict such an arm never
          # produced -- run 34322535132 did exactly that for (i2), (j) and (j2).
          # Arms record themselves here as well, and the table annotates them.
          unmeasured_arms = {}

          def note_unmeasured(tag, failures, verdict_marker):
              # `verdict_marker` is the substring ONLY the arm's real leak/bug
              # branch emits. No marker anywhere in the arm's failure strings
              # means the arm never reached its verdict branch.
              if failures and not any(verdict_marker in f for f in failures):
                  unmeasured_arms[tag] = failures[0][:220]

          # #83 / #82 process instrumentation. content_pids() is unchanged and
          # was moved up from the pid block further down -- arms (b2r), (j) and
          # (j2) all need it now, and it was defined after all three.
          import subprocess

          def content_pids():
              try:
                  out = subprocess.run(
                      ["pgrep", "-af", "contentproc"],
                      capture_output=True, text=True, timeout=5).stdout.strip()
              except Exception as e:
                  return f"ERR: {e}"
              return out

          def tab_pids():
              # Gecko puts a content process's remote type last on its command
              # line; ordinary page content is "tab". Returning a SET of pids
              # rather than the raw text is what lets an arm ASSERT "A and B
              # rendered in the same process" instead of assuming it -- #82 is a
              # per-process singleton cache, so an arm whose two contexts landed
              # in different processes measured nothing (code-recon B.3,
              # defect 3). A string return means pgrep itself failed; callers
              # must treat that as unmeasured, not as "different".
              raw = content_pids()
              if isinstance(raw, str) and raw.startswith("ERR:"):
                  return raw
              pids = set()
              for line in raw.splitlines():
                  parts = line.split()
                  if len(parts) >= 2 and parts[-1] == "tab":
                      pids.add(parts[0])
              return pids

          # bare launch -- no `fonts` key at all, so mFontFamilies holds every
          # bundled family and nothing is deleted from font.system.whitelist.
          # setFontList() per context is the only narrowing in play. Covers
          # arm (b).
          with sync_playwright() as pw:
              b = pw.firefox.launch(
                  executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                  # #83: this launch previously ran at the default
                  # dom.ipc.processCount=8, so mac/win almost certainly
                  # landed in separate content processes and this arm
                  # could never have observed a cross-process leak.
                  # Forcing a shared process is the one thing changing
                  # here -- team-lead directive, re-run before Task 8.
                  firefox_user_prefs={"dom.ipc.processCount": 1},
                  env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
              ctxs = {}
              # Same DOM-reported instrumentation as arm (b2). Arm (b2)
              # reports saw=false for every context, which would mean no
              # per-context list is ever installed -- and under this bare
              # launch that means CamouIsFontAllowed allows everything, so
              # arm (b) could not be blocking for the reason it claims.
              # Measure arm (b) with the same instrument rather than
              # assuming the two differ (#83).
              # saw=false everywhere says the typeof check failed, but not
              # why. Distinguish "the binding is absent" from "it is present
              # and the guard is wrong" by calling it unconditionally and
              # recording what happens, plus what the window actually
              # exposes (#83).
              B_INIT = ('(() => { const out = {saw: (typeof window.setFontList === "function"), '
                        'inWin: ("setFontList" in window), '
                        'typ: typeof window.setFontList, '
                        'fontProps: Object.getOwnPropertyNames(window).filter('
                        'n => /font/i.test(n)), '
                        # Which of the 14 setters are reachable from an init
                        # script (main world)? The #57 arm enumerates them with
                        # page.evaluate(), which runs in an isolated world and
                        # cannot see them either way, so its 0/14 says nothing.
                        # setNavigatorPlatform demonstrably applies from an init
                        # script in this same run, so if it is present here and
                        # setFontList is not, the difference is specific rather
                        # than systemic (#83).
                        'setters: ["setFontSpacingSeed","setAudioFingerprintSeed",'
                        '"setCanvasSeed","setTimezone","setScreenDimensions",'
                        '"setScreenColorDepth","setNavigatorPlatform","setNavigatorOscpu",'
                        '"setNavigatorHardwareConcurrency","setWebGLVendor","setWebGLRenderer",'
                        '"setFontList","setSpeechVoices","setWebRTCIPv4"]'
                        '.filter(n => typeof window[n] === "function"), '
                        'applied: false, err: null}; '
                        'try { window.setFontList(%s); out.applied = true; } '
                        'catch (e) { out.err = String(e).slice(0, 120); } '
                        'const mark = () => { try { document.documentElement.setAttribute('
                        '"data-fl", JSON.stringify(out)); } catch (e) {} }; '
                        'mark(); document.addEventListener("DOMContentLoaded", mark); })()')
              fl_b, b_naming = {}, {}
              for name in ("mac", "win"):
                  ctx = b.new_context()
                  ctx.add_init_script(B_INIT % json.dumps(",".join(FONTS[name])))
                  pg = ctx.new_page()
                  ctxs[name] = probe(pg, f"b-{name}")
                  fl_b[name] = pg.evaluate('() => document.documentElement.getAttribute("data-fl")')
                  # Same collision arm (a) hits, same context, fresh document:
                  # MS Gothic renders the probe string at the fallback face's
                  # own advance, so `measure` reads False for a family this
                  # context resolved. Candidates are PROBES only, not all three
                  # fonts.json lists -- arm (b) needs the verdict, and arm (a)
                  # already carries the full sweep that names the face.
                  pg2 = ctx.new_page()
                  pg2.goto(f"data:text/html,<h1>b-{name}-fallback</h1>")
                  b_naming[name] = pg2.evaluate(NAMING_JS, [PROBES, PROBES])
                  ctx.close()
              print(f"  [arm b / #83 instrumentation] setFontList per context {fl_b}")
              b.close()
          mac, win = ctxs["mac"], ctxs["win"]

          for label, r in (("bare launch / mac context", mac), ("bare launch / win context", win)):
              print(f"  [{label}] measure        {r['measure']}")
              print(f"  [{label}] document.fonts  {r['fontfaces']}")
              print(f"  [{label}] FontFace.status {r['status']}")
              check_signal(label, r)

          # Discriminator for the Geneva regression (no rebuild): the width
          # comparison itself may be lying. `resolved = (w(f) != w(absent))`
          # assumes the absent-reference's fallback face can never BE the
          # face under test -- but mac's allowed list is the full macOS set,
          # and Geneva (historically Mac OS's own default UI sans) is a
          # entirely plausible generic-sans fallback pick. If the fallback
          # for an unresolvable name happens to BE Geneva, then Geneva IS
          # resolving, the two widths agree because they're the SAME face,
          # and width-based "resolved=False" is a false negative -- the
          # same reference-not-guaranteed-to-differ defect this plan has
          # hit before (arm (f)'s CJK em-square collision, arm (j)'s tofu
          # floor). Break it with rendered pixels, not advance width: two
          # different faces essentially never rasterize identically at
          # 72px, even if metrically similar. Helvetica Neue is the
          # positive control -- known-resolved (measure=True), must
          # produce a DIFFERENT checksum from the absent-reference, or
          # this test itself proves nothing.
          # Same launch shape and the SAME shared PIXEL_JS the MAC_ONLY
          # precheck uses, so the two readings are comparable. Geneva is
          # again one of the probed families (alongside three of #95's other
          # four); this block remains a diagnostic with no assert -- see
          # issue-geneva.md.
          # #95: Geneva is one of FIVE families whose only cmap subtable is a
          # Unicode-platform format-10/12/13 table, which upstream's non-macOS
          # acceptableUCS4Encoding rejects -- leaving an empty character map.
          # Four of the five are probed, so the other three are measured
          # rather than assumed to follow Geneva. The fifth, .LastResort, is
          # fixed by the same clause but is not probed: its family name begins
          # with a dot, so it is not addressable from CSS and would read absent
          # for a reason unrelated to this fix.
          CMAP95_FAMILIES = ["Geneva", "Apple Symbols", "Heiti TC", "Heiti SC"]
          _gp = mac_list_probe(
              PIXEL_JS,
              CMAP95_FAMILIES + ["__CamouAbsentRef__0001", "Helvetica Neue"], "g")
          geneva_pixels = {"geneva": _gp["Geneva"]["pixels"],
                           "absent": _gp["__CamouAbsentRef__0001"]["pixels"],
                           "helvetica_neue": _gp["Helvetica Neue"]["pixels"]}
          control_differs = geneva_pixels["helvetica_neue"] != geneva_pixels["absent"]
          geneva_pixel_differs = geneva_pixels["geneva"] != geneva_pixels["absent"]
          print(f"  [Geneva pixel discriminator] checksums: {geneva_pixels}")
          print(f"  [Geneva pixel discriminator] positive control (Helvetica Neue, "
                f"known-resolved) differs from absent-reference: {control_differs} "
                f"{'-- test is valid' if control_differs else '-- TEST ITSELF IS BROKEN, ignore the Geneva result below'}")
          print(f"  [Geneva pixel discriminator] Geneva differs from absent-reference "
                f"(pixels, not width): {geneva_pixel_differs} "
                f"-- {'Geneva DOES resolve; the width-based arm (b) measurement was a false negative' if geneva_pixel_differs else 'Geneva genuinely does not render distinct pixels; the width measurement was correct'}")
          for _fam in CMAP95_FAMILIES:
              _differs = _gp[_fam]["pixels"] != geneva_pixels["absent"]
              print(f"  [#95 cmap discriminator] {_fam}: checksum="
                    f"{_gp[_fam]['pixels']} differs from absent-reference: {_differs}")

          # This block was a diagnostic with no assert because Geneva was
          # known-broken and there was nothing to guard. #95 makes these four
          # families render, so from here on the failure mode worth catching is
          # a REGRESSION back to the empty character map -- which is exactly
          # what went unnoticed for the life of the bundle. The assert is
          # deterministic: mac_list_probe sets the per-context list from the
          # whole of fonts.json's mac list (not a random sample) and launches
          # with CAMOU_CONFIG={}, so all four families are in-list every run.
          # Registered as a tripwire, NOT asserted inline. An inline assert here
          # raises ~4300 lines before arm j2 and would erase every later arm in
          # this step -- including the U+FFFD global-fallback reading, which is
          # the one thing a control run against a build WITHOUT this patch
          # exists to capture. That is the same defect the #44 headline arm was
          # just fixed for: a red arm that erases the evidence below it. The
          # triage table at the end of the step fails the step on any tripwire
          # not listed in EXPECTED_RED, so a regression still goes red -- after
          # every other arm has reported.
          _dead = [f for f in CMAP95_FAMILIES
                   if _gp[f]["pixels"] == geneva_pixels["absent"]]
          if not control_differs:
              unmeasured_arms["(cmap95)"] = (
                  "the positive control (Helvetica Neue) matches the absent "
                  "reference, so this block cannot tell rendered from unrendered")
          elif _dead:
              tripwires.append(
                  f"(cmap95) #95 families render identically to the absent "
                  f"reference, i.e. back to an empty character map: {_dead}")

          assert mac["measure"] != win["measure"], (
              "the mac and win contexts measured identically -- no per-context signal")

          # (b) each context narrows to its own OS, including one the launch
          # never had.
          #
          # These were hard asserts, which predate the collect-then-assert
          # pattern the later arms use. That cost real signal: a red here
          # aborts the step and erases every arm below it, and arm (h) --
          # the only arm Task 6 needs -- went unmeasured across two runs
          # because Geneva regressed here. An arm that kills the run makes
          # every later arm unmeasurable in exactly the situation where
          # someone needs them most.
          # Resolved per family, not raw `measure`: run 34482267222 read
          # `MS Gothic: False` in the win context while document.fonts.check
          # said True and FontFace.status said 'loaded' -- the same fallback-
          # advance collision arm (a) hits, in arm (b) (CLAUDE.md lesson 4). A
          # colliding family is decided by the two reads that remain, which are
          # independent of the canvas and must AGREE; every other family keeps
          # the width answer unchanged. `resolved` is what the four checks below
          # score, so a leak still fails: a family absent by all three reads is
          # False here exactly as it was before.
          b_collided = {name: collided_families(ctxs[name], b_naming[name],
                                                f"bare launch / {name} context")
                        for name in ("mac", "win")}
          b_resolved = {}
          for name in ("mac", "win"):
              r, out = ctxs[name], {}
              for f in PROBES:
                  if f not in b_collided[name]:
                      out[f] = r["measure"][f]
                      continue
                  ff, st = bool(r["fontfaces"][f]), r["status"][f] == "loaded"
                  assert ff == st, (
                      f"bare launch / {name} context: {f!r} renders at the fallback face's "
                      f"advance, so width cannot decide it, and the two reads that remain "
                      f"DISAGREE: document.fonts.check={ff} FontFace.status={r['status'][f]!r}. "
                      "Nothing in this run can say whether the family resolved.")
                  out[f] = ff
              b_resolved[name] = out
              print(f"  [bare launch / {name} context] resolved (width, plus the two "
                    f"non-canvas reads where width collides): {out}")
          mac_res, win_res = b_resolved["mac"], b_resolved["win"]

          b_failures = []
          # Same tripwire arm (a) carries for MAC_ONLY, added for symmetry: a mac
          # family that the presence probe says is THERE in the win context is a
          # leak whatever the two non-canvas reads say. Without this, a family in
          # b_collided whose reads both say absent scores False and passes
          # silently, while arm (a) in the same shape goes red.
          for f in MAC_ONLY:
              if b_naming["win"]["present"][f]:
                  b_failures.append(
                      f"the win context resolved {f!r}: the presence probe (source "
                      f"{b_naming['win']['presentSource']}) says it is there, whatever the "
                      f"width comparison read -- {b_naming['win']['present']}")
          if not all(mac_res[f] for f in MAC_ONLY):
              b_failures.append(
                  "a mac context cannot resolve macOS families under a bare launch -- the "
                  f"per-context filter regressed: {mac_res}")
          if any(mac_res[f] for f in WIN_ONLY):
              b_failures.append(
                  f"the mac context still resolves Windows-only families: {mac_res}")
          if not all(win_res[f] for f in WIN_ONLY):
              b_failures.append(f"win context: {win_res}")
          if any(win_res[f] for f in MAC_ONLY):
              b_failures.append(
                  f"the win context resolves macOS-only families: {win_res}")
          print(f"  (b) per-context narrowing:  {'RED' if b_failures else 'GREEN'} -- {b_failures}")
          if b_failures:
              tripwires.append(f"(b) per-context narrowing: {b_failures}")
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Arm (b2): arm (b) above, unchanged, closes each context
          # before creating the next -- and that sequence turns out to
          # be the one case in which the per-context leak (#83) cannot
          # happen (confirmed directly: mac's content process is torn
          # down and win gets a fresh one, verified by watching
          # `pgrep -af contentproc` across the close(), not inferred).
          # A caller that opens several contexts in one browser keeps
          # them alive at once -- that is the entire reason to use
          # contexts instead of separate launches -- so arm (b)'s green
          # documents a real and worth-keeping case, but not the one
          # #44's per-context feature has to hold up in.
          #
          # Arm (b2) is the SAME probe(), the SAME MAC_ONLY/WIN_ONLY
          # families, the SAME processCount=1 launch as arm (b) --
          # differing in exactly one thing: the mac (donor) context is
          # NOT closed before the win (recipient) context is created
          # and probed. Confirmed by a single-variable pair (this
          # task's own discriminator): reference ordering alone does
          # not reproduce the leak; donor liveness alone does, fully,
          # every family. This arm was EXPECTED RED on every build until
          # #83 was fixed -- it was never a broken test, it was the
          # honest state of the feature in the shape it is actually
          # used. This PR diagnosed #83 and then closed it: the leak ran
          # through gfxFcPlatformFontList::mFcSubstituteCache, a
          # process-global name->family memo keyed without the user
          # context and consulted BEFORE the base
          # FindAndAddFamiliesLocked, so the gate was never asked at all
          # -- which is why the win half of run 34428270062 emitted zero
          # `CAMOU-FL gate` lines while still resolving the donor's
          # families. With the memo keyed on the context and flushed in
          # SetFontList, this arm is EXPECTED GREEN and a leak red here
          # is a regression in that fix -- see EXPECTED_GREEN at the end
          # of this step.
          # Kept as its own arm rather than folded into arm (b), so a
          # regression in the CLOSED-donor case (arm (b) going red)
          # remains separately visible from this one.
          b2_mark = log_mark()
          b2_win_mark = None
          with sync_playwright() as pw:
              b2 = pw.firefox.launch(
                  executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                  firefox_user_prefs={"dom.ipc.processCount": 1},
                  env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
              # #83 root-cause instrumentation. The gate can only block
              # anything when `ctx != 0 && HasFontList(ctx)` -- under this
              # bare launch there is no `fonts` key, so its fallback branch
              # reads an empty sLaunchFonts and returns true for everything.
              # So a context that never installs its own list is allowed
              # every family, and would look exactly like a leak.
              # setFontList() is one-shot per user context: the handler
              # calls DisableFunction(), which writes roverfox.s.* -- and
              # cross-process-storage.patch makes that pref CROSS-PROCESS.
              # Record whether each context's init script actually found and
              # called the function, so a missing list is distinguishable
              # from a bypassed gate.
              # Report through the DOM, not a JS global. page.evaluate()
              # runs in an isolated world (that is Camoufox's core feature,
              # guarded by the #51/#62 step above), so a `window.__x` the
              # init script sets in the main world is invisible to the
              # read -- the first version of this instrumentation reported
              # saw=False for every context and looked like a finding.
              # The DOM is shared between worlds; JS globals are not.
              INIT = ('(() => { const saw = (typeof window.setFontList === "function"); '
                      'let applied = false; '
                      'if (saw) { window.setFontList(%s); applied = true; } '
                      'const mark = () => { try { document.documentElement.setAttribute('
                      '"data-fl", JSON.stringify({saw: saw, applied: applied})); } catch (e) {} }; '
                      'mark(); document.addEventListener("DOMContentLoaded", mark); })()')
              ctx2_mac = b2.new_context()
              ctx2_mac.add_init_script(INIT % json.dumps(",".join(FONTS["mac"])))
              pg_mac = ctx2_mac.new_page()
              mac2 = probe(pg_mac, "b2-mac")
              fl_mac = pg_mac.evaluate('() => document.documentElement.getAttribute("data-fl")')
              # Deliberately NOT closed here -- the one variable this
              # arm tests. Arm (b) above calls ctx.close() at this exact
              # point, before the next context exists.
              # Second mark, taken between the donor's render and the
              # recipient's: gate lines carry no uri, so a whole-launch
              # histogram cannot say which context a gate answered for. Lines
              # after this mark are the win half -- with the caveat that the
              # donor is deliberately still alive and its process can keep
              # logging, so this narrows the window rather than isolating it.
              b2_win_mark = log_mark()
              ctx2_win = b2.new_context()
              ctx2_win.add_init_script(INIT % json.dumps(",".join(FONTS["win"])))
              pg_win = ctx2_win.new_page()
              win2 = probe(pg_win, "b2-win")
              fl_win = pg_win.evaluate('() => document.documentElement.getAttribute("data-fl")')
              print(f"  [donor-alive / #83 instrumentation] mac setFontList {fl_mac}")
              print(f"  [donor-alive / #83 instrumentation] win setFontList {fl_win}")
              fl_win_d = json.loads(fl_win) if fl_win else {"saw": None, "applied": None}
              # NOTE: saw/applied are read AFTER probe() navigates, which is the
              # init script's SECOND invocation. setFontList is one-shot per user
              # context by design and Playwright runs init scripts on every
              # navigation, so invocation 1 (on about:blank) consumes it and this
              # reading always shows it absent. Measured directly: first
              # invocation has it, second does not. So saw=false here does NOT
              # mean the list was never installed -- it was. Kept as a record of
              # a wrong reading, not as a signal.
              #
              # THE KEYING DISCRIMINATOR (fix wave 6, review I2). Everything
              # above this point measures the FLUSH, not the key: win's
              # setFontList runs before win renders and clears the whole
              # process memo, so ClearFontNameCaches() alone turns this arm
              # green with the per-context key removed. The shape that needs
              # the key is the reverse one -- the DONOR rendering after the
              # recipient has stored its own entries. Without a `:<ctx>`
              # suffix mac's next lookup hits win's entries and is served
              # win's answers, including win's stored DENIAL of mac's own
              # families (an empty array, which reads as "refused"). The donor
              # context is still open, so this costs no launch and no context.
              #
              # WHAT WOULD MAKE THIS GREEN WRONGLY (CLAUDE.md lesson 4):
              #  * A CACHED FONT GROUP. If the re-probe reused mac's first
              #    render's font groups it would never consult the memo again
              #    and would reprint mac's original answers whatever the memo
              #    now holds -- a guaranteed green that measures nothing.
              #    probe()'s JS does build a fresh <canvas> per call, but
              #    whether that forces a new gfxFontGroup is a Gecko detail I
              #    have NOT read, so this runs in a NEW PAGE: a new document
              #    has its own presentation context and cannot reuse another
              #    document's font groups.
              #  * A DIFFERENT PROCESS. mFcSubstituteCache is a per-process
              #    singleton, so a re-probe page in another content process
              #    could not see win's entries and would print "unchanged"
              #    vacuously. The tab pids are recorded and asserted below,
              #    the way arms (j)/(j2) do, not assumed.
              #  * A DEAD RENDER. Scored through check_signal with the rest of
              #    the arm, so nothing-resolved is setup invalid, not a pass.
              # The init script is on the CONTEXT, so it runs again here;
              # setFontList is one-shot per user context, so it finds the
              # binding gone and installs nothing. That is what this needs --
              # a reinstall would flush the memo and erase what is being
              # probed.
              b2_reprobe_mark = log_mark()
              b2_pids_before = tab_pids()
              pg_mac2 = ctx2_mac.new_page()
              mac_after = probe(pg_mac2, "b2-reprobe")
              b2_pids_after = tab_pids()
              ctx2_mac.close()
              ctx2_win.close()
              b2.close()

          print(f"  [donor-alive / mac context] measure {mac2['measure']}")
          print(f"  [donor-alive / win context, donor still open] measure {win2['measure']}")
          print(f"  [b2 / mac-after-win] measure {mac_after['measure']}")
          print(f"  [b2 / mac-after-win] tab pids before / after the re-probe page: "
                f"{sorted(b2_pids_before) if not isinstance(b2_pids_before, str) else b2_pids_before}"
                f" / "
                f"{sorted(b2_pids_after) if not isinstance(b2_pids_after, str) else b2_pids_after}")

          # #83 log slice. The question this answers is the one arm (b2)'s
          # measurement cannot: when the win context rendered, which ctx= did
          # the gate see, and which font group served it. The `group` line
          # carries hop= (which link of provider -> document -> inner window ->
          # BrowsingContext produced the id, or where it broke) and uri= (which
          # context, via probe()'s marker); the `gate` histogram says which id
          # CamouIsFontAllowed was actually asked about. ctx=0 in either is the
          # fail-open case: CamouIsFontAllowed treats 0 as "no per-context
          # list" and allows every family (CLAUDE.md lesson 5).
          for _m in ("b2-mac", "b2-win", "b2-reprobe"):
              for _ln in camou_fl(b2_mark, "CAMOU-FL group", _m, limit=6):
                  print(f"  [b2 / #83 log / {_m}] {_ln}")
          print(f"  [b2 / #83 log] gate ctx histogram, whole launch: "
                f"{ctx_histogram(b2_mark, 'gate')}")
          print(f"  [b2 / #83 log] gate ctx histogram, win half only: "
                f"{ctx_histogram(b2_win_mark, 'gate') if b2_win_mark is not None else 'mark never taken'}")
          print(f"  [b2 / #83 log] scope-switch lines: "
                f"{camou_fl(b2_mark, 'CAMOU-FL scope-switch', limit=8) or 'none'}")
          print(f"  [b2 / #83 log] set lines (per-context lists installed): "
                f"{camou_fl(b2_mark, 'CAMOU-FL set ', limit=8) or 'none'}")
          # What the log can and cannot show about #83's fix.
          #
          # BEFORE the fix, run 34428270062's win half resolved the donor's
          # families with ZERO `CAMOU-FL gate` lines: the memo answered every
          # direct-named lookup before the gate was reached. The positive
          # signal a working fix leaves is therefore the gate being ASKED
          # again -- `gate ctx=<win> ... key=<probe family>` lines present in
          # the win half, `allowed=1` for win's own Segoe UI.
          #
          # `fc-subst hit=1` lines are PRINT-ONLY and are NOT a failure
          # criterion. Nothing scores off them (fc_subst_hits appears only
          # inside print()). Once a context looks a family up twice it hits
          # its OWN `:<ctx>`-suffixed entry, which is the memo working as
          # scoped, so "no hits" is not what a correct fix looks like. Nor is
          # "the key's trailing ctx matches the line's ctx=" a leak detector:
          # both are read from the same thread-local with nothing in between,
          # so they agree by construction, and their absence is a REGRESSION
          # TRIPWIRE for someone later removing the keying, not a measurement.
          # The one reading that does carry information: a `hit=1` line whose
          # key ends in `:0` for a context that DID install a list is the
          # inherited context-0 fail-open (CLAUDE.md lesson 5), which this fix
          # does not close.
          #
          # The slice below is a TIME WINDOW, not a context filter: the donor
          # is deliberately still alive, so a line it emits inside the win
          # window prints under the win label. Each line carries its own
          # ctx=, which is what to read.
          print(f"  [b2 / #83 log] fc-subst hits on probe families, win half of the "
                f"launch (informational, scores nothing; read each line's ctx=): "
                f"{fc_subst_hits(b2_win_mark) if b2_win_mark is not None else 'mark never taken'}")
          print(f"  [b2 / #83 log] gate lines for 'segoe ui', win half "
                f"(must be PRESENT after the fix -- the gate is asked again): "
                f"{camou_fl(b2_win_mark, 'CAMOU-FL gate', 'key=segoe ui', limit=4) if b2_win_mark is not None else 'mark never taken'}")
          # The re-probe half: this is where the per-context KEY, as opposed to
          # the flush, is the only thing that can give the right answer.
          print(f"  [b2 / mac-after-win] gate lines for 'geneva', re-probe half "
                f"(must be PRESENT -- the donor re-gates its own family): "
                f"{camou_fl(b2_reprobe_mark, 'CAMOU-FL gate', f'key={MAC_ONLY[2].lower()}', limit=4)}")
          print(f"  [b2 / mac-after-win] fc-subst hits on probe families, re-probe half "
                f"(informational; a key ending `:0` here is the context-0 fail-open): "
                f"{fc_subst_hits(b2_reprobe_mark)}")

          # ---- readings the re-probe SCORES on, derived from the same slices --
          # (fix wave 7; each is printed as well, so a reader can check the
          # derivation rather than take the verdict's word for it)

          def ctx_token(line):
              """The `ctx=<n>` token of a CAMOU-FL line, or None."""
              return next((t for t in line.split() if t.startswith("ctx=")), None)

          # The two contexts' ids, read from their own `set` lines. R8 (from the
          # re-review of 98e64ed): camou_fl concatenates each FILE's matches in
          # filename order, so "the first line" is time order only while both
          # halves land in one log file. Mac's line is identified by TIME
          # instead -- it is the one in the whole-launch window that is not in
          # the win-mark window -- and the two ids being equal is scored below.
          _mac_sets = camou_fl(b2_mark, "CAMOU-FL set ", limit=None)
          _win_sets = (camou_fl(b2_win_mark, "CAMOU-FL set ", limit=None)
                       if b2_win_mark is not None else [])
          _mac_only_sets = [ln for ln in _mac_sets if ln not in _win_sets]
          b2_mac_ctx = ctx_token(_mac_only_sets[0]) if _mac_only_sets else None
          b2_win_ctx = ctx_token(_win_sets[0]) if _win_sets else None
          # R2: any re-install of the DONOR's list after the re-probe mark.
          b2_reinstall = next(
              (ln for ln in camou_fl(b2_reprobe_mark, "CAMOU-FL set ", limit=None)
               if b2_mac_ctx and b2_mac_ctx in ln.split()), None)
          # R4: did the recipient actually reach a gated read path for these
          # families? R7 (re-review): a `gate` line shows that SOME gated read
          # path ran for that family under that context -- CamouIsFontAllowed
          # has nine call sites and only the one inside
          # FindAndAddFamiliesLocked (gfxPlatformFontList.cpp:2034) is on the
          # route that writes mFcSubstituteCache. A canvas render of a directly
          # named family does take that route, so the line is good evidence the
          # entry was written; it is not a proof, and it is used here only to
          # rule out the vacuous case where the recipient wrote nothing at all
          # for the re-probe to hit.
          b2_win_pop = [ln for ln in camou_fl(b2_win_mark, "CAMOU-FL gate", limit=None)
                        if b2_win_ctx and b2_win_ctx in ln.split()
                        and any(f"key={k}" in ln.lower() for k in FC_PROBE_KEYS)]
          # R3: hop= / ctx= of the re-probe's own font groups, which is what
          # separates a memo leak from a context-0 fail-open on that page.
          b2_reprobe_hops = sorted({
              f"{ctx_token(ln)} {next((t for t in ln.split() if t.startswith('hop=')), 'hop=?')}"
              for ln in camou_fl(b2_reprobe_mark, "CAMOU-FL group", "b2-reprobe", limit=None)})
          print(f"  [b2 / mac-after-win] derived: mac {b2_mac_ctx}, win {b2_win_ctx}, "
                f"donor list re-installed after the mark: {b2_reinstall or 'no'}, "
                f"win gate lines on probe families: {len(b2_win_pop)}, "
                f"re-probe font groups: {b2_reprobe_hops or 'none captured'}")

          # M1 (from this task's review): until now `b2_leaked` was this arm's
          # ONLY source of failure, so a launch that rendered nothing gave
          # win2["measure"] all-False, the arm printed GREEN, and the triage
          # table announced that #83 "may be fixed" while the step passed.
          # These are arm (b2r)'s own two setup checks -- its check_signal
          # try/except and its C2 donor assertion -- applied to this arm's
          # contexts. Collected, never hard-asserted: an AssertionError here
          # would kill the script before arms (e) through (k) ever run.
          #
          # R6 (re-review of 98e64ed): the preconditions are in TWO groups and
          # they gate different verdicts. `b2_leaked` -- this arm's primary #83
          # signal -- is derived from canvas widths alone and depends on the
          # fontlist log for nothing, so only the WIDTH preconditions may
          # suppress it. The log-derived preconditions gate the re-probe half
          # and only the re-probe half. Getting this wrong is not a false green
          # but the mirror of the problem C5 solves: zero recipient `gate` lines
          # on the probe families is EXACTLY what the pre-fix leak looks like
          # (run 34428270062, and structurally guaranteed on a regression --
          # the donor probes all six families first, so an unkeyed memo answers
          # every one of the recipient's lookups and the gate is never
          # reached). Gating the width verdict on it would report a regression
          # as a capture failure and never print the leak.
          b2_width_bad, b2_reprobe_bad = [], []
          for _lab, _r in (("mac donor", mac2), ("win recipient", win2)):
              try:
                  check_signal(f"b2 / {_lab}", _r)
              except AssertionError as exc:
                  b2_width_bad.append(f"arm (b2) no signal: {exc}")
          if not all(mac2["measure"][f] for f in MAC_ONLY):
              b2_width_bad.append(
                  f"arm (b2) setup invalid: the mac donor resolved {mac2['measure']} -- "
                  f"it never resolved the macOS-only families, so there was nothing for "
                  f"win to leak and win's clean result is vacuous. Same check arm (b2r) "
                  f"makes for the same reason (CLAUDE.md lesson 4, donor side).")

          # ---- re-probe-half preconditions ------------------------------------
          try:
              check_signal("b2 / mac after win", mac_after)
          except AssertionError as exc:
              b2_reprobe_bad.append(f"arm (b2) no signal (re-probe half only): {exc}")
          # The re-probe is only a measurement if it shared the donor's content
          # process: mFcSubstituteCache is a per-process singleton, so a page in
          # a different process cannot see win's entries and would report the
          # donor "unchanged" no matter what the memo holds.
          if isinstance(b2_pids_before, str) or isinstance(b2_pids_after, str):
              b2_reprobe_bad.append(
                  f"arm (b2) setup invalid (re-probe half only): could not read the "
                  f"content-process table "
                  f"({b2_pids_before} / {b2_pids_after}), so the re-probe cannot be shown "
                  f"to have run where win's memo entries live.")
          elif (b2_pids_after - b2_pids_before) or not b2_pids_before:
              # R1 (re-review of 1202d8c): `or not b2_pids_before` is the clause
              # arms (i2)/(j)/(j2) all carry and this one had dropped.
              # tab_pids() returns an empty SET -- not the "ERR:" string --
              # whenever pgrep succeeds but no line's last field is "tab", and
              # set() - set() is falsy, so without this the arm would assert
              # co-residency on zero evidence.
              b2_reprobe_bad.append(
                  f"arm (b2) setup invalid (re-probe half only): the donor re-probe cannot "
                  f"be shown to have "
                  f"shared the donor's content process. Tab pids were "
                  f"{sorted(b2_pids_before)} before and {sorted(b2_pids_after)} after -- "
                  f"either a new process appeared, or no tab process was visible at all. "
                  f"mFcSubstituteCache is a per-process singleton, so an 'unchanged' "
                  f"result from another process is vacuous.")
          # R2 (re-review): the whole re-probe rests on NOTHING having flushed
          # the memo between win's render and it. setFontList is one-shot per
          # user context, so the init script on the re-probe page should find
          # no binding and install nothing -- but that is prose, and if it ever
          # failed, SetFontList would clear both memos, mac would re-resolve
          # through its own gate, the pattern would be unchanged and this arm
          # would print GREEN having measured nothing. The decisive line is
          # already emitted: a `CAMOU-FL set` line for the MAC context after
          # the re-probe mark. Qualified by context id, not by the mark alone,
          # because camou_fl slices by byte offset and the donor is alive by
          # design.
          #
          # R5, residual: "no new pid appeared" does not rule out two
          # pre-existing tab processes with mac and win split between them and
          # the re-probe landing in mac's. Under dom.ipc.processCount=1 there
          # should be exactly one; the pids are printed, so a reader can see it.
          if b2_mac_ctx is None:
              b2_reprobe_bad.append(
                  f"arm (b2) setup invalid (re-probe half only): no `CAMOU-FL set` line "
                  f"was captured for the "
                  f"donor's own list, so this arm cannot show that nothing flushed the "
                  f"memo between win's render and the re-probe -- and a flush would make "
                  f"the re-probe's 'unchanged' result vacuous. Either the fontlist log "
                  f"module did not capture, or this build predates the `CAMOU-FL set` "
                  f"line: check the dump step's `set` count.")
          elif b2_reinstall:
              b2_reprobe_bad.append(
                  f"arm (b2) setup invalid (re-probe half only): the donor's list was "
                  f"RE-INSTALLED after the "
                  f"re-probe mark ({b2_reinstall!r}). SetFontList flushes both font-name "
                  f"memos, so mac re-resolved through its own gate and its unchanged "
                  f"pattern says nothing about the per-context key.")
          # R4 (re-review): with no win entries in the memo there is nothing for
          # mac's second lookup to hit, so an unchanged donor is guaranteed
          # under a broken key as well as a working one. A `gate` line under
          # win's context for a probe family shows a gated read path ran for
          # that family in that context -- see R7 at the derivation above for
          # why that is evidence the entry was written rather than proof of it.
          # This gates the RE-PROBE half only (R6): zero such lines is also the
          # pre-fix leak's own signature, and the width verdict must still be
          # computed and printed when it happens.
          if not b2_win_pop:
              b2_reprobe_bad.append(
                  f"arm (b2) setup invalid (re-probe half only): no `CAMOU-FL gate` line "
                  f"under the recipient's "
                  f"context ({b2_win_ctx}) names any probe family, so nothing shows the "
                  f"recipient populated mFcSubstituteCache for the families the re-probe "
                  f"then looks up. With no entries to hit, the donor's unchanged pattern "
                  f"is guaranteed whatever the key does.")
          # R8: mac and win must be DIFFERENT contexts. If camou_fl's file
          # grouping put win's `set` line where mac's was expected, the two ids
          # come back equal and the reinstall check above looked for the wrong
          # context while still passing.
          if b2_mac_ctx is not None and b2_mac_ctx == b2_win_ctx:
              b2_reprobe_bad.append(
                  f"arm (b2) setup invalid (re-probe half only): the donor and recipient "
                  f"`set` lines both read {b2_mac_ctx}, so the two contexts cannot be told "
                  f"apart in the log and the reinstall check above was made against the "
                  f"wrong context.")

          # Scored only on a valid setup, as arm (b2r) does: a leak verdict read
          # off a dead donor is not a verdict. Note the two guards: the width
          # verdict needs only the width preconditions (R6).
          b2_failures = list(b2_width_bad) + list(b2_reprobe_bad)
          b2_leaked, b2_reverse, b2_lost, b2_gained = [], [], [], []
          if not b2_width_bad:
              b2_leaked = [f for f in MAC_ONLY if win2["measure"][f]]
          if not b2_width_bad and not b2_reprobe_bad:
              # The keying half: the donor's pattern after win rendered must be
              # the pattern it had before. The two directions do NOT mean the
              # same thing, which is why they are collected separately -- see
              # the failure message below.
              b2_lost = [f for f in MAC_ONLY if not mac_after["measure"][f]]
              b2_gained = [f for f in WIN_ONLY if mac_after["measure"][f]]
              b2_reverse = ([f"{f} (lost)" for f in b2_lost] +
                            [f"{f} (gained)" for f in b2_gained])
          if b2_leaked:
              b2_failures.append(
                  f"arm (b2)/#83: win resolved macOS-only families {b2_leaked} it was "
                  f"never allowed, with the donor (mac) context still open -- the "
                  f"production shape this feature exists for. See #83.")
          if b2_reverse:
              # R3 (re-review): a gained-only result does NOT establish a memo
              # leak. Two mechanisms fit this arm's data and it does not
              # discriminate between them by itself:
              #   * a MEMO LEAK serves mac win's stored entries, which include
              #     win's DENIAL of each MAC_ONLY family (an empty array) as
              #     well as win's allowance of WIN_ONLY -- so it produces BOTH
              #     directions;
              #   * a CONTEXT-0 FAIL-OPEN on the re-probe page (CLAUDE.md
              #     lesson 5) allows every family, so it produces GAINED-ONLY
              #     with MAC_ONLY intact, and would otherwise print this same
              #     message.
              # The discriminator is already captured: the re-probe's own
              # `group` lines. hop=bc with a non-zero ctx means the context id
              # chain resolved and the fail-open did not happen.
              _shape = ("BOTH directions" if b2_lost and b2_gained
                        else "GAINED-ONLY" if b2_gained else "LOST-ONLY")
              b2_failures.append(
                  f"arm (b2)/#83: the donor's SECOND render, in a new page of the still-open "
                  f"mac context after win had rendered, changed answers: {b2_reverse}. It "
                  f"read {mac_after['measure']} where its first render read "
                  f"{mac2['measure']}. Both renders ran in tab process(es) "
                  f"{sorted(b2_pids_after)}. Shape: {_shape}. TWO readings fit: a MEMO LEAK "
                  f"(mac served the recipient's entries -- the reverse leak the per-context "
                  f"mFcSubstituteCache key, not the SetFontList flush, is what closes), "
                  f"which produces BOTH directions; or a CONTEXT-0 FAIL-OPEN on the "
                  f"re-probe page (CLAUDE.md lesson 5), which produces GAINED-ONLY with the "
                  f"macOS families intact. Decide it on the re-probe's own font groups: "
                  f"{b2_reprobe_hops or 'NONE CAPTURED -- neither reading is supported'} "
                  f"(hop=bc with a non-zero ctx rules out the fail-open; ctx=0 or a "
                  f"hop=*-null is the fail-open).")
          print(f"  (b2) donor-alive per-context leak (#83):  "
                f"{'RED' if b2_failures else 'GREEN'} -- "
                f"{b2_failures or 'win correctly saw none of macOS-only families with the donor still open, and the donor re-probed after win with its own pattern unchanged'}")
          if b2_failures:
              tripwires.append(f"(b2) donor-alive per-context leak (#83): {b2_failures}")
              # Needed only because M1 above gave this arm red paths that are
              # NOT its verdict. Without it a `no signal` or `setup invalid`
              # red prints in the triage table as "RED (expected) ... #83
              # diagnosed", asserting a leak the arm never observed.
              note_unmeasured("(b2)", b2_failures, "arm (b2)/#83:")
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Arm (b2r): the #83 discriminator (code-recon C.4, hypothesis 1).
          # Same two contexts as arm (b2) directly above -- donor mac alive,
          # recipient win probed while it is still open -- with ONE variable
          # changed: `page = ctx.new_page()` runs BEFORE `ctx.add_init_script`,
          # so the first and only init-script invocation happens on the final
          # document, in the process that will render it.
          #
          # Hypothesis H1: the per-context list is process-local
          # (`static nsTHashMap sFontLists`, dom/base/FontListManager.cpp:14)
          # while the one-shot disable flag is cross-process
          # (RoverfoxStorageManager, FontListManager.cpp:79-81). A context whose
          # about:blank lands in P1 and whose real document lands in P2 installs
          # its list in P1, and P2 finds the setter already disabled, never
          # receives the list, and renders with HasFontList(ctx) == false --
          # where CamouIsFontAllowed returns true for every family
          # (gfxPlatformFontList.cpp:1232-1239). Under H1 this reorder makes the
          # leak disappear. Under H2 (gfxFontGroup::mUserContextId cached as 0,
          # gfxTextRun.cpp:1855-1875) ordering is irrelevant and the leak stays.
          #
          # WHAT WOULD MAKE THIS ARM GREEN WRONGLY (CLAUDE.md lesson 4):
          #  * Nothing about "win resolved no mac families" is self-validating.
          #    A context that never installed a list is allowed EVERYTHING, so
          #    that failure mode prints RED, not green -- and RED here reads as
          #    "H1 refuted", which is the wrong conclusion drawn from a broken
          #    setup. The arm therefore refuses to score at all unless the
          #    data-fl attribute proves the init script ran AND called
          #    setFontList on the very document that was measured. That is the
          #    exact reading error CLAUDE.md lesson 4 records twice: a global
          #    read back through page.evaluate (isolated world), and a one-shot
          #    setter already consumed by the about:blank invocation.
          #  * data-fl at about:blank must be ABSENT. With the reorder the init
          #    script is added after new_page(), so about:blank cannot carry it.
          #    A value there means the reorder did not take effect and this is
          #    arm (b2) under a different name -- scored as setup invalid.
          #  * The measurement itself is arm (b)'s own JS/PROBES, so a genuinely
          #    absent signal (nothing resolves, impossible family resolves) is
          #    still caught by check_signal below, exactly as in arm (b).
          #  * A VACUOUS DONOR. check_signal only asks whether a context
          #    resolved SOMETHING, and the mac donor satisfies that by resolving
          #    anything at all. If mac never resolved the macOS-only families
          #    there was nothing for win to leak, win's clean result is
          #    guaranteed under H1 and H2 alike, and a GREEN here means nothing.
          #    Arm (b), which is this arm's control, asserts it with its own
          #    `if not all(mac["measure"][f] for f in MAC_ONLY)`; this arm had
          #    dropped that assertion and now makes it too, as setup invalid.
          B2R_INIT = ('(() => { const saw = (typeof window.setFontList === "function"); '
                      'let applied = false; '
                      'if (saw) { window.setFontList(%s); applied = true; } '
                      'const mark = () => { try { document.documentElement.setAttribute('
                      '"data-fl", JSON.stringify({saw: saw, applied: applied})); } catch (e) {} }; '
                      'mark(); document.addEventListener("DOMContentLoaded", mark); })()')

          b2r = {}
          b2r_pids = {}
          b2r_marks = {}
          with sync_playwright() as pw:
              b2r_browser = pw.firefox.launch(
                  executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                  # EXACTLY arm (b2)'s launch (:901). Arm (b2) is this arm's
                  # control, and the discriminator is the reorder alone -- a
                  # second changed variable (fission.autostart, say) would make a
                  # difference between the two arms unattributable. Arms (j) and
                  # (j2) do change it, because there the spec asks for it and
                  # they carry their own controls.
                  firefox_user_prefs={"dom.ipc.processCount": 1},
                  env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
              b2r_ctxs = []
              for label in ("mac", "win"):
                  # One mark per context, taken before that context exists, so
                  # the win slice below is the win half of the launch.
                  b2r_marks[label] = log_mark()
                  ctx = b2r_browser.new_context()
                  b2r_ctxs.append(ctx)
                  page = ctx.new_page()
                  b2r_pids[f"{label}_after_new_page"] = tab_pids()
                  fl_blank = page.evaluate(
                      '() => document.documentElement.getAttribute("data-fl")')
                  ctx.add_init_script(B2R_INIT % json.dumps(",".join(FONTS[label])))
                  page.goto(f"data:text/html,<h1>b2r-{label}</h1>")
                  b2r_pids[f"{label}_after_goto"] = tab_pids()
                  fl_doc = page.evaluate(
                      '() => document.documentElement.getAttribute("data-fl")')
                  b2r[label] = {"fl_blank": fl_blank, "fl_doc": fl_doc,
                                "res": page.evaluate(JS, PROBES)}
                  # I2 (from this task's review): the #83 log slice is taken
                  # HERE, at the end of this context's iteration, not after the
                  # launch. camou_fl() has a start offset and no end bound, so
                  # a slice taken after the browser closed would read
                  # mac-mark -> end of launch: the mac window would strictly
                  # CONTAIN the win window, the two `gate` histograms could not
                  # differ in the direction that means anything, and
                  # `limit=4` -- the LAST four matches -- would print win's
                  # `set` line under the mac label. Taken here, the next
                  # context does not exist yet, so end-of-file IS this
                  # context's end bound.
                  #
                  # Two honest caveats, in the shape arm (b2)'s labels use:
                  #  * the browser is still running, so a line this context
                  #    emits after this point is not in its slice. `sync`
                  #    (fflush per line) makes that a tail of at most the
                  #    in-flight line rather than a whole buffer.
                  #  * for the win iteration the mac donor is deliberately
                  #    still alive and can still emit `gate` lines, which carry
                  #    no uri. So the win `gate` histogram is win's half of the
                  #    launch, not win alone. The `group` lines are exact
                  #    either way -- they attribute by uri=, not by offset.
                  for _ln in camou_fl(b2r_marks[label], "CAMOU-FL group",
                                      f"b2r-{label}", limit=6):
                      print(f"  [b2r / #83 log / b2r-{label}] {_ln}")
                  print(f"  [b2r / #83 log / {label}] gate ctx histogram, "
                        f"{label} half only: "
                        f"{ctx_histogram(b2r_marks[label], 'gate')}")
                  print(f"  [b2r / #83 log / {label}] set lines, {label} half only: "
                        f"{camou_fl(b2r_marks[label], 'CAMOU-FL set ', limit=4) or 'none'}")
                  # #83's fc-subst pair, read the same way as arm (b2)'s --
                  # see the long comment there. The gate line is the positive
                  # signal that the fix took: on the win iteration the gate
                  # must be ASKED again for win's own family. The fc-subst
                  # hits are print-only and score nothing -- a context that
                  # looks a family up twice hits its own `:<ctx>` entry, which
                  # is the memo working as scoped. Each half is a time window,
                  # not a context filter (the donor stays alive by design), so
                  # read each line's own ctx=.
                  print(f"  [b2r / #83 log / {label}] fc-subst hits on probe families, "
                        f"{label} half of the launch (informational, scores nothing; "
                        f"read each line's ctx=): {fc_subst_hits(b2r_marks[label])}")
                  print(f"  [b2r / #83 log / {label}] gate lines for 'segoe ui', "
                        f"{label} half (win must be PRESENT after the fix -- the gate "
                        f"is asked again): "
                        f"{camou_fl(b2r_marks[label], 'CAMOU-FL gate', 'key=segoe ui', limit=4)}")
                  # The donor (mac) is deliberately NOT closed -- that is the one
                  # variable arm (b2) isolates, and this arm must keep it.
              for ctx in b2r_ctxs:
                  ctx.close()
              b2r_browser.close()

          for label in ("mac", "win"):
              print(f"  [b2r / {label}] data-fl at about:blank (expect None): "
                    f"{b2r[label]['fl_blank']!r}")
              print(f"  [b2r / {label}] data-fl on the document under test "
                    f"(expect saw=true applied=true): {b2r[label]['fl_doc']!r}")
              print(f"  [b2r / {label}] measure {b2r[label]['res']['measure']}")
          print(f"  [b2r / pids] {b2r_pids}")

          # (The #83 log slice for this arm is printed inside the launch loop
          # above, one context at a time -- see the I2 comment there for why it
          # cannot be taken here.)

          b2r_failures = []
          for label in ("mac", "win"):
              # check_signal hard-asserts, and this arm sits in the
              # collect-then-assert region: an AssertionError here would kill the
              # script before arms (e)-(k), (i), (j), (j2) and (h') ever run, and
              # a whole Phase B run would be lost to it. Collect instead.
              try:
                  check_signal(f"b2r / {label}", b2r[label]["res"])
              except AssertionError as exc:
                  b2r_failures.append(f"arm (b2r) no signal: {exc}")
              if b2r[label]["fl_blank"] is not None:
                  b2r_failures.append(
                      f"arm (b2r) setup invalid: {label}'s about:blank already carried "
                      f"data-fl={b2r[label]['fl_blank']!r}, so the init script applied before "
                      f"the page existed -- the reorder this arm tests did not take effect, "
                      f"and this is arm (b2) under another name.")
              try:
                  fl = json.loads(b2r[label]["fl_doc"]) if b2r[label]["fl_doc"] else None
              except ValueError:
                  fl = None
              if not fl or not fl.get("saw") or not fl.get("applied"):
                  b2r_failures.append(
                      f"arm (b2r) setup invalid: {label}'s document under test reports "
                      f"data-fl={b2r[label]['fl_doc']!r} -- setFontList was not seen or not "
                      f"called on the document that was measured. That context has no list, "
                      f"is therefore allowed every family, and any 'leak' below would be an "
                      f"artefact of this setup rather than #83.")
              if label == "mac" and not all(b2r["mac"]["res"]["measure"][f] for f in MAC_ONLY):
                  # C2 (from this task's review): arm (b)'s own donor assertion
                  # -- its `if not all(mac["measure"][f] for f in MAC_ONLY)` --
                  # which this arm had dropped. A GREEN here reads "win
                  # resolved none of MAC_ONLY", which is evidence of anything
                  # only if the mac donor resolved them in the first place.
                  # Without this the Phase B gate would have read a vacuous
                  # GREEN as H1 CONFIRMED -- the
                  # "a reference is only a control if it is guaranteed to differ"
                  # failure of CLAUDE.md lesson 4, on the donor side. Geneva in
                  # particular has been the subject of two regression bisects on
                  # this repo (ca29ceb, fc07cd4), so this is not hypothetical.
                  b2r_failures.append(
                      f"arm (b2r) setup invalid: the mac donor resolved "
                      f"{b2r['mac']['res']['measure']} -- it never resolved the macOS-only "
                      f"families, so there was nothing for win to leak and win's clean result "
                      f"is vacuous.")
          if not b2r_failures:
              b2r_leaked = [f for f in MAC_ONLY if b2r["win"]["res"]["measure"][f]]
              if b2r_leaked:
                  b2r_failures.append(
                      f"arm (b2r)/#83: with the init script proven applied to the document "
                      f"under test (data-fl={b2r['win']['fl_doc']}), win STILL resolved "
                      f"macOS-only families {b2r_leaked} with the donor alive -- H1 is "
                      f"REFUTED; the leak survives the reorder and the cause is not process "
                      f"placement.")
          # C3 (from this task's review): a (b2r) RED has three distinct causes
          # and only one of them is a verdict. `no signal` (the check_signal
          # try/except above) and `setup invalid` (three variants, C2's donor
          # check included) both mean the arm measured nothing; reading either
          # as "the leak survives the reorder" would draw a conclusion from an
          # arm that never ran. The kind is computed here and printed on its
          # own `[b2r / kind]` line -- deliberately NOT a second line beginning
          # "  (b2r) ", which the readback grep would then pick up twice -- so
          # a reader reads one token instead of matching prose.
          #
          # The H1 vocabulary was Phase B's, where this arm WAS the #83
          # discriminator and its red was the measurement. H1 (the per-context
          # list is process-local, so the leak is process placement) was
          # REFUTED there and the real mechanism turned out to be the
          # fontconfig substitute memo, which is now keyed on the context. A
          # green here no longer confirms anything about process placement --
          # run 34435628304 had both contexts in ONE process and no leak --
          # so the strings say what the arm measures instead.
          if not b2r_failures:
              b2r_kind = "GREEN -- no cross-context leak in this shape"
          elif any(f.startswith("arm (b2r)/#83:") for f in b2r_failures):
              b2r_kind = "RED, leak -- the recipient was served the donor's answers"
          else:
              b2r_kinds = sorted({"no signal" if f.startswith("arm (b2r) no signal:")
                                  else "setup invalid" for f in b2r_failures})
              b2r_kind = ("RED, " + "/".join(b2r_kinds) +
                          " -- NEITHER, this arm measured nothing and refutes nothing")
          print(f"  [b2r / kind] {b2r_kind}")
          print(f"  (b2r) #83 discriminator (init script on the document under test):  "
                f"{'RED' if b2r_failures else 'GREEN'} -- "
                f"{b2r_failures or 'win saw none of the macOS-only families with the init script proven on the document under test; (b2r) measures the SetFontList flush, the per-context key is measured by (b2) donor re-probe'}")
          if b2r_failures:
              tripwires.append(f"(b2r) #83 discriminator: {b2r_failures}")
              # (b2r) had no unmeasured bookkeeping of its own, unlike (i2),
              # (j), (j2) and (k). Without this, a `no signal` or `setup
              # invalid` red -- the two b2r_kind values that measure NOTHING --
              # prints in the triage table as "RED (expected) ... #83
              # diagnosed", asserting a verdict the arm never reached. With it
              # the table says "RED but UNMEASURED" and withholds the claim.
              # "arm (b2r)/#83:" is the prefix ONLY the leak branch emits,
              # which is exactly note_unmeasured's contract.
              note_unmeasured("(b2r)", b2r_failures, "arm (b2r)/#83:")
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Step 0: the two gates Task 1 added inside gfxPlatformFontList
          # (GetFontList, GetFontFamilyList) have no arm reaching either.
          # Reachability, checked against the FIREFOX_152_0_4_RELEASE tag
          # (raw.githubusercontent.com/mozilla-firefox/firefox and
          # searchfox.org/mozilla-central, symbol layout unchanged for
          # this window):
          #
          #   GetFontList -- gfxPlatform::GetFontList() has exactly one
          #   caller, nsThebesFontEnumerator (gfx/src/
          #   nsThebesFontEnumerator.cpp:53,119), which implements
          #   nsIFontEnumerator. Every consumer of that interface --
          #   browser/components/preferences/config/accessibility.mjs,
          #   toolkit/content/preferences/Preference.mjs,
          #   toolkit/mozapps/preferences/fontbuilder.js -- is the
          #   chrome-privileged about:preferences font-picker UI.
          #   Instantiating nsIFontEnumerator needs Components.classes,
          #   which unprivileged page content never has. Chrome-only: no
          #   page-side probe can reach it. Unmeasured defence-in-depth;
          #   the gate stays, it is not verified by this guard.
          #
          #   GetFontFamilyList -- exactly one caller,
          #   gfx/thebes/gfxTextRun.cpp:2229, inside
          #   gfxFontGroup::GetDefaultFont()'s font-of-last-resort loop.
          #   GetDefaultFont() IS reached from ordinary content text
          #   shaping -- gfxFontGroup::GetFirstValidFont()'s own last
          #   resort (gfxTextRun.cpp:2326) and
          #   gfxFontGroup::FindFontForChar()'s fallback chain
          #   (gfxTextRun.cpp:3430) both call it -- so this one is not
          #   chrome-only the way GetFontList is. But its interesting
          #   branch -- "if CamouIsFontAllowed() filtered the list down
          #   to nothing, hand back the unfiltered one" -- only opens
          #   when a context's ENTIRE per-context family set is empty,
          #   one step before gfxTextRun.cpp's own next fallback
          #   (pfl->GetDefaultFontEntry(), a separate, non-per-context
          #   call) and two steps before a MOZ_CRASH
          #   ("unable to find a usable font"). Every context this guard
          #   builds installs a real, non-empty OS font list, so normal
          #   probes never approach that edge, and deliberately emptying
          #   a context's list to force it risks landing on the
          #   MOZ_CRASH side of that line inside a CI browser process
          #   rather than the unfiltered-fallback side. No arm is added
          #   for it here: both gates are unmeasured defence-in-depth,
          #   like GetFontList. Stated plainly: the last-resort branch
          #   deliberately returns every bundled OS's families, unfiltered,
          #   whenever filtering has emptied a context's set -- a hole by
          #   construction, not a bug Task 2 introduces or closes.
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Arms (e)-(h): the four read paths #44's H2 review found
          # ungated. Two design lessons from two earlier attempts, both
          # against this same run_id, before this shape:
          #
          #   1. One page per context, not one context serving four
          #      pages. Sharing ctx_mac across arms (e)-(h) let (e)'s
          #      @font-face rules for "Segoe UI"/"Helvetica Neue"
          #      shadow (g)'s later plain c.font lookups for those same
          #      names on the SAME document -- (g) measured the
          #      shadowed face, not the system family.
          #   2. Even with each arm on its OWN page, the per-context
          #      list still degraded by the 3rd page opened in a
          #      context that had ALREADY served earlier arms' pages:
          #      arm (g)'s own MAIN-THREAD measurement, on ITS page
          #      alone, came back identical for mac and win (every
          #      family "present" in both) -- the same allow-everything
          #      shape arm (b) shows only when a context's per-context
          #      list is entirely absent. Whatever `setFontList()`
          #      installs is not proven to survive a context serving
          #      more than one page. So every arm below gets a FRESH
          #      context of its own (one `setFontList()` call, one
          #      page, nothing else ever asked of that context) rather
          #      than sharing ctx_mac/ctx_win across arms. Arm (f) goes
          #      one step further and gives every measurement (mac,
          #      win, and the mac2 repeatability control) its own
          #      FRESH BROWSER LAUNCH, since a shared-context fix does
          #      not rule out a process-wide confound (e.g. progressive
          #      cmap-loading state shared by every context in one
          #      content process) -- and the first attempt at this
          #      repeatability control (contexts sharing one launch)
          #      still measured mac2 != mac on an identical list.
          # -----------------------------------------------------------
          JS_E = """async () => {
            // (e) CSS @font-face via a stylesheet rule, not a JS
            // FontFace object -- FontFaceSet::Check/::Add scope an
            // AutoFontListContext; InsertRuleFontFace (what a
            // stylesheet rule goes through during style flush) does
            // not. Both discriminating families are real markers -- an
            // invented name reports 'error' in every context and would
            // never disagree with anything. A third rule, "Tahoma", is
            // a positive control: it is in BOTH FONTS["mac"] and
            // FONTS["win"], so a genuinely working readback must never
            // report 'error' for it in either context -- unlike the
            // other two, its redness would mean the readback itself is
            // broken, not that the gate is missing, which is the wrong
            // kind of red for a tripwire whose job is to tell Task 3
            // what to fix.
            //
            // Discriminator for WHICH kind of broken, per code review:
            // Tahoma's rule is declared as a bare, unquoted CSS
            // identifier (valid -- it has no space) instead of a
            // quoted string, unlike Segoe UI/Helvetica Neue which MUST
            // be quoted (they contain a space). If FontFace.family
            // serializes it without quotes and its status comes back
            // correctly gated where the space-containing families do
            // not, that points hard at InsertRuleFontFace handing a
            // QUOTED family key to IsFontAllowed(). Separately, Calibri
            // (win-only, no spaces) is added via
            // document.fonts.add(new FontFace(...)) rather than a
            // stylesheet rule -- FontFaceSet::Add DOES get an
            // AutoFontListContext scope (Task 1's own patch), unlike
            // InsertRuleFontFace. If THAT path resolves Calibri
            // correctly per context, the per-context mechanism itself
            // works and whatever is wrong is specific to the CSS-rule
            // path's family key, not a missing scope in general.
            const sheet = document.createElement('style');
            sheet.textContent =
              '@font-face { font-family: "Segoe UI"; src: local("Segoe UI"); }' +
              '@font-face { font-family: "Helvetica Neue"; src: local("Helvetica Neue"); }' +
              '@font-face { font-family: Tahoma; src: local(Tahoma); }';
            document.head.appendChild(sheet);
            document.body.offsetHeight;
            await document.fonts.ready;
            const out = {};
            const rawFamilies = [];
            for (const f of document.fonts) {
              rawFamilies.push(f.family);
              // FontFace.family serializes as a CSS string, quotes
              // included -- strip them or every lookup below misses.
              const fam = f.family.replace(/^["\']|["\']$/g, '');
              out[fam] = f.status;
            }

            const jsFace = new FontFace('Calibri', 'local(Calibri)');
            document.fonts.add(jsFace);
            document.body.offsetHeight;
            await document.fonts.ready;

            return {status: out, rawFamilies: rawFamilies, jsFaceStatus: jsFace.status};
          }"""

          JS_F = """() => {
            // (f) codepoint fallback: neither context's non-CJK
            // families cover U+FF71, so this forces
            // SystemFindFontForChar / GlobalFontFallback, which
            // nothing gates. Own browser launch, own context, one
            // page -- see the design note above.
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "NoSuchFamilyAtAll"';
            return c.measureText('\uff71').width;
          }"""

          # Positive control for arm (f), added after a review finding: JS_F's
          # width alone never proved U+6F22 can render as a real glyph at all
          # -- if it's tofu everywhere, no gate could ever make mac/win
          # diverge. Explicitly names each context's own CJK family (real,
          # allowed, per WIN_ONLY/MAC_ONLY -- WIN_ONLY needed "MS Gothic"
          # added for this control to even be attemptable, since it had no
          # CJK-covering entry before). If this width equals JS_F's
          # impossible-family fallback width, the probe measures tofu in
          # both cases and arm (f) cannot discriminate regardless of the
          # gate's correctness.
          JS_F_CONTROL_MAC = """() => {
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "PingFang HK"';
            return c.measureText('\uff71').width;
          }"""

          JS_F_CONTROL_WIN = """() => {
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "MS Gothic"';
            return c.measureText('\uff71').width;
          }"""

          # Diagnostic (not scored, no assert): does JS_F's own measurement
          # change if repeated after a delay on the SAME page? Source trace
          # (gfx/thebes/SharedFontList.h: IsFullyInitialized() requires a
          # computed character map; gfx/thebes/gfxPlatformFontList.cpp's
          # GlobalFontFallback shared-list loop skips any family that isn't
          # fully initialized and only fires an ASYNC StartCmapLoadingFromFamily
          # for it -- gfx.font_rendering.fallback.async defaults to true) says
          # a brand-new page's first-ever fallback call may race ahead of
          # cmap loading for every family except whatever few were already
          # touched during startup, and never reach a genuinely-present,
          # genuinely-allowed CJK family at all. If `delayed` differs from
          # `immediate` here, that race is the reason arm (f) cannot
          # discriminate on this harness, independent of gate correctness.
          JS_F_RACE = """async () => {
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "NoSuchFamilyAtAll"';
            const immediate = c.measureText('\uff71').width;
            await new Promise(r => setTimeout(r, 3000));
            const delayed = c.measureText('\uff71').width;
            return {immediate: immediate, delayed: delayed};
          }"""

          # Follow-up diagnostic: JS_F_RACE (this same run's earlier result,
          # mac only) confirmed the value changes over time on one page --
          # 30.533 immediate, 41.517 after 3s. But a fixed sleep is a
          # diagnostic, not something a guard can rely on for determinism,
          # and one context alone can't say whether the ASYMPTOTIC value
          # discriminates mac from win. An earlier version of this
          # diagnostic polled until the measurement stopped changing (3
          # consecutive identical reads) -- removed after CI showed it
          # stopped at a TEMPORARY plateau (polls=3, samples all 30.533,
          # exited in under a second) while JS_F_RACE's fixed 3s delay in
          # the SAME run still showed 41.517 -- the underlying process
          # changes state on a multi-second timescale, so short-run
          # stability is not convergence. This samples on a FIXED window
          # (no early-stop logic at all) long
          # enough to clear that plateau -- 20 samples, 500ms apart, 10s
          # total -- and reports the raw series plus the final value, for
          # mac, win, and mac2, to answer directly: does the eventual value
          # discriminate context, or does everything converge to the same
          # number regardless of which context is asking?
          JS_F_FINAL = """async () => {
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "NoSuchFamilyAtAll"';
            const samples = [];
            for (let i = 0; i < 20; i++) {
              samples.push(c.measureText('\uff71').width);
              await new Promise(r => setTimeout(r, 500));
            }
            const refs = {};
            for (const fam of ['monospace', 'sans-serif', 'serif']) {
              c.font = '48px ' + fam;
              refs[fam] = c.measureText('\uff71').width;
            }
            return {final: samples[samples.length - 1], samples: samples, refs: refs};
          }"""

          # Bisection (team-lead directive): the mac context's fallback
          # value (41.517) is not PingFang HK's own width (48, per the
          # positive control) -- something ELSE is serving U+6F22 in the
          # mac context. Identify it by naming, not inferring: measure
          # U+6F22 explicitly against every CJK-capable family actually
          # present in bundle/fonts/ across all three bundled OSes (exact
          # family names extracted locally via fontTools from the real
          # .ttf/.ttc/.otf files -- not guessed), in the MAC context. If a
          # name outside MAC_ONLY/FONTS["mac"] measures 41.517, the gate
          # leaks; if nothing does, fallback is reaching something not in
          # the bundle at all (a runner font).
          JS_F_BISECT = """() => {
            const c = document.createElement('canvas').getContext('2d');
            // ONLY families whose own cmap covers the probe codepoint.
            // Naming a family that does NOT cover it measures whatever
            // codepoint fallback finds, not that family's advance, so such a
            // name is a fallback reading mislabelled as a family reference
            // (CLAUDE.md lesson 4). U+FF71 coverage read locally with
            // fontTools off bundle/fonts/: these cover it; Hiragino Sans GB,
            // Heiti SC, Heiti TC, Apple SD Gothic Neo, SimSun, NSimSun and
            // Malgun Gothic do NOT and were dropped from this list when the
            // codepoint changed from U+6F22.
            const candidates = [
              'PingFang HK', 'PingFang SC', 'PingFang TC',
              'MS Gothic', 'MS PGothic', 'MS UI Gothic', 'Yu Gothic',
              'Microsoft YaHei', 'Microsoft JhengHei',
              'Noto Sans SC', 'Noto Sans TC', 'Noto Sans JP', 'Noto Sans KR',
            ];
            const widths = {};
            for (const fam of candidates) {
              c.font = '48px "' + fam + '"';
              widths[fam] = c.measureText('\uff71').width;
            }
            return widths;
          }"""

          JS_G = """async () => {
            // (g) worker / OffscreenCanvas: GetDocument() is null off
            // the main thread, so the context id falls to 0 there and
            // the per-context list is never consulted. Verdict
            // compares the worker against arm (b)'s trusted per-
            // context ground truth, not against this page's own main-
            // thread reading -- printed here for the record, but see
            // the design note above on why it cannot be trusted as a
            // baseline on its own.
            //
            // The worker is spawned and awaited FIRST, before this
            // page's main thread has touched any of these families at
            // all -- if Gecko memoizes a (family, context) resolution
            // anywhere below the per-call IsFontAllowed check, a
            // worker whose own context propagation were genuinely
            // broken could otherwise read a cache entry the main
            // thread's correctly-gated lookup had just warmed, and
            // produce this exact symmetric per-context-correct data
            // for the wrong reason. Doing gMain second removes that
            // path entirely: nothing on this page has resolved any of
            // these families before the worker answers.
            //
            // The worker reports its own identity alongside the widths
            // -- self.constructor.name and typeof document -- so a
            // silent fallback to a main-thread measurement (this
            // OffscreenCanvas is created INSIDE the worker, never
            // transferred in from the page) fails loudly instead of
            // scoring a vacuous green.
            const workerSrc = `onmessage = () => {
              const c = new OffscreenCanvas(8, 8).getContext('2d');
              // The worker's own baseline, not the page's -- these run on
              // different threads and a cross-thread baseline is only a
              // valid reference if the two sides are guaranteed to agree.
              // They aren't: gfxTextRun.cpp special-cases pref-font
              // resolution for worker threads (GetDefaultGeneric), so a
              // worker's plain 'monospace' width is not proven equal to
              // the main thread's without measuring it directly here.
              c.font = '48px monospace';
              const wBaseline = c.measureText('mmmmmmmmmmlli').width;
              const widths = {};
              for (const f of ['Segoe UI', 'Helvetica Neue', 'Tahoma']) {
                c.font = '48px "' + f + '", monospace';
                widths[f] = c.measureText('mmmmmmmmmmlli').width;
              }
              postMessage({widths: widths, baseline: wBaseline,
                          ctor: self.constructor.name,
                          docType: typeof document});
            }`;
            const gWorker = await new Promise((resolve, reject) => {
              const w = new Worker(URL.createObjectURL(
                new Blob([workerSrc], {type: 'text/javascript'})));
              const timer = setTimeout(
                () => reject(new Error('worker never responded (10s)')), 10000);
              w.onmessage = (ev) => { clearTimeout(timer); resolve(ev.data); };
              w.onerror = (ev) => { clearTimeout(timer); reject(new Error('worker error: ' + ev.message)); };
              w.postMessage(null);
            });

            // Only now -- after the worker has already answered -- does
            // this page's main thread touch any of these families.
            const c = document.createElement('canvas').getContext('2d');
            const s48 = 'mmmmmmmmmmlli';
            const baseline48 = (() => {
              c.font = '48px monospace';
              return c.measureText(s48).width;
            })();
            const gMain = {};
            for (const f of ['Segoe UI', 'Helvetica Neue', 'Tahoma']) {
              c.font = '48px "' + f + '", monospace';
              gMain[f] = c.measureText(s48).width;
            }
            return {gMain: gMain, gWorker: gWorker.widths,
                    gWorkerBaseline: gWorker.baseline, gWorkerCtor: gWorker.ctor,
                    gWorkerDocType: gWorker.docType, baseline48: baseline48};
          }"""

          JS_H = """async () => {
            // (h) face-name lookup: only reached when a local()
            // @font-face src is actually USED to render text
            // (gfxUserFontSet::FindPlatformFont at font-matching time)
            // -- never via FontFace.load(), which font-hijacker.patch
            // answers purely from IsFontAllowed() without ever calling
            // mImpl->Load(). Full-name and PostScript-name forms,
            // printed regardless of verdict -- Task 6 designs the gate
            // from what these print.
            const sheet = document.createElement('style');
            sheet.textContent =
              '@font-face { font-family: "ProbeH_full"; src: local("Segoe UI"); }' +
              '@font-face { font-family: "ProbeH_ps"; src: local("SegoeUI"); }';
            document.head.appendChild(sheet);
            document.body.offsetHeight;
            await document.fonts.ready;
            const c = document.createElement('canvas').getContext('2d');
            const s48 = 'mmmmmmmmmmlli';
            c.font = '48px monospace';
            const baseline = c.measureText(s48).width;
            c.font = '48px sans-serif';
            const sans = c.measureText(s48).width;
            c.font = '48px serif';
            const serif = c.measureText(s48).width;
            c.font = '48px "ProbeH_full", monospace';
            const hFull = c.measureText(s48).width;
            c.font = '48px "ProbeH_ps", monospace';
            const hPs = c.measureText(s48).width;
            return {hFull: hFull, hPs: hPs, baseline: baseline, sans: sans, serif: serif};
          }"""

          JS_WEBFONT = """async (fontDataUri) => {
            // Out-of-scope observation for #44 (measured, not fixed here --
            // see the Task 3 brief). font-hijacker.patch's SetStatus()
            // answers status purely from IsFontAllowed() for EVERY
            // @font-face, not just the OS-name surface Tasks 1-3 spoof. An
            // ordinary web font loaded by URL, whose family is in no OS
            // list at all, asks IsFontAllowed() a question it can only
            // answer 'no' to. A bare, unquoted, single-word invented
            // family name isolates this from the quoting bug Task 3 fixes:
            // IsFontAllowed() never has a chance to match it against any
            // list entry regardless of quoting.
            //
            // status alone cannot tell "reported failed" apart from
            // "genuinely failed" -- both look like 'error'. The
            // discriminating control is render evidence: does the glyph
            // width actually change from a plain-monospace fallback, which
            // only happens if the browser truly loaded and is using this
            // font's outlines.
            const FAMILY = 'CamouProbeWebFont';
            const sheet = document.createElement('style');
            sheet.textContent =
                '@font-face { font-family: ' + FAMILY + '; src: url("' + fontDataUri + '"); }';
            document.head.appendChild(sheet);
            document.body.offsetHeight;
            await document.fonts.ready;
            const face = [...document.fonts].find(
                f => f.family.replace(/^["\']|["\']$/g, '') === FAMILY);
            const c = document.createElement('canvas').getContext('2d');
            const s = 'mmmmmmmmmmlli';
            c.font = '72px monospace';
            const baseline = c.measureText(s).width;
            c.font = '72px "' + FAMILY + '", monospace';
            const probeWidth = c.measureText(s).width;
            return {
              status: face ? face.status : 'NO_FACE_FOUND',
              rendered: Math.abs(probeWidth - baseline) > 1,
              probeWidth: probeWidth,
              baseline: baseline,
            };
          }"""

          def one_page(fonts_key, js):
              # A brand-new launch, a brand-new context, exactly one
              # page: the strongest isolation available, since sharing
              # even just a context (never mind a whole launch) across
              # more than one page was already shown to degrade the
              # per-context list.
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx = b.new_context()
                  ctx.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS[fonts_key])))
                  page = ctx.new_page()
                  page.goto("data:text/html,<h1>f</h1>")
                  result = page.evaluate(js)
                  b.close()
                  return result

          def one_page_arg(fonts_key, js, arg):
              # one_page() with an argument for page.evaluate(). Same launch,
              # same context, same single page.
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx = b.new_context()
                  ctx.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS[fonts_key])))
                  page = ctx.new_page()
                  page.goto("data:text/html,<h1>f</h1>")
                  result = page.evaluate(js, arg)
                  b.close()
                  return result

          # Arm (h3) reads the log window arms (e)-(h) produce, so the mark has
          # to be taken before their launches, not after.
          efgh_mark = log_mark()
          e = {"mac": one_page("mac", JS_E), "win": one_page("win", JS_E)}
          f = {"mac": one_page("mac", JS_F), "win": one_page("win", JS_F),
               "mac2": one_page("mac", JS_F)}
          f_control = {"mac": one_page("mac", JS_F_CONTROL_MAC),
                       "win": one_page("win", JS_F_CONTROL_WIN)}
          f_race = one_page("mac", JS_F_RACE)
          f_final = {"mac": one_page("mac", JS_F_FINAL),
                     "win": one_page("win", JS_F_FINAL),
                     "mac2": one_page("mac", JS_F_FINAL)}
          f_bisect = {"mac": one_page("mac", JS_F_BISECT),
                      "win": one_page("win", JS_F_BISECT)}
          g = {"mac": one_page("mac", JS_G), "win": one_page("win", JS_G)}
          # Arm (h)'s own window. efgh_mark spans arms (e)-(h), and arm (e)
          # installs `src: local("Segoe UI")` @font-face rules of its own, so a
          # `facename key=segoe ui` line read over efgh_mark cannot be said to
          # be arm (h)'s. This mark contains exactly the two launches below.
          h_mark = log_mark()
          h = {"mac": one_page("mac", JS_H), "win": one_page("win", JS_H)}

          print(f"  [mac / arm e] document.fonts status {e['mac']['status']} raw families {e['mac']['rawFamilies']}")
          print(f"  [win / arm e] document.fonts status {e['win']['status']} raw families {e['win']['rawFamilies']}")
          print(f"  [mac / arm e] document.fonts.add(new FontFace('Calibri', ...)).status = {e['mac']['jsFaceStatus']!r}")
          print(f"  [win / arm e] document.fonts.add(new FontFace('Calibri', ...)).status = {e['win']['jsFaceStatus']!r}")
          print(f"  [mac / arm f] CJK fallback width      {f['mac']}")
          print(f"  [mac2 / arm f] CJK fallback width (dup mac list, own launch) {f['mac2']}")
          print(f"  [win / arm f] CJK fallback width      {f['win']}")
          print(f"  [mac / arm f] positive control -- named 'PingFang HK' width {f_control['mac']}")
          print(f"  [win / arm f] positive control -- named 'MS Gothic' width   {f_control['win']}")
          print(f"  [mac / arm f] async cmap-loading race diagnostic -- immediate={f_race['immediate']} delayed(3s)={f_race['delayed']}")
          for label in ("mac", "win", "mac2"):
              ff = f_final[label]
              print(f"  [{label} / arm f] fixed-window (20x500ms=10s) -- final={ff['final']} "
                    f"samples={ff['samples']} refs={ff['refs']}")
          for label in ("mac", "win"):
              this_final = f_final[label]["final"]
              print(f"  [{label} / arm f] bisection -- named-CJK widths {f_bisect[label]}")
              matches = [fam for fam, w in f_bisect[label].items() if w == this_final]
              print(f"  [{label} / arm f] bisection MATCH for {label}'s fallback final ({this_final}): {matches or 'NONE -- not any named bundled CJK family'}")
          print(f"  [mac / arm g] main thread widths (this page only, not a trusted baseline) {g['mac']['gMain']} (main baseline {g['mac']['baseline48']})")
          print(f"  [mac / arm g] worker widths      {g['mac']['gWorker']} (worker's OWN baseline {g['mac']['gWorkerBaseline']} -- the verdict below, unlike the print above, compares against this, not the main-thread baseline48)")
          print(f"  [mac / arm g] worker identity    ctor={g['mac']['gWorkerCtor']!r} typeof document={g['mac']['gWorkerDocType']!r}")
          print(f"  [win / arm g] main thread widths (this page only, not a trusted baseline) {g['win']['gMain']} (main baseline {g['win']['baseline48']})")
          print(f"  [win / arm g] worker widths      {g['win']['gWorker']} (worker's OWN baseline {g['win']['gWorkerBaseline']} -- the verdict below, unlike the print above, compares against this, not the main-thread baseline48)")
          print(f"  [win / arm g] worker identity    ctor={g['win']['gWorkerCtor']!r} typeof document={g['win']['gWorkerDocType']!r}")
          print(f"  [mac / arm h] local('Segoe UI')={h['mac']['hFull']} local('SegoeUI')={h['mac']['hPs']} baseline={h['mac']['baseline']}")
          print(f"  [win / arm h] local('Segoe UI')={h['win']['hFull']} local('SegoeUI')={h['win']['hPs']} baseline={h['win']['baseline']}")

          assert g["mac"]["baseline48"] > 0 and g["win"]["baseline48"] > 0, (
              "arm (g): monospace baseline measured 0 -- nothing ran")
          assert h["mac"]["baseline"] > 0 and h["win"]["baseline"] > 0, (
              "arm (h): monospace baseline measured 0 -- nothing ran")
          assert g["mac"]["gWorkerBaseline"] > 0 and g["win"]["gWorkerBaseline"] > 0, (
              "arm (g): worker's own monospace baseline measured 0 -- the worker ran "
              "but never measured its own reference width, so nothing below can be trusted")
          assert set(g["mac"]["gWorker"].keys()) == {"Segoe UI", "Helvetica Neue", "Tahoma"}, (
              f"arm (g): mac worker returned {g['mac']['gWorker']} -- did the Worker even run?")
          assert set(g["win"]["gWorker"].keys()) == {"Segoe UI", "Helvetica Neue", "Tahoma"}, (
              f"arm (g): win worker returned {g['win']['gWorker']} -- did the Worker even run?")
          # Prove the measurement genuinely ran off the main thread before
          # trusting anything about the widths: a fallback that silently
          # measured on the main thread and reported it as "the worker's"
          # answer would look exactly like a real, gated result.
          for label in ("mac", "win"):
              assert g[label]["gWorkerCtor"] == "DedicatedWorkerGlobalScope", (
                  f"arm (g): {label} worker reported self.constructor.name = "
                  f"{g[label]['gWorkerCtor']!r}, not 'DedicatedWorkerGlobalScope' -- "
                  "this did not run in a worker, the whole arm is unverified")
              assert g[label]["gWorkerDocType"] == "undefined", (
                  f"arm (g): {label} worker reported typeof document = "
                  f"{g[label]['gWorkerDocType']!r}, not 'undefined' -- "
                  "this ran somewhere with a document, the whole arm is unverified")
          assert f["mac"] > 0 and f["win"] > 0 and f["mac2"] > 0, (
              f"arm (f): CJK fallback measured 0 somewhere -- nothing rendered, no signal. "
              f"mac={f['mac']} mac2={f['mac2']} win={f['win']}")
          # Positive control: prove U+FF71 can render as a real, non-tofu
          # glyph at all before trusting anything about arm (f)'s fallback
          # measurement. If naming the context's own CJK family produces the
          # SAME width as JS_F's impossible-family fallback, the probe has
          # been measuring tofu in both cases and no gate could ever make
          # this arm discriminate -- that would be a probe-design defect,
          # not evidence about the gate.
          #
          # This WAS a hard assert. It is now a recorded collision, because on
          # this bundle it is the reference that broke, not the gate (CLAUDE.md
          # lesson 4, the CJK bullet; the Geneva discriminator above already
          # names "arm (f)'s CJK em-square collision" as an instance of the same
          # class). `f[label]` doubles as the arm's tofu floor, and it was only
          # ever a floor because the runner's host DejaVu drew a .notdef box:
          # run 34445606698's mac bisection reads 23 for the refused family
          # 'MS Gothic', run 34475502454's reads 48 for the same family in the
          # same context. Under FONTCONFIG_FILE there is no host face left to
          # draw that box, every bundled CJK family draws U+6F22 on the full em
          # square, and 48 == 48 says nothing about WHICH face served it. A hard
          # assert here would also erase arms (g)-(k) and the whole triage block
          # for a probe-design limit that asserts nothing about #44.
          # Restored by the codepoint change. U+6F22 is a full em in every
          # bundled CJK face AND `.notdef` is a full em in most of them, so
          # glyph and tofu were the same number. U+FF71 (HALFWIDTH KATAKANA
          # LETTER A) is 0.5 em in MS Gothic, PingFang HK and Yu Gothic while
          # their `.notdef` stays 1.0 em -- read locally with fontTools off
          # bundle/fonts/. Both of this arm's named controls cover it.
          # The tolerance is a float comparison, not decoration.
          f_floor_valid = {}
          for label, fam in (("mac", "PingFang HK"), ("win", "MS Gothic")):
              f_floor_valid[label] = abs(f_control[label] - f[label]) > 0.01
              print(f"  [{label} / arm f] tofu floor -- named {fam!r} width "
                    f"{f_control[label]} vs impossible-family fallback {f[label]}: "
                    f"{'floor is a real reference' if f_floor_valid[label] else 'COLLIDES, no floor'}")
          # Whether mac and win can be told apart AT ALL by advance: if each
          # context's own named CJK family measures the same, then two
          # different faces produce the same number and `mac_final ==
          # win_final` cannot mean "the same face served both". Verified
          # locally and expected to be EQUAL here -- PingFang HK and MS Gothic
          # are both 0.5 em at U+FF71 -- which is why no codepoint choice
          # rescues this comparison; only a pixel discriminator would.
          f_ctx_separable = abs(f_control["mac"] - f_control["win"]) > 0.01
          print(f"  [arm f] can advance width separate the two contexts? "
                f"mac control {f_control['mac']} vs win control {f_control['win']} -> "
                f"{'yes' if f_ctx_separable else 'NO -- equality is not a verdict'}")

          # Well-formedness floor for arm (e): document.fonts has
          # exactly the 3 rules this page declared, non-empty, real
          # family strings. This is a pure "did anything even run" gate
          # -- kept as an early hard assert, unlike Tahoma's positive
          # control below, which is itself part of the evidence the
          # discriminator needs and must not be allowed to mask it.
          for label in ("mac", "win"):
              raw = sorted(f.strip('"').strip("'") for f in e[label]["rawFamilies"])
              assert raw == ["Helvetica Neue", "Segoe UI", "Tahoma"], (
                  f"arm (e): {label} document.fonts has {raw!r}, not exactly the 3 rules "
                  "this page declared -- the readback is malformed, not a gating question")

          # (e) CSS @font-face: expect NO disagreement between
          # document.fonts and the arm (b) measurement (mac/win dicts,
          # already validated above) for the same family in the same
          # context. Pre-gate, InsertRuleFontFace runs with no context
          # in scope, so IsFontAllowed() falls through to allow-all and
          # a family arm (b) says this context doesn't have still
          # reports 'loaded'. That disagreement is the red. Tahoma is
          # included here too, not as a separate early hard-assert like
          # (a)-(d)'s __impossible__ check -- it is in BOTH
          # FONTS["mac"] and FONTS["win"] (not from arm (b)'s
          # PROBES-based measurement, which never covers it), so its
          # ground truth is hardcoded True/"loaded" for both contexts.
          # Folding it into e_failures rather than a standalone assert
          # means a broken Tahoma reading still surfaces as evidence
          # instead of crashing before the discriminator below runs.
          e_ground = {
              "mac": {"Segoe UI": mac["measure"]["Segoe UI"],
                      "Helvetica Neue": mac["measure"]["Helvetica Neue"], "Tahoma": True},
              "win": {"Segoe UI": win["measure"]["Segoe UI"],
                      "Helvetica Neue": win["measure"]["Helvetica Neue"], "Tahoma": True},
          }
          # CAVEAT: arm (b)'s "ground truth" is valid only in the donor-closed shape it measures (see the #83 discriminator below); a donor-alive companion for this arm is a follow-up.
          e_failures = []
          for label, ground in e_ground.items():
              for fam, present in ground.items():
                  expect = "loaded" if present else "error"
                  got = e[label]["status"].get(fam)
                  if got != expect:
                      e_failures.append(
                          f"{label}/{fam}: document.fonts status is {got!r} but expected "
                          f"{expect!r} ({'arm (b) measurement' if fam != 'Tahoma' else 'Tahoma is in both FONTS[mac] and FONTS[win]'})")

          # Discriminator: does document.fonts.add(new FontFace(...)) --
          # the ALREADY-SCOPED path -- resolve "Calibri" (win-only)
          # correctly per context, and does the bare-identifier Tahoma
          # rule (no quotes needed in its source) resolve correctly,
          # where the space-containing (always-quoted) Segoe UI /
          # Helvetica Neue rules do not? The combination tells Task 3
          # which defect this tripwire is actually reporting.
          js_face_expect = {"mac": "error", "win": "loaded"}  # Calibri is win-only
          js_face_correct = all(
              e[label]["jsFaceStatus"] == js_face_expect[label] for label in ("mac", "win"))
          tahoma_bare_correct = all(
              e[label]["status"].get("Tahoma") == "loaded" for label in ("mac", "win"))
          print(f"  [arm e] document.fonts.add() path correct per context? {js_face_correct}")
          print(f"  [arm e] bare-identifier Tahoma rule correct per context? {tahoma_bare_correct}")
          if js_face_correct and tahoma_bare_correct:
              hypothesis = (
                  "SUPPORTS the quoting hypothesis: document.fonts.add() resolves Calibri "
                  "correctly per context AND the bare-identifier Tahoma rule also resolves "
                  "correctly, while the space-containing (always-quoted) Segoe UI/Helvetica "
                  "Neue rules do not -- InsertRuleFontFace is handing IsFontAllowed() a "
                  "QUOTED family key for names that need quoting in CSS, and that mismatch "
                  "-- not a missing context scope -- is the defect Task 3 should fix.")
          elif js_face_correct and not tahoma_bare_correct:
              hypothesis = (
                  "PARTIALLY supports the CSS-rule-key hypothesis: document.fonts.add() "
                  "resolves Calibri correctly (the per-context mechanism itself works), but "
                  "Tahoma still fails even as a bare, unquoted identifier -- so quoting "
                  "alone does not explain it; something else about InsertRuleFontFace's "
                  "family key is broken, still specific to the CSS-rule path, not a missing "
                  "context scope in general (which would predict allow-all/'loaded', not "
                  "uniform 'error').")
          else:
              hypothesis = (
                  "REFUTES the CSS-rule-specific hypothesis: document.fonts.add(), the "
                  "ALREADY-SCOPED path per Task 1's own patch, ALSO fails to resolve Calibri "
                  "correctly per context -- whatever is broken is not specific to "
                  "InsertRuleFontFace or CSS-rule parsing; the per-context mechanism itself "
                  "is unreliable somewhere broader, and Task 3 needs to look there first.")
          print(f"  [arm e] hypothesis: {hypothesis}")

          # (f) codepoint fallback: expect the mac and win contexts to
          # each resolve their OWN real CJK family in a correctly-gated
          # world -- not merely "different from each other", but each
          # settled value corresponding to a family that context is
          # actually allowed. Ungated, fallback ignores context entirely
          # and both resolve the same font (or the same tofu box) --
          # that sameness is the red.
          #
          # Scored on the SETTLED value (f_final), not the immediate one
          # (f): the immediate measurement is taken inside
          # GlobalFontFallback's async cmap-loading window
          # (gfx.font_rendering.fallback.async defaults true -- see the
          # Task 4 report's source trace) and is architecturally
          # guaranteed to be the .notdef/tofu box regardless of gate
          # correctness -- every context's OWN `f[label]` immediate
          # measurement already IS that tofu floor (confirmed repeatable
          # and reference-matched across every prior run of this arm), so
          # it doubles as the per-context "known tofu" baseline below
          # without needing a hardcoded constant. f_final samples on a
          # fixed 10s window, well past that race.
          mac_final = f_final["mac"]["final"]
          win_final = f_final["win"]["final"]
          mac2_final = f_final["mac2"]["final"]
          f_repeatable = (mac_final == mac2_final)
          f_not_tofu_mac = mac_final != f["mac"]
          f_not_tofu_win = win_final != f["win"]
          # Bisection identifies WHICH family each context's settled value
          # corresponds to (JS_F_BISECT, measured explicitly per
          # candidate, run in BOTH contexts) -- a match must be a family
          # FONTS[label] (what setFontList() actually installed for that
          # context) really contains, not merely a number that happens to
          # differ from the other context's. Win needs this same
          # bisection, not just a check against its own positive control:
          # 48 is the shared full-em advance of at least six bundled CJK
          # families (PingFang HK/SC/TC, Hiragino Sans GB, Heiti SC/TC),
          # so "win_final == 48" alone couldn't rule out a leak to any of
          # those. A width matching families both inside and outside the
          # allowed list is AMBIGUOUS -- cannot confirm which one actually
          # served it -- and counts as a failure, not a pass because SOME
          # match happens to be allowed.
          bisect_matches, bisect_allowed, bisect_disallowed = {}, {}, {}
          for label, this_final in (("mac", mac_final), ("win", win_final)):
              bisect_matches[label] = [fam for fam, w in f_bisect[label].items() if w == this_final]
              bisect_allowed[label] = [fam for fam in bisect_matches[label] if fam in FONTS[label]]
              bisect_disallowed[label] = [fam for fam in bisect_matches[label] if fam not in FONTS[label]]

          f_failures = []
          f_collision = None   # set by either no-verdict branch below
          if not all(f_floor_valid.values()):
              # FIRST, and alone: everything below this point is scored against
              # `f[label]` as a tofu floor, and the floor collided. This string
              # is what note_unmeasured/`unmeasured_arms` records as the arm's
              # signature, so it must be the only entry.
              f_collision = (
                  f"arm (f) width reference collides: naming a context's own CJK family "
                  f"measures the SAME width as the impossible-family fallback (mac "
                  f"{f_control['mac']} vs {f['mac']}, win {f_control['win']} vs "
                  f"{f['win']}) for U+FF71. The named family and the fallback are one "
                  f"number, so there is no tofu floor and no advance here can say WHICH "
                  f"face served the codepoint: NO VERDICT about the gate either way. "
                  f"U+FF71 was chosen precisely because it is 0.5 em in MS Gothic and "
                  f"PingFang HK against a 1.0 em .notdef, so a collision here means "
                  f"something other than the U+6F22 full-em problem this replaced")
              f_failures.append(f_collision)
          elif not f_repeatable:
              f_failures.append(
                  f"mac settled value not repeatable across separate launches on the same "
                  f"list: mac={mac_final} mac2={mac2_final} -- width is not a deterministic "
                  f"function of the list, this arm proves nothing")
          else:
              if not f_not_tofu_mac:
                  f_failures.append(
                      f"mac settled value ({mac_final}) never left the tofu/no-render floor "
                      f"({f['mac']}) inside the 10s window -- fallback found nothing")
              if not f_not_tofu_win:
                  f_failures.append(
                      f"win settled value ({win_final}) never left the tofu/no-render floor "
                      f"({f['win']}) inside the 10s window -- fallback found nothing")
              if f_not_tofu_mac and f_not_tofu_win and mac_final == win_final:
                  if f_ctx_separable:
                      f_failures.append(
                          f"mac and win settled to the SAME value ({mac_final}) -- fallback "
                          f"ignores context")
                  else:
                      # Equal advance is not the same face. The two contexts'
                      # own named families measure the same, so this equality
                      # is exactly as consistent with a correct per-context
                      # resolution as with a leak. No verdict.
                      f_collision = (
                          f"arm (f) width reference collides: mac and win both settled at "
                          f"{mac_final}, but their own named CJK families also measure the "
                          f"same (mac {f_control['mac']}, win {f_control['win']}), so equal "
                          f"advance cannot mean the same face served both. NO VERDICT about "
                          f"the gate either way")
                      f_failures.append(f_collision)
              for label, not_tofu in (("mac", f_not_tofu_mac), ("win", f_not_tofu_win)):
                  if not not_tofu:
                      continue
                  if not bisect_allowed[label]:
                      f_failures.append(
                          f"{label} settled value ({f_final[label]['final']}) does not "
                          f"correspond to any ALLOWED family in FONTS['{label}'] -- bisection "
                          f"matches: {bisect_matches[label] or 'none'}")
                  elif bisect_disallowed[label]:
                      # NOT a failure any more. Under FONTCONFIG_FILE the font
                      # universe is the bundle alone, so naming a family this
                      # context REFUSES measures the fallback face, which is by
                      # definition the settled value. Every refused candidate
                      # therefore "matches" by construction and this branch was
                      # true whatever the gate did -- a reference that cannot
                      # differ (CLAUDE.md lesson 4). Printed, not scored.
                      print(f"  [{label} / arm f] disallowed candidates also read the settled "
                            f"value ({f_final[label]['final']}): {bisect_disallowed[label]} -- "
                            f"expected, a refused name measures the fallback, not itself; "
                            f"carries no information about a leak")
          print(f"  [arm f] repeatable (mac == mac2 settled, separate launches)? {f_repeatable}")
          print(f"  [arm f] mac settled family match (in FONTS['mac']): {bisect_allowed['mac'] or bisect_matches['mac'] or 'none'}")
          print(f"  [arm f] win settled family match (in FONTS['win']): {bisect_allowed['win'] or bisect_matches['win'] or 'none'}")

          # (g) worker/OffscreenCanvas: expect the worker's answer to
          # match arm (b)'s trusted per-context ground truth for every
          # family in a correctly-gated world -- NOT this page's own
          # main-thread reading, which cannot be trusted as a baseline
          # (see the design note above). GetDocument() is null off the
          # main thread, so the context id falls to 0 there and
          # sLaunchFonts is empty under this bare launch, so
          # CamouIsFontAllowed falls through to allow-all -- the worker
          # should see every family regardless of context. That
          # disagreement with arm (b) is the red. Tahoma is printed for
          # the record (both contexts should resolve it either way) but
          # skipped here -- arm (b)'s ground truth only covers
          # MAC_ONLY/WIN_ONLY, and Tahoma is neither, so it has no
          # ground-truth entry to compare against.
          #
          # "Present" is decided against the WORKER'S OWN monospace
          # baseline (gWorkerBaseline), not the main thread's (baseline48).
          # Those are two different threads' font resolutions; nothing
          # guarantees they numerically agree even when both are correct
          # (gfxTextRun.cpp's GetDefaultGeneric special-cases worker
          # threads for pref-font resolution). A comparison whose two
          # sides can differ for a reason unrelated to #44 is not a valid
          # discriminator.
          # CAVEAT: arm (b)'s "ground truth" is valid only in the donor-closed shape it measures (see the #83 discriminator below); a donor-alive companion for this arm is a follow-up.
          g_failures = []
          for label, ground in (("mac", mac["measure"]), ("win", win["measure"])):
              for fam in ("Segoe UI", "Helvetica Neue"):
                  worker_present = g[label]["gWorker"][fam] != g[label]["gWorkerBaseline"]
                  if worker_present != ground[fam]:
                      g_failures.append(
                          f"{label}/{fam}: worker {'resolved' if worker_present else 'did not resolve'} "
                          f"it, arm (b) says this context {'has' if ground[fam] else 'does not have'} it")

          # (h) face-name lookup: local('Segoe UI') and local('SegoeUI') --
          # full name and PostScript name -- both name the SAME face, which
          # belongs to the WIN_ONLY family "Segoe UI". Ground truth is arm
          # (b)'s own per-context measurement of that family (mac["measure"]
          # / win["measure"]["Segoe UI"]), the same trusted reference arm
          # (g) compares against above -- NOT "mac != win", since a leak
          # that resolved the SAME wrong face in both contexts would still
          # show mac == win and pass a same-vs-different check.
          #
          # "Resolved" means the probe rendered the GENUINE Segoe UI face:
          # its width equals Segoe UI's width measured by family name in the
          # win context of this same run (arm (g), main thread, same text,
          # same 48px, same monospace stack). Advance widths are a property
          # of the font file, not of the context -- Tahoma measures
          # identically in both contexts above -- so that reference differs
          # from every face this arm can otherwise reach in this run --
          # monospace, sans-serif and serif, checked below. Metric-compatible
          # families exist by design, so this is a per-run check, not a
          # universal. The previous verdict,
          # `width != baseline`, could not tell "resolved Segoe UI" from
          # "local() was blocked and text fell back to a non-monospace face":
          # diag run 34211089822 logged the gate BLOCKING both mac probes
          # (ctx with list, allowed=0) while the mac page still measured
          # 375.7 -- neither Segoe UI (448.4) nor monospace (507.5) -- and the
          # old verdict called that a leak for four consecutive runs.
          #
          # CAVEAT: arm (b)'s "ground truth" is valid only in the donor-closed
          # shape it measures (see the #83 discriminator below); a donor-alive
          # companion for this arm is a follow-up.
          h_failures = []
          segoe_ref = g["win"]["gMain"]["Segoe UI"]
          # THE ADVANCE CONTROL FOR THE WIN HALF DIED WHEN #92 WAS FIXED.
          # Arm (h)'s win half is the POSITIVE control: a context whose list
          # contains Segoe UI must resolve local('Segoe UI'). It scored that by
          # advance, against segoe_ref. Under A2 a generic resolves through the
          # ordered table intersected with the context's list, and the first
          # sans-serif-row family in FONTS['win'] is Segoe UI itself -- run
          # 34538378696 logs `CAMOU-FL generic-map ctx=7 generic=2 step=row
          # key=segoe ui`, and that run's win generics read 338/446/409 where
          # Phase 0 (34519345704) read 312/312/312. So in the win context
          # `sans-serif` IS Segoe UI: "the face-name lookup resolved the genuine
          # face" and "the lookup was refused and the group fell back to
          # sans-serif" name ONE FACE at ONE advance (446 in that run). No
          # advance and no pixel checksum can separate them -- there is nothing
          # to separate -- so the width is demoted to a discriminator that says
          # when it cannot decide, and the verdict moves to the one observable
          # that still distinguishes them: the `CAMOU-FL facename` line, which
          # gfxPlatformFontList.cpp:1133 emits UNCONDITIONALLY, with allowed=0/1,
          # BEFORE the refusal at :1136.
          #
          # ATTRIBUTION IS READ, NOT ASSUMED (CLAUDE.md lesson 4). "The file
          # with allowed=1 is the win one" would assume this arm's answer. Each
          # one_page() launch is its own process and so its own log file, and
          # every launch emits `CAMOU-FL set ctx=N n=<families>` naming the size
          # of the list it installed. len(FONTS['mac']) and len(FONTS['win'])
          # differ (574 vs 107 in pythonlib/camoufox/fonts.json), so that count
          # says which context a file belongs to without consulting the answer.
          # Asserted distinct below: if the two lists ever became the same
          # length this would pair files with contexts at random.
          #
          # MN8 (PR #84's re-review) is KEPT and made per-context. It added the
          # mac generics to the clash set because a mac-side clash would let the
          # MAC arm read "resolved Segoe UI" for a face that is simply the mac
          # generic. That is a statement about the mac arm; a win-side clash is
          # a statement about the win arm. Each label is now checked against its
          # OWN generics, which is what MN8 meant, and a clash no longer fails
          # the whole arm -- it makes that label's WIDTH half abstain while the
          # log half decides. On a binary with no `facename` kind there is no
          # log half, and a clash is still a hard control-invalid.
          def _h_file(ln):
              """The cfx<PID> basename camou_fl prefixes to every line."""
              parts = ln.split(None, 1)
              return parts[0] if parts else ""

          _H_N = {"mac": len(FONTS["mac"]), "win": len(FONTS["win"])}
          assert _H_N["mac"] != _H_N["win"], (
              f"arm (h) SETUP-INVALID: FONTS['mac'] and FONTS['win'] are both "
              f"{_H_N['mac']} families long, so `CAMOU-FL set n=` cannot say which log "
              f"file belongs to which context and the facename control below would pair "
              f"them at random.")
          _h_all = camou_fl(h_mark, "CAMOU-FL ", limit=None)
          _h_owner = {}
          for _ln in _h_all:
              if "CAMOU-FL set " in _ln:
                  _tok = next((t for t in _ln.split() if t.startswith("n=")), None)
                  if _tok:
                      for _lab, _n in _H_N.items():
                          if _tok[2:] == str(_n):
                              _h_owner.setdefault(_h_file(_ln), set()).add(_lab)
          # A file that installed BOTH lists cannot attribute anything.
          _h_owner = {_k: next(iter(_v)) for _k, _v in _h_owner.items() if len(_v) == 1}
          _h_face = {"mac": [], "win": []}
          for _ln in _h_all:
              if "CAMOU-FL facename" in _ln and "key=segoe ui" in _ln:
                  _lab = _h_owner.get(_h_file(_ln))
                  if _lab:
                      _h_face[_lab].append(_ln)
          _h_allowed = {_lab: {_ln.rsplit("allowed=", 1)[1].strip()
                               for _ln in _lns if "allowed=" in _ln}
                        for _lab, _lns in _h_face.items()}
          _h_log_live = kind_total("facename") > 0
          print(f"  [arm h] facename control: files in this arm's window -> context "
                f"{_h_owner}; `key=segoe ui` lines mac={len(_h_face['mac'])} "
                f"win={len(_h_face['win'])}; allowed values mac={sorted(_h_allowed['mac'])} "
                f"win={sorted(_h_allowed['win'])}; kind_total(facename)="
                f"{kind_total('facename')}")
          for _lab in ("mac", "win"):
              for _ln in _h_face[_lab][-2:]:
                  print(f"      [{_lab}] {_ln}")
          if not _h_log_live:
              print("  [arm h] DIAGNOSTIC: this binary emits no `facename` line, so the "
                    "gate's own answer cannot be read and the width below is all there is.")

          _h_gen = {"mac": (("mac monospace baseline", h["mac"]["baseline"]),
                            ("mac sans-serif", h["mac"]["sans"]),
                            ("mac serif", h["mac"]["serif"])),
                    "win": (("win monospace baseline", g["win"]["baseline48"]),
                            ("win sans-serif", h["win"]["sans"]),
                            ("win serif", h["win"]["serif"]))}
          h_ref_clash = {_lab: [_name for _name, _w in _rows if segoe_ref == _w]
                         for _lab, _rows in _h_gen.items()}
          for label, ground in (("mac", mac["measure"]), ("win", win["measure"])):
              want = ground["Segoe UI"]
              # ---- the verdict: the gate's own answer, which no generic can
              # collide with, because it is a name and not a number.
              seen = _h_allowed[label]
              if not _h_log_live:
                  pass
              elif not seen:
                  h_failures.append(
                      f"{label}: setup invalid: no `CAMOU-FL facename ... key=segoe ui` line "
                      f"attributed to a {label}-list launch in this arm's window (files seen: "
                      f"{_h_owner}), so the face-name gate's answer for this context was never "
                      f"observed")
              elif len(seen) > 1:
                  h_failures.append(
                      f"{label}: setup invalid: the {label}-list launches disagree on the "
                      f"face-name gate's answer for key=segoe ui ({sorted(seen)}), so this "
                      f"context has no single answer to score")
              elif (seen == {"1"}) != want:
                  h_failures.append(
                      f"{label}: the face-name gate answered allowed={sorted(seen)[0]} for "
                      f"key=segoe ui, but arm (b) says this context "
                      f"{'has' if want else 'does not have'} Segoe UI")
              # ---- the width, now a discriminator that reports its own silence
              if h_ref_clash[label]:
                  print(f"  [{label} / arm h] the width half asserts NOTHING this run: "
                        f"segoe_ref {segoe_ref} equals this context's "
                        f"{' and '.join(h_ref_clash[label])} width, so 'resolved the "
                        f"face-name lookup' and 'fell back to that generic' are the same "
                        f"face. The `facename` line above is the verdict.")
                  if not _h_log_live:
                      h_failures.append(
                          f"control invalid: the win context's family-name Segoe UI width "
                          f"({segoe_ref}) equals the {label} context's "
                          f"{' and '.join(h_ref_clash[label])} width, and this binary emits no "
                          f"`facename` kind, so nothing can decide this context")
              for probe_key, probe_name in (("hFull", "local('Segoe UI')"),
                                            ("hPs", "local('SegoeUI')")):
                  w = h[label][probe_key]
                  resolved = abs(w - segoe_ref) < 0.01
                  fell_back_to = ("monospace" if w == h[label]["baseline"] else
                                  "sans-serif" if w == h[label]["sans"] else
                                  "serif" if w == h[label]["serif"] else
                                  "an unidentified face")
                  print(f"  [{label} / arm h] {probe_name}: width={w} segoe={segoe_ref} "
                        f"baseline={h[label]['baseline']} sans={h[label]['sans']} "
                        f"serif={h[label]['serif']} -> "
                        f"{'resolved Segoe UI' if resolved else 'fell back to ' + fell_back_to}")
                  if h_ref_clash[label]:
                      continue
                  if resolved != want:
                      h_failures.append(
                          f"{label}/{probe_name}: {'resolved' if resolved else 'did not resolve'} "
                          f"the Segoe UI face (width={w} segoe={segoe_ref} "
                          f"baseline={h[label]['baseline']}), arm (b) says this context "
                          f"{'has' if want else 'does not have'} Segoe UI")

          # -----------------------------------------------------------
          # Arm (h3): #88. Arm (h) proved the face-name gate FIRES for the mac
          # probes -- the diag build logged ctx with a list, allowed=0 -- and
          # the text still rendered at 375.70001220703125. What serves that text
          # is gfxFontGroup::GetDefaultFont (gfxTextRun.cpp:2201-2320), which
          # opens NO AutoFontListContext and whose shared-list last-resort walk
          # (:2237-2263) has no gate at all. The verdict here is the LOG
          # PREDICATE: the `default ctx=N family=X` line that follows the mac
          # context's `facename ... key=segoe ui allowed=0` must name a family
          # the mac context's list contains.
          #
          # WHAT WOULD MAKE THIS PRINT A WRONG ANSWER (CLAUDE.md lesson 4):
          #  * The width half is NOT the verdict. #88's own comment records that
          #    262 of 513 bundled mac families tie at the target width, so an
          #    equality is not an identification. It is kept only as a
          #    discriminator, and the arm says so out loud when it cannot
          #    discriminate.
          #  * ctx is NOT hardcoded. Run 34213805428 happened to use ctx=6; the
          #    id depends on how many contexts preceded this arm. It is read off
          #    the `facename` line and the following `default` line is matched
          #    on the same id.
          #  * MATCHING ON ctx ALONE IS NOT ENOUGH, and this is the reason the
          #    reads below go through ONE camou_fl call. camou_fl iterates
          #    `for p in sorted(glob(...))` and only then the lines of each file,
          #    so its output is grouped by cfx<PID> in LEXICOGRAPHIC file order
          #    -- `[-1]` is "last line of the last-sorting file", not "most
          #    recent". This arm's window is efgh_mark, which spans arms (e),
          #    (f), (f_control), (g) and (h): eight separate one_page()
          #    launches, eight browser processes, eight log files. Playwright
          #    allocates user-context ids per browser, so a later launch very
          #    likely reuses the same numeric id, and a ctx-only match would tie
          #    arm (h)'s `facename` line to some other arm's `default` line. The
          #    spec says "the FOLLOWING default line", which means: same log
          #    file, later in that file. Reading every CAMOU-FL line of the
          #    window once and filtering the ordered list in Python expresses
          #    both -- the file basename is each line's first token, and
          #    position is the list index -- and needs no new helper.
          def _ctx_of(ln):
              tok = next((t for t in ln.split() if t.startswith("ctx=")), None)
              return tok[4:] if tok else None

          #  * THE OBSERVABLE MOVES WHEN A2 LANDS, and scoring its absence as a
          #    broken setup would fail the very build that fixes #88.
          #    `CAMOU-FL default` is emitted only from
          #    gfxFontGroup::GetDefaultFont (gfxTextRun.cpp:2316), which is
          #    reached only when the group's own list resolved to NOTHING.
          #    Arm (h)'s stack is '48px "ProbeH_full", monospace'. AFTER A2,
          #    CamouGenericCandidate answers `monospace` from the table with
          #    Menlo (mac-only, bundled), mFonts is non-empty, GetFirstValidFont
          #    returns a real font, GetDefaultFont is never called, and NO
          #    `default` line exists for that context. So there are two GREEN
          #    shapes and the arm reports which one fired:
          #      shape A  a `default ctx=N family=X` line with X in the mac list
          #      shape B  no `default` line for that ctx, TOGETHER WITH a
          #               `generic-map ctx=N ... key=<in-list family>` line
          #               proving the group resolved through the table instead
          #    Shape B is only available once the binary emits `generic-map`;
          #    before that, a missing `default` line really is a broken setup.
          #    kind_total("generic-map") is what tells the two apart.
          #
          #    PRE-RUN EXPECTATION ON 34432908522, written down before the run
          #    and NOT the plan's: the plan predicted a `DEFAULT FONT OUTSIDE
          #    THE LIST` red here, reasoning that monospace -> Cousine and the
          #    appended serif -> Tinos are both refused, so mFonts is empty and
          #    the `default` line fires. Run 34496121342, the SAME binary under
          #    FONTCONFIG_FILE, counted `default` = 0 for the whole run, and arm
          #    (h)'s own mac generics measured three DIFFERENT widths (baseline
          #    377, sans 433, serif 409) -- so mFonts was not empty and
          #    GetDefaultFont was never reached. Those generics resolved by the
          #    very fontconfig-distance mechanism arm (n2) measures for #92.
          #    This arm therefore lands in the `h3_family is None` +
          #    no-generic-map branch: setup invalid, absorbed by EXPECTED_RED as
          #    RED but UNMEASURED. That is the correct behaviour, and it means
          #    Phase 0 gets no measured #88 verdict from (h3) on this binary.
          def _file_of(ln):
              """The cfx<PID> basename camou_fl prefixes to every line."""
              parts = ln.split(None, 1)
              return parts[0] if parts else ""

          # ONE read of the whole window, in (file, line) order, then filtered
          # in Python. This is what lets "the following default line" mean the
          # same file and a later position, not merely the same ctx number.
          #  * `h3_face[-1]` PICKS THE LAST-SORTING FILE, NOT THE MOST RECENT
          #    EVENT, and the pinning argument above only makes the `default`
          #    line follow whichever `facename` line that picks. Two things make
          #    it the right one, and both are written down here rather than
          #    assumed. STRUCTURAL: `local("Segoe UI")` occurs exactly once in
          #    this whole file, in arm (h)'s `ProbeH_full` rule; arms (e), (f)
          #    and (g) name `Segoe UI` only as a FAMILY, and a family-name
          #    lookup can in principle fall through to LookupInFaceNameLists and
          #    emit the same line, so this is a strong prior and not a proof.
          #    OBSERVED: run 34508157395 emitted 3 `CAMOU-FL facename` lines in
          #    total and both `key=segoe ui allowed=0` refusals sat in ONE file
          #    (cfx-child.9501.child-1.moz_log, ctx=6, 143 us apart) -- arm (h)'s
          #    single mac launch looking the rule up twice. If a future run
          #    splits them across files, narrow this window to arm (h)'s own
          #    mark instead of efgh_mark and the question goes away.
          h3_all = camou_fl(efgh_mark, "CAMOU-FL ", limit=None)
          h3_face_idx = [i for i, ln in enumerate(h3_all)
                         if "CAMOU-FL facename" in ln and "key=segoe ui" in ln
                         and "allowed=0" in ln]
          h3_face = [h3_all[i] for i in h3_face_idx]
          h3_unfiltered = [ln for ln in h3_all if "CAMOU-FL default-unfiltered" in ln]
          h3_ctx = _ctx_of(h3_face[-1]) if h3_face else None
          h3_pos = h3_face_idx[-1] if h3_face_idx else -1
          h3_file = _file_of(h3_face[-1]) if h3_face else None
          # Same file, same ctx, and AFTER the refusal.
          h3_after = ([ln for i, ln in enumerate(h3_all)
                       if i > h3_pos and "CAMOU-FL default " in ln
                       and _file_of(ln) == h3_file and _ctx_of(ln) == h3_ctx]
                      if h3_ctx else [])
          h3_family = (h3_after[-1].split("family=", 1)[1].strip()
                       if h3_after and "family=" in h3_after[-1] else None)
          h3_maclist = {f.casefold() for f in FONTS["mac"]}
          # `key` is the last field of the generic-map line and may contain
          # spaces, so it runs to end of line -- same rule as arm (n2). Shape B
          # asserts that ARM (h)'s OWN group resolved through the table, so the
          # same file/ctx pinning applies; the position bound is dropped because
          # EnsureFontList runs BEFORE the face-name lookup, so a generic-map
          # line for this group legitimately precedes the facename line.
          h3_gm_mine = ([ln for ln in h3_all
                         if "CAMOU-FL generic-map" in ln
                         and _file_of(ln) == h3_file and _ctx_of(ln) == h3_ctx]
                        if h3_ctx else [])
          h3_gm = [ln for ln in h3_all if "CAMOU-FL generic-map" in ln]
          h3_gm_keys = {ln.split("key=", 1)[1].strip().casefold()
                        for ln in h3_gm_mine if "key=" in ln} - {"none", ""}
          h3_gm_inlist = sorted(k for k in h3_gm_keys if k in h3_maclist)
          print(f"  [arm h3 / #88] facename refusals for 'segoe ui': {len(h3_face)}; "
                f"file={h3_file} ctx={h3_ctx}; `default` lines in that file after the "
                f"refusal: {len(h3_after)}; family={h3_family!r}; "
                f"default-unfiltered={len(h3_unfiltered)}; generic-map in that file for "
                f"that ctx: {len(h3_gm_mine)} of {len(h3_gm)} in the window; "
                f"keys={sorted(h3_gm_keys)} in-list={h3_gm_inlist}; "
                f"kind_total(generic-map)={kind_total('generic-map')}")
          for _ln in (h3_face[-2:] + h3_after[-2:] + h3_gm_mine[-2:]):
              print(f"      {_ln}")

          h3_failures = []
          if kind_total("facename") == 0:
              print("  [arm h3 / #88] DIAGNOSTIC: this binary emits no `facename` "
                    "line, so the refusal this predicate follows cannot be seen.")
          elif not h3_face:
              h3_failures.append(
                  f"setup invalid: the run emitted {kind_total('facename')} facename "
                  f"lines but none with key=segoe ui allowed=0 in arm (h)'s window, so "
                  f"the refusal this predicate follows never happened")
          elif h3_family is None and kind_total("generic-map") > 0:
              # SHAPE B. A2 is in this binary and the group never needed a
              # default font. That is the fix working, not a broken fixture --
              # but only if the table demonstrably answered with an in-list
              # family for this same context.
              if h3_gm_inlist:
                  print(f"  [arm h3 / #88] GREEN, shape B: no `default` line for "
                        f"ctx={h3_ctx} -- the group never fell to the default font -- "
                        f"and generic-map resolved {h3_gm_inlist} from the context's "
                        f"own list. GetDefaultFont was not reached, which is what A2 "
                        f"is for.")
              else:
                  h3_failures.append(
                      f"DEFAULT FONT OUTSIDE THE LIST: no `default` line for "
                      f"ctx={h3_ctx} AND no generic-map line naming an in-list family "
                      f"for it, so nothing shows how the group resolved. generic-map "
                      f"keys seen: {sorted(h3_gm_keys) or 'none'}")
          elif h3_family is None:
              h3_failures.append(
                  f"setup invalid: no `CAMOU-FL default` line for ctx={h3_ctx} after "
                  f"the refusal, and this binary emits no `generic-map` kind, so the "
                  f"face that served the text was never named")
          elif h3_family.casefold() not in h3_maclist:
              h3_failures.append(
                  f"DEFAULT FONT OUTSIDE THE LIST: after refusing 'segoe ui' for "
                  f"ctx={h3_ctx}, GetDefaultFont served {h3_family!r}, which is not in "
                  f"the mac list. default-unfiltered lines: {len(h3_unfiltered)}")
          else:
              print(f"  [arm h3 / #88] GREEN, shape A: `default ctx={h3_ctx} "
                    f"family={h3_family}` names a family in the mac list.")
              # Discriminator only, and it says so when it discriminates nothing.
              _target = h["mac"]["hFull"]
              _others = [h["mac"]["baseline"], h["mac"]["sans"], h["mac"]["serif"]]
              if all(abs(_target - o) < 0.01 for o in _others):
                  print(f"  [arm h3 / #88] the width half asserts NOTHING this run: "
                        f"{_target} equals every other in-context reference "
                        f"{_others}, and 262 of 513 mac families tie at the #88 "
                        f"target. The log predicate above is the verdict.")
              else:
                  print(f"  [arm h3 / #88] discriminator OK: refused-probe width "
                        f"{_target} differs from at least one in-context reference "
                        f"{_others}.")
          if h3_failures:
              tripwires.append(f"(h3) default font after a per-context refusal (#88): {h3_failures}")
              note_unmeasured("(h3)", h3_failures, "DEFAULT FONT OUTSIDE THE LIST")
              print(f"  (h3) default font after a per-context refusal (#88):  RED -- {h3_failures}")
          else:
              print("  (h3) default font after a per-context refusal (#88):  GREEN -- no tripwire")
          # -----------------------------------------------------------

          if e_failures:
              tripwires.append(
                  f"(e) CSS @font-face -- doc.fonts vs arm (b) measurement disagree: "
                  f"{e_failures}. Discriminator result -- {hypothesis}")
          if f_failures:
              tripwires.append(f"(f) codepoint fallback -- settled values: {f_failures}")
              # Not note_unmeasured(): that helper takes ONE substring that only
              # the real leak branch emits, and this arm has five real-verdict
              # branches (not repeatable / never left the floor / same value /
              # no allowed match / ambiguous). The condition here is exact --
              # when the floor collides, the branch above is the ONLY entry in
              # f_failures and no verdict was reached, so nothing real can be
              # swallowed by recording it.
              # Only when the collision is the ONLY entry. A tofu branch or a
              # "no allowed family matched" branch IS a verdict about the gate,
              # and routing the arm to `unmeasured` alongside one would let
              # KNOWN_UNMEASURABLE swallow a real defect claim.
              if f_collision and f_failures == [f_collision]:
                  unmeasured_arms["(f)"] = f_collision[:220]
          if g_failures:
              tripwires.append(f"(g) worker vs arm (b) per-context ground truth disagree: {g_failures}")
          if h_failures:
              tripwires.append(f"(h) face-name lookup vs arm (b) per-context ground truth disagree: {h_failures}")

          print("=== arms (e)-(h) summary ===")
          print(f"  (e) CSS @font-face:         {'RED (expected)' if e_failures else 'GREEN'} -- {e_failures}")
          print(f"  (f) codepoint fallback:     {'RED' if f_failures else 'GREEN'} -- "
                f"mac_settled={mac_final} (family={bisect_allowed['mac']}) mac2_settled={mac2_final} "
                f"win_settled={win_final} (family={bisect_allowed['win']}) failures={f_failures}")
          print(f"  (g) worker/OffscreenCanvas: {'RED (expected)' if g_failures else 'GREEN'} -- {g_failures}")
          print(f"  (h) face-name lookup:       {'RED' if h_failures else 'GREEN'} -- {h_failures}")
          print(f"      mac: local('Segoe UI')={h['mac']['hFull']} local('SegoeUI')={h['mac']['hPs']} baseline={h['mac']['baseline']}")
          print(f"      win: local('Segoe UI')={h['win']['hFull']} local('SegoeUI')={h['win']['hPs']} baseline={h['win']['baseline']}")

          # -----------------------------------------------------------
          # Arm (n1): #94, the pref-font path. gfxFontGroup::FindFontForChar
          # exit 7 (gfxTextRun.cpp:3576-3593) calls WhichPrefFontSupportsChar,
          # which walks mLangGroupPrefFonts[lang][generic] with NO gate of any
          # kind -- no CamouIsFontAllowed, no MaskedFontListBlocks, not even
          # IsVisibleToCSS. The memo is process-global and its key carries
          # neither a context id nor a FontVisibility, so the FIRST caller to
          # miss fixes the cell for the whole process, at context 0, where the
          # gate allows everything.
          #
          # Fixture. Context list ["Times"] (mac-only in fonts.json). Stack
          # '72px "Times", serif' -- naming a generic makes mFallbackGeneric
          # Serif (gfxTextRun.cpp:1998-2000), so the cell consulted is
          # [x-cyrillic][Serif]. U+1C80 is UBLOCK_CYRILLIC_EXTENDED_C, which has
          # a case in GetFontPrefLangFor, and the Unix block of all.js:2746 sets
          # font.name-list.serif.x-cyrillic to the literal "serif" -- which
          # fontconfig, under the bundle's own fonts.conf, answers with Tinos.
          #
          # WHY "Times" AND NOT "Geneva". The plan wrote this fixture as
          # ["Geneva"], and Geneva is the one bundled mac family that never
          # renders (issue #95): run 34477369394's pixel discriminator has
          # Geneva rasterising byte-identical to a deliberately-absent family
          # while the Helvetica Neue control differs, so the test was valid and
          # Geneva did not resolve. A list of one unrenderable family leaves
          # mFonts EMPTY, which routes U+1C80 through GetDefaultFont's
          # last-resort walk (#88) instead of FindFontForChar exit 7 (#94) and
          # would make a RED here attributable to the wrong issue -- and the
          # tofu floor and the Tinos reference could then be the same face,
          # which trips this arm's own control-invalid branch. Times is mac-only
          # like Geneva, renders, and is A2's first serif-row family, so the
          # appended `serif` generic resolves to Times as well: mFonts holds a
          # real face, exit 7 is the path under test, and the substitution
          # changes nothing about the attribution argument below, because that
          # argument is about what covers U+1C80, not about what is in the list.
          #
          # WHY U+1C80. Scanned over every face and every cmap subtable of
          # bundle/fonts/{macos,windows,linux}: among families whose name does
          # not start with '.', ONLY Tinos and Arimo cover it. Both are
          # lin-only in fonts.json, so both gates refuse them under ["Times"],
          # and no mac family can answer instead -- which is what makes a RED
          # here attributable to the ungated pref path rather than to an
          # ordinary in-list fallback. Re-run against the shipped bundle before
          # this arm landed: 345 faces scanned, U+1C80 -> ['Arimo', 'Tinos'].
          #
          # WHAT WOULD MAKE THIS PRINT A WRONG ANSWER (CLAUDE.md lesson 4):
          #  * The Tinos reference and the tofu floor could be equal, in which
          #    case "matched Tinos" and "rendered nothing" are the same number.
          #    Asserted below; if equal the arm scores nothing.
          #  * The Tinos reference is measured by FAMILY NAME in a BARE context.
          #    That is a SEPARATE browser process -- one_page_list_arg opens its
          #    own sync_playwright() -- so this is not a same-process
          #    comparison. What makes the two sides comparable is narrower and
          #    has to be stated as what it is: the same font FILES (one
          #    artifact, one FONTCONFIG_FILE), the same 72px size, the same
          #    canvas measureText path, and an advance width that is a property
          #    of the face rather than of the context. Arm (h) relies on the
          #    same property and states it the same way.
          #  * The reference launch's OWN font list contains Tinos -- its
          #    appended serif generic resolves there because no per-context list
          #    refuses it -- so its `fontlist` line would satisfy the "a carrier
          #    reached mFonts" branch below if it were in the window. Every
          #    camou_fl read is therefore taken BEFORE the reference launch, and
          #    the lines are additionally filtered to the fixture context's own
          #    ctx=. Either alone would do; both are cheap.
          #  * On a binary with no `fontlist` kind at all the precondition
          #    "the context's list resolved to no U+1C80 carrier" cannot be
          #    read. That is the width-only branch. It still scores: a width
          #    match against the bare reference IS #94's leak, and #94 needs a
          #    Phase 0 RED.
          N1_CP = 0x1C80          # CYRILLIC SMALL LETTER ROUNDED VE
          N1_PUA = 0xE000         # tofu floor: nothing MAC-side covers it
          N1_NAMED = "Times"      # mac-only, renders (unlike Geneva, #95)
          N1_LIST = [N1_NAMED]
          N1_OUTSIDE = "Tinos"    # the ctx-0 pref answer under the bundle conf

          JS_N1 = """(a) => {
            const c = document.createElement('canvas').getContext('2d');
            const out = {};
            c.font = '72px "' + a.named + '", serif';
            out.probe = c.measureText(String.fromCodePoint(a.cp)).width;
            out.floor = c.measureText(String.fromCodePoint(a.pua)).width;
            c.font = '72px "' + a.outside + '"';
            out.outsideDirect = c.measureText(String.fromCodePoint(a.cp)).width;
            return out;
          }"""

          def one_page_list_arg(font_list, js, arg):
              # one_page_arg() with an EXPLICIT list rather than a fonts.json
              # key. Same launch ({}), same context, same single page.
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx = b.new_context()
                  if font_list is not None:
                      ctx.add_init_script(
                          'if (typeof window.setFontList === "function") '
                          'window.setFontList(%s);' % json.dumps(",".join(font_list)))
                  page = ctx.new_page()
                  page.goto("data:text/html,<h1>n1</h1>")
                  result = page.evaluate(js, arg)
                  b.close()
                  return result

          # M2: this was a byte-identical second copy of `_ctx_of`, which arm
          # (h3) defines earlier in this same heredoc. One function, two names,
          # is a thing to grep twice and change once.
          _ctx_tok = _ctx_of

          n1_mark = log_mark()
          n1 = one_page_list_arg(
              N1_LIST, JS_N1,
              {"named": N1_NAMED, "cp": N1_CP, "pua": N1_PUA,
               "outside": N1_OUTSIDE})
          # EVERY log read happens HERE, before the reference launch. The
          # reference runs with no per-context list, so its own appended serif
          # generic resolves to Tinos and its `fontlist` line names a U+1C80
          # carrier -- which is exactly the string the "a carrier reached
          # mFonts" branch below refuses on. camou_fl reads every file in
          # LOG_DIR and treats a file absent from the mark as offset 0
          # (see camou_fl above), so a launch made after the mark IS inside the
          # window. Reading first is what keeps the fixture's window the
          # fixture's.
          n1_fl_all = camou_fl(n1_mark, "CAMOU-FL fontlist", limit=None)
          n1_pf_all = camou_fl(n1_mark, "CAMOU-FL pref-fallback", limit=None)
          # Second, independent narrowing: keep only the fixture context's own
          # lines. The fixture is the single launch in this window, so its ctx
          # is whichever non-zero id its `fontlist` lines carry.
          n1_ctxs = {c for c in (_ctx_tok(ln) for ln in n1_fl_all)
                     if c and c != "0"}
          n1_ctx = next(iter(n1_ctxs)) if len(n1_ctxs) == 1 else None
          n1_fl = [ln for ln in n1_fl_all if _ctx_tok(ln) == n1_ctx] if n1_ctx else []
          n1_pf = [ln for ln in n1_pf_all if _ctx_tok(ln) == n1_ctx] if n1_ctx else []

          # The reference: Tinos's U+1C80 measured by family name in a BARE
          # context, where no per-context list gates anything.
          n1_ref = one_page_list_arg(
              None, JS_N1,
              {"named": N1_NAMED, "cp": N1_CP, "pua": N1_PUA,
               "outside": N1_OUTSIDE})["outsideDirect"]
          n1_have_fontlist = kind_total("fontlist") > 0
          print(f"  [arm n1 / #94] probe(U+1C80 in {N1_LIST})={n1['probe']} "
                f"floor(U+E000)={n1['floor']} tinos_ref={n1_ref} ctx={n1_ctx} "
                f"fontlist_lines={len(n1_fl)}/{len(n1_fl_all)} "
                f"pref_fallback_lines={len(n1_pf)}/{len(n1_pf_all)} "
                f"kind_totals: fontlist={kind_total('fontlist')} "
                f"pref-fallback={kind_total('pref-fallback')}")
          for _ln in (n1_fl + n1_pf)[-6:]:
