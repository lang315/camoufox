                  f"generic-map lines but this arm could not resolve a single "
                  f"non-zero ctx for its own launch (fontlist lines "
                  f"{len(n2_fl_all)}, generic-map lines {len(n2_gm_all)}), so no "
                  f"line can be attributed to the fixture context and an unrelated "
                  f"ctx=0 resolution would be scored as this arm's")
          elif kind_total("generic-map") > 0:
