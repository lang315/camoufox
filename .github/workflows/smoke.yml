          g_failures = []
          for label, ground in (("mac", mac["measure"]), ("win", win["measure"])):
              for fam in ("Segoe UI", "Helvetica Neue"):
                  worker_present = g[label]["gWorker"][fam] != g[label]["gWorkerBaseline"]
                  if worker_present != ground[fam]:
                      g_failures.append(
                          f"{label}/{fam}: worker {'resolved' if worker_present else 'did not resolve'} "
                          f"it, arm (b) says this context {'has' if ground[fam] else 'does not have'} it")

          # (h) face-name lookup: local('Segoe UI') and local('SegoeUI') --
          # full name and PostScript name -- both name the SAME face, which
          # belongs to the WIN_ONLY family "Segoe UI". Ground truth is arm
          # (b)'s own per-context measurement of that family (mac["measure"]
          # / win["measure"]["Segoe UI"]), the same trusted reference arm
          # (g) compares against above -- NOT "mac != win", since a leak
          # that resolved the SAME wrong face in both contexts would still
          # show mac == win and pass a same-vs-different check.
          #
          # "Resolved" means the probe rendered the GENUINE Segoe UI face:
          # its width equals Segoe UI's width measured by family name in the
          # win context of this same run (arm (g), main thread, same text,
          # same 48px, same monospace stack). Advance widths are a property
          # of the font file, not of the context -- Tahoma measures
          # identically in both contexts above -- so that reference differs
          # from every face this arm can otherwise reach in this run --
          # monospace, sans-serif and serif, checked below. Metric-compatible
          # families exist by design, so this is a per-run check, not a
          # universal. The previous verdict,
          # `width != baseline`, could not tell "resolved Segoe UI" from
          # "local() was blocked and text fell back to a non-monospace face":
          # diag run 34211089822 logged the gate BLOCKING both mac probes
          # (ctx with list, allowed=0) while the mac page still measured
          # 375.7 -- neither Segoe UI (448.4) nor monospace (507.5) -- and the
          # old verdict called that a leak for four consecutive runs.
          #
          # CAVEAT: arm (b)'s "ground truth" is valid only in the donor-closed
          # shape it measures (see the #83 discriminator below); a donor-alive
          # companion for this arm is a follow-up.
          h_failures = []
          segoe_ref = g["win"]["gMain"]["Segoe UI"]
          # MN8 (from PR #84's re-review): the previous version checked segoe_ref
          # only against the WIN context's generics, so a mac-side clash --
          # segoe_ref equal to a width the mac context can reach for free --
          # would let the mac arm read "resolved Segoe UI" for a face that is
          # simply the mac generic. The mac context is where the refusal is
          # under test, so its own generics have to be in the clash set too.
          h_ref_clash = [name for name, w in (
                             ("win monospace baseline", g["win"]["baseline48"]),
                             ("win sans-serif", h["win"]["sans"]),
                             ("win serif", h["win"]["serif"]),
                             ("mac monospace baseline", h["mac"]["baseline"]),
                             ("mac sans-serif", h["mac"]["sans"]),
                             ("mac serif", h["mac"]["serif"]))
                         if segoe_ref == w]
          if h_ref_clash:
              h_failures.append(
                  f"control invalid: the win context's family-name Segoe UI width ({segoe_ref}) "
                  f"equals its {' and '.join(h_ref_clash)} width, so it cannot serve as the "
                  f"genuine-face reference for this run")
          for label, ground in (("mac", mac["measure"]), ("win", win["measure"])):
              for probe_key, probe_name in (("hFull", "local('Segoe UI')"),
                                            ("hPs", "local('SegoeUI')")):
                  w = h[label][probe_key]
                  resolved = abs(w - segoe_ref) < 0.01
                  fell_back_to = ("monospace" if w == h[label]["baseline"] else
                                  "sans-serif" if w == h[label]["sans"] else
                                  "serif" if w == h[label]["serif"] else
                                  "an unidentified face")
                  print(f"  [{label} / arm h] {probe_name}: width={w} segoe={segoe_ref} "
                        f"baseline={h[label]['baseline']} sans={h[label]['sans']} "
                        f"serif={h[label]['serif']} -> "
                        f"{'resolved Segoe UI' if resolved else 'fell back to ' + fell_back_to}")
                  if resolved != ground["Segoe UI"]:
                      h_failures.append(
                          f"{label}/{probe_name}: {'resolved' if resolved else 'did not resolve'} "
                          f"the Segoe UI face (width={w} segoe={segoe_ref} "
                          f"baseline={h[label]['baseline']}), arm (b) says this context "
                          f"{'has' if ground['Segoe UI'] else 'does not have'} Segoe UI")

          if e_failures:
              tripwires.append(
                  f"(e) CSS @font-face -- doc.fonts vs arm (b) measurement disagree: "
                  f"{e_failures}. Discriminator result -- {hypothesis}")
          if f_failures:
              tripwires.append(f"(f) codepoint fallback -- settled values: {f_failures}")
          if g_failures:
              tripwires.append(f"(g) worker vs arm (b) per-context ground truth disagree: {g_failures}")
          if h_failures:
              tripwires.append(f"(h) face-name lookup vs arm (b) per-context ground truth disagree: {h_failures}")

          print("=== arms (e)-(h) summary ===")
          print(f"  (e) CSS @font-face:         {'RED (expected)' if e_failures else 'GREEN'} -- {e_failures}")
          print(f"  (f) codepoint fallback:     {'RED' if f_failures else 'GREEN'} -- "
                f"mac_settled={mac_final} (family={bisect_allowed['mac']}) mac2_settled={mac2_final} "
                f"win_settled={win_final} (family={bisect_allowed['win']}) failures={f_failures}")
          print(f"  (g) worker/OffscreenCanvas: {'RED (expected)' if g_failures else 'GREEN'} -- {g_failures}")
          print(f"  (h) face-name lookup:       {'RED' if h_failures else 'GREEN'} -- {h_failures}")
          print(f"      mac: local('Segoe UI')={h['mac']['hFull']} local('SegoeUI')={h['mac']['hPs']} baseline={h['mac']['baseline']}")
          print(f"      win: local('Segoe UI')={h['win']['hFull']} local('SegoeUI')={h['win']['hPs']} baseline={h['win']['baseline']}")

          # -----------------------------------------------------------
          # Arm (h'): identify the 375.70001220703125 face (#88). Arm (h) above
          # proved the gate FIRED for both mac probes -- the diag build's
          # CAMOU-H trace logged ctx=6 hasList=1 allowed=0 -- and the text still
          # rendered at 375.70001220703125, which matches nothing else in run
          # 34213805428: not the real Segoe UI (448.4 in the win context), not
          # the generics (507.5), not Helvetica Neue (441.45), not Tahoma
          # (436.27). Method 1 of #88: measure every family the macOS bundle
          # carries, in the same mac context, at the same size and stack, and
          # print whichever matches. No rebuild.
          #
          # WHAT WOULD MAKE THIS PRINT A WRONG ANSWER (CLAUDE.md lesson 4):
          #  * A family that does NOT resolve measures the monospace baseline,
          #    because the probe stack is '48px "F", monospace' -- the same
          #    stack arm (h) uses. So a match must be reported together with
          #    whether that width equals the baseline; if it does, the "match"
          #    is just the fallback and names nothing.
          #  * .ttc files hold several faces and TTFont() raises on them, so a
          #    silent except would drop 33 of the 61 bundle entries and let the
          #    arm report "no match" when the answer was in the files it
          #    skipped. Collections are opened with TTCollection and every
          #    failure is counted and printed.
          #  * This is a DIAGNOSTIC. It appends to no tripwire and changes no
          #    verdict; it prints, and #88 is answered from what it prints.
          H88_TARGET = 375.70001220703125

          def mac_bundle_families():
              from fontTools.ttLib import TTFont, TTCollection
              fams, errs = set(), []
              root = "bundle/fonts/macos"
              for dirpath, _dirnames, filenames in os.walk(root):
                  for fn in filenames:
                      p = os.path.join(dirpath, fn)
                      try:
                          if fn.lower().endswith(".ttc"):
                              faces = list(TTCollection(p).fonts)
                          else:
                              faces = [TTFont(p, fontNumber=0, lazy=True)]
                      except Exception as exc:
                          errs.append(f"{fn}: {type(exc).__name__}")
                          continue
                      for face in faces:
                          try:
                              for rec in face["name"].names:
                                  # 1 = family, 16 = typographic family
                                  if rec.nameID in (1, 16):
                                      s = rec.toUnicode()
                                      if s:
                                          fams.add(s)
                          except Exception as exc:
                              errs.append(f"{fn}: name table: {type(exc).__name__}")
              return sorted(fams), errs

          JS_HP = """(families) => {
            const c = document.createElement('canvas').getContext('2d');
            const s48 = 'mmmmmmmmmmlli';
            const widths = {};
            for (const f of families) {
              c.font = '48px "' + f + '", monospace';
              widths[f] = c.measureText(s48).width;
            }
            for (const gname of ['monospace', 'sans-serif', 'serif']) {
              c.font = '48px ' + gname;
              widths['generic:' + gname] = c.measureText(s48).width;
            }
            return widths;
          }"""

          # M1 (from this task's review): arm (k)'s fontTools import is wrapped
          # and this one was not, while this call runs FIRST -- a
          # pip-succeeds-then-import-fails would abort the whole step before
          # arms (k), (i), (i2), (j) and (j2). Wrapping it makes the "this is a
          # DIAGNOSTIC, it changes no verdict" claim above true without
          # qualification: a failure lands in the SKIP branch below.
          try:
              hp_families, hp_errs = mac_bundle_families()
          except Exception as exc:
              hp_families = []
              hp_errs = [f"mac_bundle_families: {type(exc).__name__}: {exc}"]
          print(f"  [arm h' / #88] enumerated {len(hp_families)} family names from "
                f"bundle/fonts/macos; {len(hp_errs)} file(s) could not be read: {hp_errs}")
          if not hp_families:
              print("  [arm h' / #88] SKIP: no family names could be extracted -- the "
                    "identification cannot run, #88 falls back to its method 2 (log the "
                    "resolved gfxFontEntry after refusal) in a later build.")
          else:
              hp = one_page_arg("mac", JS_HP, hp_families)
              hp_baseline = hp.get("generic:monospace")
              hp_matches = [(f, w) for f, w in hp.items()
                            if not f.startswith("generic:")
                            and abs(w - H88_TARGET) < 0.01]
              print(f"  [arm h' / #88] mac-context generics: monospace={hp_baseline} "
                    f"sans-serif={hp.get('generic:sans-serif')} serif={hp.get('generic:serif')}")
              print(f"  [arm h' / #88] target {H88_TARGET}; families within 0.01: "
                    f"{hp_matches or 'NO MATCH'}")
              if hp_baseline is not None and abs(hp_baseline - H88_TARGET) < 0.01:
                  print(f"  [arm h' / #88] WARNING: the mac monospace baseline is itself "
                        f"{hp_baseline}, so every unresolved family matches the target and "
                        f"the list above names nothing.")
              elif hp_matches:
                  print(f"  [arm h' / #88] ANSWER: local('Segoe UI') in the mac context "
                        f"resolves to {[f for f, _ in hp_matches]}. Arm (h)'s verdict scores "
                        f"only 'is this the Segoe UI width', so this face passes it today; "
                        f"whether it is an expected fallback or a leak is #88's decision.")
              else:
                  print(f"  [arm h' / #88] ANSWER: {H88_TARGET} matches no family the macOS "
                        f"bundle carries, so the face is not a bundled mac family. #88 falls "
                        f"back to its method 2 (log the resolved gfxFontEntry after refusal "
                        f"in LookupInSharedFaceNameList), which needs a build.")
          # -----------------------------------------------------------

          # Web-font measurement (out of scope for this task -- see the
          # comment on JS_WEBFONT above). A local .ttf on the runner
          # supplies real font bytes for a data: URI src -- the browser
          # only ever sees these as ordinary web-font bytes, not a host
          # font, so the host-font-deletion machinery is irrelevant here.
          import base64, glob

          def find_test_font():
              for c in (
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                  "/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf",
              ):
                  if os.path.exists(c):
                      return c
              hits = glob.glob("/usr/share/fonts/**/*.ttf", recursive=True)
              return hits[0] if hits else None

          webfont_path = find_test_font()
          if webfont_path is None:
              print("  [web-font] SKIP: no local .ttf found on the runner to embed")
          else:
              with open(webfont_path, "rb") as fh:
                  webfont_b64 = base64.b64encode(fh.read()).decode("ascii")
              webfont_uri = "data:font/ttf;base64," + webfont_b64

              def one_page_webfont(fonts_key, js, arg):
                  # Same shape as one_page() above, but page.evaluate() here
                  # needs an argument (the data: URI) -- kept as its own
                  # function rather than changing one_page()'s signature.
                  with sync_playwright() as pw:
                      b = pw.firefox.launch(
                          executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                          env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                      ctx = b.new_context()
                      ctx.add_init_script(
                          'if (typeof window.setFontList === "function") '
                          'window.setFontList(%s);' % json.dumps(",".join(FONTS[fonts_key])))
                      page = ctx.new_page()
                      page.goto("data:text/html,<h1>f</h1>")
                      result = page.evaluate(js, arg)
                      b.close()
                      return result

              webfont = one_page_webfont("mac", JS_WEBFONT, webfont_uri)
              print(f"  [web-font] font file used: {webfont_path} ({len(webfont_b64)} b64 chars)")
              print(f"  [web-font] document.fonts status = {webfont['status']!r}")
              print(f"  [web-font] rendered (probe width {webfont['probeWidth']} vs "
                    f"monospace baseline {webfont['baseline']})? {webfont['rendered']}")
              if webfont['status'] == 'error' and webfont['rendered']:
                  print("  [web-font] FINDING (out of scope, not fixed here): "
                        "document.fonts reports 'error' for an ordinary web font "
                        "that the canvas evidence shows the browser actually "
                        "rendered -- SetStatus() answers every @font-face from "
                        "IsFontAllowed(), not just the OS-name spoofing surface "
                        "#44 targets. A page can watch its own web font render "
                        "while document.fonts calls it failed. Recorded for "
                        "issue #44; intentionally not fixed by this task.")
              elif webfont['status'] == 'loaded' and not webfont['rendered']:
                  print("  [web-font] unexpected: status says 'loaded' but no "
                        "render evidence -- treat this measurement as unreliable, "
                        "not a clean answer either way.")
              else:
                  print("  [web-font] status and render evidence agree -- no "
                        "production-wide surface shown by this measurement.")

              if webfont['status'] == 'error' and not webfont['rendered']:
                  # Review pushback: status and render evidence agreeing
                  # does NOT mean "no problem" here -- it means the web font
                  # is consistently blocked rather than inconsistently
                  # reported, and "camoufox blocks web fonts" would itself
                  # be a far bigger tell than #44. But one sample through a
                  # data: URI on a data: page can fail for reasons that have
                  # nothing to do with font gating (CSP, origin rules, a
                  # malformed payload). Discriminator: does this same page
                  # render under a BARE launch/context instead -- no
                  # CAMOU_CONFIG "fonts" key, no setFontList() call at all,
                  # so IsFontAllowed()'s own second branch
                  # (FontFaceImpl.h) falls through to allow-everything?
                  def one_page_webfont_bare(js, arg):
                      # Deliberately NOT one_page_webfont() above: this one
                      # must skip the setFontList() call entirely, not just
                      # pass a different fonts_key -- there must be no
                      # per-context list AND no launch-level list installed.
                      with sync_playwright() as pw:
                          b = pw.firefox.launch(
                              executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                              env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                          ctx = b.new_context()
                          page = ctx.new_page()
                          page.goto("data:text/html,<h1>f</h1>")
                          result = page.evaluate(js, arg)
                          b.close()
                          return result

                  webfont_bare = one_page_webfont_bare(JS_WEBFONT, webfont_uri)
                  print(f"  [web-font/bare] document.fonts status = {webfont_bare['status']!r}")
                  print(f"  [web-font/bare] rendered (probe width {webfont_bare['probeWidth']} vs "
                        f"monospace baseline {webfont_bare['baseline']})? {webfont_bare['rendered']}")
                  if webfont_bare['rendered']:
                      print("  [web-font] DISCRIMINATOR: renders under the bare launch/context "
                            "(IsFontAllowed falls through to allow-everything) but NOT under the "
                            "per-context-list measurement above -- pins the non-render to font "
                            "gating specifically. This is a real defect, out of scope for #44 "
                            "and NOT fixed by this task -- it needs its own issue and its own plan.")
                  else:
                      print("  [web-font] DISCRIMINATOR: fails to render under the bare "
                            "launch/context too, where IsFontAllowed() allows everything -- the "
                            "non-render cannot be font gating. The probe's own setup is at fault "
                            "(most likely the data: URI font payload -- decode failure, MIME "
                            "type, or the raw .ttf needing a woff2 wrapper instead), not a gating "
                            "defect. The question stays open, not closed: next step would be "
                            "checking for a console font-decode error, or trying a woff2 payload.")

          # -----------------------------------------------------------
          # Arm (k): #80's RENDER half. The web-font block above measured probe
          # width 761.33 in BOTH launches -- only the monospace reference moved
          # (#80's own recorded numbers). Its probe font was DejaVuSans.ttf,
          # which IS a bundled family, so reference and measurement could
          # resolve to the same typeface and "rendered? False" was never
          # established (CLAUDE.md lesson 4; code-recon A.1). Only the
          # `status = 'error'` half is supported by that evidence.
          #
          # This arm removes the coincidence. The probe font is built here at
          # run time, has no twin anywhere in bundle/fonts, and carries a
          # deliberately absurd advance: unitsPerEm 1000 with glyph 'a' advancing
          # 2000 units, so at 48px each 'a' advances 48 * 2000/1000 = 96px and a
          # 20-character string measures exactly 1920. "Did it render" is one
          # exact number and needs no reference face at all.
          #
          # WHAT WOULD MAKE THIS ARM GREEN WRONGLY (CLAUDE.md lesson 4):
          #  1. A payload that fails to build or fails to decode gives status
          #     'error' and a fallback width -- indistinguishable from the gate
          #     refusing it. The BARE launch is the control: no `fonts` key, no
          #     setFontList call, so IsFontAllowed answers true for everything
          #     (FontFaceImpl.h). If the face does not render THERE, the probe
          #     is at fault and the arm reports "probe invalid" rather than a
          #     #80 verdict.
          #  2. 1920 arriving from a fallback face would require that face to
          #     have a two-em advance for 'a'. Ruled out explicitly: the
          #     monospace baseline for the same string is measured and must not
          #     equal 1920.
          #  3. Reading `document.fonts` for the wrong face. The family name is
          #     matched with the quote-stripping the existing web-font probe
          #     uses, because FontFace.family serialises WITH quotes -- the
          #     defect that made every arm (e) face read 'error' before #84.
          K_FAMILY = "CamouProbeK"
          K_EXPECT = 1920.0

          def build_probe_k():
              """A one-glyph TTF with a two-em advance. Returns a data: URI, or
              None if fontTools could not build it (reported, never silent)."""
              import io
              import base64 as _b64
              from fontTools.fontBuilder import FontBuilder
              from fontTools.pens.ttGlyphPen import TTGlyphPen
              fb = FontBuilder(1000, isTTF=True)
              fb.setupGlyphOrder([".notdef", "a"])
              fb.setupCharacterMap({0x61: "a"})
              pen = TTGlyphPen(None)
              pen.moveTo((100, 0))
              pen.lineTo((100, 700))
              pen.lineTo((900, 700))
              pen.lineTo((900, 0))
              pen.closePath()
              fb.setupGlyf({".notdef": TTGlyphPen(None).glyph(), "a": pen.glyph()})
              fb.setupHorizontalMetrics({".notdef": (2000, 0), "a": (2000, 100)})
              fb.setupHorizontalHeader(ascent=800, descent=-200)
              fb.setupNameTable({
                  "familyName": K_FAMILY,
                  "styleName": "Regular",
                  "uniqueFontIdentifier": K_FAMILY + "-Regular-camoufox-probe",
                  "fullName": K_FAMILY + " Regular",
                  "psName": K_FAMILY + "-Regular",
                  "version": "1.000",
              })
              fb.setupOS2(sTypoAscender=800, sTypoDescender=-200,
                          usWinAscent=800, usWinDescent=200)
              fb.setupPost()
              buf = io.BytesIO()
              fb.save(buf)
              return "data:font/ttf;base64," + _b64.b64encode(buf.getvalue()).decode("ascii")

          k_uri, k_build_error = None, None
          try:
              k_uri = build_probe_k()
          except Exception as exc:
              k_build_error = f"{type(exc).__name__}: {exc}"

          JS_K = """async (fontDataUri) => {
            const FAMILY = 'CamouProbeK';
            const sheet = document.createElement('style');
            sheet.textContent =
                '@font-face { font-family: ' + FAMILY + '; src: url("' + fontDataUri + '"); }';
            document.head.appendChild(sheet);
            document.body.offsetHeight;
            await document.fonts.ready;
            const face = [...document.fonts].find(
                f => f.family.replace(/^["\']|["\']$/g, '') === FAMILY);
            const c = document.createElement('canvas').getContext('2d');
            const s = 'aaaaaaaaaaaaaaaaaaaa';   // 20 glyphs -> 1920 at 48px
            c.font = '48px monospace';
            const baseline = c.measureText(s).width;
            c.font = '48px "' + FAMILY + '", monospace';
            const probeWidth = c.measureText(s).width;
            return {status: face ? face.status : 'NO_FACE_FOUND',
                    probeWidth: probeWidth, baseline: baseline};
          }"""

          def k_launch(with_list, js, arg):
              # Its own launcher: one_page_webfont / one_page_webfont_bare are
              # nested inside the web-font block's conditionals and are not in
              # scope here.
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx = b.new_context()
                  if with_list:
                      ctx.add_init_script(
                          'if (typeof window.setFontList === "function") '
                          'window.setFontList(%s);' % json.dumps(",".join(FONTS["mac"])))
                  page = ctx.new_page()
                  page.goto("data:text/html,<h1>k</h1>")
                  result = page.evaluate(js, arg)
                  b.close()
                  return result

          k_failures = []
          if k_uri is None:
              k_failures.append(
                  f"arm (k) probe invalid: fontTools could not build the probe face "
                  f"({k_build_error}) -- no #80 verdict is available from this run.")
          else:
              k_list = k_launch(True, JS_K, k_uri)
              k_bare = k_launch(False, JS_K, k_uri)
              print(f"  [arm k / #80] per-context list (FONTS['mac'], which cannot contain "
                    f"{K_FAMILY!r}): status={k_list['status']!r} width={k_list['probeWidth']} "
                    f"monospace baseline={k_list['baseline']} (expect {K_EXPECT} after the fix)")
              print(f"  [arm k / #80] bare launch (control -- IsFontAllowed allows everything): "
                    f"status={k_bare['status']!r} width={k_bare['probeWidth']} "
                    f"monospace baseline={k_bare['baseline']}")
              if abs(k_bare["probeWidth"] - K_EXPECT) >= 0.01:
                  k_failures.append(
                      f"arm (k) probe invalid: under the BARE launch -- no `fonts` key and no "
                      f"setFontList call, so IsFontAllowed answers true for every family -- "
                      f"the probe measured {k_bare['probeWidth']}, not {K_EXPECT}. The payload "
                      f"or the @font-face rule is at fault, not the gate, and this arm cannot "
                      f"say anything about #80 until the bare control renders.")
              elif (abs(k_bare["baseline"] - K_EXPECT) < 0.01
                    or abs(k_list["baseline"] - K_EXPECT) < 0.01):
                  # M6 (from this task's review): wrong-GREEN cause 2 above says
                  # "the monospace baseline for the same string is measured and
                  # must not equal 1920", but only the bare launch's baseline was
                  # checked. Both launches measure one, and either reaching
                  # K_EXPECT destroys the identification.
                  k_failures.append(
                      f"arm (k) control invalid: the monospace baseline for the same string is "
                      f"also {K_EXPECT} in at least one launch (bare {k_bare['baseline']}, "
                      f"per-context list {k_list['baseline']}), so {K_EXPECT} no longer "
                      f"identifies the probe face.")
              else:
                  if k_list["status"] != "loaded":
                      k_failures.append(
                          f"arm (k)/#80: a url() web font under a per-context list reports "
                          f"document.fonts status {k_list['status']!r}, not 'loaded'. The same "
                          f"bytes report {k_bare['status']!r} under the bare launch, so this "
                          f"is the family-name gate refusing a family the page invented, not a "
                          f"load failure. FontFaceImpl::SetStatus / FontFace::Status().")
                  if abs(k_list["probeWidth"] - K_EXPECT) >= 0.01:
                      k_failures.append(
                          f"arm (k)/#80: the same url() web font did not RENDER under a "
                          f"per-context list -- width {k_list['probeWidth']}, expected "
                          f"{K_EXPECT}, monospace baseline {k_list['baseline']} -- while it "
                          f"rendered at {k_bare['probeWidth']} under the bare launch. This is "
                          f"the render half #80 never established.")
          print(f"  (k) url() web font under a fonts list (#80):  "
                f"{'RED' if k_failures else 'GREEN'} -- "
                f"{k_failures or f'status loaded and width {K_EXPECT} under both launches'}")
          if k_failures:
              tripwires.append(f"(k) url() web font under a fonts list (#80): {k_failures}")
              # R1 (from this task's re-review): arm (k) was the one arm left
              # carrying C5's defect. Three of its five k_failures branches are
              # precondition failures -- probe invalid when fontTools could not
              # build the face, probe invalid when the bare control did not
              # render, control invalid when a monospace baseline reaches
              # K_EXPECT -- and all five reach tripwires, so any of the three
              # printed "(k) RED (expected) ... #80 ... unfixed", a verdict the
              # arm never produced. The marker is unique to the two verdict
              # branches, which are the only strings carrying "arm (k)/#80:".
              note_unmeasured("(k)", k_failures, "arm (k)/#80:")
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Arm (i): the negative fallback cache Task 4's gate made
          # reachable (#81 / Task 4b). gfxPlatformFontList's
          # mCodepointsWithNoFonts is a process-wide "no font covers
          # this codepoint" cache, keyed only by FontVisibility --
          # unrelated to mUserContextId. gfxFontGroup::FindFontForChar
          # consults it via SkipFontFallbackForChar() at
          # gfxTextRun.cpp:3450, BEFORE reaching
          # WhichSystemFontSupportsChar at :3506 -- Task 4's gate. A
          # cache hit short-circuits FindFontForChar and returns
          # early; the gate never runs.
          #
          # Before Task 4 a fallback miss was almost impossible (the
          # scan was unfiltered, nearly always found something).
          # After Task 4 a miss is the correct, expected outcome
          # whenever a context's own list covers nothing for a
          # codepoint -- which is exactly what makes this cache
          # reachable in normal operation for the first time.
          #
          # This arm must do the OPPOSITE of every other arm in this
          # guard: ONE launch, TWO contexts, IN ORDER. Every other arm
          # gives each measurement its own fresh launch specifically
          # for isolation -- which is exactly why none of them can see
          # this bug (the cache always starts empty). Context A gets a
          # list covering NOTHING for U+6F22 (a genuine, correct miss
          # that poisons the process-wide cache); context B, same
          # launch, opened AFTER A, gets a list that DOES cover it. B
          # rendering tofu is the bug -- B's own gate never ran because
          # the cache answered before FindFontForChar ever reached it.
          # B rendering its own real glyph is the fix.
          NO_CJK_PROBE = ["Calibri", "Segoe UI", "Arial"]

          def two_contexts_one_launch(list_a, list_b, js, extra_prefs=None):
              # extra_prefs is additive and defaults to nothing, so arm (i)'s
              # already-confirmed RED/GREEN pair (runs 33597181430 / 33597175086)
              # keeps the exact launch it was measured under. Only arm (j)
              # passes anything.
              prefs = {"dom.ipc.processCount": 1}
              if extra_prefs:
                  prefs.update(extra_prefs)
              # Deliberately NOT one_page(): every other helper in this
              # file gives each measurement its own fresh launch. This
              # arm needs the opposite -- one launch serving two
              # contexts in sequence, so a launch-lifetime cache set by
              # the first can be observed (or not) by the second.
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      # PERMANENT, not diagnostic: gfxPlatformFontList is
                      # a per-process singleton, and Firefox's content-
                      # process selection factors in OriginAttributes
                      # (mUserContextId is a member) -- so two sequential
                      # new_context() calls normally land in SEPARATE
                      # content processes with no shared font-list state
                      # at all, and this arm tests NOTHING without this
                      # pref. Confirmed empirically, not just by source
                      # reading: the unforced arm read GREEN in every
                      # earlier run of this task (mistaken for "the fix
                      # works" and, before that, for "the bug isn't
                      # reachable") purely because the two contexts never
                      # shared a process; forcing this pref produced the
                      # first RED/GREEN pair that actually meant
                      # anything -- RED on a binary with no #81 fix
                      # (run 33597181430), GREEN with it (run
                      # 33597175086), both under this exact pref. Default
                      # dom.ipc.processCount is 8, so production
                      # reproduction starts as soon as a caller runs more
                      # than a handful of contexts and process reuse
                      # begins -- this pref makes that condition apply on
                      # every run of this arm, every time, rather than
                      # depending on how many contexts happen to precede
                      # it.
                      firefox_user_prefs=prefs,
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx_a = b.new_context()
                  ctx_a.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(list_a)))
                  page_a = ctx_a.new_page()
                  page_a.goto("data:text/html,<h1>4b-a</h1>")
                  pids_a = tab_pids()
                  result_a = page_a.evaluate(js)

                  ctx_b = b.new_context()
                  ctx_b.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(list_b)))
                  page_b = ctx_b.new_page()
                  page_b.goto("data:text/html,<h1>4b-b</h1>")
                  pids_b = tab_pids()
                  result_b = page_b.evaluate(js)

                  b.close()
                  # A stays open for B's whole probe (no ctx_a.close()), which is
                  # the donor-alive shape #83 showed is the one that leaks.
                  return result_a, result_b, {"after_a": pids_a, "after_b": pids_b}

          JS_4B = """async () => {
            // Same fixed-window sampling discipline as arm (f)'s
            // JS_F_FINAL -- no early-stop heuristic, long enough to
            // clear the async cmap-loading window this fork's
            // fallback path goes through (see the Task 4 report's
            // source trace) -- so a genuinely-covered context isn't
            // mistaken for a poisoned one just because it hasn't
            // settled yet.
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "NoSuchFamilyAtAll"';
            const samples = [];
            for (let i = 0; i < 20; i++) {
              samples.push(c.measureText('漢').width);
              await new Promise(r => setTimeout(r, 500));
            }
            const refs = {};
            for (const fam of ['monospace', 'sans-serif', 'serif']) {
              c.font = '48px ' + fam;
              refs[fam] = c.measureText('漢').width;
            }
            return {final: samples[samples.length - 1], samples: samples, refs: refs};
          }"""

          i_a, i_b, i_pids = two_contexts_one_launch(NO_CJK_PROBE, FONTS["win"], JS_4B)
          print(f"  [arm i / 4b] tab pids after A / after B: {i_pids}")
          i_a_tofu = i_a["final"] in i_a["refs"].values()
          # NOT i_b["refs"]: FONTS["win"] broadly covers CJK, so B's own
          # generic-family refs (monospace/sans-serif/serif) can ALSO
          # correctly fall back to the SAME real CJK font B's own gate
          # finds for "NoSuchFamilyAtAll" -- both routes reach MS Gothic
          # for entirely legitimate reasons, so "differs from B's own
          # refs" is a false-negative test for a WORKING fix (caught by
          # this exact false AssertionError on the first real run: B
          # settled to 48, refs all 48 too, both correct, not tofu).
          # i_a's list has zero CJK anywhere, confirmed by i_a_tofu
          # above, so i_a["final"] is a reliable "genuinely nothing
          # rendered" baseline to compare B against instead.
          i_b_tofu = i_b["final"] == i_a["final"]
          print(f"  [arm i / 4b] context A (no-CJK list, first in launch) settled={i_a['final']} "
                f"refs={i_a['refs']} samples={i_a['samples']}")
          print(f"  [arm i / 4b] context B (FONTS['win'], same launch, AFTER A) settled={i_b['final']} "
                f"refs={i_b['refs']} samples={i_b['samples']}")

          # Collect-then-assert (team-lead directive), matching arms
          # (e)/(f)/(g): a hard `assert` here KILLS THE SCRIPT before any
          # arm below it runs -- and arm (i) is EXPECTED red on any
          # binary without the #81 fix, which is exactly the control
          # build arm (j) also needs. An inline assert made arm (j)
          # structurally unmeasurable on the one build where its own red
          # matters most (confirmed: run 33599430397, arm (i) correctly
          # red on the control build, arm (j) never printed anything at
          # all because the script died first). Every arm in this guard
          # must run and print, every time, before anything asserts.
          i_failures = []
          if not i_a_tofu:
              i_failures.append(
                  f"arm (i)/4b setup invalid: context A's no-CJK list ({NO_CJK_PROBE}) settled "
                  f"U+6F22 to {i_a['final']}, which is NOT its own tofu floor ({i_a['refs']}) -- "
                  f"either the probe list accidentally covers this codepoint, or something else "
                  f"is wrong with the setup. This arm cannot test the cache-poisoning bug until "
                  f"A's own miss is genuine.")
          elif i_b_tofu:
              i_failures.append(
                  f"arm (i)/4b: NEGATIVE FALLBACK CACHE BUG (#81) -- context B (FONTS['win'], "
                  f"same launch, measured AFTER context A's genuine miss) settled U+6F22 to "
                  f"{i_b['final']}, matching context A's confirmed tofu floor "
                  f"({i_a['final']}, no-CJK list) -- context A's "
                  f"correct, context-specific miss poisoned gfxPlatformFontList's process-wide "
                  f"mCodepointsWithNoFonts cache (keyed only by FontVisibility, not context id), "
                  f"so B's FindFontForChar short-circuited via SkipFontFallbackForChar() at "
                  f"gfxTextRun.cpp:3450 before ever reaching WhichSystemFontSupportsChar's gate "
                  f"at :3506 -- B never got a chance to resolve its own real CJK font, even "
                  f"though its own list ({FONTS['win'][:3]}... plus MS Gothic et al.) covers "
                  f"this codepoint.")
          i_ok_msg = f"context B resolved its own real font ({i_b['final']}), unaffected by context A's earlier miss"
          print(f"  (i) negative fallback cache (#81):  {'RED' if i_failures else 'GREEN'} -- "
                f"{i_failures or i_ok_msg}")
          if i_failures:
              tripwires.append(f"(i) negative fallback cache (#81): {i_failures}")
              # (i) is expected GREEN here, so an unmeasured red would be
              # reported as a regression in #81's fix rather than as an arm
              # whose own setup failed -- the same gap (i2), (j), (j2), (k) and
              # (b2r) already close. "NEGATIVE FALLBACK CACHE BUG" is the
              # marker only this arm's leak branch emits.
              note_unmeasured("(i)", i_failures, "NEGATIVE FALLBACK CACHE BUG")

          # -----------------------------------------------------------
          # Arm (i2): #81 in the ordinary caller shape. Arm (i) above installs
          # A's list, renders A, installs B's list, renders B -- and B's install
          # runs ClearCodepointsWithNoFonts() AFTER A's miss was written, so the
          # clear-on-install fix covers it. A caller that sets up its contexts
          # before navigating produces the other order: both installs, then both
          # renders. Both clears are spent before A's gated miss reaches
          # gfxPlatformFontList.cpp:1403, nothing clears the cache between A's
          # render and B's, and B reads tofu for a codepoint its own list covers.
          #
          # This is why the fix in this PR is on the READ path: a context with
          # its own list neither honours a hit in gfxFontGroup::FindFontForChar
          # nor records its own misses. That has no ordering dependency.
          #
          # WHAT WOULD MAKE THIS ARM GREEN WRONGLY (CLAUDE.md lesson 4):
          #  * Comparing B against B's OWN generic refs. FONTS['win'] broadly
          #    covers CJK, so B's monospace/sans-serif/serif legitimately reach
          #    the same real face B's gate finds -- both correct, and "differs
          #    from B's refs" is false for a WORKING fix. Arm (i) hit exactly
          #    that false AssertionError on its first real run. The floor is A's
          #    settled width instead: A's list has zero CJK anywhere, asserted
          #    below, so it is a genuine "nothing rendered" baseline.
          #  * Both contexts in different processes. mCodepointsWithNoFonts is a
          #    per-process member, so a split pair cannot poison anything and
          #    would print GREEN. The tab pids are asserted, not assumed.
          #  * A never actually missing. If A's own settled width is NOT its own
          #    tofu floor, A resolved something and wrote no miss, so there is
          #    nothing for B to inherit -- reported as setup invalid.
          def two_contexts_installs_first(list_a, list_b, js, extra_prefs=None):
              # Deliberately NOT two_contexts_one_launch(): that helper evaluates
              # A before B's context exists, which is the sequence arm (i)
              # already covers and the one the clear-on-install fix handles.
              prefs = {"dom.ipc.processCount": 1}
              if extra_prefs:
                  prefs.update(extra_prefs)
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      firefox_user_prefs=prefs,
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx_a = b.new_context()
                  ctx_a.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(list_a)))
                  page_a = ctx_a.new_page()
                  page_a.goto("data:text/html,<h1>i2-a</h1>")
                  pids_a = tab_pids()

                  ctx_b = b.new_context()
                  ctx_b.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(list_b)))
                  page_b = ctx_b.new_page()
                  page_b.goto("data:text/html,<h1>i2-b</h1>")
                  pids_b = tab_pids()

                  # Both installs are done, so both clears are spent. Only now
                  # does anything render.
                  result_a = page_a.evaluate(js)
                  result_b = page_b.evaluate(js)

                  b.close()
                  # C4 (from this task's review): TWO samples, taken in the same
                  # shape arms (j)/(j2) take theirs -- after A's navigation and
                  # after B's, both before either render -- so this arm can run
                  # their "no NEW tab pid appeared for B" test rather than an
                  # exact-cardinality one.
                  return result_a, result_b, {"after_a": pids_a, "after_b": pids_b}

          # C4 (from this task's review): fission.autostart=False, which arms (j)
          # and (j2) already pass and this arm did not, even though it is the arm
          # least likely to be able to score. #83's process table (run
          # 34008395471) shows dom.ipc.processCount=1 alone does not reliably
          # collapse two contexts into one content process.
          i2_a, i2_b, i2_pids = two_contexts_installs_first(
              NO_CJK_PROBE, FONTS["win"], JS_4B,
              extra_prefs={"fission.autostart": False})
          i2_a_tofu = i2_a["final"] in i2_a["refs"].values()
          # M4 (from this task's review): a 0.01 tolerance, matching every other
          # comparison the new arms make. The exact `==` inherited from arm (i)
          # would call a real leak clean on a one-ulp difference. The
          # `i2_a_tofu` line above keeps arm (i)'s exact form deliberately: it
          # was not flagged and is not part of this repair.
          i2_b_tofu = abs(i2_b["final"] - i2_a["final"]) < 0.01
          print(f"  [arm i2 / #81] context A (no-CJK list, installed first, rendered first) "
                f"settled={i2_a['final']} refs={i2_a['refs']} samples={i2_a['samples']}")
          print(f"  [arm i2 / #81] context B (FONTS['win'], installed BEFORE A rendered) "
                f"settled={i2_b['final']} refs={i2_b['refs']} samples={i2_b['samples']}")
          print(f"  [arm i2 / #81] tab pids after A / after B: {i2_pids}")

          i2_failures = []
          if isinstance(i2_pids["after_a"], str) or isinstance(i2_pids["after_b"], str):
              i2_failures.append(
                  f"arm (i2)/#81 unmeasured: could not read the content-process table "
                  f"({i2_pids}) -- mCodepointsWithNoFonts is a per-process member, so without "
                  f"the pids this arm cannot tell a working gate from two isolated processes.")
          elif (i2_pids["after_b"] - i2_pids["after_a"]) or not i2_pids["after_a"]:
              # C4: arms (j)/(j2)'s exact test, for the reason they give -- a
              # lingering or preallocated content process makes strict
              # cardinality false on runs that DID share a process, which is what
              # run 34322535132 printed here: two identical tab pids, scored
              # "unmeasured". What is asserted is that B got no NEW tab process.
              i2_failures.append(
                  f"arm (i2)/#81 unmeasured: a new content process appeared for B. Tab pids "
                  f"were {sorted(i2_pids['after_a'])} after A's navigation and "
                  f"{sorted(i2_pids['after_b'])} after B's, so A's miss cannot reach B and "
                  f"this arm tests nothing.")
          elif not i2_a_tofu:
              i2_failures.append(
                  f"arm (i2)/#81 setup invalid: context A's no-CJK list ({NO_CJK_PROBE}) "
                  f"settled U+6F22 at {i2_a['final']}, which is not one of its own generic "
                  f"refs ({i2_a['refs']}) -- A resolved something, wrote no miss, and there is "
                  f"nothing for B to inherit.")
          elif i2_b_tofu:
              i2_failures.append(
                  f"arm (i2)/#81: NEGATIVE FALLBACK CACHE BUG, ordering case -- both contexts "
                  f"installed their lists before either rendered, so both "
                  f"ClearCodepointsWithNoFonts() calls were spent before context A's gated "
                  f"miss was written at gfxPlatformFontList.cpp:1403. Context B "
                  f"(FONTS['win'], which covers U+6F22) settled at {i2_b['final']}, the same "
                  f"width A's zero-CJK list produced -- B rendered tofu for a codepoint its "
                  f"own list covers, and B's gate never ran because "
                  f"SkipFontFallbackForChar answered first. The clear-on-install fix cannot "
                  f"see this order; the read-path check is what closes it.")
          i2_ok_msg = (f"context B rendered its own glyph ({i2_b['final']}) rather than A's "
                       f"tofu floor ({i2_a['final']}), in tab process(es) "
                       f"{sorted(i2_pids['after_b']) if not isinstance(i2_pids['after_b'], str) else i2_pids['after_b']}")
          print(f"  (i2) negative fallback cache, ordering case (#81):  "
                f"{'RED' if i2_failures else 'GREEN'} -- {i2_failures or i2_ok_msg}")
          if i2_failures:
              tripwires.append(f"(i2) negative fallback cache, ordering case (#81): {i2_failures}")
              note_unmeasured("(i2)", i2_failures, "NEGATIVE FALLBACK CACHE BUG")
          # -----------------------------------------------------------

          # Cost measurement REMOVED (was JS_4B_COST): window.setFontList()
          # is one-shot per user context by design --
          # nsGlobalWindowInner::SetFontList calls
          # FontListManager::DisableFunction(userContextId) immediately
          # after installing the list, which deletes the WebIDL-exposed
          # property for that context. Calling it repeatedly in a loop
          # (this measurement's original design) throws "window.setFontList
          # is not a function" on the second call -- confirmed via the
          # actual traceback in runs 33595475459 and 33596116918, both of
          # which crashed HERE, before ever reaching arm (j)'s own code
          # below. This is a bug in this measurement, not in arm (j) or in
          # any product code -- redesigning to use one fresh context per
          # cold sample (each getting exactly one setFontList() call, as
          # designed) is deferred until a fix candidate is settled, since
          # the previous fix (afebedc) this was measuring is itself
          # superseded -- see the Task 4b report.
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Arm (j): the U+FFFD replacement-char fallback cache leak
          # (#82), found while checking whether #81's cache was the
          # only structure of its shape. gfxPlatformFontList's
          # mReplacementCharFallbackFamily is a SIBLING of
          # mCodepointsWithNoFonts -- same EnumeratedArray<FontVisibility,
          # ...> shape, same process-wide scope, same FontVisibility-only
          # key -- but read at gfxPlatformFontList.cpp's U+FFFD fast
          # path INSIDE SystemFindFontForChar, before
          # CommonFontFallback/GlobalFontFallback (and Task 4's gates
          # inside them) ever run. Unlike #81, this is not a Task-4
          # regression: before Task 4, BOTH the population and the read
          # were ungated, so this cache was indistinguishable from the
          # rest of the leaky fallback path. Task 4's gate closed the
          # population side (population now goes through gated
          # Common/GlobalFontFallback) but left the read side open --
          # a pre-existing hole the gate narrowed but did not close.
          #
          # Unlike #81's miss (tofu where a glyph belonged), this reads
          # a REAL, working font handle cached by an earlier context,
          # with no gating check on the read at all -- a genuine
          # cross-context leak, not just a coherence defect.
          #
          # Same two-contexts-one-launch shape as arm (i). Context A
          # needs a list with a family that DEMONSTRABLY resolves
          # U+FFFD in THIS build under a per-context list -- team-lead
          # correction: a fontTools cmap entry says the codepoint is
          # MAPPED, it does not guarantee this build's gated fallback
          # actually resolves that family for it (confirmed the hard
          # way: "Tahoma" alone reported "arm (j)/#82 setup invalid...
          # settled U+FFFD to 49.217, its OWN tofu floor" in run
          # 33596116918 -- A never populated the cache, so B had
          # nothing to inherit, and the arm correctly refused its own
          # result rather than report a false pass). Bisected against
          # several strong candidates by naming each one directly
          # (`JS_FFFD_BISECT`, same discipline as arm (f)'s
          # `JS_F_BISECT`) to find one that empirically differs from a
          # known-tofu reference, rather than trusting cmap coverage
          # alone.
          FFFD_CANDIDATES = ["Tahoma", "Verdana", "Segoe UI", "MS Gothic",
                              "Arial Unicode MS", "Noto Sans", "DejaVu Sans",
                              "SimSun", "Malgun Gothic", "Yu Gothic"]
          JS_FFFD_BISECT = """() => {
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "NoSuchFamilyAtAll5"';
            const tofu = c.measureText('�').width;
            const widths = {};
            for (const fam of """ + json.dumps(FFFD_CANDIDATES) + """) {
              c.font = '48px "' + fam + '"';
              widths[fam] = c.measureText('�').width;
            }
            return {tofu: tofu, widths: widths};
          }"""
          fffd_bisect = one_page("win", JS_FFFD_BISECT)
          print(f"  [arm j / #82 setup] U+FFFD tofu floor (no-op family, own context): "
                f"{fffd_bisect['tofu']}")
          print(f"  [arm j / #82 setup] named-candidate U+FFFD widths: {fffd_bisect['widths']}")
          fffd_working = [fam for fam, w in fffd_bisect["widths"].items() if w != fffd_bisect["tofu"]]
          print(f"  [arm j / #82 setup] candidates that demonstrably resolve U+FFFD "
                f"(differ from tofu): {fffd_working or 'NONE -- see setup note above'}")

          # REPAIR (#82, 2026-09-09). The donor's list is exactly ["Tahoma"].
          # From the bisect in run 34240575679, Tahoma renders U+FFFD at 46.617
          # while Verdana and Segoe UI BOTH render it at 44.533 -- with more than
          # one family on the donor's list the leaked width cannot be attributed
          # to a specific face, so a leak and a coincidence look the same.
          # Malgun Gothic (48) is also unambiguous but is a CJK face whose
          # advance is more likely to collide with a fallback.
          FFFD_DONOR = ["Tahoma"]
          FFFD_NO_PROBE = ["Arial", "Calibri", "Times New Roman"]
          # Cross-check, printed not scored: the width Tahoma rendered U+FFFD at
          # in run 34240575679. A different number here is not a failure -- it
          # means the bundle or the build changed -- but it must be read before
          # anyone quotes 46.617 again (CLAUDE.md lesson 6).
          FFFD_TAHOMA_HISTORIC = 46.617

          JS_4C = """async () => {
            // Same fixed-window sampling discipline as arm (i)'s
            // JS_4B -- needed even though the U+FFFD fast path itself
            // is synchronous, because context A's FIRST-EVER
            // resolution (before mReplacementCharFallbackFamily is
            // populated at all) still falls through to the normal,
            // async-raced Common/GlobalFontFallback path.
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "NoSuchFamilyAtAll4"';
            const samples = [];
            for (let i = 0; i < 20; i++) {
              samples.push(c.measureText('�').width);
              await new Promise(r => setTimeout(r, 500));
            }
            const refs = {};
            for (const fam of ['monospace', 'sans-serif', 'serif']) {
              c.font = '48px ' + fam;
              refs[fam] = c.measureText('�').width;
            }
            // A GUARANTEED-DIFFERENT tofu reference. The generic families
            // above are NOT one: a generic resolves within the asking
            // context's own allowed list, and Segoe UI / Tahoma / Malgun
            // Gothic all carry U+FFFD (fontTools over bundle/fonts: 46 of
            // 574 faces cover it; 9 Windows families among them). So in a
            // context allowed those, `sans-serif` renders the REAL glyph,
            // fallback renders the same real glyph, the two compare equal,
            // and a correct resolution reads as "settled to its own tofu
            // floor". Three #82 setups were declared invalid on exactly
            // that false negative.
            // These three are absent from the U+FFFD-covering set, so
            // naming one yields the true tofu width whether the context is
            // allowed it (no glyph in the face) or not (gated out).
            const named = {};
            for (const fam of ['Arial', 'Calibri', 'Times New Roman',
                               'Tahoma', 'Segoe UI', 'Malgun Gothic']) {
              c.font = '48px "' + fam + '"';
              named[fam] = c.measureText('�').width;
            }
            // `tofu` is retained only as a printed diagnostic. It is NO LONGER
            // the scoring reference: both it and `final` route through U+FFFD
            // system fallback, so during a real leak the cache answers both
            // identically and the arm goes green for the bug it guards
            // (code-recon B.3, defect 1). Scoring is now positive
            // identification against the donor's own directly-named Tahoma
            // width, measured in the same run and the same process.
            return {final: samples[samples.length - 1], samples: samples,
                    refs: refs, named: named, tofu: named['Arial']};
          }"""

          # WHAT WOULD MAKE THIS ARM GREEN WRONGLY (CLAUDE.md lesson 4):
          #  1. The old floor comparison. `tofu = named['Arial']` and `final`
          #     both route through U+FFFD system fallback, so a cache hit
          #     answered both and `final != tofu` was false during a real leak.
          #     Replaced below by positive identification: B leaks iff B's
          #     automatic fallback measures the SAME width as the donor's own
          #     directly-named Tahoma. The FIRST repair then reinstated
          #     named['Arial'] two lines later as a "control invalid" floor,
          #     which is the same defect again: Arial carries no U+FFFD glyph,
          #     so it routes through the very cache under test and reads the
          #     donor's width during a real leak -- firing "control invalid" and
          #     making the leak branch unreachable exactly when the leak is real.
          #     The floor is now fffd_bisect["tofu"], measured in its own launch
          #     BEFORE any candidate family is named, so the cache is empty when
          #     it is taken and it cannot equal the donor's Tahoma width. B's
          #     named Arial is printed as a diagnostic and scores nothing.
          #  2. Donor and recipient in different content processes.
          #     mReplacementCharFallbackFamily is a member of gfxPlatformFontList,
          #     a per-process singleton, so a split pair tests nothing and would
          #     print GREEN. #83's process table (run 34008395471) showed
          #     dom.ipc.processCount=1 alone does not collapse them, so the pids
          #     are asserted, not assumed, and a split reports "unmeasured".
          #  3. The donor never populating the cache. Under a narrow list
          #     GlobalFontFallback can take the StartCmapLoadingFromFamily skip
          #     (gfxPlatformFontList.cpp:1581-1587) and `continue` past every
          #     family, leaving nothing to inherit. Turned off with
          #     gfx.font_rendering.fallback.async=false, and asserted: A's own
          #     automatic `final` must equal A's directly-named Tahoma width.
          #
          # WHY THIS ARM IS UNMEASURABLE ON THIS BUNDLE -- measured, not
          # inferred, in run 34428270062, and the reason arm (j) is in
          # KNOWN_UNMEASURABLE at the end of this step rather than in
          # EXPECTED_GREEN. The whole run produced ZERO `CAMOU-FL fffd-cache`
          # lines and ZERO `global-fallback` / `sys-fallback` lines for
          # U+FFFD; all 111 of each were for U+6F22, arm (f)'s codepoint. The
          # only route to mReplacementCharFallbackFamily from a text run is
          # gfxFontGroup::WhichSystemFontSupportsChar -> SystemFindFontForChar
          # (gfxTextRun.cpp:3623, logged immediately after at :3629), so zero
          # sys-fallback lines for U+FFFD means FindFontForChar returned
          # BEFORE that call on every U+FFFD run in all 76 log files: the
          # cache was neither read nor written, by anyone.
          #
          # For THIS arm the trailing default font is the cause, and the
          # argument is the donor list, not a width match. FFFD_DONOR is
          # ["Tahoma"] -- a SINGLE family -- and Tahoma's directly-named
          # U+FFFD width is 46.61666488647461, while the donor settled at
          # 49.21666717529297. The glyph therefore cannot have come from the
          # one family this donor was allowed, and the trailing default is
          # what remains. Every one of the run's 355 `CAMOU-FL default` lines
          # names DejaVu Sans, whose own directly-named U+FFFD width is that
          # same 49.21666717529297.
          #
          # The width match ALONE would not identify the face: the run's
          # bare-context table shows MS Gothic, Noto Sans, SimSun and DejaVu
          # Sans all measuring 49.21666717529297. What the width does
          # establish is that the "tofu floor" is not tofu -- it is a real
          # face rendering a real glyph -- which is CLAUDE.md lesson 4 again,
          # a reference not guaranteed to differ from a successful
          # resolution because it IS one. No choice of donor list changes
          # that; the default font is appended to every font group.
          #
          # FOLLOW-UP, NOT THIS PR. Measuring #82 needs a different
          # observation point: a donor whose mFonts INCLUDING its trailing
          # default has no U+FFFD coverage, or a direct probe of
          # mReplacementCharFallbackFamily rather than an inference from a
          # rendered width. gfx.font_rendering.fallback.async is not the lever
          # the setup-invalid text above suggests, and re-running changes
          # nothing.
          j_mark = log_mark()
          j_a, j_b, j_pids = two_contexts_one_launch(
              FFFD_DONOR, FFFD_NO_PROBE, JS_4C,
              extra_prefs={"gfx.font_rendering.fallback.async": False,
                           "fission.autostart": False})
          # Task 4's fallback-observation question, now answerable: which face
          # the donor's U+FFFD fallback actually settled on, from the browser's
          # own log rather than inferred from a width. Three of this arm's five
          # failure branches are `setup invalid` / `unmeasured` verdicts about
          # the donor, and this line is what names WHY one of them fired --
          # `resolved=<none>` means GlobalFontFallback refused everything, so
          # there was never anything for context B to inherit.
          print(f"  [arm j / U+FFFD fallback observed] "
                f"{fffd_resolved(j_mark) or 'no global-fallback line for U+FFFD in this launch'}")
          print(f"  [arm j / U+FFFD fallback observed] textrun system fallback: "
                f"{camou_fl(j_mark, 'textrun-systemfallback', limit=4) or 'none'}")
          j_sig = j_a["named"]["Tahoma"]      # the leak signature
          # DIAGNOSTIC ONLY (wrong-GREEN item 1 above): Arial has no U+FFFD
          # glyph, so this routes through the same system fallback as `final`
          # and can equal j_sig during a real leak. Printed, never compared.
          j_b_arial = j_b["named"]["Arial"]
          # The scoring floor: measured in the bisect's own launch before any
          # candidate family was named, so the cache was empty when it was taken.
          j_floor = fffd_bisect["tofu"]
          print(f"  [arm j / #82] context A ({FFFD_DONOR}, donor, first in launch, stays open) "
                f"settled={j_a['final']} named-Tahoma={j_sig} named={j_a['named']} "
                f"refs={j_a['refs']} samples={j_a['samples']}")
          print(f"  [arm j / #82] context B ({FFFD_NO_PROBE}, no U+FFFD coverage, same launch, "
                f"AFTER A) settled={j_b['final']} named-Arial(diagnostic)={j_b_arial} "
                f"named={j_b['named']} refs={j_b['refs']} samples={j_b['samples']}")
          print(f"  [arm j / #82] tab pids after A / after B: {j_pids}")
          print(f"  [arm j / #82] cross-check (printed, not scored): donor Tahoma U+FFFD "
                f"width {j_sig} vs run 34240575679's {FFFD_TAHOMA_HISTORIC} -- "
                f"{'matches' if abs(j_sig - FFFD_TAHOMA_HISTORIC) < 0.01 else 'DIFFERS, do not quote the old number'}")

          j_failures = []
          if isinstance(j_pids["after_a"], str) or isinstance(j_pids["after_b"], str):
              j_failures.append(
                  f"arm (j)/#82 unmeasured: could not read the content-process table "
                  f"({j_pids}) -- #82's cache is a per-process singleton, so without the pids "
                  f"this arm cannot tell a working gate from two isolated processes.")
          elif (j_pids["after_b"] - j_pids["after_a"]) or not j_pids["after_a"]:
              # "No NEW tab pid appeared for B", not set equality: a lingering
              # about:blank process that exits between the two samples would make
              # equality false forever and the arm would read "unmeasured" on
              # every run, including ones that did share a process.
              j_failures.append(
                  f"arm (j)/#82 unmeasured: a new content process appeared for B. Tab pids were "
                  f"{sorted(j_pids['after_a'])} after A and {sorted(j_pids['after_b'])} after "
                  f"B, so donor and recipient did not share the gfxPlatformFontList singleton "
                  f"that holds mReplacementCharFallbackFamily. Not a verdict either way.")
          elif "Tahoma" not in fffd_working:
              j_failures.append(
                  f"arm (j)/#82 setup invalid: Tahoma is not among the families that "
                  f"demonstrably resolve U+FFFD in this build ({fffd_working or 'NONE'}, "
                  f"widths {fffd_bisect['widths']}, tofu {fffd_bisect['tofu']}). The donor "
                  f"cannot populate the cache, so there is nothing for B to inherit.")
          elif abs(j_a["final"] - j_sig) >= 0.01:
              j_failures.append(
                  f"arm (j)/#82 setup invalid: the donor's AUTOMATIC U+FFFD fallback settled "
                  f"at {j_a['final']}, not at its own directly-named Tahoma width ({j_sig}), "
                  f"so mReplacementCharFallbackFamily was never populated with Tahoma and "
                  f"there is nothing for context B to inherit. Check whether "
                  f"gfx.font_rendering.fallback.async=false actually applied.")
          elif abs(j_sig - j_floor) < 0.01:
              j_failures.append(
                  f"arm (j)/#82 control invalid: the leak signature ({j_sig}, the donor's "
                  f"directly-named Tahoma, measured in this arm's own launch) equals the run's "
                  f"U+FFFD tofu floor ({j_floor}, taken in the bisect launch before any "
                  f"candidate family was named), so a leak and a correct block would read "
                  f"identically. This arm cannot discriminate on this build.")
          elif abs(j_b["final"] - j_sig) < 0.01:
              j_failures.append(
                  f"arm (j)/#82: REPLACEMENT-CHAR CACHE LEAK (#82) -- context B "
                  f"({FFFD_NO_PROBE}, none of which cover U+FFFD) settled U+FFFD at "
                  f"{j_b['final']}, which is the donor's own Tahoma width ({j_sig}) and not "
                  f"the run's tofu floor ({j_floor}); B's named Arial, a diagnostic that routes "
                  f"through the same fallback and scores nothing, read {j_b_arial}. "
                  f"Both contexts shared tab process(es) "
                  f"{sorted(j_pids['after_a'])}. B rendered a REAL glyph from a family it was "
                  f"never allowed, inherited through gfxPlatformFontList's process-wide "
                  f"mReplacementCharFallbackFamily, which is read at "
                  f"gfxPlatformFontList.cpp:1328-1348 with no CamouIsFontAllowed check.")
          j_ok_msg = (f"context B settled U+FFFD at {j_b['final']}, which is NOT the donor's "
                      f"Tahoma ({j_sig}); the donor did populate the cache "
                      f"(A settled {j_a['final']}), the two shared "
                      f"process(es) {sorted(j_pids['after_a']) if not isinstance(j_pids['after_a'], str) else j_pids['after_a']}, "
                      f"the run's tofu floor is {j_floor}, and B's named Arial "
                      f"(a diagnostic only) is {j_b_arial}")
          print(f"  (j) replacement-char cache leak (#82):  {'RED' if j_failures else 'GREEN'} "
                f"-- {j_failures or j_ok_msg}")
          if j_failures:
              tripwires.append(f"(j) replacement-char cache leak (#82): {j_failures}")
              note_unmeasured("(j)", j_failures, "REPLACEMENT-CHAR CACHE LEAK")
          # -----------------------------------------------------------

          # Diagnostic (not scored, no assert -- same discipline as
          # JS_F_RACE above): arm (j)'s OWN `named` data (printed
          # above) shows context B (allow-list FFFD_NO_PROBE = Arial/
          # Calibri/Times New Roman ONLY) resolving Tahoma/Segoe UI/
          # Malgun Gothic -- none on its own list -- to their REAL,
          # named widths, not tofu, in the SAME shared-process launch,
          # AFTER context A had already named all three as its own
          # (allowed) probe candidates. That is a leak, through
          # whichever cache backs canvas direct-name font resolution --
          # not necessarily mReplacementCharFallbackFamily specifically.
          # Two hypotheses this data alone cannot separate: (a)
          # order-dependent -- a process-wide cache A's earlier,
          # legitimate lookup populated, read back by B without
          # re-checking CamouIsFontAllowed; (b) canvas direct-naming
          # isn't gated per-context on this build at all, regardless of
          # order. Discriminator: name the same three families in a
          # FRESH, ISOLATED, single-context launch (FFFD_NO_PROBE as
          # the ONLY allow-list, nothing preceding it at all) -- if
          # still correctly blocked there, the leak is order-dependent
          # (a); if not, gating is absent outright (b).
          JS_DIAG_NAMED = """() => {
            const c = document.createElement('canvas').getContext('2d');
            c.font = '48px "NoSuchFamilyAtAll7"';
            const tofu = c.measureText('�').width;
            const widths = {};
            for (const fam of ['Tahoma', 'Segoe UI', 'Malgun Gothic']) {
              c.font = '48px "' + fam + '"';
              widths[fam] = c.measureText('�').width;
            }
            return {tofu: tofu, widths: widths};
          }"""

          def one_page_list(font_list, js):
              # Same shape as one_page() above, but takes a literal
              # font list instead of a FONTS[] dict key -- FFFD_NO_PROBE
              # is a literal list, not in that dict.
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx = b.new_context()
                  ctx.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(font_list)))
                  page = ctx.new_page()
                  page.goto("data:text/html,<h1>4b-diag</h1>")
                  result = page.evaluate(js)
                  b.close()
                  return result

          diag_isolated = one_page_list(FFFD_NO_PROBE, JS_DIAG_NAMED)
          print(f"  [diagnostic, not scored] ISOLATED single-context launch, "
                f"FFFD_NO_PROBE-only allow-list, nothing preceding it -- "
                f"tofu={diag_isolated['tofu']} named={diag_isolated['widths']}")
          diag_leaked = [f for f, w in diag_isolated["widths"].items() if w != diag_isolated["tofu"]]
          if diag_leaked:
              print(f"  [diagnostic] {diag_leaked} resolved to REAL widths even ALONE, "
                    f"isolated, nothing preceding -- gating for direct-named canvas font "
                    f"lookups may not hold at all on this build, independent of ordering "
                    f"(hypothesis b).")
          else:
              print(f"  [diagnostic] all three correctly blocked when isolated -- gating "
                    f"holds ALONE; the leak seen in arm (j)'s context B is order-dependent, "
                    f"consistent with a process-wide cache populated by context A's earlier, "
                    f"legitimate resolution and read back by B without re-checking "
                    f"CamouIsFontAllowed (hypothesis a).")
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Discriminator (#83's true scope): does the leak require a
          # SINGLE, unresolvable font-family request with nothing else
          # in the CSS stack to fall back to, or does it also leak when
          # an explicit generic ("monospace") follows the blocked name
          # in the SAME request? Team-lead's hypothesis, from arm (b)
          # staying green at processCount=1 while arm (j) still leaks:
          # CSS font-stack resolution tries each declared family in
          # order and stops at the first that resolves -- "monospace"
          # always resolves to something, so a STACKED request never
          # needs Gecko's automatic Unicode-fallback machinery, which
          # is where the process-wide, unguarded cache read lives. A
          # SINGLE name with nothing after it has nowhere else to go
          # and DOES enter that path.
          #
          # Same shared-process, mac-then-win shape as arm (b) itself:
          # dom.ipc.processCount=1, mac context first (legitimately
          # resolving its own MAC_ONLY families, exactly like arm (b)'s
          # own probe), win context second, measuring those SAME
          # families it was never allowed -- in BOTH forms, same
          # families, same launch, same order, only the stack differs.
          # A NoSuchFontAtAll control in both forms gives each form its
          # own unresolvable baseline, so "differs from its own
          # baseline" -- not a hardcoded width -- is what "leaked"
          # means, same discipline as every other arm here.
          JS_DISC_MAC = """() => {
            // Resolve mac's own families for real, exactly like arm
            // (b)'s probe() does, to populate whatever process-wide
            // state the leak reads from.
            const c = document.createElement('canvas').getContext('2d');
            const s = 'mmmmmmmmmmlliWWWWWWW@#$%^&*()_+';
            const widths = {};
            for (const fam of """ + json.dumps(MAC_ONLY) + """) {
              c.font = '48px "' + fam + '"';
              widths[fam] = c.measureText(s).width;
            }
            return widths;
          }"""

          JS_DISC_WIN = """() => {
            const c = document.createElement('canvas').getContext('2d');
            const s = 'mmmmmmmmmmlliWWWWWWW@#$%^&*()_+';
            const families = """ + json.dumps(MAC_ONLY + ["NoSuchFontAtAll"]) + """;
            const single = {}, stacked = {};
            for (const fam of families) {
              c.font = '48px "' + fam + '"';
              single[fam] = c.measureText(s).width;
              c.font = '48px "' + fam + '", monospace';
              stacked[fam] = c.measureText(s).width;
            }
            return {single: single, stacked: stacked};
          }"""

          def discriminator_run():
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      firefox_user_prefs={"dom.ipc.processCount": 1},
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx_mac = b.new_context()
                  ctx_mac.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["mac"])))
                  page_mac = ctx_mac.new_page()
                  page_mac.goto("data:text/html,<h1>disc-mac</h1>")
                  mac_result = page_mac.evaluate(JS_DISC_MAC)

                  ctx_win = b.new_context()
                  ctx_win.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["win"])))
                  page_win = ctx_win.new_page()
                  page_win.goto("data:text/html,<h1>disc-win</h1>")
                  win_result = page_win.evaluate(JS_DISC_WIN)

                  b.close()
                  return mac_result, win_result

          disc_mac, disc_win = discriminator_run()
          print(f"  [discriminator / #83 scope] mac context (first, resolving its own "
                f"families for real): {disc_mac}")
          print(f"  [discriminator / #83 scope] win context (second, same process), "
                f"single-name form: {disc_win['single']}")
          print(f"  [discriminator / #83 scope] win context (second, same process), "
                f"stacked ', monospace' form: {disc_win['stacked']}")

          disc_single_baseline = disc_win["single"]["NoSuchFontAtAll"]
          disc_stacked_baseline = disc_win["stacked"]["NoSuchFontAtAll"]
          disc_single_leaked = [f for f in MAC_ONLY if disc_win["single"][f] != disc_single_baseline]
          disc_stacked_leaked = [f for f in MAC_ONLY if disc_win["stacked"][f] != disc_stacked_baseline]
          print(f"  [discriminator / #83 scope] single-name baseline (NoSuchFontAtAll): "
                f"{disc_single_baseline}; leaked: {disc_single_leaked or 'NONE'}")
          print(f"  [discriminator / #83 scope] stacked-form baseline (NoSuchFontAtAll, "
                f"monospace): {disc_stacked_baseline}; leaked: {disc_stacked_leaked or 'NONE'}")

          if disc_single_leaked and not disc_stacked_leaked:
              print("  [discriminator / #83 scope] VERDICT: hypothesis HOLDS -- single-name "
                    "form leaks, stacked form does not. #83 is precisely a bare/"
                    "unresolvable-request leak: a fingerprinter probing a single font name "
                    "with no fallback (an ordinary font-detection technique) can read back "
                    "an earlier context's resolution. Narrower mechanism, same severity -- "
                    "this is exactly the detection #44's per-context list exists to prevent.")
          elif disc_single_leaked and disc_stacked_leaked:
              print("  [discriminator / #83 scope] VERDICT: BOTH forms leak -- arm (b)'s "
                    "green result does not come from stack-resolution avoiding the leaky "
                    "path; the gate is weaker than arm (b) alone shows. This blocks Task 8's "
                    "flip pending further investigation.")
          elif not disc_single_leaked and not disc_stacked_leaked:
              print("  [discriminator / #83 scope] VERDICT: NEITHER form leaks -- this "
                    "specific mac/win family pairing does not reproduce #83 at all. The "
                    "leak may be specific to arm (j)'s U+FFFD probe families or setup, not "
                    "this one. #83 needs re-scoping again before it means anything.")
          else:
              print("  [discriminator / #83 scope] VERDICT: UNEXPECTED -- stacked form "
                    "leaks but single-name form does not. Re-examine the hypothesis before "
                    "trusting either reading.")
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Is arm (b)'s green real or structural? #83's discriminator
          # leaked mac's exact real font widths into win, same shared
          # process, same run in which arm (b) itself reported green
          # for the identical families. Two untested differences
          # between arm (b)'s probe() and the leaking discriminator,
          # per team-lead direction -- vary ONE at a time so the result
          # attributes cleanly:
          #
          #   1. Reference ordering: probe()'s absentW is measured
          #      BEFORE the family loop; the discriminator measured its
          #      baseline AFTER (last). If the leak needs an earlier
          #      same-context request to seed whatever it reads, taking
          #      the reference first means arm (b) never reaches that
          #      state before it has already recorded its answer.
          #   2. Donor context lifetime: arm (b) calls ctx.close() on
          #      mac before creating win. The discriminator's leak was
          #      demonstrated with the donor context still alive.
          #
          # Both variants below keep processCount=1 and every other
          # condition (same FONTS[name] lists, same probe string, same
          # 72px+monospace stacked form) identical to arm (b)'s own
          # probe() -- ONLY the one named variable changes in each.
          # `mac`/`win` (arm (b)'s own already-computed result, same
          # run) are still in scope below for a same-run comparison.

          # Variant 1: reference-ordering only. Same JS shape as arm
          # (b)'s probe(), same ctx.close()-before-next lifetime -- only
          # WHEN absentW is measured moves, from first to last.
          JS_ORDER_LAST = """(families) => {
            const c = document.createElement('canvas').getContext('2d');
            const s = 'mmmmmmmmmmlliWWWWWWW@#$%^&*()_+';
            const w = (f) => { c.font = '72px "' + f + '", monospace'; return c.measureText(s).width; };
            const rawWidths = {};
            for (const f of families) rawWidths[f] = w(f);
            rawWidths['__impossible__'] = w('__NoSuchFamily__12345');
            const absentW = w('__CamouAbsentRef__0001');
            const measure = {};
            for (const f of families) measure[f] = (rawWidths[f] !== absentW);
            measure['__impossible__'] = (rawWidths['__impossible__'] !== absentW);
            return {measure: measure, absentWidth: absentW};
          }"""

          def run_ordering_variant():
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      firefox_user_prefs={"dom.ipc.processCount": 1},
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctxs = {}
                  for name in ("mac", "win"):
                      ctx = b.new_context()
                      ctx.add_init_script(
                          'if (typeof window.setFontList === "function") '
                          'window.setFontList(%s);' % json.dumps(",".join(FONTS[name])))
                      page = ctx.new_page()
                      page.goto("data:text/html,<h1>f</h1>")
                      ctxs[name] = page.evaluate(JS_ORDER_LAST, PROBES)
                      ctx.close()  # matches arm (b)'s own close-before-next
                  b.close()
                  return ctxs["mac"], ctxs["win"]

          order_mac, order_win = run_ordering_variant()
          print(f"  [variant 1 / ordering-only] mac measure {order_mac['measure']}")
          print(f"  [variant 1 / ordering-only] win measure {order_win['measure']}")
          order_leaked = [f for f in MAC_ONLY if order_win["measure"][f]]
          print(f"  [variant 1 / ordering-only] win resolved MAC_ONLY families it was never "
                f"allowed: {order_leaked or 'NONE -- unchanged from arm (b)'}")

          # Variant 2: donor-lifetime only. Same JS as arm (b)'s probe()
          # verbatim (reference still measured FIRST), same reused
          # probe() helper -- only mac's context is kept alive (not
          # closed) while win is created and probed.
          def run_lifetime_variant():
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      firefox_user_prefs={"dom.ipc.processCount": 1},
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx_mac = b.new_context()
                  ctx_mac.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["mac"])))
                  mac_result = probe(ctx_mac.new_page())
                  # Deliberately NOT closed here -- the one variable
                  # under test. arm (b) itself calls ctx.close() at this
                  # exact point, before the next context exists.
                  ctx_win = b.new_context()
                  ctx_win.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["win"])))
                  win_result = probe(ctx_win.new_page())
                  ctx_mac.close()
                  ctx_win.close()
                  b.close()
                  return mac_result, win_result

          life_mac, life_win = run_lifetime_variant()
          print(f"  [variant 2 / lifetime-only] mac measure {life_mac['measure']}")
          print(f"  [variant 2 / lifetime-only] win measure {life_win['measure']}")
          life_leaked = [f for f in MAC_ONLY if life_win["measure"][f]]
          print(f"  [variant 2 / lifetime-only] win resolved MAC_ONLY families it was never "
                f"allowed, donor still alive: {life_leaked or 'NONE -- unchanged from arm (b)'}")

          print(f"  [variants summary] arm (b) original (this same run): win resolved "
                f"{[f for f in MAC_ONLY if win['measure'][f]] or 'NONE'}")
          if order_leaked and not life_leaked:
              print("  [variants summary] VERDICT: ordering alone flips it -- arm (b)'s "
                    "green is structural (reference taken before the leak-triggering state "
                    "exists), not evidence the gate holds.")
          elif life_leaked and not order_leaked:
              print("  [variants summary] VERDICT: donor lifetime alone flips it -- arm (b)'s "
                    "green is structural (closing the donor tears down whatever holds the "
                    "cached resolution before the recipient ever asks), not evidence the gate "
                    "holds.")
          elif order_leaked and life_leaked:
              print("  [variants summary] VERDICT: BOTH flip it independently -- either is "
                    "sufficient on its own; arm (b)'s green depends on both conditions arm (b) "
                    "happens to have (reference-first AND donor-closed), not on the gate.")
          else:
              print("  [variants summary] VERDICT: NEITHER flips it -- arm (b)'s green survives "
                    "both candidate explanations. There is a third, unidentified difference "
                    "between arm (b)'s setup and the discriminator's; report as such rather "
                    "than forcing a conclusion.")
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Does closing a context kill its content process (team-lead's
          # sharper version of the lifetime finding): if so, arm (b)'s
          # win never shared ANY process with mac, at any
          # dom.ipc.processCount setting, and its green says nothing
          # about cross-context sharing either way.
          #
          # No content-visible API answers this: web content has no
          # standard way to read its own OS process id (checked --
          # Camoufox's own Services.appinfo.processID reference, at
          # additions/juggler/content/main.js:83, is Juggler's own
          # PRIVILEGED chrome-context automation code, not something a
          # page can call; exposing process identity to content would
          # itself be a fingerprinting surface no browser ships). So
          # this checks from OUTSIDE, at the OS level, which the CI
          # runner can do directly and more authoritatively than any
          # content-side proxy: list this binary's own content-process
          # PIDs (Gecko's e10s convention: a content process carries
          # '-contentproc' on its command line, unrelated to Camoufox)
          # at three checkpoints, for BOTH sequences already measured
          # above -- donor-closed (arm (b)'s own shape) and donor-alive
          # (the lifetime variant that leaked).
          def track_pids_donor_closed():
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      firefox_user_prefs={"dom.ipc.processCount": 1},
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx_mac = b.new_context()
                  ctx_mac.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["mac"])))
                  page_mac = ctx_mac.new_page()
                  page_mac.goto("data:text/html,<h1>pid-mac</h1>")
                  after_mac = content_pids()
                  ctx_mac.close()
                  after_close = content_pids()
                  ctx_win = b.new_context()
                  ctx_win.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["win"])))
                  page_win = ctx_win.new_page()
                  page_win.goto("data:text/html,<h1>pid-win</h1>")
                  after_win = content_pids()
                  ctx_win.close()
                  b.close()
                  return after_mac, after_close, after_win

          def track_pids_donor_alive():
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      firefox_user_prefs={"dom.ipc.processCount": 1},
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx_mac = b.new_context()
                  ctx_mac.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["mac"])))
                  page_mac = ctx_mac.new_page()
                  page_mac.goto("data:text/html,<h1>pid-mac2</h1>")
                  after_mac = content_pids()
                  # donor stays alive -- no ctx_mac.close() here
                  ctx_win = b.new_context()
                  ctx_win.add_init_script(
                      'if (typeof window.setFontList === "function") '
                      'window.setFontList(%s);' % json.dumps(",".join(FONTS["win"])))
                  page_win = ctx_win.new_page()
                  page_win.goto("data:text/html,<h1>pid-win2</h1>")
                  after_win = content_pids()
                  ctx_mac.close()
                  ctx_win.close()
                  b.close()
                  return after_mac, after_win

          pid_after_mac, pid_after_close, pid_after_win = track_pids_donor_closed()
          print(f"  [pid / donor-closed] content processes after mac page ready:\n{pid_after_mac}")
          print(f"  [pid / donor-closed] content processes after ctx_mac.close():\n{pid_after_close}")
          print(f"  [pid / donor-closed] content processes after win page ready:\n{pid_after_win}")

          pid2_after_mac, pid2_after_win = track_pids_donor_alive()
          print(f"  [pid / donor-alive] content processes after mac page ready:\n{pid2_after_mac}")
          print(f"  [pid / donor-alive] content processes after win page ready (donor still open):\n{pid2_after_win}")
          # -----------------------------------------------------------

          # -----------------------------------------------------------
          # Arm (j2): UNMEASURABLE ON THIS BUNDLE -- see the long note
          # above arm (j)'s launch. The bare donor here settled U+FFFD at
          # 49.21666717529297 in run 34428270062, which is both this
          # arm's "tofu floor" AND the directly-named U+FFFD width of
          # DejaVu Sans, the family every one of the run's 355 `default`
          # lines names. WHICH face rendered it is NOT established here:
          # this donor is bare under a bare launch, so it is allowed
          # every family, and MS Gothic, Noto Sans and SimSun measure
          # that same width -- the four-way tie arm (j)'s single-family
          # ["Tahoma"] donor breaks by construction is not broken on this
          # arm. What IS measured, and is what puts the arm in
          # KNOWN_UNMEASURABLE, needs no such identification: zero
          # fffd-cache lines and zero U+FFFD sys-fallback lines across
          # all 76 files, so the cache this arm exists to observe was
          # never read and never written, whatever supplied the glyph.
          # The donor did not fail to resolve -- it resolved something
          # real, which is what the floor was measuring all along. Kept,
          # and listed in KNOWN_UNMEASURABLE at the end of this step, so
          # the arm still prints its numbers for the follow-up rather
          # than being deleted -- but its GREEN would be vacuous and its
          # RED observes nothing.
          #
          # Arm (j) above asked a NARROW per-context list to populate
          # mReplacementCharFallbackFamily; none of ten strong
          # candidates did, so that context's OWN gated fallback never
          # reaches the population site and there is nothing for a
          # later context to inherit -- correctly reported as "setup
          # invalid" above, not a false pass.
          #
          # Read straight from CamouIsFontAllowed
          # (patches/font-list-spoofing.patch, gfxPlatformFontList.cpp):
          #   uint32_t ctx = FontListManager::GetCurrentContext();
          #   if (ctx != 0 && FontListManager::HasFontList(ctx)) { ...gated...}
          #   ...else falls through to the (launch-level) "fonts" key...
          # The gated branch is skipped -- and the launch-level
          # fallback taken instead -- whenever HasFontList(ctx) is
          # false, i.e. whenever setFontList() was NEVER called for
          # that context. That is true for literal userContextId 0
          # (nothing ever calls setFontList() on it) but also, per this
          # same read, for ANY context that simply never calls it --
          # exactly this fork's own established "bare context" pattern
          # (see one_page_webfont_bare() above, same file). Under
          # CAMOU_CONFIG={} (empty launch, no "fonts" key),
          # sLaunchFonts is empty, so CamouIsFontAllowed returns true
          # for every font name -- a bare launch/context is allowed
          # everything, which is also the realistic production shape
          # of a context nobody ever called setFontList() on.
          def one_page_bare(js):
              # Same shape as one_page() above, but the context never
              # calls window.setFontList() at all -- HasFontList(ctx)
              # stays false for its whole life, so CamouIsFontAllowed
              # falls through to the (empty) launch-level fonts key.
              with sync_playwright() as pw:
                  b = pw.firefox.launch(
                      executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                      env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                  ctx = b.new_context()
                  page = ctx.new_page()
                  page.goto("data:text/html,<h1>4b-bare</h1>")
                  result = page.evaluate(js)
                  b.close()
                  return result

          bare_bisect = one_page_bare(JS_FFFD_BISECT)
          print(f"  [arm j2 / #82 bare setup] U+FFFD tofu floor (no-op family, bare context): "
                f"{bare_bisect['tofu']}")
          print(f"  [arm j2 / #82 bare setup] named-candidate U+FFFD widths under a BARE "
                f"context (no per-context list, no launch fonts key): {bare_bisect['widths']}")
          bare_working = [fam for fam, w in bare_bisect["widths"].items() if w != bare_bisect["tofu"]]
          print(f"  [arm j2 / #82 bare setup] candidates that resolve U+FFFD under a bare "
                f"context: {bare_working or 'NONE'}")

          j2_failures = []
          if not bare_working:
              # Stop condition (team-lead directive): this is the last
              # attempt on #82 in this task. A bare context is the
              # least restricted setup this fork can produce -- if
              # U+FFFD does not resolve here either, it does not
              # resolve through this build's gated fallback under any
              # setup tried, which is itself a finding, not a null
              # result to iterate past.
              j2_failures.append(
                  f"arm (j2)/#82 bare-context setup ALSO invalid: none of the bisected "
                  f"candidates ({FFFD_CANDIDATES}) resolve U+FFFD under a bare context "
                  f"either (widths {bare_bisect['widths']} all equal tofu "
                  f"{bare_bisect['tofu']}) -- U+FFFD does not resolve through this build's "
                  f"gated fallback under the least-restricted setup available. Per the "
                  f"task's stop condition, no further arm redesign was attempted; this is "
                  f"reported on #82 as its own finding and may warrant a separate issue.")
              print(f"  (j2) bare-context U+FFFD population check:  INCONCLUSIVE -- "
                    f"{j2_failures}")
          else:
              def two_contexts_bare_then_narrow(list_b, js, extra_prefs=None):
                  prefs = {"dom.ipc.processCount": 1}
                  if extra_prefs:
                      prefs.update(extra_prefs)
                  # Same one-launch-two-contexts shape as
                  # two_contexts_one_launch() above, but context A
                  # never calls setFontList() at all -- it must be
                  # BARE, not narrow, to test whether the
                  # default-shaped context (nothing ever calls
                  # setFontList() on it) is what actually populates
                  # mReplacementCharFallbackFamily in production.
                  # Deliberately NOT a parameter on
                  # two_contexts_one_launch(): that helper always
                  # installs list_a via setFontList, and arm (i)'s
                  # already-confirmed call site should not change.
                  with sync_playwright() as pw:
                      b = pw.firefox.launch(
                          executable_path=os.environ["CAMOUFOX_BIN"], headless=False,
                          # Same requirement as two_contexts_one_launch():
                          # without this, A and B land in separate
                          # content processes and this arm tests nothing.
                          firefox_user_prefs=prefs,
                          env={**os.environ, "CAMOU_CONFIG": json.dumps({})})
                      ctx_a = b.new_context()
                      page_a = ctx_a.new_page()
                      page_a.goto("data:text/html,<h1>4b-bare-a</h1>")
                      pids_a = tab_pids()
                      result_a = page_a.evaluate(js)

                      ctx_b = b.new_context()
                      ctx_b.add_init_script(
                          'if (typeof window.setFontList === "function") '
                          'window.setFontList(%s);' % json.dumps(",".join(list_b)))
                      page_b = ctx_b.new_page()
                      page_b.goto("data:text/html,<h1>4b-bare-b</h1>")
                      pids_b = tab_pids()
                      result_b = page_b.evaluate(js)

                      b.close()
                      return result_a, result_b, {"after_a": pids_a, "after_b": pids_b}

              # WHAT WOULD MAKE THIS ARM GREEN WRONGLY (CLAUDE.md lesson 4):
              # identical to arm (j)'s list, with one difference. A bare donor
              # has no list, so the leak signature cannot be named in advance --
              # it is DERIVED here from the donor's own `named` dict: the family
              # whose directly-named U+FFFD width equals the donor's settled
              # width is the face the cache now holds. If no named family
              # matches, the arm cannot identify what the donor resolved and
              # says so rather than falling back to a floor comparison, which is
              # the exact defect this repair removes.
              #
              # WHAT WOULD MAKE THIS ARM PRINT A LEAK WRONGLY -- the mode run
              # 34322535132 actually hit. The bare donor settled at the run's own
              # tofu floor, i.e. it resolved no real face at all; B then settled
              # at that same universal tofu, which is the CORRECT outcome, and
              # the arm printed "LEAK CONFIRMED". Its guard missed it because the
              # guard compared against j2_b["named"]["Arial"], a named-family
              # width that itself lacks U+FFFD coverage, rather than against a
              # "nothing rendered" floor. The floor is now bare_bisect["tofu"],
              # measured in its own bare launch before any candidate is named,
              # and a donor sitting on it is scored `setup invalid` -- the same
              # shape arm (j) uses.
              j2_mark = log_mark()
              j2_a, j2_b, j2_pids = two_contexts_bare_then_narrow(
                  FFFD_NO_PROBE, JS_4C,
                  extra_prefs={"gfx.font_rendering.fallback.async": False,
                               "fission.autostart": False})
              # Arm (j)'s fallback observation, for the bare donor. Both of this
              # arm's `setup invalid` branches are statements about what the
              # bare donor resolved; this names the face the browser itself
              # reports, so a Phase D `setup invalid` says why rather than only
              # that widths matched.
              print(f"  [arm j2 / U+FFFD fallback observed] "
                    f"{fffd_resolved(j2_mark) or 'no global-fallback line for U+FFFD in this launch'}")
              print(f"  [arm j2 / U+FFFD fallback observed] textrun system fallback: "
                    f"{camou_fl(j2_mark, 'textrun-systemfallback', limit=4) or 'none'}")
              j2_sig_families = [fam for fam, w in j2_a["named"].items()
                                 if abs(w - j2_a["final"]) < 0.01]
              # DIAGNOSTIC ONLY, for arm (j)'s reason: Arial has no U+FFFD glyph
              # and routes through the cache under test. Printed, never compared.
              j2_b_arial = j2_b["named"]["Arial"]
              j2_floor = bare_bisect["tofu"]
              print(f"  [arm j2 / #82] context A (bare, no setFontList call at all, first in "
                    f"launch, stays open) settled={j2_a['final']} named={j2_a['named']} "
                    f"refs={j2_a['refs']} samples={j2_a['samples']}")
              print(f"  [arm j2 / #82] the donor's settled width matches these named families: "
                    f"{j2_sig_families or 'NONE'}")
              print(f"  [arm j2 / #82] context B ({FFFD_NO_PROBE}, no U+FFFD coverage, same "
                    f"launch, AFTER A) settled={j2_b['final']} "
                    f"named-Arial(diagnostic)={j2_b_arial} "
                    f"named={j2_b['named']} refs={j2_b['refs']} samples={j2_b['samples']}")
              print(f"  [arm j2 / #82] tab pids after A / after B: {j2_pids}")

              if isinstance(j2_pids["after_a"], str) or isinstance(j2_pids["after_b"], str):
                  j2_failures.append(
                      f"arm (j2)/#82 unmeasured: could not read the content-process table "
                      f"({j2_pids}); #82's cache is a per-process singleton.")
              elif (j2_pids["after_b"] - j2_pids["after_a"]) or not j2_pids["after_a"]:
                  # Same "no NEW tab pid" test as arm (j), for the same reason.
                  j2_failures.append(
                      f"arm (j2)/#82 unmeasured: a new content process appeared for B. Tab pids were "
                      f"{sorted(j2_pids['after_a'])} after A and {sorted(j2_pids['after_b'])} "
                      f"after B, so donor and recipient did not share the gfxPlatformFontList "
                      f"singleton. Not a verdict either way.")
              elif abs(j2_a["final"] - j2_floor) < 0.01:
                  # Ordered BEFORE the sig-families check on purpose. When the
                  # donor resolves nothing, families that also lack U+FFFD
                  # coverage still "match" its settled width, so j2_sig_families
                  # is non-empty and names nothing: run 34322535132 derived
                  # ['Calibri'] that way and the arm went on to print a leak. A
                  # donor sitting on the tofu floor is a setup failure, and it is
                  # now the first thing tested.
                  j2_failures.append(
                      f"arm (j2)/#82 setup invalid: the bare donor settled U+FFFD at "
                      f"{j2_a['final']}, which is the run's own bare-context tofu floor "
                      f"({j2_floor}, taken in the bisect launch before any candidate was "
                      f"named). The donor resolved no real face, so nothing was written to "
                      f"mReplacementCharFallbackFamily and B settling at the same width is the "
                      f"correct outcome rather than a leak. The derived signature "
                      f"{j2_sig_families} names only families that also fail to cover U+FFFD.")
              elif not j2_sig_families:
                  j2_failures.append(
                      f"arm (j2)/#82 setup invalid: the bare donor settled U+FFFD at "
                      f"{j2_a['final']}, which matches none of the families it named "
                      f"({j2_a['named']}). The face now in mReplacementCharFallbackFamily "
                      f"cannot be identified, so no positive-identification verdict is "
                      f"available and this arm will not fall back to a floor comparison.")
              elif abs(j2_b["final"] - j2_a["final"]) < 0.01:
                  j2_failures.append(
                      f"arm (j2)/#82: REPLACEMENT-CHAR CACHE LEAK (#82) CONFIRMED via the "
                      f"bare-context population path -- context B ({FFFD_NO_PROBE}, none of "
                      f"which cover U+FFFD) settled U+FFFD at {j2_b['final']}, the same width "
                      f"the bare donor settled at ({j2_a['final']}, identified as "
                      f"{j2_sig_families}) and not the run's bare tofu floor ({j2_floor}); "
                      f"B's named Arial, a diagnostic that routes through the same fallback "
                      f"and scores nothing, read {j2_b_arial}. Both shared "
                      f"tab process(es) {sorted(j2_pids['after_a'])}. A bare context -- the "
                      f"production shape of one nobody ever called setFontList on, which "
                      f"CamouIsFontAllowed treats exactly like userContextId 0 -- populated "
                      f"the process-wide cache and B inherited a real glyph from a family it "
                      f"was never allowed.")
              j2_ok_msg = (f"context B settled U+FFFD at {j2_b['final']}, which is NOT the "
                           f"bare donor's {j2_a['final']} ({j2_sig_families}); the run's bare "
                           f"tofu floor is {j2_floor}, and B's named Arial (a diagnostic only) "
                           f"is {j2_b_arial}")
              print(f"  (j2) bare-context replacement-char cache leak (#82):  "
                    f"{'RED' if j2_failures else 'GREEN'} -- {j2_failures or j2_ok_msg}")
          if j2_failures:
              tripwires.append(f"(j2) bare-context replacement-char cache leak (#82): {j2_failures}")
              note_unmeasured("(j2)", j2_failures, "REPLACEMENT-CHAR CACHE LEAK")
          # -----------------------------------------------------------

          # Phase D triage. This branch closes #80, #81 and #83, and #82 is
          # unmeasurable on this bundle (see KNOWN_UNMEASURABLE below).
          #
          # #83 was diagnosed and then fixed within this PR: the leak ran
          # through gfxFcPlatformFontList::mFcSubstituteCache, a process-global
          # name->family memo keyed WITHOUT the user context and consulted
          # before the base FindAndAddFamiliesLocked where the gate lives, so
          # the gate was never asked (recon-83-gate-bypass.md). With the memo
          # keys carrying the context and the memos flushed in SetFontList,
          # arms (b2) and (b2r) are expected GREEN and a leak red in either is
          # a regression in that fix.
          #
          # Nothing is triaged red any more, so EXPECTED_RED is empty. The
          # dict stays rather than being deleted: it is the machinery for
          # triaging a future measured-but-unfixed defect, and the loop below
          # prints nothing when it is empty.
          EXPECTED_RED = {}
          # The arms that guard defects this branch DOES close, so each must be
          # GREEN here. Listed so the run prints a per-arm verdict line for
          # each even when every one passes -- Phase D's readback needs a line
          # per arm to quote, not the absence of one.
          EXPECTED_GREEN = {
              "(b2)": "#83, cross-context leak with the donor alive -- closed by keying "
                      "mFcSubstituteCache on the user context",
              "(b2r)": "#83, same, with the init script on the document under test",
              "(i)": "#81, negative fallback cache",
              "(i2)": "#81 ordering case -- both lists installed before either context "
                      "renders",
              "(k)": "#80, url() web fonts under a configured fonts list",
          }
          # Arms this binary cannot measure AT ALL, for a reason in the build
          # rather than in the arm. Distinct from unmeasured_arms, which is a
          # per-run accident: this is a standing property of the bundle, read
          # off run 34428270062's own log. Such an arm must never print GREEN
          # (its green is vacuous) and must never be reported as "unfixed"
          # (it observed nothing), and its setup-invalid red must not fail the
          # step -- there is nothing a re-run could do about it.
          KNOWN_UNMEASURABLE = {
              "(j)": "#82: U+FFFD never reaches SystemFindFontForChar on this bundle -- "
                     "the default font (DejaVu Sans) covers it; fffd-cache lines = 0 in "
                     "run 34428270062",
              "(j2)": "#82: U+FFFD never reaches SystemFindFontForChar on this bundle -- "
                      "the default font (DejaVu Sans) covers it; fffd-cache lines = 0 in "
                      "run 34428270062",
          }
          # Four buckets. An arm in unmeasured_arms is red because its OWN
          # preconditions failed on this run: it reached no verdict, so calling
          # it a regression is as wrong as calling it a confirmed defect.
          #
          # ORDER MATTERS HERE. EXPECTED_RED is consulted first, so a triaged
          # arm never fails the step whichever way it went red -- the table
          # below still annotates it "RED but UNMEASURED" and withholds the
          # "unfixed" claim, which is what C5 asked for. KNOWN_UNMEASURABLE is
          # consulted second, and ONLY absorbs an arm that also reached no
          # verdict. An arm listed there that DOES reach its verdict has become
          # measurable -- the structural blocker no longer applies and it is
          # reporting a real defect -- so it falls through to `unexpected` and
          # fails the step rather than being swallowed by its own excuse. An
          # arm that is expected GREEN and comes back unmeasured also fails,
          # under its own name: there the missing measurement is missing
          # evidence for a fix this PR claims.
          expected, unmeasurable, unmeasured, unexpected = [], [], [], []
          for t in tripwires:
              tag = next((k for k in EXPECTED_RED if t.startswith(k)), None)
              if tag:
                  expected.append(f"{t[:120]}...")
                  continue
              tag = next((k for k in KNOWN_UNMEASURABLE if t.startswith(k)), None)
              if tag and tag in unmeasured_arms:
                  unmeasurable.append(t)
                  continue
              tag = next((k for k in unmeasured_arms if t.startswith(k)), None)
              (unmeasured if tag else unexpected).append(t)
          print("=== tripwire triage ===")
          for k, why in EXPECTED_RED.items():
              hit = any(t.startswith(k) for t in tripwires)
              if hit and k in unmeasured_arms:
                  # C5: this arm is red because its OWN preconditions failed. It
                  # reached no verdict, so the table must not assert that the
                  # defect it guards is still unfixed.
                  state = "RED but UNMEASURED -- no verdict; does NOT assert:"
              elif hit:
                  state = "RED (expected)"
              else:
                  state = ("GREEN -- was expected red, so the defect it guards may be "
                           "fixed; update EXPECTED_RED")
              print(f"  {k:5} {state}  {why}")
          for k, why in EXPECTED_GREEN.items():
              hit = any(t.startswith(k) for t in tripwires)
              if hit and k in unmeasured_arms:
                  state = "RED but UNMEASURED -- no verdict; does NOT assert:"
              elif hit:
                  state = "RED (UNEXPECTED) -- expected GREEN on this binary:"
              else:
                  state = "GREEN"
              print(f"  {k:5} {state}  {why}")
          for k, why in KNOWN_UNMEASURABLE.items():
              hit = any(t.startswith(k) for t in tripwires)
              if hit and k in unmeasured_arms:
                  state = "UNMEASURABLE (known) -- observed nothing; asserts NOTHING:"
              elif hit:
                  state = ("RED WITH A VERDICT -- this arm has become measurable, the "
                           "blocker below no longer applies, and it is reporting a real "
                           "defect. READ IT:")
              else:
                  state = ("GREEN, but VACUOUS on this bundle -- NOT evidence the defect "
                           "is fixed:")
              print(f"  {k:5} {state}  {why}")
              if hit and k in unmeasured_arms:
                  # F1 (from this task's re-review): `why` above is a FIXED
                  # string describing the branch that fired in run
                  # 34428270062. These arms have five and four absorbed
                  # branches respectively -- a process split, an unreadable
                  # process table, a control-invalid signature -- and the
                  # standing reason does not describe those. Printing the
                  # arm's own recorded text under the row is what stops a row
                  # someone quotes from asserting a cause nobody read back
                  # (CLAUDE.md lesson 6).
                  print(f"        observed this run: {unmeasured_arms[k]}")
          if unmeasurable:
              print("=== KNOWN UNMEASURABLE (a property of this bundle, not of this run) ===")
              for t in unmeasurable:
                  print(f"  KNOWN UNMEASURABLE: {t}")
          if unmeasured_arms:
              print("=== UNMEASURED (red, but the arm measured nothing -- not a verdict) ===")
              for tag, first in unmeasured_arms.items():
                  print(f"  {tag:5} {first}")
          for t in unmeasured:
              print(f"  RED but UNMEASURED: {t}")
          for t in unexpected:
              print(f"  UNEXPECTED RED: {t}")
          assert not (unexpected or unmeasured), (
              f"{len(unexpected)} arm(s) red for a reason this guard does not already "
              f"know about:\n" + "\n".join(unexpected) +
              f"\n{len(unmeasured)} arm(s) red because their OWN preconditions failed -- "
              f"no verdict either way, and no evidence Phase D can quote:\n" +
              "\n".join(unmeasured))
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}
          LIBGL_ALWAYS_SOFTWARE: "1"

      # Bulk dump of what the step above captured. Separate from that step, and
      # `if: always()`, for two reasons: it must not spend the guard's
      # 10-minute budget, and the run in which the guard FAILS is exactly the
      # run whose log someone needs. It launches nothing -- MOZ_LOG was set
      # inside the guard's own Python, so every one of its ~20 launches was
      # already instrumented.
      - name: "CAMOU-FL font log dump (#83/#88 diagnostic)"
        if: always()
        timeout-minutes: 5
        run: |
          python3 - <<'PY'
          import glob, os, re, sys

          LOG_DIR = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "camou-fontlog")
          # The nine CAMOU-FL kinds Task 5 added (task-5-report.md section 2a),
          # in the order they appear there.
          KINDS = ["gate", "set", "group", "scope-switch", "fffd-cache",
                   "global-fallback", "sys-fallback", "default", "facename",
                   # #83's mechanism site, added with the mFcSubstituteCache
                   # fix: a hit here answers a direct-named family before the
                   # gate is ever asked.
                   "fc-subst"]
          OTHER = "textrun-systemfallback"   # pre-existing eGfxLog_textrun line
          CAP = 3000                        # printed lines, head + tail

          files = sorted(glob.glob(os.path.join(LOG_DIR, "*")))
          total_bytes = sum(os.path.getsize(p) for p in files)
          print(f"log dir: {LOG_DIR}")
          print(f"files: {len(files)}   bytes: {total_bytes}")
          if not files:
              # Not an error: this step also runs when the guard step failed
              # before its first launch. Say which it is rather than printing
              # an empty section that reads like "the log lines are gone".
              print("NO LOG FILES -- either the guard step never launched a browser, or "
                    "MOZ_LOG_FILE did not take effect. A build without patches/"
                    "font-list-spoofing.patch has no CAMOU-FL sites at all.")
              sys.exit(0)

          # `timestamp` puts UTC wall clock at the head of every line
          # (xpcom/base/Logging.cpp:797-801), so sorting on it merges the
          # per-process files into one time order; file and line number break
          # ties and keep a file's own lines in the order it wrote them.
          TS = re.compile(r"^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+) UTC")
          rows, counts = [], {k: 0 for k in KINDS + [OTHER]}
          for p in files:
              base = os.path.basename(p)
              with open(p, encoding="utf-8", errors="replace") as fh:
                  for i, raw in enumerate(fh):
                      line = raw.rstrip()
                      if "CAMOU-FL " in line:
                          kind = line.split("CAMOU-FL ", 1)[1].split(" ", 1)[0]
                          counts[kind] = counts.get(kind, 0) + 1
                      elif OTHER in line:
                          counts[OTHER] += 1
                      else:
                          continue
                      m = TS.match(line)
                      rows.append((m.group(1) if m else "", base, i, line))
          rows.sort(key=lambda r: (r[0], r[1], r[2]))

          print(f"total matching lines: {len(rows)}")
          for k in KINDS + [OTHER]:
              print(f"  {k:18} {counts.get(k, 0)}")
          for k in sorted(set(counts) - set(KINDS) - {OTHER}):
              print(f"  {k:18} {counts[k]}   <-- kind not in Task 5's nine")
          if not rows:
              print("ZERO matching lines despite non-empty log files: the fontlist module "
                    "logged, but no CAMOU-FL site ran. Check that this artifact carries "
                    "patches/font-list-spoofing.patch.")

          # The full set goes to a file the Upload results step collects, so a
          # reader can re-slice what the cap below drops.
          with open("camou-fl.txt", "w", encoding="utf-8") as out:
              for ts, base, i, line in rows:
                  out.write(f"{base}:{i}\t{line}\n")
          print("full set written to camou-fl.txt (uploaded with smoke-results)")

          # I1 (from this task's review): the (b2)/(b2r) slice attributed per
          # context, printed HERE and not only inside the guard step. Arm (a)
          # hard-asserts and arm (b)'s check_signal hard-asserts, both before
          # arm (b2) runs, and a 10-minute timeout kills the step wherever it
          # is -- any of which leaves the guard step's own slice unprinted. On
          # a build whose purpose is to diagnose #83 that is the one output
          # that has to survive, and this step is `if: always()`.
          #
          # This attributes by uri= alone, so it needs no byte mark and does
          # not care which launch or process emitted the line. The
          # `<h1>...</h1>` wrapper is part of the needle: it makes the marker
          # unambiguous against a bare substring.
          print("=== (b2)/(b2r) group lines by context (uri= attribution) ===")
          for m in ("b2-mac", "b2-win", "b2r-mac", "b2r-win"):
              sel = [ln for _ts, _b, _i, ln in rows
                     if "CAMOU-FL group " in ln and f"<h1>{m}</h1>" in ln]
              print(f"  [{m}] {len(sel)} group line(s)")
              for ln in sel[-6:]:
                  print(f"    {ln}")
          print("  (a context with 0 group lines never built a font group under that "
                "marker -- its arm did not run, or the render never resolved a family)")

          # #83's decisive pair, printed here for the same reason as the slice
          # above: the guard step may never reach arm (b2). fc-subst lines
          # carry ctx= but no uri=, so they cannot be attributed to a marker --
          # the ctx value is what identifies the context, and a hit on a probe
          # family under a NON-ZERO ctx that did not install that family is the
          # leak. After the fix there should be none of these at all; before
          # it, run 34428270062's shape was `fc-subst ctx=7 key=0:geneva:<vis>
          # hit=1` with no gate line beside it. Keys look like
          # `0:segoe ui:3` -- a family name with spaces -- so the key runs from
          # `key=` to ` hit=`.
          FC_PROBE_KEYS = ("geneva", "segoe ui", "calibri", "helvetica neue")
          fc_hits = []
          for _ts, _b, _i, ln in rows:
              if "CAMOU-FL fc-subst " not in ln or " hit=1 " not in ln or "key=" not in ln:
                  continue
              if any(k in ln.split("key=", 1)[1].split(" hit=", 1)[0].lower()
                     for k in FC_PROBE_KEYS):
                  fc_hits.append(ln)
          print(f"=== fc-subst hit=1 on probe families ({len(fc_hits)} line(s)) ===")
          for ln in fc_hits[-40:]:
              print(f"    {ln}")
          if not fc_hits:
              print("    none -- the substitute memo answered no probe family, so every "
                    "such lookup reached the gate (or the build predates the fc-subst "
                    "log line, in which case the count above is 0 as well: check it)")

          print("=== CAMOU-FL lines, merged time order ===")
          if len(rows) <= CAP:
              shown = rows
              elided = 0
          else:
              half = CAP // 2
              shown = rows[:half] + rows[-half:]
              elided = len(rows) - CAP
          for n, (ts, base, i, line) in enumerate(shown):
              if elided and n == CAP // 2:
                  print(f"  ... {elided} line(s) elided; camou-fl.txt has all of them ...")
              print(f"  {base}:{i} {line}")
          PY

      - name: "record_video under headless=virtual (#93/#458 regression guard)"
        timeout-minutes: 15
        run: |
          # ffmpeg is a separate playwright download; without it video recording
          # hangs rather than erroring. playwright==1.55.0 is the version this
          # suite's browser interop is known good on.
          pip install --quiet -e pythonlib 'playwright==1.55.0'
          python -m playwright install ffmpeg
          cd pythonlib
          python - <<'PY'
          import os, glob
          from camoufox.sync_api import Camoufox
          out = "/tmp/vid"; os.makedirs(out, exist_ok=True)
          with Camoufox(headless="virtual", executable_path=os.environ["CAMOUFOX_BIN"],
                        ff_version=152, i_know_what_im_doing=True) as b:
              p = b.new_page(record_video_dir=out, viewport={"width": 800, "height": 600})
              p.goto("data:text/html,<h1 style='font-size:200px'>hello world</h1>")
              p.wait_for_timeout(2000)
              p.close()
          vids = glob.glob(out + "/*.webm")
          assert vids, "no .webm produced under headless='virtual'"
          size = os.path.getsize(vids[0])
          print(f"video: {vids[0]} {size} bytes")
          # Composite off produced a 110-byte empty container; on, ~54KB. 10K
          # separates them by a wide margin without pinning an exact size.
          assert size > 10_000, (
              f"video is {size} bytes -- an empty container. Composite is most likely "
              "off; see the measurement table in pythonlib/camoufox/virtdisplay.py"
          )
          PY
        env:
          CAMOUFOX_BIN: ${{ steps.bin.outputs.bin }}
          # pkgman.get_path() resolves fonts/ and properties.json through
          # camoufox_path(), which fetches from the GitHub releases API when no
          # local install exists; unauthenticated that is rate-limited to 403.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Integration suite (all goapi tests vs real binary)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        # Runs the FULL suite against the real binary, not just TestRuntimeSpoofs:
        # the other ~24 browser tests (navigation, DOM, forms, keyboard, storage,
        # accessibility, ...) otherwise never execute against a real build —
        # goapi.yml runs without CAMOUFOX_BIN so they all t.Skip.
        run: |
          set -o pipefail  # tee must not mask a go-test failure exit code
          cd goapi
          CAMOUFOX_BIN="${{ steps.bin.outputs.bin }}" \
            xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            go test -timeout 15m -v ./... 2>&1 | tee "$GITHUB_WORKSPACE/spoof-test.log"

          # TestRuntimeSpoofs used to launch headless, so its two WebGL subtests
          # hit their "__NOGL__" guard and skipped while the suite still
          # reported PASS. They now run headful under the xvfb above; fail the
          # step if they go back to skipping, otherwise the regression is
          # invisible again.
          # A subtest that downgrades itself to a skip still lets the suite
          # report PASS, so the missing coverage is invisible. Both of these
          # skipped for months while their PASS line was quoted as evidence.
          for marker in "no WebGL in this headless env" "no voices returned" \
                        "decodingInfo did not resolve in time"; do
            if grep -q "$marker" "$GITHUB_WORKSPACE/spoof-test.log"; then
              echo "::error::subtest skipped ($marker) -- that spoof was not verified"
              exit 1
            fi
          done

      - name: Detector-site smoke (CreepJS / sannysoft / browserleaks)
        run: |
          set -o pipefail  # tee must not mask the run's exit code
          cd goapi
          # This step used to end in `|| true` with no pipefail, so it was green
          # even if the binary crashed or ./example/integration failed to
          # compile -- the workflow's only live check against real anti-bot
          # vendors could not fail for any reason.
          CAMOUFOX_BIN="${{ steps.bin.outputs.bin }}" \
            xvfb-run -a go run ./example/integration 2>&1 | tee "$GITHUB_WORKSPACE/smoke.log"

          # example/integration asserts nothing about the verdicts by design --
          # it logs each oracle and writes its JSON "for human review", skipping
          # any oracle whose goto/eval failed. So the file count is the one
          # machine-checkable signal here: zero files means the browser reached
          # no oracle at all, which is a broken run, not a bad score.
          written=$(ls integration-results/*.json 2>/dev/null | wc -l)
          echo "oracles captured: $written / 4"
          if [ "$written" -eq 0 ]; then
            echo "::error::detector smoke reached no oracle -- run is broken, not merely flagged"
            exit 1
          fi
          if [ "$written" -lt 4 ]; then
            echo "::warning::only $written/4 oracles captured; the rest failed goto/eval (see smoke.log)"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: |
            spoof-test.log
            smoke.log
            camou-fl.txt
            goapi/integration-results/
          if-no-files-found: warn
          retention-days: 14
