name: Pin the fpgen model
description: >-
  Install the sha256-pinned fpgen model before anything imports fpgen, restored
  from the Actions cache so a pin is downloaded once rather than once per job: a
  release-asset 5xx on the download fails the job, and in tests.yml skips the
  build behind it (#421). Run it after camoufox is installed.

inputs:
  python:
    description: The Python that camoufox is installed in.
    required: false
    default: python3

runs:
  using: composite
  steps:
    # fpgen reads its model only from its own package directory, so that is what
    # gets cached. CAMOUFOX_FPGEN_DATA moves only the TypeScript launcher's copy.
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        dir="$("${{ inputs.python }}" -c 'from camoufox.fpgen_model import fpgen_data_dir; print(fpgen_data_dir())')"
        echo "FPGEN_DATA_DIR=$dir" >> "$GITHUB_ENV"

    # The path is part of the cache version, so each interpreter gets its own entry.
    - uses: actions/cache@v4
      with:
        path: ${{ env.FPGEN_DATA_DIR }}
        key: fpgen-model-python-${{ hashFiles('python/src/camoufox/fpgen-model.json') }}

    # fpgen downloads its model on first import with TLS verification OFF and no
    # checksum, and its release picker can only ever reach the April-2025 model.
    # On a cache hit this only checks the files: see python/scripts/pin-fpgen-model.py.
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: '"${{ inputs.python }}" python/scripts/pin-fpgen-model.py'
